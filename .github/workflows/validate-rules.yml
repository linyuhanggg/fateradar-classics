name: validate-rules
on:
  pull_request:
    paths:
      - "references/**"
      - "sources/fulltext/**"
      - "sources/normalized/**"
      - "sources/excerpts/**"
      - "tools/**"
      - ".github/workflows/validate-rules.yml"
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            references
            sources/fulltext
            sources/normalized
            sources/excerpts
            tools
            docs/closeout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml opencc-python-reimplemented
      - run: python tools/validate-rules.py
      - run: python tools/validate-executable.py
      - run: python tools/test-validate-executable.py
      - run: python tools/validate-annotations.py
      - run: python tools/validate-figure-evidence.py
      - run: python tools/test-validate-figure-evidence.py
      - run: python tools/test-validate-annotations.py
      - run: python tools/test-library-inventory.py
      - run: python tools/test-export-knowledge.py
      - run: python tools/test-source-cases.py
      - run: python tools/test-source-editions.py
      - run: python tools/test-build-draft-disposition.py
      - run: python tools/test-huangji-table-context.py
      - run: python tools/test-huangji-chronicle-context.py
      - run: python tools/test-import-shidian.py
      - run: python tools/test-export-runtime-evidence.py
      - run: python tools/test-export-tiaohou.py
      - run: python tools/export-reading-notes.py
      - run: python tools/test-export-reading-notes.py
      - run: python tools/test-validate-gates.py
      # 谓词语言 v3：叶子遍历（组形不得被读成「没有谓词」）与三态求值语义。
      - run: python tools/test-predicate-lang.py
      - run: python tools/test-eval-predicates.py
      # 人工复核台账：断言 189 条不可锚全部是 restatement，且锚点恢复仍「零可锚」
      # （防止重述文本/来源标签被硬锚上）。
      - run: python tools/test-needs-human-review-report.py
      # 六十甲子象辞映射：自证断言「反查序列 == 规范六十甲子」
      - run: python tools/test-map-nayin-ganzhi.py
      # 奇门天地盘干映射：含「中五不立天地盘干事实」不变量
      - run: python tools/test-map-qimen-stems.py
      # executable 层求值：三态语义 + 对照表不得引用不存在/不产出的事实
      - run: python tools/test-eval-executable.py
      # 地支成组映射：三合／方局／六冲的 v3 all_of 表达 + 语义断言
      - run: python tools/test-map-branch-groups.py
      # 具名固定取值映射：四柱枚举对 / 具名纳音 / 六壬课传位置（含「任意一传≠居日上」）
      - run: python tools/test-map-fixed-values.py
      # 「机械判为可表达但经复核仍不映射」的 30 条残留台账：不得过期、不得漂移
      - run: python tools/test-expressible-residue.py
      # 贯穿契约的跨提交审计：受保护字段零改动 + 每条 applicable_to 变动可溯源
      - run: python tools/audit-contract.py
      - run: python tools/test-audit-contract.py
      # 判定台账 ↔ 规则实况一致性（台账不得声称映射了空规则，反之亦然）
      - run: python tools/test-ledger-consistency.py
      # 恒真映射登记册（域完备键上的单值子句：25 → 64 的口径更正）
      - run: python tools/test-tautology-register.py
      # 有据定义表：引文逐字 + 展开求值 + 「查不到就报查不到」
      - run: python tools/test-definition-table.py
      # 命名定义的可得性登记册（繁简折半检索，避免「月朗天门」搜不到「月朗天門」）
      - run: python tools/executable-definition-gaps.py
      - run: python tools/test-check-ganzhi-sequences.py
      # 步长筛查：与「已登记待核」集合对账（现有 3 条全部指向奇门 p281 第 6 列的「巳/卯」，
      # 已在 ocr-batch-0280-0298.md 的 doubt_281 登记，需原生读图复读一次才能结案）。
      # 四柱列举类假警已由判据排除并有测试；集合一变即红。
      - run: python tools/check-ganzhi-registered.py -v
      - run: python tools/coverage-report.py --fail-under 54
      - run: python tools/predicate-report.py --max-wildcard 15 --check-open-values --check-art-keys
