name: Fetch Daliuren facsimile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify official facsimile
        run: |
          curl -fL --retry 0 \
            --output /tmp/NCL-06572-daliuren-miben.pdf \
            'https://upload.wikimedia.org/wikipedia/commons/0/0a/NCL-06572_%E5%A4%A7%E5%85%AD%E5%A3%AC%E7%A7%98%E6%9C%AC.pdf'
          test "$(stat -c '%s' /tmp/NCL-06572-daliuren-miben.pdf)" = '154825545'
          file --mime-type /tmp/NCL-06572-daliuren-miben.pdf | grep -q 'application/pdf'

      - name: Upload to the oversize release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload facsimiles-oversize-2026-09-04 \
            '/tmp/NCL-06572-daliuren-miben.pdf#NCL-06572 大六壬秘本' \
            --repo "${{ github.repository }}" \
            --clobber
