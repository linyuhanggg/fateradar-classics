- rule_id: ZHOUYIZHEZHO-004
  kind: doctrine
  statement: 得中又当位（如九五、六二）为"中正"，最贵之爻；多主大吉、君子之道。
  anchor:
    file: sources/fulltext/divination/zhouyi-zhezhong/fulltext.md
    start_line: 4409
    end_line: 4409
  quote: 本義〔以卦徳卦體而言陽猶可亨也〕程傳〔以卦才言也内健而外巽健而能巽也二五居中剛中也陽性上進下復乾體志在於行也剛居中為剛而得中又為中剛言畜陽則以柔巽言能亨則由剛中以成卦之義言則為隂畜陽以卦才言則陽為剛中才如是故畜雖小而能亨也〕
