    start_line: 1265
    end_line: 1265
  quote: 臣二言大臣盡其職任以答夫君三與上相交泰之終也故三言平變而爲陂上言城復而于隍蓋君子進而小人退所以致泰也君委任而臣效忠所以致泰也抑天運之循環泰極而否有必然者而保泰之意隱然有不容不恐懼焉則平陂城隍其旨嚴哉○吳氏曰愼曰初四以氣類言二體之始也三上以時運
