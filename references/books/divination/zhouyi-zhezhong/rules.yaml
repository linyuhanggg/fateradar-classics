  quote: 正家之義脩於近小言之與行君子樞機出身加人發邇化遠故舉言行以爲之誡○楊氏時曰言忠信則有物行篤敬則有常○胡氏炳文曰風自火出一家之化自吾言行出皆由内及外自然薰蒸而成者也○俞氏琰曰齊家之道自脩身始此風自火出所以爲家人之象也君子知風之自於是齊家以脩身爲本而
