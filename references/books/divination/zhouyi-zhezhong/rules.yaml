    start_line: 8477
    end_line: 8477
  quote: 相攻相取相感之人其居皆有逺近其行皆有情偽其情皆有愛惡也故總以相近一條明之近而不相得則以惡相攻而凶生矣以偽相感而害生矣不以近相取而悔吝生矣是則一近之中備此三條也凡爻有比爻有應爻有一卦之主爻皆情之當相得者也今稱近者止據比爻言之反以三隅則逺而為應
