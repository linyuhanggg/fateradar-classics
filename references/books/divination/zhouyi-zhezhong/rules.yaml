- rule_id: ZZR
  kind: doctrine
  statement: 八卦相重，每一重卦具六爻，由此形成六十四卦体系。
  anchor: null
  quote: 乾坤剥復〔大過〕頤姤夬
  applicable_to: []
  caveats:
  - 仅作重卦结构方法，不授权卦意吉凶
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZZR-01
  kind: doctrine
  statement: 阳爻居阳位（初三五）、阴爻居阴位（二四上）为"当位"；当位则正，多吉。
  anchor:
    file: sources/fulltext/divination/zhouyi-zhezhong/fulltext.md
    start_line: 2398
    end_line: 2398
  quote: 本義〔位雖得正然過剛不中志從於上不能久於其所故為不恒其德或承之羞之象或者不知其何人之辭承奉也言人皆得奉而進之不知其所自來也貞吝者正而不恒為可羞吝申戒占者之辭〕程傳〔三陽爻居陽位處得其位是其常處也乃志從於上六不惟隂陽相應風復從雷於恒處而不處不恒之人
  applicable_to: []
  caveats:
  - 当位非必然吉
  - 尚需看爻之时位与应
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZHOUYIZHEZHO-ZZR-01
  kind: doctrine
  statement: 二爻居下卦中、五爻居上卦中；得中位者多吉，所谓"刚中"（阳爻居中）或"柔中"（阴爻居中）。
  anchor: null
