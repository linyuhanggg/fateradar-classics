- rule_id: ZHOUYIZHEZHO-007
  kind: doctrine
  statement: 一卦之主爻多为五爻（君位）；或以"成卦之主"（一阴一阳独成卦义者）；或以"主卦之主"（位最尊德最大者）。
  anchor: null
