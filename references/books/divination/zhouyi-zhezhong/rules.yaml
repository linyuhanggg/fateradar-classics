- rule_id: ZHOUYIZHEZHO-026
  kind: doctrine
  statement: 六爻全静占本卦彖辞 / 卦辞；一爻变占本卦变爻爻辞；二爻变占本卦二变爻、上爻为主；三爻变占本卦及变卦彖辞、本卦为主；四爻变占变卦二不变爻、下爻为主；五爻变占变卦不变爻；六爻全变占之卦彖辞（乾用九 / 坤用六例外）。
  anchor: null
  quote: 六爻全静占本卦彖辞 / 卦辞；一爻变占本卦变爻爻辞；二爻变占本卦二变爻、上爻为主；三爻变占本卦及变卦彖辞、本卦为主；四爻变占变卦二不变爻、下爻为主；五爻变占变卦不变爻；六爻全变占之卦彖辞（乾用九 / 坤用六例外）。
  applicable_to: []
  caveats:
  - 朱熹折中诸家说之总结
  - 其他派别变占法（如京房 6 亲法）不同
  school: null
  verified: false
