  caveats:
  - 当位非必然吉
  - 尚需看爻之时位与应
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZHOUYIZHEZHO-ZZR-01
  kind: doctrine
  statement: 二爻居下卦中、五爻居上卦中；得中位者多吉，所谓"刚中"（阳爻居中）或"柔中"（阴爻居中）。
  anchor: null
  quote: 二爻居下卦中、五爻居上卦中；得中位者多吉，所谓"刚中"（阳爻居中）或"柔中"（阴爻居中）。
  applicable_to: []
  caveats:
  - 中位虽贵，仍需看爻才与时
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZHOUYIZHEZHO-004
  kind: doctrine
  statement: 得中又当位（如九五、六二）为"中正"，最贵之爻；多主大吉、君子之道。
  anchor: null
