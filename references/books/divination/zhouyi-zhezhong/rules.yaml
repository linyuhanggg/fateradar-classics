  verified_at: null
- rule_id: ZZR-01
  kind: doctrine
  statement: 阳爻居阳位（初三五）、阴爻居阴位（二四上）为"当位"；当位则正，多吉。
  anchor: null
  quote: 阳爻居阳位（初三五）、阴爻居阴位（二四上）为"当位"；当位则正，多吉。
