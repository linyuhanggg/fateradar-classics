- rule_id: ZHOUYIZHEZHO-005
  kind: doctrine
  statement: 初与四、二与五、三与上相应；阴阳相应为有应（吉象）、同性相应为无应（孤立）。
  anchor: null
  quote: 初与四、二与五、三与上相应；阴阳相应为有应（吉象）、同性相应为无应（孤立）。
