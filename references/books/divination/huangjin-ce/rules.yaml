rules:
- rule_id: HJC
  kind: doctrine
  statement: 占卦以动爻为变化之始、变卦为变化之终。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 17
    end_line: 17
  quote: 《黃金策》題明•劉基著。此書為火珠林卦法的集大成之作，是研究火珠林法的經典。明清術士莫不奉之圭臬。目前在民間流傳甚廣的《卜筮全書》、《增刪卜易》、《卜筮正宗》都收錄了此書，可見影響之大。 本電子文按《卜筮正宗》本，全文載錄。
  applicable_to: []
  caveats:
  - 仅作动变方法，不授权具体事项吉凶
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R001
  kind: doctrine
  statement: 断卦先看日辰、月建对用神、世应、动爻的生克冲合与旺衰；不能只凭卦名或单个神煞下结论。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 26
    end_line: 26
  quote: 日辰為六爻之主宰，喜其滅項以安劉。月建乃萬卦之提綱，豈可助桀而為虐。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R002
  kind: doctrine
  statement: 世为自己/本方，应为对方/他人；世应相合相生利互动，世应受伤、俱空或冲克则关系不稳。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 30
    end_line: 30
  quote: 世為己，應為人，大宜契合。動為始，變為終，最怕交爭。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R003
  kind: doctrine
  statement: 动爻主事情发动，变爻主后势或结果；动变比和、进退、回头克等决定进展。
  anchor: null
  quote: 世為己，應為人，大宜契合。動為始，變為終，最怕交爭。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R004
  kind: doctrine
  statement: 用神有气且无明显损伤，所问有成；主象徒存但被伤，谋事不遂。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 38
    end_line: 38
  quote: 用神有氣無他故，所作皆成。主象徒存更被傷，凡謀不遂。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R005
  kind: doctrine
  statement: 用神受伤须有救应；空、合、冲、墓、旺衰不能孤立解释，要看是否逢冲可用、合破无功、墓冲而发。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 40
    end_line: 40
  quote: 有傷須救，無故勿空；空逢沖而有用，合遭破以無功。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R006
  kind: doctrine
  statement: 吉凶神煞、六神取象只能作旁证；核心判断仍以生克制化、用神旺衰和世应动变为主。
  anchor: null
  quote: 虎興而遇吉神，不害其為吉。龍動而逢凶曜，難掩其為凶。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R007
  kind: doctrine
  statement: 天时占以父母主雨、妻财主晴为主要取象，再看子孙日月、兄弟风云、官爻雷电及四季五行。
  anchor: null
  quote: 應乃太虛，逢空則雨晴難擬。世為大塊，受剋則天變非常。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R008
  kind: doctrine
  statement: 婚姻先看阴阳、六合六冲、世应合冲生克，再看财鬼是否空亡刑害。
  anchor: null
  quote: 陰陽交錯，難期琴瑟之和鳴；內外互搖，定見家庭之撓括。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R009
  kind: doctrine
  statement: 求财先看财爻与子孙；财旺福兴利，财空福绝不利；父兄皆动、兄鬼克世多阻。
  anchor: null
  quote: 要問吉凶，但看財福。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R010
  kind: doctrine
  statement: 财来生世或就世较易，我去寻财、世持动兄、财被日伤则难；应期看生衰旺合。
  anchor: null
  quote: 兄如太過，反不剋財；身或兄臨，必難求望。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R011
  kind: doctrine
  statement: 家宅以卦内为宅、卦外为人，合为门、冲为路，再看宅、门、世应、日月之间的生克冲合。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 1018
    end_line: 1018
  quote: 內為宅，外為人，詳審爻中之真假。合為門，沖為路，不論卦內之有無。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R012
  kind: doctrine
  statement: 宅无破而逢生则宅兴财旺；有财无鬼多耗散，有鬼无财多灾生，有人制鬼则鬼动无妨。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 1040
    end_line: 1040
  quote: 宅合有情之玄武，門庭柳陌花街；木臨無氣之螣蛇，宅舍茆簷蓬戶。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R013
  kind: doctrine
  statement: 求名看父母文书与官鬼名位；父官旺相有助，财动、福动、兄弟竞发常成阻。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 880
    end_line: 880
  quote: 父爻旺相。文成擲地金聲；鬼位興隆，家報泥金捷喜。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R014
  kind: doctrine
  statement: 词讼先看世应输赢，世宜旺生、应宜休囚；官鬼为问官，父母为文书案卷，子孙主和解消散。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 1318
    end_line: 1318
  quote: 應乃對頭，要休囚死絕；世為自己，宜帝旺長生。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R015
  kind: doctrine
  statement: 出行以父母为行李、妻财为盘缠，世看自身承受，应看谋成，间爻看路途同伴。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 1578
    end_line: 1578
  quote: 父為行李，帶刑則破損不中；妻作盤纏，生旺則豐盈足用。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R016
  kind: doctrine
  statement: 行人问归期，先找主象/用爻；用爻动则身已动，安静则未思归，生克合冲伏藏决定迟速与阻滞。
  anchor:
    file: sources/fulltext/divination/huangjin-ce/fulltext.md
    start_line: 1617
    end_line: 1617
  quote: 克速生遲，我若制他難見面；三門四戶，用如合世即還家。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HJC-R017
  kind: doctrine
  statement: 病症、病体、医药章节可记录六亲、五行、卦宫、六神如何取象，但不得输出为现代诊断、疗法或用药建议。
  anchor: null
  quote: 人孰無常，疾病無常，事孰為大，死生為大。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
