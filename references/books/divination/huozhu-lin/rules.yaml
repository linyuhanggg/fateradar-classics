- rule_id: HZL-R001
  kind: doctrine
  statement: 公用取官鬼，私用取妻财；官用以父母辅，财用以子孙辅。
  anchor: null
  quote: 阴阳男女，次策推排；
  applicable_to: []
  caveats: []
