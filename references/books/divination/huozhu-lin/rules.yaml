- rule_id: HZL-R003
  kind: doctrine
  statement: 乱动时先看世上旁爻、世下亲爻，再以最旺或发动生世之爻为用。
  anchor: null
  quote: 独发易取，乱动难寻；
  applicable_to: []
  caveats: []
