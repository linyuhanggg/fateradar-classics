- rule_id: HZL-R002
  kind: doctrine
  statement: 财官旺相、有辅体发动或生世为可用；休囚、克破、无辅则力薄。
  anchor: null
  quote: 财官异路，可辨五乡；
  applicable_to: []
  caveats: []
