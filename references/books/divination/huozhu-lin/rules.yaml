- rule_id: HZL-R008
  kind: doctrine
  statement: 内卦二爻为宅，外卦六爻看动；宅下伏鬼、父空、财动等均有特定宅象。
  anchor:
    file: sources/fulltext/divination/huozhu-lin/fulltext.md
    start_line: 809
    end_line: 809
  quote: 鬼墓方为圣堂，子墓方为牲畜，财墓方为仓库，绝为厕，兄墓得直方水生旺处为井，应为屋，鬼为厅，福为廊，财为房屋橱柜，兄为门。身持兄得，五事俱全，不可空，无刑冲克，上等屋也。内有一爻被冲克，主有损坏，得空为妙。
  applicable_to: 
  - key: liuqin
    value: 妻财
