  kind: doctrine
  statement: 占防非避讼——以官鬼为用；官鬼空 / 安静 / 受制——无讼；官鬼旺动克世——讼来。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 1955
    end_line: 1955
  quote: 占官差以官鬼爲用﹐此卦辰土持世﹐寅木官鬼克世﹐世爻空﹐卽於壬寅日得差﹐次年三月死於中途﹐豈可謂之用克世勿作凶看。
