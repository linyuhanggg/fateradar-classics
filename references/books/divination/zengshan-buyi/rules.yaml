- rule_id: ZR-17
  kind: doctrine
  statement: 占茔葬——以二爻为穴、世爻为后人；穴旺生世——吉地；穴受冲克——凶地。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6220
    end_line: 6220
  quote: 世爻旺相﹐祖父魂安。福德興隆﹐兒孫縮杞。古以二爻爲穴﹐內卦爲穴﹐騰蛇爲穴﹐屢試不驗﹐所驗者﹐世爲穴也﹐世宜旺相﹐或臨日月﹐或日月動爻生扶﹐乃吉地也。兒孫乃祭杞之裔﹐宜於持世﹐或在他爻旺相﹐振振螽斯。
