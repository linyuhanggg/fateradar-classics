- rule_id: ZENGSHANBUYI-ZR-11
  kind: doctrine
  statement: 占财福——以妻财为用、子孙为元神；财旺有源为佳。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 2406
    end_line: 2406
  quote: 子孫爲日月星斗﹐動則萬里晴光。黃金策以財動者﹐八方咸仰晴光﹐非也。子孫發動﹐萬里無雲﹐財以子孫爲元神﹐財動𨿽晴﹐倘如子孫休囚空破﹐或現而不動﹐必不大晴﹐當有浮雲薄霧。
  applicable_to: []
  caveats:
