    start_line: 5410
    end_line: 5410
  quote: 人爲利名﹐奔馳道路﹐風波不測。占卜應以世爻爲先﹐旺相宜行﹐空亡宜止。世爲出行人﹐生旺有气則吉﹐動而化吉﹐及化子孫者更吉。如若休囚空破﹐動而化凶者不宜行也。應爲地頭﹐又爲傍倚人﹐他若空破墓絕或動而化絕化回頭克者﹐去之無益。
