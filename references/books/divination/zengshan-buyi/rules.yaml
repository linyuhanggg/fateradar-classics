- rule_id: ZENGSHANBUYI-037
  kind: doctrine
  statement: 占功名——以官鬼为用、父母为元神（印绶）；官旺得印为佳。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 2292
    end_line: 2292
  quote: 此人已往軍前援例﹐故占流年﹐只謂命有功名﹐流年必現﹐卻不知占功名﹐以官爲官﹐最喜官星持世。
