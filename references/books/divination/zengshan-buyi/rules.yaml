- rule_id: ZR-10
  kind: doctrine
  statement: 所有问占先取用神 → 看用神旺衰 → 看元忌动静 → 看应期；此为通则。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 5638
    end_line: 5638
  quote: 動墓絕化墓絕須忌生旺﹐日月克動爻克最怕休囚。用神逢墓絕及動而化墓化絕全看衰旺﹐用神旺者何須慮﹐用神衰者實堪優。日月動爻沖克者亦須看用神旺衰﹐旺相者沖去克神之日而愈﹐休囚者生助克神之日而危。
  applicable_to: []
  caveats:
