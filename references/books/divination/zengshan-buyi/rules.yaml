- rule_id: ZENGSHANBUYI-ZR-04
  kind: doctrine
  statement: 生用神者元神（喜其旺动）；克用神者忌神（怕其旺动）；克元神 / 生忌神者仇神（不可旺）。
  anchor: null
  quote: 生用神者元神（喜其旺动）；克用神者忌神（怕其旺动）；克元神 / 生忌神者仇神（不可旺）。
  applicable_to: []
  caveats:
