- rule_id: ZENGSHANBUYI-007
  kind: doctrine
  statement: 用神两现时，若仅一爻发动则取动爻；若两爻俱动或俱静，须再择其旺者。旬空、月破等取舍不可脱离实际占验机械套用。
  anchor: null
  quote: 用神两现时，若仅一爻发动则取动爻；若两爻俱动或俱静，须再择其旺者。旬空、月破等取舍不可脱离实际占验机械套用。
  applicable_to: []
  caveats:
  - 两爻同动或同静时仍须完成月日、旺相休囚、空破冲合与受伤等综合裁决，不得按单一条件硬选
  school: null
  verified: false
  verified_by: null
  verified_at: null
