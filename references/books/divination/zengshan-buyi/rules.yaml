  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-006
  kind: doctrine
  statement: 用神不上卦时取本宫伏神；伏神受日月生扶可用、被压制则不可用。
  anchor: null
  quote: 用神不上卦时取本宫伏神；伏神受日月生扶可用、被压制则不可用。
