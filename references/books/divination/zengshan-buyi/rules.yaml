- rule_id: ZENGSHANBUYI-012
  kind: doctrine
  statement: 月令当令的本气五行为旺，月令所生五行为相，其余先记作休囚候选；四时标签须与日辰、空破、动变和生克合参。
  anchor: null
  quote: 月令当令的本气五行为旺，月令所生五行为相，其余先记作休囚候选；四时标签须与日辰、空破、动变和生克合参。
  applicable_to: []
  caveats:
