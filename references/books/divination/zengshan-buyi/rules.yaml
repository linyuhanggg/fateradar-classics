- rule_id: ZENGSHANBUYI-ZR-14
  kind: doctrine
  statement: 占兴讼胜负——世应相战看哪边得日月生扶；世旺应衰胜、世衰应旺败。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 5129
    end_line: 5129
  quote: 有技力﹐首重世應﹐若勝以得財者﹐兼用財。又世喜臨於日月﹐財宜日月生扶﹐世爻動而化吉﹐應帶財而生世﹐皆我勝。世財休囚空破或被刑沖克害﹐及卦中父動者﹐多破其財。
