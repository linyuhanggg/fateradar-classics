  statement: 占疾病——以官鬼为病、子孙为药；官鬼旺动且无子孙——病重；子孙旺动 / 临日月——可愈。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 5758
    end_line: 5758
  quote: 野鶴曰﹕諸書無不以官爲鬼爲病﹐應爲醫人﹐子孫爲藥﹐理固然也﹐但此宜鬼者非鬼非病﹐乃憂神耳。
