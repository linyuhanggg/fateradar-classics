rules:
- rule_id: ZR
  kind: doctrine
  statement: 原文保存兑为泽初、上爻动而变天水讼的完整成卦实例，只用于核对 provider 的起卦结果。
  anchor: null
  quote: 原文保存兑为泽初、上爻动而变天水讼的完整成卦实例，只用于核对 provider 的起卦结果。
  applicable_to: []
  caveats:
  - 仅证明成卦实例，不授权官运吉凶判断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-02
  kind: doctrine
  statement: 八宫卦各纳天干（乾纳甲壬、坤纳乙癸、震纳庚、巽纳辛、坎纳戊、离纳己、艮纳丙、兑纳丁）；六爻配地支按纳甲歌取。
  anchor: null
  quote: 納天干地支總領：
  applicable_to: []
  caveats:
  - 必须由 `tool.divination.liuyao_bindisk` 处理
  - 禁止 LLM 手算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-03
  kind: doctrine
  statement: 以世爻五行为我，生我者父母、克我者官鬼、我生者子孙、我克者妻财、与我同者兄弟。
  anchor: null
  quote: 卜筮被許多人斥為迷信行為。
  applicable_to: []
  caveats:
  - 六亲是占断主轴
  - 女命问夫看官鬼、男命问妻看妻财（含现代性别考量）
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-04
  kind: doctrine
  statement: 所占之事在卦中之代表爻为用神；问占类型决定用神（详见 ZP-04 取用神流程）。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6417
    end_line: 6417
  quote: 世爻變鬼﹐占者不祥﹐鬼化六親﹐各屬不吉。世爻變鬼及隨墓助傷﹐所占之人不吉﹐兄弟妻子動而化鬼﹑鬼化兄弟父母妻子者﹐查其所犯而斷也。又有子命化鬼﹐鼠命者殃。午命變鬼﹐馬命不利﹐餘仿此。
  applicable_to: []
  caveats:
  - 用神为占断之根本
  - 用神有伤则事不成
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-ZR-04
  kind: doctrine
  statement: 生用神者元神（喜其旺动）；克用神者忌神（怕其旺动）；克元神 / 生忌神者仇神（不可旺）。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6742
    end_line: 6742
  quote: 元神者元神章查之。
  applicable_to: []
  caveats:
  - 四神协参，单看用神不全
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-006
  kind: doctrine
  statement: 用神不上卦时取本宫伏神；伏神受日月生扶可用、被压制则不可用。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 498
    end_line: 498
  quote: 若占妻財﹐取財爻爲神﹐用此姤卦以寅卯木爻爲妻財﹐今六爻無寅卯﹐卽是用神不上卦﹐如於寅卯月占者﹐則以日月爲用神﹐倘非寅卯月﹐須在宮首卦﹐乾爲天卦內尋之。乾宮首卦乾爲天。
  applicable_to: []
  caveats:
  - 伏神之力远不及上卦之爻
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-007
  kind: doctrine
  statement: 用神两现时，若仅一爻发动则取动爻；若两爻俱动或俱静，须再择其旺者。旬空、月破等取舍不可脱离实际占验机械套用。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6746
    end_line: 6746
  quote: 此卦辰、戌兩爻俱是父母，若兩爻俱動或都不發動，擇其旺者爲用神。
  applicable_to: []
  caveats:
  - 两爻同动或同静时仍须完成月日、旺相休囚、空破冲合与受伤等综合裁决，不得按单一条件硬选
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-05
  kind: doctrine
  statement: 元神旺动而无伤——用神得力；忌神旺动而无制——用神受伤。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6900
    end_line: 6900
  quote: 元神𨿽生用神，須要旺相，方可生得用神。元神能生用神者有五：元神旺相或臨日月或日月動爻生扶者一也。元神動化回頭生及化進神者二也。元神長生帝旺於日辰三也。元神與忌神同動四也。元神旺動臨空化空五也。
  applicable_to: []
  caveats:
  - 动静与旺衰并参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-ZR-05
  kind: doctrine
  statement: 金生水、水生木、木生火、火生土、土生金；元神之力本于此。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6940
    end_line: 6940
  quote: 金生水，水生木，木生火，火生土，土生金。
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-010
  kind: doctrine
  statement: 金克木、木克土、土克水、水克火、火克金；忌神之力本于此。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6955
    end_line: 6955
  quote: 金克木，木克土，土克水，水克火，火克金。
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-011
  kind: doctrine
  statement: 用神被克处又逢生扶（日月或动爻）则危而不死；俗谓"贪生忘克"。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 5454
    end_line: 5454
  quote: 世爻空者行人卽至﹐用神靜逢休囚空破者且不思歸﹐動空旺空者實空沖空之月日必歸﹐惟恐卦變克絕及反吟卦﹐用神被克被沖者﹐皆難望其歸也。
  applicable_to: []
  caveats:
  - 必须有真生扶之爻，非空虚之论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-012
  kind: doctrine
  statement: 月令当令的本气五行为旺，月令所生五行为相，其余先记作休囚候选；四时标签须与日辰、空破、动变和生克合参。
  anchor: null
  quote: 楚江李坦我平鑑定
  applicable_to: []
  caveats:
  - 只裁定月令季节带，不单独形成候选综合旺衰、成败、吉凶或应期结论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-013
  kind: doctrine
  statement: 月建生扶用神则旺、克伤用神则衰；月建之力贯穿一月。
  anchor: null
  quote: 用財者﹐財爻旺相﹐卽許婚。
  applicable_to: []
  caveats:
  - 月建之力大于动爻、小于日辰
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-014
  kind: doctrine
  statement: 日辰为占断之最大旺衰主宰；可生扶可克破，可冲实空爻、合住动爻。
  anchor: null
  quote: 楚江李坦我平鑑定
  applicable_to: []
  caveats:
  - 日辰之权最大
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-06
  kind: doctrine
  statement: 摇卦得三背或三面为动爻，老阳老阴变化；动爻变出之爻为变爻。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6571
    end_line: 6571
  quote: 第一次得兩背爲「拆」，畫作「⚋」，二次得三背爲「重」，畫作「○」，三次得兩背爲「拆」，畫作「⚋」，四次得一背爲「單」，畫作「⚊」，五次得三面爲「交」，畫作「ㄨ」，六次得一背爲「單」，畫作「⚊」。
  applicable_to: []
  caveats:
  - 必须由 `tool.divination.liuyao_bindisk` 完成
  - 禁止 LLM 手算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-ZR-06
  kind: doctrine
  statement: 动爻能生克他爻、亦能受他爻克生；静爻不能生克他爻，唯受日月生克。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 7022
    end_line: 7022
  quote: 卦有動爻，動而必變，夫變出之爻能生克沖合本位之動爻，不能生克他爻，而他爻與本位之動爻，亦不能生克變爻。
  applicable_to: []
  caveats:
  - 暗动除外（ZR-06-04）
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-017
  kind: doctrine
  statement: 动爻与变爻间可成回头生、回头克、回头冲、回头合；变爻反作用于本动爻。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6739
    end_line: 6739
  quote: 回頭生回頭克者在動變生克章查之。
  applicable_to: []
  caveats:
  - 变克本为大忌
  - 变生本为大吉
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-018
  kind: doctrine
  statement: 静爻得日辰冲为暗动；暗动如同动，能生克他爻。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 7387
    end_line: 7387
  quote: 沖者散也，凡占凶事宜於沖散、占吉事而不宜，必兼用神而言，用神旺𨿽沖不破，用神失陷凶而又凶，六合卦變六沖卦者，用神旺者始吉終凶，圖事難成，有始無終也。爻沖有五：爻與月沖謂月破。爻遇日沖爲暗動。休囚而遇日沖謂之日破。動爻化回頭沖。如逢仇敵。爻遇爻沖謂之相殺也。
  applicable_to: []
  caveats:
  - 暗动力虽显但不及真动
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-019
  kind: doctrine
  statement: 动爻被日辰冲为动散，力减不能为大用。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6445
    end_line: 6445
  quote: 父母爻被日月動爻沖克及卦動化沖﹐如在艮坤之宮﹐卦得亥卯未合成木局克父﹐必有地風衝歪棺槨。
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-020
  kind: doctrine
  statement: 化进神（如寅化卯）力增、化退神（如卯化寅）力减；进神逢冲不进、退神逢冲不退。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 878
    end_line: 878
  quote: 斷曰﹕世爻寅木而值旬空﹐酉金忌神搖於五位﹐古法謂之避空﹐予以爲謬也﹐此時逢空﹐出空一定遭傷﹐後卒於六月。應未月者﹐土爻未土乃世爻之墓﹐已破﹐丑日沖開﹐謂之開墓﹐以待彼克﹐而入墓不死也。或問﹕酉金化退神﹐如何克木﹖予曰﹕丑土生酉金﹐旺而不退。
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-021
  kind: doctrine
  statement: 一卦六爻独一爻动，此动爻为占断之主；详细参其生克墓绝。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 1142
    end_line: 1142
  quote: 五爻俱動﹐一爻不動﹐謂之獨靜﹔五爻不動﹐一爻獨動﹐謂之獨發。事之成敗﹐由乎用神﹔應期遲速﹐亦由乎用神﹔獨發獨靜﹐古有驗之﹐予試亦有驗也﹐皆在驗事應之後﹐如會神機﹐非初敢執之而斷禍福與應期也。況卦得獨靜𨿽少﹐而獨發者多﹐如捨其用神﹐執之而決事者﹐謬也﹐過也。
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-07
  kind: doctrine
  statement: 子丑、寅亥、卯戌、辰酉、巳申、午未六合；合则成事、合则停、合住忌神则解凶。
  anchor: null
  quote: 楚江李坦我平鑑定
  applicable_to: []
  caveats:
  - 合住用神有时反不利（事不动）
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-ZR-07
  kind: doctrine
  statement: 子午、丑未、寅申、卯酉、辰戌、巳亥六冲；冲散事、冲实空、冲开合。
  anchor: null
  quote: 楚江李坦我平鑑定
  applicable_to: []
  caveats:
  - 六冲卦不一定凶，看用神状态
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-024
  kind: doctrine
  statement: 寅巳申、丑戌未、子卯三刑；刑则有损伤纠葛。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 1504
    end_line: 1504
  quote: 斷﹕世臨午火﹐子日沖之﹐休囚爲日破﹐不爲暗動﹐今日若審﹐必有責罰﹐果於本日見官責杖二十﹐此卽卦見二午﹐豈可謂之一子不沖二午耶﹐又曰寅巳申爲三刑﹐若有寅巳二字﹐而無申字﹐或有寅申二字﹐而無巳字﹐但少一字﹐不成三刑﹐又曰亥卯未爲三合﹐卦有二﹐內少一字者﹐不成三合。
  applicable_to: []
  caveats:
  - 本书重视六冲六合，三刑作辅
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-025
  kind: doctrine
  statement: 反吟主反复颠倒、伏吟主呻吟忧虑；皆非吉象。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 126
    end_line: 126
  quote: 卦有卦之反吟，爻有爻之反吟。反吟者，實際上是卦變沖克、爻變沖克。卦之反吟者，內外動而反吟。有-{乾}-變巽，巽變-{乾}-；坎變離，離變坎；震變兌，兌變震；坤變艮，艮變坤。坤艮兩卦皆土，爲何相沖？《卜筮正宗》云：「艮卦坐於東北，艮右有丑，左有寅；坤卦坐於西南，右有未，左有申。二卦相對，有丑未相沖，寅申相沖。」
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-08
  kind: doctrine
  statement: 动爻变出之爻有回头生 / 克 / 比合 / 墓 / 绝；其中入墓主收藏停滞、入绝主断绝。
  anchor: null
  quote: 楚江李坦我平鑑定
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-ZR-08
  kind: doctrine
  statement: 用神旬空——空而不空（动 / 旺 / 临日月）则不空；真空——出旬即应；旬空亦可冲实。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 7618
    end_line: 7618
  quote: 因得此卦合前卦而決之，竟斷曰：財無气矣，不必勞心。彼問：何故？予曰：前卦丑則𨿽則空而有气，後卦子水財空伏於五爻未土之下，伏而又空，空而被克，知其無財而無疑也，後果全無。
  applicable_to: []
  caveats:
  - 必须由 `tool.divination.liuyao_bindisk` 计算旬空
  - 禁止 LLM 手算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-028
  kind: doctrine
  statement: 用神长生之地、帝旺之地、墓绝之地皆为应期取义点。
  anchor: null
  quote: 用神长生之地、帝旺之地、墓绝之地皆为应期取义点。
  applicable_to: []
  caveats:
  - 与 ZR-08-04 合参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-029
  kind: doctrine
  statement: 用神动则于值日 / 冲日 / 合日应；用神静则于冲日 / 临日应；用神空则出空 / 冲空之日实。
  anchor: null
  quote: 官鬼雷霆霧電。官鬼乃父母之元神﹐動則生父﹐故主霧霆雷電。或應雷霆﹐不拘春夏秋冬﹐可執以爲雷霆霧電看是也。
  applicable_to: []
  caveats:
  - 本书核心规则之一
  - 现代精准时间预测仍受多重不确定性限制
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZENGSHANBUYI-030
  kind: doctrine
  statement: 月建冲爻为月破；月破之爻——静则到底破、动则能伤本变、变则能伤本动、出月或合日不破。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 7067
    end_line: 7067
  quote: 月建沖爻卽爲月破，乃無用之爻也。
  applicable_to: []
  caveats:
