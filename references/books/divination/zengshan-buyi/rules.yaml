- rule_id: ZENGSHANBUYI-ZR-13
  kind: doctrine
  statement: 占行人归否——以应爻 / 远人之爻为用；用动来生世 / 临归魂——速归；用入墓入空——未归。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 1967
    end_line: 1967
  quote: 速則動而克世爻﹐緩則靜而生身。此獨占行人而用之﹐他占不用。謂用神動而克世﹐行人回來之速也。用神靜而生世﹐行人歸來緩也。且如占父母何日歸﹐父母動而克世者﹐許之歸。
