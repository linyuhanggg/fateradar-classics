- rule_id: ZENGSHANBUYI-039
  kind: doctrine
  statement: 占求财——以妻财为用；财旺有元神（子孙）则得；忌兄弟（劫财）旺动。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 6760
    end_line: 6760
  quote: 占妻、妾、婢、僕及占財物都以妻財爻爲用神，此卦寅木妻財就是用神。忌臨旬空月破，宜水相生，怕金相克，也有四處生克，多生少克爲吉與前同看。凡占金銀、買賣都以妻財爲用神，須在用神章中細看。
