- rule_id: ZR-11
  kind: doctrine
  statement: 占身命——以世爻为身、子孙为福德、官鬼为忧；世旺无伤为佳。
  anchor:
    file: sources/fulltext/divination/zengshan-buyi/fulltext.md
    start_line: 3148
    end_line: 3148
  quote: 卦宮衰弱根基淺﹐爻象豐隆命運高。爻象豐隆﹐占身命最重。世爻﹑財爻﹑福爻﹐得遇生扶﹐自然命運高彊。惟卦宮之衰弱者不驗﹐常見根基淺薄之人﹐宮幾旺﹐是不爲法。
  applicable_to: []
  caveats:
