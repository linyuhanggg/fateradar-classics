- rule_id: ZR-03
  kind: doctrine
  statement: 以世爻五行为我，生我者父母、克我者官鬼、我生者子孙、我克者妻财、与我同者兄弟。
  anchor: null
  quote: 以世爻五行为我，生我者父母、克我者官鬼、我生者子孙、我克者妻财、与我同者兄弟。
  applicable_to: []
  caveats:
  - 六亲是占断主轴
  - 女命问夫看官鬼、男命问妻看妻财（含现代性别考量）
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZR-04
  kind: doctrine
  statement: 所占之事在卦中之代表爻为用神；问占类型决定用神（详见 ZP-04 取用神流程）。
  anchor: null
  quote: 所占之事在卦中之代表爻为用神；问占类型决定用神（详见 ZP-04 取用神流程）。
  applicable_to: []
  caveats:
  - 用神为占断之根本
  - 用神有伤则事不成
