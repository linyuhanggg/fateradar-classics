- rule_id: ZR-02
  kind: doctrine
  statement: 八宫卦各纳天干（乾纳甲壬、坤纳乙癸、震纳庚、巽纳辛、坎纳戊、离纳己、艮纳丙、兑纳丁）；六爻配地支按纳甲歌取。
  anchor: null
  quote: 八宫卦各纳天干（乾纳甲壬、坤纳乙癸、震纳庚、巽纳辛、坎纳戊、离纳己、艮纳丙、兑纳丁）；六爻配地支按纳甲歌取。
