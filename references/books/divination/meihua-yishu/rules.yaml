- rule_id: MR-12
  kind: doctrine
  statement: 体为告者、用为对方；体克用胜、用克体败；用生体有人助、体生用己耗。
  anchor:
    file: sources/fulltext/divination/meihua-yishu/fulltext.md
    start_line: 1239
    end_line: 1239
  quote: 人事之占，詳觀體用。體卦為主，用卦為賓。用克體不宜，體克用則吉。用生體有進益之喜，體生用有耗失之患。體用比和，謀為吉利。更詳觀互卦、變卦，以斷吉凶；複究盛衰，以明休咎。
  applicable_to: []
  caveats:
  - 现代诉讼以法律证据为准
  - 占断不替代律师意见
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: MEIHUAYISHU-MR-12
  kind: doctrine
  statement: 体为后人、用为坟；体生用耗、用生体福；用克体凶；体克用安。
  anchor:
    file: sources/fulltext/divination/meihua-yishu/fulltext.md
    start_line: 1417
    end_line: 1417
  quote: 占墳墓以體為主，用為墳墓。體克用，葬之吉；用克體，葬之凶。體生用，葬之主運退；用生體，葬之主興隆，有蔭益後嗣。體用比和，乃為吉地。大宜葬，葬之吉昌。
  applicable_to: []
  caveats:
  - 现代殡葬以法规为主
  school: null
  verified: false
