- rule_id: MR-13
  kind: doctrine
  statement: 占断本于体用生克 + 卦气衰旺 + 互变补充 + 类象取义；不拘一格，须临占灵动。
  anchor:
    file: sources/fulltext/divination/meihua-yishu/fulltext.md
    start_line: 2085
    end_line: 2085
  quote: 卦成，則於體用互變之中，視全卦之數，以為約定之期，審其事端之遲速而刻之，如屋宅墳墓永久者也。
  applicable_to: []
  caveats:
  - 本书重心法多于死法
