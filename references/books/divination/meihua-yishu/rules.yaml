- rule_id: MR-11
  kind: doctrine
  statement: 体为病人、用为病；用克体病重；体克用病可制；用生体反耗体；体生用病退；比和病稳。卦象类病象（坎肾、离心、震肝、艮脾）。
  anchor:
    file: sources/fulltext/divination/meihua-yishu/fulltext.md
    start_line: 1357
    end_line: 1357
  quote: 凡占疾病，以體為病人，用為病症。
