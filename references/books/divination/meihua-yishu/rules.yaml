  verified: false
  verified_by: null
  verified_at: null
- rule_id: MR-07
  kind: doctrine
  statement: 体克用、用克体晴；用生体雨；坎多雨；离多晴；震多雷；巽多风；坤多阴；艮多雾。
  anchor: null
  quote: 体克用、用克体晴；用生体雨；坎多雨；离多晴；震多雷；巽多风；坤多阴；艮多雾。
