rules:
- rule_id: HR-01
  kind: doctrine
  statement: 一元 = 12 会 = 360 运 = 4320 世 = 129600 年；为天地一开辟之大周期。
  anchor: null
  quote: 一元 = 12 会 = 360 运 = 4320 世 = 129600 年；为天地一开辟之大周期。
  applicable_to: []
  caveats:
  - 本数为术数史观符号，不等于现代地质 / 天文学时间尺度
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-HR-01
  kind: doctrine
  statement: 邵雍以"子会"开物（万物始）、"丑会"立地、"寅会"生人；亥会闭物（万物归）。
  anchor: null
  quote: 皇極經世書卷五上    宋 邵雍 撰
  applicable_to: []
  caveats:
  - 属术数史观，非自然演化论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-003
  kind: doctrine
  statement: 以元经会主天之运（卷一至二）、以会经运主地之化（卷三至四）、以运经世主人物之事（卷五至六）；以世经世落具体年甲子（卷七至十）。
  anchor: null
  quote: 皇極經世書卷六下    宋 邵雍 撰觀物篇三十四  以運經世十
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-004
  kind: doctrine
  statement: 一元 12 会以 12 地支配；子开寅生午盛申退戌闭亥归；现今天地正处于"午会"中后期。
  anchor: null
  quote: 一元 12 会以 12 地支配；子开寅生午盛申退戌闭亥归；现今天地正处于"午会"中后期。
  applicable_to: []
  caveats:
  - 邵雍立场视点为北宋，"午会"判断含历史时代背景
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HR-02
  kind: doctrine
  statement: 以六十四卦配岁；卦气消息按月配中孚 / 复 / 临 / 泰……剥 / 坤；亦按经世配元会运世。
  anchor: null
  quote: 以六十四卦配岁；卦气消息按月配中孚 / 复 / 临 / 泰……剥 / 坤；亦按经世配元会运世。
  applicable_to: []
  caveats:
  - 与汉孟喜卦气、京房八宫卦气取义不同
  - 查具体年用 `tool.divination.huangji`
  school: null
