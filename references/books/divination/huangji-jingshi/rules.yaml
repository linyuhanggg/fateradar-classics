- rule_id: HUANGJIJINGS-004
  kind: doctrine
  statement: 一元 12 会以 12 地支配；子开寅生午盛申退戌闭亥归；现今天地正处于"午会"中后期。
  anchor: null
  quote: 一元 12 会以 12 地支配；子开寅生午盛申退戌闭亥归；现今天地正处于"午会"中后期。
  applicable_to: []
  caveats:
  - 邵雍立场视点为北宋，"午会"判断含历史时代背景
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HR-02
  kind: doctrine
  statement: 以六十四卦配岁；卦气消息按月配中孚 / 复 / 临 / 泰……剥 / 坤；亦按经世配元会运世。
  anchor: null
  quote: 以六十四卦配岁；卦气消息按月配中孚 / 复 / 临 / 泰……剥 / 坤；亦按经世配元会运世。
  applicable_to: []
  caveats:
  - 与汉孟喜卦气、京房八宫卦气取义不同
  - 查具体年用 `tool.divination.huangji`
  school: null
  verified: false
  verified_by: null
  verified_at: null
