- rule_id: HR-04
  kind: doctrine
  statement: 八卦先天数：乾 1、兑 2、离 3、震 4、巽 5、坎 6、艮 7、坤 8。
  anchor:
    file: sources/fulltext/divination/huangji-jingshi/fulltext.md
    start_line: 37145
    end_line: 37145
  quote: 先天學心法也故圖皆自中起萬化萬事生乎心也先天學主乎誠至誠可以通神明不誠則不可以得道先天之學心也後天之學迹也
  applicable_to: []
  caveats:
  - 起具体卦应由 `tool.divination.qiguagua`（梅花体系）处理
  - 本书仅提供数理来源
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-HR-04
  kind: doctrine
  statement: 每加一爻卦数倍增；太极生两仪→四象→八卦→十六→三十二→六十四。
  anchor:
    file: sources/fulltext/divination/huangji-jingshi/fulltext.md
    start_line: 37239
    end_line: 37239
  quote: 萬物各有太極兩儀四象八卦之次亦有古今之象隂陽分而生二儀二儀交而生四象四象交而生八卦八卦交而生萬物故二儀生天地之類四象定天地之體四象生八卦之類八卦定日月之體八卦生萬物之類重卦定萬物之體類者生之序也體者象之交也推類者必本乎生觀體者必由乎象生則未
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-010
  kind: doctrine
  statement: 先天八卦方位（伏羲）— 乾南坤北、离东坎西；后天八卦方位（文王）— 离南坎北、震东兑西。
  anchor:
    file: sources/fulltext/divination/huangji-jingshi/fulltext.md
    start_line: 37022
    end_line: 37022
  quote: 主嬴也乾坤不用者何也獨陽不生專隂不成也離坎用半何也離東坎西當隂陽之半為春秋晝夜之門也或用乾或用離坎何也主陽而言之故用乾也主嬴分而言之則陽侵隂晝侵夜故用離坎也陽主嬴故乾全用也隂主虚故坤全不用也陽侵隂隂侵陽故離坎用半也是以天之南全見而北全不見東
  applicable_to: []
  caveats:
  - 梅花易数兼用先后天，本书仅辨先天
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-011
  kind: doctrine
  statement: 六十四卦两两为偶（反对）；非反即对；卦序之理本于此。
  anchor: null
  quote: 六十四卦两两为偶（反对）；非反即对；卦序之理本于此。
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HR-05
  kind: doctrine
  statement: 以物观物则得理通，以我观物则有情累；圣人之观物在反观。
  anchor:
    file: sources/fulltext/divination/huangji-jingshi/fulltext.md
    start_line: 36973
    end_line: 36973
  quote: 之聖人也夫鑑之所以能為朙者謂其能不隠萬物之形也雖然鑑之能不隠萬物之形未若水之能一萬物之形也雖然水之能一萬物之形又未若聖人之能一萬物之情也聖人之所以能一萬物之情者謂其聖人之能反觀也所以謂之反觀者不以我觀物也不以我觀物者以物觀物之謂也既能以物觀
  applicable_to: []
  caveats:
  - 属哲学义理，非具体占断规则
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-HR-05
  kind: doctrine
  statement: 天地之心可知，万化从心起；心为太极，万象皆心之发。
  anchor: null
  quote: 太極道之極也太𤣥道之𤣥也太素色之本也太一數之始也太初事之初也其成功則一也
  applicable_to: []
  caveats:
  - —
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-014
  kind: doctrine
  statement: 乾坤为体、坎离为用；体不立则用不行，用不行则体不显。
  anchor:
    file: sources/fulltext/divination/huangji-jingshi/fulltext.md
    start_line: 37103
    end_line: 37103
  quote: 乾坤坎離為上篇之用兊艮震巽為下篇之用也頥中孚大過小過為二篇之正也
  applicable_to: []
  caveats:
  - 与梅花易数"体用生克"占法不同
  - 梅花是占断方法
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HR-06
  kind: doctrine
  statement: 天声 10 类配地音 12 类、平上去入 4 调 × 开发收闭 4 等；声音之数皆受元会运世数管摄。
  anchor: null
  quote: 剛少剛之用數是謂水火土石之化數日月星辰之變數一萬七千二十四謂之動數水火土石之化數一萬七千二十四謂之植數再唱和日月星辰水火土石之變化通數二萬八千九百八十一萬六千五百七十六謂之動植通數
  applicable_to: []
  caveats:
  - 与现代音韵学需对照
  - 具体音类查 `tool.divination.huangji`
  school: null
  verified: false
