- rule_id: HUANGJIJINGS-003
  kind: doctrine
  statement: 以元经会主天之运（卷一至二）、以会经运主地之化（卷三至四）、以运经世主人物之事（卷五至六）；以世经世落具体年甲子（卷七至十）。
  anchor: null
