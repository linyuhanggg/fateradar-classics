  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-HR-02
  kind: doctrine
  statement: 经世卦序以乾坤为始、咸恒为人事之序；与《周易》上下经卦序有结构相通。
  anchor: null
