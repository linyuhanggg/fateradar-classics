- rule_id: HR-09
  kind: doctrine
  statement: 元会运世年甲子表 / 卦气配年表 / 声音律吕表，凡查询事实层运算，必须 `tool.divination.huangji`，**严禁 LLM 手算**。
  anchor:
    file: sources/fulltext/divination/huangji-jingshi/fulltext.md
    start_line: 37492
    end_line: 37492
  quote: 先天者伏羲之易也後天者文王之易也太元者子雲之易後天之匹也皇極經世者康節之易先天之嗣也觀物篇立言廣大措意精微如繋辭然稽之以理既無不通參之以數亦無不合經世之數元㑹運世主之天而地也觀物之數聲音律吕主之地而物也夫天之運行有一十二萬九千六百之年地之生
  applicable_to: []
  caveats:
  - 手算极易出错
  - 表项数百万级
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: HUANGJIJINGS-HR-09
  kind: doctrine
  statement: 邵雍以唐尧元年甲辰（公元前 2357 年）为经世表元始首甲；后续年甲子均依此推。
  anchor: null
  quote: 經辰之申二千一百五十七
  applicable_to: []
  caveats:
  - 与《竹书纪年》《史记·三代世表》等他源元始有出入
  - 以本书表为准
  school: null
  verified: false
  verified_by: null
  verified_at: null
