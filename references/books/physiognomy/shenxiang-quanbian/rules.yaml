- rule_id: SHENXIANGQUA-004
  kind: doctrine
  statement: 仁配木 / 义配金 / 礼配火 / 智配水 / 信配土；以五德对应五行体相。
  anchor:
    file: sources/fulltext/physiognomy/shenxiang-quanbian/fulltext.md
    start_line: 373
    end_line: 373
  quote: 《祕訣》云：「水火木金土，肝肺心腎脾，五德配五行，仁義禮智信。發而為四端，信則居其一。生相若無信，虛負軀殼體。吾見世間人，致飾於外矣。不知無文中，含有真實理。真實即為信，四時不愆期。相中全在信，福祿壽須彌。四端豈假借，各具其一理。信寄四端中，有用無方體。」
  applicable_to: []
  caveats:
