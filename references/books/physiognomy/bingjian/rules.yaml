  verified_at: null
- rule_id: BR-06-02
  kind: doctrine
  statement: 声主张，寻发处见；音主敛，寻歇处见。辨声必辨喜怒哀乐：喜如折竹当风、怒如阴雷起地、哀如石击薄冰、樂如雪舞风前；以轻清为上。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 63
    end_line: 63
  quote: 聲與音不同。聲主張，尋發處見；音主斂，尋歇處見。辨聲之法，必辨喜怒哀樂。喜如折竹當風，怒如陰雷起地，哀如石擊薄冰，樂如雪舞風前，大概以輕清為上。聲雄者，如鐘則貴，如鑼則賤；聲雌者，如雉鳴則貴，如蛙鳴則賤。遠聽聲洪，近聽悠揚，起若乘風，止若拍瑟，上上；大言不張唇，細言若無齒，上也。出而不返，荒郊牛鳴；急而不達，深夜鼠嚼；或字句相聯，喋喋利口；或齒喉隔斷，喈喈混談；市井之夫，何足比數。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - 不作具体个人情绪 / 病情诊断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-06-03
  kind: doctrine
  statement: 声雄如钟则贵、如锣则贱；声雌如雉鸣则贵、如蛙鸣则贱。市井之夫，何足比数。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 63
    end_line: 63
  quote: 聲與音不同。聲主張，尋發處見；音主斂，尋歇處見。辨聲之法，必辨喜怒哀樂。喜如折竹當風，怒如陰雷起地，哀如石擊薄冰，樂如雪舞風前，大概以輕清為上。聲雄者，如鐘則貴，如鑼則賤；聲雌者，如雉鳴則貴，如蛙鳴則賤。遠聽聲洪，近聽悠揚，起若乘風，止若拍瑟，上上；大言不張唇，細言若無齒，上也。出而不返，荒郊牛鳴；急而不達，深夜鼠嚼；或字句相聯，喋喋利口；或齒喉隔斷，喈喈混談；市井之夫，何足比數。
