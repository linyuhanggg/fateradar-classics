- rule_id: BR-06-01
  kind: doctrine
  statement: 人之声音犹天地之气，轻清上浮、重浊下坠；始于丹田、发于喉、转于舌、辨于齿、出于唇；与五音相配。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 61
    end_line: 61
  quote: 人之聲音，猶天地之氣，輕清上浮，重濁下墜。始於丹田，發於喉，轉於舌，辨於齒，出於唇，實與五音相配。取其自成一家，不必一一合調。聞聲相思，其人斯在，寧必一見決雌雄哉。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - 不作语音学/医学诊断
