- rule_id: BR-03-01
  kind: doctrine
  statement: 容以七尺为期，貌合两仪而论；背腹手足实接五方，耳目口鼻全通四气；相顾相称则福生。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 37
    end_line: 37
  quote: 容以七尺為期，貌合兩儀而論。背腹手足，實接五方；耳目口鼻，全通四氣。相顧相稱則福生，如肖如湊，則林林總總不足論也。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"福生"古义，不作具体福报预测'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-03-02
  kind: doctrine
  statement: 容贵整：短不豕蹲、长不茅立、肥不熊餐、瘦不鹊寒；五短多贵、两大不扬；负重高官、鼠行好利。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 39
    end_line: 39
  quote: 容貴整，整非整齊之謂。短不豕蹲，長不茅立，肥不熊餐，瘦不鵲寒，所謂整也。背宜圓，腹宜突坦，手宜溫軟，曲若彎弓，足宜豐滿，下宜藏蛋，所謂整也。五短多貴，兩大不揚，負重高官，鼠行好利，此為定格。他如手長其身，身長過於體，配以佳骨，定主封侯。羅紋滿身，胸有秀骨，配以妙神，不拜相即鼎甲。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '**贬义**——"鼠行好利 / 两大不扬"'
  - 现代禁止用于职业/招聘/婚配判断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-03-03
  kind: doctrine
  statement: 科名星：印堂、眉尾时隐时见，13-39 岁随时见；阴骘纹：眼角阴雨便见、如三叉，19-46 岁随时见。二见全大物；得一亦贵；二者全无前程莫问。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 41
    end_line: 41
  quote: 相貌家有清、古、奇、秀之別，總之不必，須看科名星、陰騭紋為主。科名星，十三歲至三十九歲隨時而見；陰騭紋，十九歲至四十六歲隨時而見。二見全，大物也，得一亦貴。科名星見於印堂、眉尾，時隱時見，或為剛針，或為小丸，常有光氣，酒後及發怒時易見。陰騭紋見於眼角，陰雨便見，如三叉樣，假寐時最易見。得科名星早發，得陰騭紋遲發。二者全無，前程莫問。陰騭紋見於喉間，又主子貴，雜路不在此格。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"前程莫问"是古义铁口判语'
  - '**现代严禁直接套用**到高考、升迁、考公等具体场合'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-03-04
  kind: doctrine
  statement: 目深、鼻高、口阔方、齿多固、眼角入鬓、耳白过面：贵徵；舌脱、橘面、文人眼伤、鹰准动便食人：贱徵。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 43
    end_line: 43
  quote: 目者面之淵，不深則不清；鼻者面之山，不高則不靈。口闊而方祿千鍾，齒多而固不家食。眼角入鬢，必掌刑名；耳白過面，終身錢穀。此貴徵也。舌脫無官，橘面不顯；文人不傷在眼，鷹準動便食人。此賤徵也。
  applicable_to: []
  caveats:
  - '**强贬义判语**——"贱徵 / 食人"'
  - 现代必须 reframe
  - '**禁止**用于评价具体个人'
  - 涉及职业 / 道德判断属现代禁用
