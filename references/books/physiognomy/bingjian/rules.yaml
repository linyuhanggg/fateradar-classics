- rule_id: BR-06-04
  kind: doctrine
  statement: 贫贱者有声无音，尖巧者有音无声，所谓"禽无声、兽无音"是也。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 65
    end_line: 65
  quote: 音者，聲之餘也，與聲相去不遠，此則從細處曲中見直。貧賤者有聲無音，尖巧者有音無聲，所謂禽無聲、獸無音是也。凡人說話是聲，其散在左右前後是音。開談若含情，話終多餘響，不惟雅人，兼稱國士；闊口無溢出，尖舌無窕音，不惟實厚，兼獲名高。
  applicable_to: []
  caveats:
