- rule_id: BR-01-04
  kind: doctrine
  statement: 抖擞时易见，断续时难见。小心者从其做不了处看（脱略）；大胆者从其做了处看（针线）。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 23
    end_line: 23
  quote: 凡精神抖擻時易見，斷續時難見。斷者出處斷，續者閉處續。道家所謂收拾入門之說，不了處看其脫略，做了處看其針線。小心者，從其做不了處看之，疏節闊目，若不經意，所謂脫略也。大膽者，從其做了處看之，慎重周密，無有苟且，所謂針線也。二者實看向內處，稍移外便落情態矣，情態易見。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - 属古典察人技法，与现代心理学不同源
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-01-05
  kind: doctrine
  statement: 骨有九起：天庭、枕、顶、佐串、太阳、眉、鼻、颧、颊。头主天庭、枕、太阳；面主眉、颧。五者备者，柱石器也。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 25
    end_line: 25
  quote: 骨有九起：天庭骨隆起，枕骨強起，頂骨平起，佐串骨角起，太陽骨線起，眉骨伏犀起，鼻骨芽起，顴骨豐起，頰骨平伏起。在頭以天庭骨、枕骨、太陽骨為主；在面以眉骨、顴骨為主。五者備，柱石器也。一則不窮，二則不賤，三動履小勝，四貴異。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"柱石器"是古典语义，不作现代职业前途判断'
  - 不作医学骨学解读
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-01-06
  kind: doctrine
  statement: 面以青为主（"少年公卿半青面"），紫次之，白下；头联者贵、扁次、碎下；面佳不如头佳。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 27
    end_line: 27
  quote: 骨有色，面以青為主，少年公卿半青面是也。紫次之，白斯下矣。骨有質，頭以聯者為貴，匾者次之，碎為最下。總之，頭少惡骨，面佳不如頭佳。然大而缺天庭，終是賤品；圓而無串骨，半為孤僧；鼻骨犯眉，堂上不壽；顴與眼爭，子嗣不立。此中貴賤，有毫厘千里之辨。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"贵 / 下" 古义判语'
  - 现代禁用于评价具体个人
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-01-07
  kind: doctrine
  statement: 大而缺天庭终是贱品；圆而无串骨半为孤僧；鼻骨犯眉堂上不寿；颧与眼争子嗣不立。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 27
    end_line: 27
  quote: 骨有色，面以青為主，少年公卿半青面是也。紫次之，白斯下矣。骨有質，頭以聯者為貴，匾者次之，碎為最下。總之，頭少惡骨，面佳不如頭佳。然大而缺天庭，終是賤品；圓而無串骨，半為孤僧；鼻骨犯眉，堂上不壽；顴與眼爭，子嗣不立。此中貴賤，有毫厘千里之辨。
