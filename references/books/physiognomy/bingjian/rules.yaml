- rule_id: BR-02-01
  kind: doctrine
  statement: 既识神骨，当辨刚柔。刚柔即五行生克之数，名"先天种子"；不足用补、有余用泄。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 31
    end_line: 31
  quote: 既識神骨，當辨剛柔。剛柔即五行生剋之數，名曰先天種子。不足用補，有餘用洩，消息直與命通，此其皎然易見。五行有合法。木合火，水合木，此順而合。順者多富，即貴亦在浮沉之間。金與火仇，有時合火，推之水土皆然，此逆而合。逆者其貴非常。然所謂逆合者，金形帶火則然，火形帶金則三十死矣；水形帶土則然，土形帶水則孤寒老矣；木形帶金則然，金形帶木則刀劍隨身矣。此外牽合，俱是雜格，不入文人正論。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"先天种子"为古义，不作现代医学/遗传学解读'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-02-02
  kind: doctrine
  statement: 木合火、水合木：顺合，多富，贵在浮沉间；金与火仇时合火、水土皆然：逆合，贵非常。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 31
    end_line: 31
  quote: 既識神骨，當辨剛柔。剛柔即五行生剋之數，名曰先天種子。不足用補，有餘用洩，消息直與命通，此其皎然易見。五行有合法。木合火，水合木，此順而合。順者多富，即貴亦在浮沉之間。金與火仇，有時合火，推之水土皆然，此逆而合。逆者其貴非常。然所謂逆合者，金形帶火則然，火形帶金則三十死矣；水形帶土則然，土形帶水則孤寒老矣；木形帶金則然，金形帶木則刀劍隨身矣。此外牽合，俱是雜格，不入文人正論。
