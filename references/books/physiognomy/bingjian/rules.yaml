- rule_id: BR-07-01
  kind: doctrine
  statement: 面部如命、气色如运。大命固宜整齐、小运亦当亨泰。光焰不发：珠玉与瓦砾同观；藻绘未扬：缯帛与布葛齐价。大者主一生祸福、小者亦三月吉凶。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 69
    end_line: 69
  quote: 面部如命，氣色如運。大命固宜整齊，小運亦當亨泰。是故光焰不發，珠玉與瓦礫同觀；藻繪未揚，繒帛與布葛齊價。大者主一生禍福，小者亦三月吉凶。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"祸福 / 吉凶"古义'
  - 现代不作具体祸福预测
  - 属 safety-redlines 范围
