- rule_id: BR-01-01
  kind: doctrine
  statement: 一身精神具乎两目；一身骨相具乎面部。文人观人先观神骨，开门见山。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 19
    end_line: 19
  quote: 語云：脫穀為糠，其髓斯存，神之謂也。山騫不崩，惟石為鎮，骨之謂也。一身精神，具乎兩目；一身骨相，具乎面部。他家兼論形骸，文人先觀神骨，開門見山，此為第一。
  applicable_to: []
  caveats:
  - 仅作旁证参考，不参与命盘硬判断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-01-02
  kind: doctrine
  statement: 论神先辨清浊，再辨邪正；辨邪正先观动静。静若含珠、动若水发；静若无人、动若赴敌——澄清到底。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 21
    end_line: 21
  quote: 相家論神，有清濁之辨。清濁易辨，邪正難辨。欲辨邪正，先觀動靜。靜若含珠，動若水發；靜若無人，動若赴敵。此為澄清到底。靜若螢光，動若流水，尖巧喜淫；靜若半睡，動若鹿駭，別才而深思；一為敗器，一為隱流。均之。託跡二清，不可不辨。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"邪正"是古义概念，现代不作道德评价'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-01-03
  kind: doctrine
  statement: 静若萤光、动若流水：尖巧喜淫；静若半睡、动若鹿骇：别才深思；前者隐流，后者败器。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 21
    end_line: 21
  quote: 相家論神，有清濁之辨。清濁易辨，邪正難辨。欲辨邪正，先觀動靜。靜若含珠，動若水發；靜若無人，動若赴敵。此為澄清到底。靜若螢光，動若流水，尖巧喜淫；靜若半睡，動若鹿駭，別才而深思；一為敗器，一為隱流。均之。託跡二清，不可不辨。
