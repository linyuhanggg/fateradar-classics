- rule_id: BR-05-01
  kind: doctrine
  statement: 鬚眉男子。少年两道眉、临老一林鬚——眉主早成、鬚主晚运。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 55
    end_line: 55
  quote: 鬚眉男子。未有鬚眉不具，可稱男子者。少年兩道眉，臨老一林鬚。此言眉主早成，鬚主晚運也。然而，紫面無眉自貴，暴腮缺鬚亦榮。郭令公半部不全，霍剽姚一副寡臉。此等間逢。畢竟有鬚眉者十之九也。眉尚彩，彩者，杪處反光是也。貴人有三層彩，有一二層彩者，所謂文明氣象。宜疏爽不宜凝滯，一望有乘風翔舞之勢者，上也；如潑墨者，最下。倒豎者，上也；下垂者，最下。長有起伏，短有神氣，濃忌浮光，淡忌枯索。如劍者掌兵權，如帚者赴法場。箇中亦有微茫，不可不辨。他如壓眼不利，散亂多憂，細而帶媚，粗而無文，最是下乘。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - 现代不作"早成晚运"的硬性人生分期
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-05-02
  kind: doctrine
  statement: 眉尚彩；贵人三层彩；一二层为文明气象。宜疏爽不宜凝滞、宜倒竖不宜下垂；如剑者掌兵权、如帚者赴法场。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 55
    end_line: 55
  quote: 鬚眉男子。未有鬚眉不具，可稱男子者。少年兩道眉，臨老一林鬚。此言眉主早成，鬚主晚運也。然而，紫面無眉自貴，暴腮缺鬚亦榮。郭令公半部不全，霍剽姚一副寡臉。此等間逢。畢竟有鬚眉者十之九也。眉尚彩，彩者，杪處反光是也。貴人有三層彩，有一二層彩者，所謂文明氣象。宜疏爽不宜凝滯，一望有乘風翔舞之勢者，上也；如潑墨者，最下。倒豎者，上也；下垂者，最下。長有起伏，短有神氣，濃忌浮光，淡忌枯索。如劍者掌兵權，如帚者赴法場。箇中亦有微茫，不可不辨。他如壓眼不利，散亂多憂，細而帶媚，粗而無文，最是下乘。
