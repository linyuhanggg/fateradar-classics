- rule_id: BR-07-02
  kind: doctrine
  statement: 终身气色：少淡、长明、壮艳、老素；年气色：春青、夏红、秋黄、冬白；月气色：朔后森发、望后隐跃；日气色：早透、昼满、晚停、暮静。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 71
    end_line: 71
  quote: 人以氣為主，於內為精神，於外為氣色。有終身之氣色，少淡、長明、壯艷、老素是也。有一年之氣色，春青、夏紅、秋黃、冬白是也。有一月之氣色，朔後森發，望後隱躍是也。有一日之氣色，早透、晝滿、晚停、暮靜是也。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - 古典色相分类，不作现代医学之"面色"诊断
  - 不作具体吉凶预测
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-07-03
  kind: doctrine
  statement: 科名中人以黄为主：黄云盖顶必掇大魁、黄翅入鬓进身不远、印堂黄色富贵逼人、学堂紫净明年及第。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 73
    end_line: 73
  quote: 科名中人，以黃色為主，此正色也。黃雲蓋頂，必掇大魁；黃翅入鬢，進身不遠；印堂黃色，富貴逼人；學堂紫淨，明年及第。他如眼角霞鮮，決利小考；印堂垂紫，動獲小利；紅暈中分，定產佳兒；兩顴紅潤，骨肉發跡。由此推之，足見一斑矣。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"必掇大魁 / 富贵逼人 / 明年及第"是古义铁口判语'
  - '**现代严禁**直接套用到考试 / 升迁 / 中标等具体场合'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-07-04
  kind: doctrine
  statement: 色忌白、忌青；青常见眼底、白常发眉端。心事忧劳青如凝墨；祸生不测青如浮烟；酒色憊倦白如卧羊；灾晦催人白如傅粉。最不佳者：太白夹日月、烏鳥集天庭、桃花散面颊、赪尾守地阁。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 75
    end_line: 75
  quote: 色忌白、忌青。青常見於眼底，白常發於眉端。然亦有不同。心事憂勞，青如凝墨；禍生不測，青如浮煙；酒色憊倦，白如臥羊；災晦催人，白如傅粉。又或青而帶紫，金形遇之而飛揚；白而有光，土庚相當亦富貴；又不在此論也。最不佳者，太白夾日月，烏鳥集天庭，桃花散面頰，赬尾守地閣。有一於此，前程退落，禍患再三矣。
  applicable_to: []
  caveats:
  - '**强凶语**——"祸 / 灾 / 前程退落 / 禍患再三"'
  - '**现代严禁**直接预测灾祸'
  - 属 safety-redlines
  - 输出层屏蔽灾祸 / 病况硬判
  - 仅作传统语义还原
