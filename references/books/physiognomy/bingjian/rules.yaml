- rule_id: BR-02-04
  kind: doctrine
  statement: 喜高怒重、过目辄忘——近粗；伏不伉跳不扬——近蠢；初浅转深——近奸。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 33
    end_line: 33
  quote: 五行為外剛柔，內剛柔則喜怒、伏跳、深淺者是。喜高怒重，過目輒忘，近粗。伏亦不伉，跳亦不揚，近蠢。初念甚淺，轉念甚深，近奸。內奸者，功名可期。粗蠢各半者，勝人以壽。純奸能豁達者，其人終成。純粗無周密者，半途必棄。觀人所忽，十得八九矣。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '**贬义**——"粗 / 蠢 / 奸" 现代必须 reframe 为"古典语义还原"，不作人格诊断'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: BR-02-05
  kind: doctrine
  statement: 内奸者功名可期；粗蠢各半者胜人以寿；纯奸能豁达者其人终成；纯粗无周密者半途必弃。
  anchor:
