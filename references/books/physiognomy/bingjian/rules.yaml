    start_line: 49
    end_line: 49
  quote: 人有弱態，有狂態，有疏懶態，有周旋態。飛鳥依人，情致婉轉，此弱態也。不衫不履，旁若無人，此狂態也。坐立自如，問答隨意，此疏懶態也。飾其中機，不苟言笑，察言觀色，趨吉避凶，此周旋態也。皆根其性，不由矯枉。弱而不媚，狂而不譁，疏懶而真誠，周旋而健舉，皆能成器；反此，敗類也。大概亦得二三矣。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - 本书强调"皆根其性、不由矫枉"，可作传统人格四分模型
  - 但不作现代心理学诊断
