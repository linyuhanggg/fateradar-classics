- rule_id: BR-05-03
  kind: doctrine
  statement: 须取与眉相称；多者宜清疏缩参差，少者宜健光圆有情。捲如螺、长如索、劲如戟、亮如银条皆官途大器。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 57
    end_line: 57
  quote: 鬚有多寡，取其與眉相稱。多者宜清、宜疏、宜縮、宜參差不齊；少者宜健、宜光、宜圓、宜有情照顧。捲如螺紋，聰明豁達；長如解索，風流榮顯；勁如張戟，位高權重；亮若銀條，早登廊廟。皆官途大器。紫鬚劍眉，聲音洪壯；蓬然虯亂，嘗見耳後；配以神骨清奇，不千里封侯，亦十年拜相。他如輔鬚先長終不利，人中不見一世窮，鼻毛接鬚多晦滯，短髭遮口餓終身，此其顯可見矣。
  applicable_to: []
  caveats:
  - 仅作旁证参考
  - '"官途大器"古义'
