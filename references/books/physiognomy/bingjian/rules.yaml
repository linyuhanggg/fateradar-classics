- rule_id: BR-04-03
  kind: doctrine
  statement: 神忽他往、独冷笑：深险难近，不足与论情；极口称是、故意诋毁：卑庸可耻，不足与论事；漫无可否、无故堕泪：愚昧之仁，不足与谈心。三者不必定人终身。
  anchor:
    file: sources/fulltext/physiognomy/bingjian/fulltext.md
    start_line: 51
    end_line: 51
  quote: 前者恒態，亦有時態。方與對談，神忽他往；眾方稱言，此獨冷笑；深險難近，不足與論情。言不必當，極口稱是；未交此人，故意詆毀；卑庸可恥，不足與論事。漫無可否，臨事遲回；不甚關情，亦為墮淚；愚昧之仁，不足與談心。三者不必定人終身。反此以求，可以交天下士。
  applicable_to: []
