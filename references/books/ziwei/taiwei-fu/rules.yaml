- rule_id: TAIWEIFU-021
  kind: doctrine
  statement: 土星苟居其垣若可移动；金星专司财库最怕空亡；帝星动则列宿奔驰；贪守空而财源不聚。
  anchor:
    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 8
    end_line: 8
  quote: 觀乎紫微舍躔，司一天儀之象，率列宿而成垣，土星苟居其垣，若可移動，金星專司財庫，最怕空亡。
  applicable_to: []
  caveats:
  - 各主星本性归属，须结合宫位综合判断
