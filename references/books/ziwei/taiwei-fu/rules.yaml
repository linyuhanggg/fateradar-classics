- rule_id: TAIWEIFU-011
  kind: doctrine
  statement: 太阳居午，谓之日丽中天，有专权之贵、敌国之富。
  anchor:
    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 32
    end_line: 32
  quote: 太陽居午，謂之日麗中天，有專權之貴，敵國之富。
  applicable_to: []
  caveats:
