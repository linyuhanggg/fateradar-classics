rules:
- rule_id: TR
  kind: doctrine
  statement: 斗数至玄至微，理旨难明；寿夭贤愚、富贵贫贱，不可一概论议。
  anchor:
    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 5
    end_line: 5
  quote: 斗數至玄至微，理旨難明，雖設問於百篇之中，猶有言而未盡，至如星之分野，各有所屬，壽夭賢愚，富貴貧賤，不可一概論議。
  applicable_to: []
  caveats:
  - 提醒断命须留余地，不作一概而论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: TAIWEIFU-TR
  kind: doctrine
  statement: 入庙为奇，失度为虚；身命为福德之本，加以根源为穷通之资。
  anchor:
    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 6
    end_line: 6
  quote: 其星分布一十二垣，數定乎三十六位，入廟為奇，失度為虛，大抵以身命為福德之本，加以根源為窮通之資。
  applicable_to: []
  caveats:
  - 入庙/失度的具体配位需查《紫微斗数全书》卷二
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: TAIWEIFU-003
  kind: doctrine
  statement: 禄存逢冲破，吉处藏凶。
  anchor:
    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 15
    end_line: 15
  quote: 祿逢沖破，吉處藏凶。馬遇空亡，終身奔走。
  applicable_to: []
  caveats:
  - 现代教学保留为"吉中藏忧"参考，不作绝对凶论
  school: null
