- rule_id: TAIWEIFU-006
  kind: doctrine
  statement: 日月最嫌反背（日不入南、月不照北）；禄马最喜交驰（禄存与天马同会）。
  anchor:
    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 18
    end_line: 18
  quote: 日月最嫌反背，祿馬最喜交馳。
  applicable_to:
  - {key: xingyao, value: 太阳}
  caveats:
  - 反背为不吉倾向，非铁口凶论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: TAIWEIFU-007
  kind: doctrine
  statement: 紫微天府全依辅弼之功；辅弼夹帝为上品。
  anchor:
    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 20
    end_line: 20
  quote: 紫微天府全依輔弼之功，七殺破軍專依羊鈴之虐。
  applicable_to: []
  caveats:
  - 须辅弼真夹（紧夹）方为上品
  - 隔宫效力减半
  school: null
  verified: false
