    file: sources/fulltext/ziwei/taiwei-fu/fulltext.md
    start_line: 16
    end_line: 16
  quote: 生逢敗地，發也虛花。絕處逢生，生花不敗。
  applicable_to: []
  caveats:
  - 须结合大限流年综合判断
