    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 3806
    end_line: 3806
  quote: 凡看父母以太陽星為父，太陰星為母。太陽在陷宮主先克父，太陰星在陷宮主先克母。
