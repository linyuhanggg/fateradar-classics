    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 3749
    end_line: 3749
  quote: 紫微福厚享福安樂，天府天相同終身獲吉，破軍同勞心費力不安，加羊陀鈴空劫福薄，天機同享福終身。
