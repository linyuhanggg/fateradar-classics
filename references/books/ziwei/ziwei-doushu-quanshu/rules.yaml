- rule_id: ZIWEIDOUSHUQ-008
  kind: doctrine
  statement: 廉贞为官禄囚星，入命主邪正双面：清白入庙主清贵廉洁；会煞落陷主官非桃花、刑伤囚禁。
  anchor: null
  quote: 財居空亡巴三覽四，文曲旺宮聞一知十。暗合廉貞為貪濫之曹吏。
  applicable_to: []
  caveats:
