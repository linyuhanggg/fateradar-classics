- rule_id: ZIWEIDOUSHUQ-024
  kind: doctrine
  statement: 天空地劫主破败劫财；二星夹命主一生不聚财；会吉星则减凶。
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 1106
    end_line: 1106
  quote: 希夷先生曰：二星守身命，遇吉則吉，遇凶則凶。如四殺沖照，輕者下賤，重者六畜之命。僧道不正，女子婢妾，刑克孤獨。大抵二星俱不宜見，定主破財，二限逢之必凶。
  applicable_to: 
  - key: ziwei_star
    value: 地劫
  - key: ziwei_star
    value: 天空
  caveats:
  - 仅作文化研究参考
  - 不作铁口断破财
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZIWEIDOUSHUQ-025
  kind: doctrine
  statement: 天伤主病伤损耗，天使主疾厄使灾；流年遇之主小灾。
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 3472
    end_line: 3472
  quote: 先看命宮星曜落陷加羊陀火鈴空劫化忌守照如何，又看疾厄宮星曜善惡廟旺落陷如何斷之。
  applicable_to: []
  caveats:
  - ⚠️ "病伤"断语**严禁**作医疗诊断
  - 仅作文化研究参考
  - 如有健康疑虑请就医
