    start_line: 4008
    end_line: 4008
  quote: 如寅午巳酉生人，見辰戍丑未時最毒，子申亥卯生人次之。若寅亥巳生人，見午申酉亥時，主先克父，出十六歲則不妨。若辰巳丑未生人，見子午卯巳亥申酉時生者，主先克母。
