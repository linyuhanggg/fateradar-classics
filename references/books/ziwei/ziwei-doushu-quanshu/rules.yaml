  kind: doctrine
  statement: 天府为南斗财库主星，入命主慷慨稳重、财禄宽裕；与紫微同宫为大富大贵之"紫府同宫"格。
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 409
    end_line: 409
  quote: 答曰：紫微屬土，乃中天之尊星為帝座，主掌造化樞機，人生主宰。仗五行育萬物，以人命為之立定數。
