    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 3983
    end_line: 3983
  quote: 小兒博士力士上短下長，青龍將軍腮小頭圓。大耗鼻仰唇縮，死符病符聲高性雄。官府奏書逢惡曜落地無聲，白虎太歲遇七殺幼弱遭傷。須分生克制化之垣，更看時祿衰敗之地，後觀關殺方知壽夭窮通。
