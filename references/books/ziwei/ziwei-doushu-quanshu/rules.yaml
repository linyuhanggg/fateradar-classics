    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 4039
    end_line: 4039
  quote: 須詳大限獨守吉凶何如，小限獨守吉凶何如，太歲獨守吉凶何如。如歲限俱凶則凶。又看大限與小限相逢吉凶何如，大限逢太歲吉凶何如，小限逢太歲吉凶何如，禍福所定。又看太歲沖大限小限，太歲沖羊陀七殺，然後可斷吉凶。
