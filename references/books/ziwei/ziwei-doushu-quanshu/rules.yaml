- rule_id: ZIWEIDOUSHUQ-021
  kind: doctrine
  statement: 禄存主财禄，天马主奔波；禄马同宫或会照成"禄马交驰"富格，主奔波得财；禄存独守且无吉则称"羊陀夹禄"易破。
  anchor: null
  quote: 苗而不秀科名陷於凶神，發不主財祿主躔於弱地。
