- rule_id: ZIWEIDOUSHUQ-059
  kind: doctrine
  statement: 07 男女命同异
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 3977
    end_line: 3977
  quote: 男女命不同，星辰各別。男命先看身命，次看財帛宮祿遷移，俱要廟旺為吉，落陷聚凶為凶。三看福德，權祿劫空廟陷吉忌。又看田宅奴僕疾厄宮吉凶，吉凶已算於後。又看父母妻子三宮，俱有劫空殺忌則僧道之命，否則貧窮孤獨。須要仔細參詳，方可斷人禍福榮辱。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
