rules:
- rule_id: ZW
  kind: doctrine
  statement: 斗数以命、兄弟、妻妾、子女、财帛、疾厄、迁移、奴仆、官禄、田宅、福德、父母为十二宫次序。
  anchor: null
  quote: 紫微有倚靠年長之兄，天府同三人，天相同三四人，破軍同亦有三人，或各胞生，加羊陀火鈴空劫克害有則欠和。
  applicable_to: []
  caveats:
  - 仅证明十二宫方法，不授权宫位吉凶
  school: null
  verified: false
  verified_by: null
  verified_at: null
