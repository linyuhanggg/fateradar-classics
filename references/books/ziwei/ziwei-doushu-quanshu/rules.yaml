    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 4686
    end_line: 4686
  quote: 火鈴夾命為敗局  如命安寅申，火星在丑，鈴星在卯。吉多尚可，惟夾忌。辰凶歲限巡遊者此地亦吉
