- rule_id: ZIWEIDOUSHUQ-022
  kind: doctrine
  statement: 擎羊主刑伤争斗，陀罗主延滞磨折；二煞夹命/夹禄/夹忌主灾厄；庙旺会吉星可制凶（如"马头带剑"）。
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 1257
    end_line: 1257
  quote: 命里逢空不飄流即主疾苦，馬頭帶劍非夭折則主刑傷。
