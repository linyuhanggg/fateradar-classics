- rule_id: ZIWEIDOUSHUQ-005
  kind: doctrine
  statement: 太阳庙旺（寅卯辰巳午）入命主贵气光明、为父星夫星；落陷（戌亥子）入命主辛劳;**女命**太阳庙旺与男命同贵，落陷则古书指婚迟（**强 reframe**：现代社会无此因果）。
  anchor: null
  quote: 太阳庙旺（寅卯辰巳午）入命主贵气光明、为父星夫星；落陷（戌亥子）入命主辛劳;**女命**太阳庙旺与男命同贵，落陷则古书指婚迟（**强 reframe**：现代社会无此因果）。
