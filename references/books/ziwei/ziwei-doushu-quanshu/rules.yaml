- rule_id: ZW-01
  kind: doctrine
  statement: 紫微为帝座尊星，入命主聪明端正、仪表魁梧、有领导力；庙旺会左辅右弼天魁天钺主大富大贵；落陷无吉则成"在野孤君"，主孤高难合群。
  anchor: null
  quote: 希夷先生曰：紫微為帝座，在諸宮能降福消災，解諸星之惡虛。能制火鈴為善，能降七殺為權。
  applicable_to: []
  caveats:
  - 仅作命书文化研究参考，不作铁口断富贵
  - 不替代现代职业/教育规划
  school: null
  verified: false
  verified_by: null
  verified_at: null
