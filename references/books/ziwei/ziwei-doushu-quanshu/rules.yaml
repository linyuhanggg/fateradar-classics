- rule_id: ZIWEIDOUSHUQ-020
  kind: doctrine
  statement: 天魁阳贵人主白日助力，天钺阴贵人主夜间助力；命身夹魁钺为"魁钺夹命"贵格，主一生贵人提携。
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 4696
    end_line: 4696
  quote: 魁鉞夾命為奇格  如命安在辰宮，魁在卯，鉞在巳宮是也。
