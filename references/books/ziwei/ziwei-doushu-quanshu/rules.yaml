  kind: doctrine
  statement: 天机为兄弟主星，入命主智慧善变、宜动宜谋；与天梁同主善人；与太阴同主参佐；落陷会煞主奔波劳碌、虚而不实。
  anchor: null
  quote: 紫微有倚靠年長之兄，天府同三人，天相同三四人，破軍同亦有三人，或各胞生，加羊陀火鈴空劫克害有則欠和。
  applicable_to: []
