  statement: 命局有先贫后富之象（如大限早凶后吉、武贪格三十后发等）；为命学动态发展观，非命定贫富。
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 4013
    end_line: 4013
  quote: 人生於富貴之家，一生快樂享福，財官顯達，妻榮子貴，奴僕成行，聲名昭著。其間有半途遭傷，人離財散，官非火盜，身喪家亡，此等之命非命也。是限步逢大小二限及太歲相衝照，又加兇殺守臨，故此破敗，不貧即損壽也。所謂先成後敗，先大後小也。
