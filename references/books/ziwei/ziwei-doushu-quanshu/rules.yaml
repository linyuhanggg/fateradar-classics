- rule_id: ZIWEIDOUSHUQ-ZW-02
  kind: doctrine
  statement: 左辅右弼会紫微成"君臣庆会"贵格；左右夹命主一生贵人多助；单守命宫力减半。
  anchor:
    file: sources/fulltext/ziwei/ziwei-doushu-quanshu/fulltext.md
    start_line: 3572
    end_line: 3572
  quote: 紫微成行得力，旺主生財，加擎羊火鈴陀羅欠力，破軍同先難後有招，天相同得力，加空劫招怨逃走。
