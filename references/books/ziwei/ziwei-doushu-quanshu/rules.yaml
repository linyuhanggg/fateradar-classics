    start_line: 1418
    end_line: 1418
  quote: 如克妻克子克父母內犯一二不為僧道亦作貧賤之人，第一看父母在廟旺地有無吉凶星辰，如在陷地加殺化忌必主刑克，第二又看妻妾宮，三看子女宮廟陷之地，有無吉凶星辰，如在陷加殺化忌必鰥寡孤獨論斷。
