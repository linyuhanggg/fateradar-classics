- rule_id: LIXUZHONGMIN-004
  kind: doctrine
  statement: 本旺禄休之火；惟欲阴旺恶处盛阳；木火相资连艮震必变鼎。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 24
    end_line: 24
  quote: 丁卯貴祿奇乃本旺祿休之火惟欲隂旺惡處盛陽若火木相資連於艮震之方必能變鼎味而成享禮也〔欲逢官鬼始得貴奇〕
  applicable_to: []
  caveats:
