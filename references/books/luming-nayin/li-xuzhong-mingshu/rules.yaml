  quote: 吉凶中〔其言吉凶有相反如季主云使盡吉合則殃也〕運限之道有天官限者〔三元到中庸之地見貴逢合或只有貴却無合或有合而無貴四柱相生運嵗相輔凡得此限君子將榮庶人獲安事事皆吉 有得勢限三元俱到旺相地四柱相資承 有蔵限如祿金入土干下者是也命金入土支下身金入土納音下
