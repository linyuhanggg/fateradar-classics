- rule_id: LIXUZHONGMIN-014
  kind: doctrine
  statement: 渐下欲流之水；得水土相承经败地源脉不断可升而济物。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 33
    end_line: 33
  quote: 丁丑祿自守乃漸下欲流之水得水土相承經於敗地源脈不斷可升而濟物功徳昭著也〔丑有癸蔵不明見官〕
