    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 34
    end_line: 34
  quote: 戊寅地官承乃生體安和之土若資之以火土俱盛金旺之榮雖多反制尚可髙崇為不常之用〔得官不旺貴出自然〕己卯地官承為鬼旺體堅之土生於金重木多而見財重乃富貴長逺〔得官不旺貴出自然〕
