rules:
- rule_id: LX-01
  kind: doctrine
  statement: 子旺母衰之金，溺水下韬光，须假火革；命入贵格明暗取官。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 21
    end_line: 21
  quote: 甲子天官蔵是子旺母衰之金溺於水下而韜光湏假火革有旺盛之氣方可以揚名顯用〔命入貴格明暗取官〕
  applicable_to: []
  caveats:
