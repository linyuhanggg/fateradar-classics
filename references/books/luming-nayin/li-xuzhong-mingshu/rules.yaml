- rule_id: LIXUZHONGMIN-LX-03
  kind: doctrine
  statement: 坤为土，乾为金，金亦土也，为水母。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 96
    end_line: 96
  quote: 地二蓋乾坤之體坤為土也乾為金金亦土也為水母〔天一地二奇耦之策也三奇為乾三耦為坤是一而兩之之義也故隂陽自始者謂之太始隂陽自明者謂之太極則萬物之始於乾也亦由天地之所資以始是以知乾為之太始萬物之所資生於坤也亦由天地之所資以生是以知坤為之太極故乾之卦
  applicable_to: []
  caveats:
  - 同上
  school: null
