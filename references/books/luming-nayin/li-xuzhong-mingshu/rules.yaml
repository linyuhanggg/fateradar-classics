    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 92
    end_line: 92
  quote: 澄髙者自下而上天髙而浮地厚而沈浮者有彰動之象故為陽沈者有寂沒之理故為隂清者上騰髙而純陽故充滿濁者下沈密而純隂故㝠寂而萬物從化之故衝於上者為陽而生萬物沈於下者為隂而成萬物然而實始於一者也〕清濁交分人物混成造化始於無相因而三生〔太樸之散乾坤之形分體
  applicable_to: []
