    end_line: 81
  quote: 名若有衝破空亡只作一多難州縣官晚年得至朝官極矣如辛未庚寅此為第三等若無死絶衝破空亡即作正郎卿監少達歴清要差遣更有福神為之助往往為兩制矣若有死絶即作員郎京朝官更有衝破空亡平生多難只作州縣卑冗之官縱得改官易位夀不永矣〔林開五命〕紫虛局 貴人交互人多貴
