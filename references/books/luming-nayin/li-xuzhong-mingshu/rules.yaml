    end_line: 237
  quote: 終始之道非才能明於日月器度廣於山川大人君子孰能備徳况神頭祿各有神以主之應日臨神或左右運動於六合之中盈縮於吉凶之變也〔己丑土為天乙貴人乙未土為太常福神觧百煞之凶配一人之徳吉以吉應逐凶釋凶若得之當用則為横財之善若戊辰為勾陳戊戌為天空亡之神多遷改君
