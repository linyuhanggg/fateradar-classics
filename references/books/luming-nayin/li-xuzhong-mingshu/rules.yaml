- rule_id: LIXUZHONGMIN-008
  kind: doctrine
  statement: 自本立形之土；火助木乘水轻木重亦小康；败而乘禄方为厚载之福。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 27
    end_line: 27
  quote: 辛未祿自蔵乃自本立形之土有火相助得木相乘水輕木重亦可以小康若敗而乘祿多方為厚載之福〔喜見干連不畏木重〕
