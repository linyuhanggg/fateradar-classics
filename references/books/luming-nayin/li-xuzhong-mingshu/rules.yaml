- rule_id: LIXUZHONGMIN-LX-01
  kind: doctrine
  statement: 库墓守财之金；不嫌鬼旺、喜禄财；水土砥砺亦可成器。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 22
    end_line: 22
  quote: 乙丑祿官承乃庫墓守財之金不嫌鬼旺之方喜見祿財之地水土砥礪忽然有氣亦可以為器成材〔平和貴格不湏禄到〕
  applicable_to: []
  caveats:
