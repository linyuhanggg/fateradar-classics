- rule_id: LIXUZHONGMIN-009
  kind: doctrine
  statement: 自任权制之金；刚而有断；爱土木嫌火重；财旺身衰亦清华之贵。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 28
    end_line: 28
  quote: 壬申地天祿乃自任權制之金剛而有斷愛土木而嫌火重雖居財旺身衰亦主清華之貴〔真假財官貴之為貴〕
  applicable_to: []
  caveats:
  - 命书条文层
  - 不作具体仕途、寿夭、财运硬判
  - 与子平格局/用神不可混用
