    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 31
    end_line: 31
  quote: 乙亥地祿承為氣散㳺魂之火生於木火榮方上下不逢相制僅而成達多助尤崇〔真官相制得貴亦崇〕
