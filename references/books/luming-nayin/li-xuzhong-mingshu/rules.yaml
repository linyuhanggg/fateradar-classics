    start_line: 222
    end_line: 222
  quote: 入災運於十載之間亦有五年之吉不至於凶甚以此消息故名布素限分前後五年不吉後運則助五年無凶後運若凶則凶咎 有失所限三元俱值鬼二運見三刑併衝柱主本與行年不相承作黄泉失所之命也 有破碎限此非死限只是金破碎去如流水而不返諸運氣沐浴更逢真鬼謂甲衰而有庚之類
