- rule_id: LIXUZHONGMIN-006
  kind: doctrine
  statement: 气胜体刚之木；逢对旺干鬼或木来比助金伐则成栋梁。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 26
    end_line: 26
  quote: 己巳地奇備乃氣勝體剛之木生逢對旺干鬼相加或木來比助金伐以成為棟梁之材皆得終美〔貴無官鬼湏見角音〕庚午天祿承是含輝始育之土氣數未備惟喜旺方得數已完尚嫌水重若獨祿會命旺身絶豈是貴地〔祿鬼自處不假官鬼〕
  applicable_to: []
  caveats:
