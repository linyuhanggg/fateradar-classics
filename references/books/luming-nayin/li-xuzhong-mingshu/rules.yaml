    start_line: 239
    end_line: 239
  quote: 雖名大智非軒昂超達之士不可姑息順則安平逆則奸危庚申為白虎之神利於武而不利於文有抱道旅羈之性善中嚴内色厲内荏有仁義好幽僻辛酉為太隂之神懷肅殺之氣者有清白之風為文章和易不世之才然後各以親踈休旺定之也〕水土名用 土本無一方之氣從水妻之義也隂陽各逐四時
