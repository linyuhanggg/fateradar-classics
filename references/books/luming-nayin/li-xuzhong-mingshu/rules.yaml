    start_line: 38
    end_line: 38
  quote: 癸未祿自備為伐根之木氣敗而體柔不嫌金制喜水之榮及會元而借生主乃重器成徳之材〔癸在巳中喜逢甲乙〕甲申地祿生乃源泉之水務有資助流長而無鬼則為運廣之淵可享髙厚之福〔祿始生要干生旺而無官〕
