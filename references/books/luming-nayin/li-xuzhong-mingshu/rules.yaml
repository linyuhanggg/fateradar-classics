- rule_id: LIXUZHONGMIN-003
  kind: doctrine
  statement: 子母相承之火；先煙后焰；喜木助、嫌水陵迟；五行相养虽死方亦光耿。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 23
    end_line: 23
  quote: 丙寅祿地元是子母相承之火先煙後熖抽其明而三進喜木為助嫌水陵遲五行相養雖在死方亦可光耿〔命入貴格不用干祿〕
  applicable_to: []
  caveats:
