  verified_at: null
- rule_id: LIXUZHONGMIN-069
  kind: doctrine
  statement: 甲己真宫（土）、乙庚真商（金）、丙辛真羽（水）、丁壬真角（木）、戊癸真徵（火）。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 107
    end_line: 107
  quote: 戌之為陽是知隂陽之相覆奇耦相匹故萬物化成生者為父為母為子為孫配之為夫為婦以别人倫之要也〕故曰甲己真宫乙庚真商丙辛真羽丁壬真角戊癸真徵〔甲木二五之始名而為土六位相成於已故曰真宫土生始成終故金次於土羽水之音角木之音徵火之音此十干皆天之清氣生數成於五
  applicable_to: []
  caveats:
  - 真五行≠纳音五行，须严格区分
