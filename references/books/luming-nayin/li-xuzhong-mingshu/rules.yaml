- rule_id: LIXUZHONGMIN-005
  kind: doctrine
  statement: 华实兼荣之木；爱水土忌火金；金养则英实之命。
  anchor:
    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 25
    end_line: 25
  quote: 戊辰神頭祿乃華實兼榮之木愛乎水土忌見火金有所養於金乃英實之命也〔相乘可貴不畏鬼臨〕
  applicable_to: []
  caveats:
  - 命书条文层
  - 不作具体仕途、寿夭、财运硬判
  - 与子平格局/用神不可混用
