    file: sources/fulltext/luming-nayin/li-xuzhong-mingshu/fulltext.md
    start_line: 29
    end_line: 29
  quote: 癸酉貴符印乃剛鋭利用之金不嫌絶敗惟畏鬼多若平易而不相刑當有自然之材器〔庚辛無鬼不假官貴〕
