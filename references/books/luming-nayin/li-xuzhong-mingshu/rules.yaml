    start_line: 76
    end_line: 76
  quote: 論貴神優劣 乙丑文星貴神 乙未華盖貴神〔截路空亡〕丁未退神羊刃貴神〔一云半吉〕己未羊刃貴神〔一云半吉〕辛未華盖貴神〔一云空亡大敗〕癸未伏神華盖貴神〔已上甲戊庚人月日時貴神〕甲子進神貴神 丙子交神貴神 戊子伏神貴神 庚子徳合貴神 壬子羊刃貴神 甲申截路空亡貴神〔一云半吉〕丙申大敗
