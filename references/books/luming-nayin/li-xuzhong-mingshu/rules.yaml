    start_line: 71
    end_line: 71
  quote: 此六十位五行支干相乘要分輕重若金溺水下火出水上木不得金之所制木無成也如甲子乙亥是也金溺水下火出水上金不得火之所制金無成也如辛亥之金是也夫如是而推伏現之情則造化之機自理〔鬼谷子以此十二音五行分輕重之用以推通變之妙者尚恐人執守方隅故言稱顯可測造化
