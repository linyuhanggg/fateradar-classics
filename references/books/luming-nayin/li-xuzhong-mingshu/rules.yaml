    start_line: 83
    end_line: 83
  quote: 貴合貴食 有貴合則官位穹崇所作契合有貴食則祿豐足所成造望如甲戊庚貴在丑未甲得己丑己未戊得癸丑癸未庚得乙丑乙未乙巳貴在申子乙得庚子庚申巳得甲子甲申丙丁貴在亥酉丙得辛酉辛亥丁得壬寅壬辰如此之類謂之貴合甲食丙乙食丁丙丁貴在酉亥甲得丙寅丙辰乙得丁酉丁
