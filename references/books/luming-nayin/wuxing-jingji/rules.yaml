    start_line: 8701
    end_line: 8701
  quote: 凡空亡遇三者，主骨肉離散，拋失鄉井，橫遭官事，常主破財，祿馬與一切福神落空亡，皆為陷沒，大小運至此，三命又在衰鄉，財祿無氣，亦為死厄。（三命鈴）
