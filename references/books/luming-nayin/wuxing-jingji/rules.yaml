    start_line: 11240
    end_line: 11240
  quote: 太歲者，木星之精也，每歲一位，其神為諸殺之君，故諸殺視之以定其位，所至之宮，欲常與本命支幹納音相合，無沖害、刑克，仍加本命貴人、祿馬，一切福神之地，則其年有遷官得財、成名進身．婚姻生子、利見大人之福。
