- rule_id: WX-05-07
  kind: doctrine
  statement: 学堂文章
  anchor:
    file: sources/fulltext/luming-nayin/wuxing-jingji/fulltext.md
    start_line: 6809
    end_line: 6809
  quote: 謂年、月、日、時，有甲乙丙丁分處四位，相聯不斷，帶木火盛數，如甲寅年、乙亥月、丁酉時、丙申日，丙寅胎，此青赤為文之命也，又雲：青赤時為父子，謂如甲子年、丙寅月、甲子日，丙寅時，又甲寅、丙寅之類，亦是如年木、月火、日木、時火，不惟福力最緊，兼文彩異眾。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: WX-06-01
  kind: doctrine
  statement: 上贵格三大要素
  anchor:
    file: sources/fulltext/luming-nayin/wuxing-jingji/fulltext.md
    start_line: 6084
    end_line: 6084
  quote: 以上贵格，须是支神带生旺福聚方入格，若有驳杂冲破空亡，所临时加减言之，若带死绝、凶杀、福聚之处，虽有如无也，主吉中有凶，亦作薄命断之，盖变官为鬼也，又若己酉己卯人见丁壬，壬子壬午人见乙庚，虽纳音见真五行克为官，奈本干同受克，故不作真官，而作真鬼断之，大小运太岁逢之，灾尤重。
  applicable_to: []
