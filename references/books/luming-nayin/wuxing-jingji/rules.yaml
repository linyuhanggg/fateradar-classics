  quote: 珞琭子雲：律呂宮商，五虎論其成敗，王氏注雲：陽六為律，陰六為呂，五音總於律呂，吹律吸呂，以定宮商，蓋五行合於五音，是故甲己宮土，遁起丙寅，乙庚商金，起戊寅，丙辛羽水，起於庚寅，丁壬角木，起自壬寅，戊癸徵火，起於甲寅，遁人之成敗吉兇
