- rule_id: WX-05-04
  kind: doctrine
  statement: 四进神贵命
  anchor:
    file: sources/fulltext/luming-nayin/wuxing-jingji/fulltext.md
    start_line: 6520
    end_line: 6520
  quote: 甲午为第三进神，则丙午、丁未、戊申为交、退伏神，已酉为第四进神，则辛酉、壬戌、癸亥为交、退、伏神、值进神则发迹亨快，值交神，则庶事不谐，值退神则官资降黜，值伏神则所作留滞。
  applicable_to: []
