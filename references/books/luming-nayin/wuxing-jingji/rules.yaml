    start_line: 8602
    end_line: 8602
  quote: 每旬管兩空亡，分前後五辰，各有所屬，假令甲子旬中無戌亥，自甲子至戊辰，以戌為空亡，自己巳至癸酉，以亥為空亡，餘彷此。（林開五命）
