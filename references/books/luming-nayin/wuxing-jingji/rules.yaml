    start_line: 9402
    end_line: 9402
  quote: 凡小兒日帶甲乙者，主印堂寬，日藏神，人中長，眉疏秀。帶丙丁者，主眼大，頸長，額窄。小年多患瘡。帶戊己者，主頭大，額廣，帶庚字者，主面方，額闊，帶辛字者，主鳳眼，耳朝口，有垂珠，帶壬字者，主眼大，好喫酒，膽大，蓋癸乃真武殺也。
