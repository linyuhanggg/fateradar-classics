    start_line: 9571
    end_line: 9571
  quote: 凡推男命，以年為父，胎為母，月為兄弟，官員以朋為僚友日為己身、妻妾，時為子孫，官員以時為帝座，禍福凡是子午卯酉日生，主娶子午卯酉命妻，或日支三六合，或乾合，俱不得偕老。
