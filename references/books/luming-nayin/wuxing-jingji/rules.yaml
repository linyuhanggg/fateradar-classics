    start_line: 8456
    end_line: 8456
  quote: 刑有四种：一曰无礼刑，子刑卯，卯复刑子，盖子为生阳晶，卯为日门，阳者，君也，夫也，势不两立，又子者，水也，卯者，木也，有子母之道，因两阳之竞不恤，所以相生处相刑害。
