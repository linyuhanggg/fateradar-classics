- rule_id: WX-08-04
  kind: doctrine
  statement: 父母位
  anchor:
    file: sources/fulltext/luming-nayin/wuxing-jingji/fulltext.md
    start_line: 9918
    end_line: 9918
  quote: 父位者，以克母者為之，謂如木命以土為父，若遇父在有氣之鄉，其父必居華顯或得父祖庥蔭，名望升達，假令戊辰木命人，以土為父，十一月生為旺鄉，若居無氣之鄉，則主其父不利，或幼失尊長，或父抱疾，終當孤立，假令丁卯火命人，以金為父，九月生為衰鄉，他皆彷。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: WX-09-01
  kind: doctrine
  statement: 子息位
  anchor:
    file: sources/fulltext/luming-nayin/wuxing-jingji/fulltext.md
    start_line: 9993
    end_line: 9993
  quote: 子位者，以妻命所生者為之，謂如木命人以金為子，若遇子位在旺相有氣之鄉，則生有聰明忠孝之子，光顯祖宗。假令甲子人以火為子，五月生火乘旺氣，餘準此。若是陰命人，定子位，並以所生者為子，如木命人，火為子，他彷此。其吉兇休咎，皆如前法夫命推之。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
