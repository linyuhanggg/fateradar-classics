    start_line: 45
    end_line: 45
  quote: 假令乙亥人夘日辰時應門户出耳〕甲乙同來寅夘定出長髪師姑〔甲寅乙夘全也若更在旬日空亡尤為應耳如甲辰旬中甲寅乙夘甲子旬中甲戌乙亥甲戌旬中甲申乙酉甲午旬中甲辰乙巳甲申旬中甲午乙未外倣此〕庚辛向申酉之方人亡兵刃〔庚申辛酉全也若更在大旺之鄉者凶兆假令寅人得庚
