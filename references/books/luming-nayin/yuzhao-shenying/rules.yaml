    start_line: 24
    end_line: 24
  quote: 亥月丁亥日辛亥時者是也但甲丙戊重見戌亥者應上文耳〕魁罡上見往來加臨獄官屠訟〔辰戌往來四柱見之為公吏獄人屠兒鬪訟不義之人又云若四柱旺官相財得者因不義而得也不相得者主不義而愚下爾又云若旺多在辰戌者為獄官也相多在辰戌者為不道之人也死囚休廢者為屠兒獄吏
