  statement: 干防尊老、音同身、尅防同类妻妾、下防陰人小口。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 29
    end_line: 29
  quote: 乙未時五月甲乙休又日時全敗此者墓也支者寅夘逢未巳午到戌申酉見丑亥子辰戌丑未到辰納音者木未火戌金丑水土辰又云干防尊老同身尅防同類妻妾下防陰小也故自古今言辰戌丑未防害為五墓在焉今以正上文而應爾假令甲子人正月乙丑日時先庫後納音墓終有陰死亡人兆假令
