- rule_id: YZ-02
  kind: doctrine
  statement: 论命须以年/胎/月/日/时五主互参，分别尊卑、干音并重。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 16
    end_line: 16
  quote: 必大敗假令庚午土人壬午日時壬午自刑正月木甲木又尅土故應上文外倣此〕四陽俱立定知難有陰尊〔注云陽干多而陰干少也陽干者甲丙戊庚壬為陽干也若胎月日時中帶陽干盛陰干孤見者定母不夀也一若時犯尅者少年母死不犯尅者亦在二十五嵗或中年母先死假令甲子年金甲為陽丙
  applicable_to: []
  caveats:
