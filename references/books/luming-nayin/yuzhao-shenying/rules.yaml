- rule_id: YUZHAOSHENYI-021
  kind: doctrine
  statement: 阳干月德合在干、陰干月德合在支；同柱为近合力强，旁柱为远合力弱。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 30
    end_line: 30
  quote: 甲子人四月乙未日時墓在干在尊長爾假令丙子水人四月壬辰日時支與音同墓上尊人中陰人妻妾下陰小外倣此〕德合與吉干相逢視於逺近〔德合者陽干德日女陰干在支合也甲德自干乙德在庚丙德自干丁德在壬戊德自干已德在甲庚德自干辛德在丙壬德自干癸德在戊也相逢者視其合也
