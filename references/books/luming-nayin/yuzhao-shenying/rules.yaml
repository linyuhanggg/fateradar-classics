    start_line: 124
    end_line: 124
  quote: 午時者子孫孤也外同〕上來生下身貧賤〔論納音也凡年生月月生日日生時者身必貧賤也然富貴亦非長久也假令甲子金年丁丑月水戊辰日木戊午時火皆應上生下也外頗同〕下如生上進前程〔時生日日生月月生年胎者皆下生上也應進發之命假令甲子年金辛未月土己夘日土癸酉時金壬戌胎
