- rule_id: YUZHAOSHENYI-004
  kind: doctrine
  statement: 时柱尅日柱，干尅轻、音尅重；干音俱尅则为重伤。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 18
    end_line: 18
  quote: 巳胎木巳為陰只戊寅為陽外四陰一陽也犯陽父先死也〕時來破日音凶而干見還輕〔注云凡干尅在頭面音尅在身及四支也故干輕音重也假令辛巳金人得丁亥日時丁尅辛然干尅下有土生金見之輕耳主先貧而後富先賤而後貴又須詳太常在其中無氣之鄉而言之應耳假令辛巳金人得己丑日
  applicable_to: []
