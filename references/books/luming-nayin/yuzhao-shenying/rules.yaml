    start_line: 64
    end_line: 64
  quote: 丙戌年辛夘月或辛夘人丙戌胎頗同〕嵗日朝時自身舍立〔如庚人乙日時丙人辛日時是但嵗干與日時干合者自身舍居〕合分内外取於進退之方〔有内合外合也假令甲人有巳合為内合也丙辛丁壬戊癸乙庚合非本有合者此為外合也主本有合者為内合也月内合主内立外合主外立進退合而言之
