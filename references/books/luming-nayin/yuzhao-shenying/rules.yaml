- rule_id: YUZHAOSHENYI-052
  kind: doctrine
  statement: 甲己真土/乙庚真金/丙辛真水/丁壬真木/戊癸真火，所合所化为正道。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 121
    end_line: 121
  quote: 定頭面之災〔日時尅嵗干者主頭面之損耳〕音損者四肢為患〔納音日時尅嵗音者主身及四肢不全之患耳〕今施前聖諸經共作一家之論〔郭公所施諸聖為祖者以尊其上文〕正道歌用法先看真五行〔甲己真土乙庚真金丙辛真水丁壬真木戊癸真火此真五行〕假真成敗細推尋〔造化合在長生冠帶臨官建
