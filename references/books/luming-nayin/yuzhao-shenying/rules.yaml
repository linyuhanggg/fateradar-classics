    start_line: 28
    end_line: 28
  quote: 〕干神支墓須詳上下吉凶〔干者天干也支者十二支也下者納音也辨三才入墓詳其上下言之凡干者甲乙在未丙丁到戌庚辛到丑戊巳壬癸到辰此者干墓也凡有干墓若無旺氣者墓也有旺氣者庫也假令甲寅人十月乙未日己夘時十月相又得乙禄在夘復旺相有未非墓也假令甲子人五月丙申日
