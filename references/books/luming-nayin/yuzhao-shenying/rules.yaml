- rule_id: YUZHAOSHENYI-022
  kind: doctrine
  statement: 甲寅(纳音水)+辛丑(纳音土)，下尅上主官事刑咎。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 32
    end_line: 32
  quote: 吏曹官辛到丑在甲之官墓也下有辛丑丑土傷甲寅水故有因官而刑咎之象耳假令甲寅月水辛丑日時但有二干下尅上者是也〕癸未庚申盗賊亡歿〔癸者𤣥武到未為折足庚白虎到申臨亭白虎主道路道路見𤣥武故主盗賊而死亡或道路而退敗之兆假令庚申日癸未時應耳但有此二干音者應也〕火逢
  applicable_to: 
