  quote: 外頗同〕癸乙壬加夘酉男女私情〔癸為𤣥武乙為六合壬為天后夘酉為私門忌之男女多姦私也假令乙夘年壬午月癸亥日乙夘時此應耳〕乙辛丁巳亥酉官事隂人常有〔乙六合主私事辛太陰主暗昧丁主女人己亥赤口主口舌酉門户故言官事隂人常有也假令丁夘人乙巳月辛酉日己亥時應爾外頗同
