- rule_id: YZ-01
  kind: doctrine
  statement: 卦逢生气天德合，仍要长生有所归；先看生我何为父，次看克我是何儿。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 13
    end_line: 13
  quote: 卦逢生氣天德合世世長年〔注云生氣三合生方者為生氣亥夘未人在亥申子辰人在申巳酉丑人在巳寅午戌人在寅須要日時也又云長生亦名生氣甲乙木到亥丙丁火到寅戊己土壬癸水到申庚辛金到巳此名干隂生氣也上更帶天月德合者尤為長夀及數世之延長耳天德者正丁二坤三壬四辛
  applicable_to: []
  caveats:
