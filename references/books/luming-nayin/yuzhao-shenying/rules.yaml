    start_line: 22
    end_line: 22
  quote: 逆不可下尅上也若時破胎者祖破敗破月門及父敗破日身及弟兄妻財敗外倣此凡命尅干主輕尅音尤重耳假令庚子年丙戌月壬寅日戊申時丁丑胎此者乃應時干尅日干日干尅月干月干尅年干也此雖傷尊人而於身輕忌之兆耳假令庚子年土壬午月木壬申日金甲辰時火此者應時納音尅日
