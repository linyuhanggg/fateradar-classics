    start_line: 133
    end_line: 133
  quote: 清逢應發〔凡四孟見有力之鄉者發耳〕四仲俱安柄不輕〔子午夘酉上見旺相氣主富貴耳〕四季土刑刑忌殺犯者家宅不利尊〔辰戌丑未四季見者主上文耳〕卦見本家須富貴〔申子辰水人見本卦吉午人得之返尅凶卦同〕返尅之人定有嗔〔火人得申子辰水人得土卦土人得木卦木人得金卦金人得火卦〕三
