- rule_id: YUZHAOSHENYI-YZ-02
  kind: doctrine
  statement: 干尅支为顺，主头面尊老；支尅干为逆，主身体四支与陰人小口。干尅在尊位为重，音尅在身位为切。
  anchor:
    file: sources/fulltext/luming-nayin/yuzhao-shenying/fulltext.md
    start_line: 116
    end_line: 116
  quote: 尅四親孤尤忌二尊〔攴尅干也假令癸未木壬戌月庚午日己夘時癸丑胎皆下尅上主四親二尊人尤忌之象〕復立上宫多常退陰人小口〔干尅攴多也假令甲辰年甲戌月丙辰日己亥時上尅多隂人小口尤忌〕三來尅下官嗔〔三干尅三支也假令乙丑年甲戌月丁酉日皆是三上尅下也外頗同〕三制上時鬼
  applicable_to: []
  caveats:
