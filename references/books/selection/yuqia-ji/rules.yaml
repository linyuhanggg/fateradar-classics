- rule_id: JR-04
  kind: doctrine
  statement: 二十八宿按七曜（日月火水木金土）周而复始配日；本书有"角木蛟亢金龙氐土貉…"长歌，逐宿配吉凶事项；与协纪辨方书卷五口径基本一致。
