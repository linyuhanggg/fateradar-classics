- rule_id: JR-11
  kind: doctrine
  statement: 每日"人神"游某身体部位（如初一在脚拇指、初二在外踝…）；古俗忌该部位针灸 / 手术 / 服药。
  anchor: null
  quote: 人神所在日           先賢死葬日
