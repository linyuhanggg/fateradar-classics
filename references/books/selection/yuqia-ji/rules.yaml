- rule_id: JR-06
  kind: doctrine
  statement: 每年农历十三个固定日为杨公忌（正月十三、二月十一、三月初九、四月初七、五月初五、六月初三、七月初一/廿九、八月廿七、九月廿五、十月廿三、十一月廿一、十二月十九）；忌一切用事。
