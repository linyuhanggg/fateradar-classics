rules:
- rule_id: JR-01
  kind: doctrine
  statement: 本书为民间通书系经典；其规则定位是"民俗信仰与禁忌日的汇编"，与官方典籍冲突时以官方为准。所有规则均为民俗参考，不构成事实判断。
  anchor:
    file: sources/fulltext/selection/yuqia-ji/fulltext.md
    start_line: 310
    end_line: 310
  quote: 擇吉術從方士們的枕中鴻秘逐漸演變為民間習俗，給人們日常行事提供簡明易知的吉凶宜忌指導，是有一個漫長的過程的。
  applicable_to: []
  caveats:
  - 文化参考，非事实判断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: JR-02
  kind: doctrine
  statement: 本书核心组"许真君日期"逐月列出宜祭祀 / 沐浴 / 修真 / 上章 / 用事 / 起造 / 出行 / 嫁娶等的吉日。具体日子由 tool 根据农历输出。
  anchor: null
  quote: 真君見世人作福酬願，拜表上章，建齋設醮，或吉或凶，作福作禍。
  applicable_to: []
  caveats:
  - 文化参考，非事实判断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: JR-03
  kind: doctrine
  statement: 三元：上元正月十五（天官诞）、中元七月十五（地官诞）、下元十月十五（水官诞）。五腊：天腊正月初一、地腊五月初五、道德腊七月初七、民岁腊十月初一、王侯腊十二月初八。诸日宜祭祀斋戒。
  anchor:
    file: sources/fulltext/selection/yuqia-ji/fulltext.md
    start_line: 485
    end_line: 485
  quote: 元年正月十五日，唐太宗皇帝宣問諸大臣僚：“聯見天下萬姓，每三四日長明設齋求福，如何卻有禍生當時？”三藏和尚奏：“萬姓設齋之日，值遇凶神，故為咎者皆是不按《藏經》內值吉神可用之日，所以致此。臣今〈藏經〉內《如來選擇記》奏上見其禍福由日之吉凶也。”
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: JR-04
  kind: doctrine
  statement: 二十八宿按七曜（日月火水木金土）周而复始配日；本书有"角木蛟亢金龙氐土貉…"长歌，逐宿配吉凶事项；与协纪辨方书卷五口径基本一致。
  anchor: null
  quote: 二十八宿按七曜（日月火水木金土）周而复始配日；本书有"角木蛟亢金龙氐土貉…"长歌，逐宿配吉凶事项；与协纪辨方书卷五口径基本一致。
