- rule_id: JR-03
  kind: doctrine
  statement: 三元：上元正月十五（天官诞）、中元七月十五（地官诞）、下元十月十五（水官诞）。五腊：天腊正月初一、地腊五月初五、道德腊七月初七、民岁腊十月初一、王侯腊十二月初八。诸日宜祭祀斋戒。
  anchor: null
