- rule_id: JR-05
  kind: doctrine
  statement: 彭祖百忌歌：天干十忌（甲不开仓 / 乙不栽植 / …）+ 地支十二忌（子不问卜 / 丑不冠带 / …）；按当日干支匹配避忌事项。
