    start_line: 1509
    end_line: 1509
  quote: 唐代醫學家孫思邈《千金方》中有“炙法當避人神”之語，意思是人神所在之處須避針炙。本篇的人神所在日是從農曆每月初一到三十排列的。現將人神所在隨時日變換的情況表列於後，以備參考：
