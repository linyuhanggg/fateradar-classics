- rule_id: JR-10
  kind: doctrine
  statement: 九土鬼日为忌动土的民俗凶日；与起造 / 修造 / 葬埋的择日通则联用。
  anchor:
    file: sources/fulltext/selection/yuqia-ji/fulltext.md
    start_line: 302
    end_line: 302
  quote: 我國從古代流傳下來的擇吉書很多，《玉匣記》即是其中的一種。以前，這本書曾在民間廣為流傳，影響頗大。顯而易見，從學術研究的角度看，它具有較高的民俗學價值 。
  applicable_to: []
  caveats:
  - 文化参考，非事实判断
