- rule_id: JR-05
  kind: doctrine
  statement: 彭祖百忌歌：天干十忌（甲不开仓 / 乙不栽植 / …）+ 地支十二忌（子不问卜 / 丑不冠带 / …）；按当日干支匹配避忌事项。
  anchor:
    file: sources/fulltext/selection/yuqia-ji/fulltext.md
    start_line: 1533
    end_line: 1533
  quote: 甲不開倉，財物耗亡；乙不栽植，千株不長。
  applicable_to: []
  caveats:
