  kind: doctrine
  statement: 十恶大败日为八字 / 择日双系大凶日；干支组合：甲辰、乙巳、丙申、丁亥、戊戌、己丑、庚辰、辛巳、壬申、癸亥（一说异于此）；取义"十干受死"。
