- rule_id: XIEJIBIANFAN-004
  kind: doctrine
  statement: 建除十二神依月支起例：寅月起建于寅，卯月起建于卯，依次类推；建/除/满/平/定/执/破/危/成/收/开/闭十二位轮排，配合月支推每日"建除"。建/除/定/执/成/开六位为吉，其余六位多凶。月厌与月支相冲。
  anchor:
    file: sources/fulltext/selection/xieji-bianfang-shu/fulltext.md
    start_line: 2187
    end_line: 2187
  quote: 通書曰六壬天罡年月例取天罡為首順行十二支以天罡配辰太乙配巳勝光配午小吉配未傳送配申從魁配酉河魁配戌登明配亥神后配子大吉配丑功曹配寅太衝配卯取神后子勝光午功曹寅傳送申天罡辰河魁戌六位為吉用三合月日時楊救貧造葬用山頭吉星修方用方道吉星如修凶方從
  applicable_to: []
  caveats:
  - 建除十二神必须由 mingli-master.selection.v1 计算
  - 某日为何"客"决定通用宜忌
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: XIEJIBIANFAN-005
  kind: doctrine
  statement: 嫁娶宜：天德、月德、月恩、四相、时德、生气、母仓、不将日、要安、定日、成日、开日、收日；忌：月破、月厌、月刑、月害、四废、五墓、孤辰、寡宿、十恶大败、重丧、三丧、复日、伏断、嫁娶周堂"翁姑/夫妇/父母"忌位。
  anchor:
    file: sources/fulltext/selection/xieji-bianfang-shu/fulltext.md
    start_line: 3138
    end_line: 3138
  quote: 寅申月值成日丑未月值開日與月德天德合月德合併止忌行幸遣使安撫邊境選將訓兵出師上官赴任臨政親民結婚姻納采問名嫁娶求醫療病般移遠迴栽種餘皆不忌不與德神併如常例辰戌月值定日己亥月值滿日與天德月德月德合併凡所忌者則不註宜所宜者亦不註忌不與徳合併如常
