- rule_id: XIEJIBIANFAN-XR
  kind: doctrine
  statement: 二十四方位以八卦（壬子、癸丑、艮寅…）布全周天 360°；坐山方位避忌按"年月克山家"裁判；阳宅方位用八宅大小游年变卦。
  anchor: null
  quote: 二十四方位以八卦（壬子、癸丑、艮寅…）布全周天 360°；坐山方位避忌按"年月克山家"裁判；阳宅方位用八宅大小游年变卦。
  applicable_to: []
  caveats:
