- rule_id: XIEJIBIANFAN-018
  kind: doctrine
  statement: 巡山羅㬋按年支配二十四山；原文明确“止忌立向，开山、修方不忌”，且一白到向为吉、吉星到山到向可择用，与太岁同宫则勿犯。当前事实层未计算同宫与制化，因此仅作方位信息，不作硬淘汰。
  anchor:
    file: sources/fulltext/selection/xieji-bianfang-shu/fulltext.md
    start_line: 1699
    end_line: 1700
  quote: 起例巡山羅㬋為太嵗前一位子年在癸丑年在艮寅年在甲卯年在乙辰年在巽巳年在丙午年在丁未年在坤申年在庚酉年在辛戌年在乾亥年在壬○選擇宗鏡曰巡山羅㬋止忌立向開山修方不忌○通書曰申子辰羅㬋乙巽辛寅午戌丁癸艮宫出巳酉丑丙壬乾作首亥卯未甲庚坤大忌註曰申年辛子年乙辰年巽寅年艮午年丁戌年癸巳年丙酉年乾丑年壬亥年庚卯年甲未年坤
  applicable_to: []
  caveats:
  - 只在巡山罗睺方位由确定性 provider 实际命中时适用
  - 不得据此直接淘汰候选日
