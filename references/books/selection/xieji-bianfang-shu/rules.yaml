  quote: 按上朔為隂陽與嵗徳俱盡之日四離四絶為二氣五行分判之日晦為月盡之日故諸事不宜惟祭祀解除等事或以事神而不敢禁或以除舊而不為嫌故遇有所宜之神則不忌晦日雖不與上朔同凶然亦止宜祭祀等事餘事雖不忌亦不註宜也又上朔以年干取義晦日反支以月朔取義四離四絶以節
