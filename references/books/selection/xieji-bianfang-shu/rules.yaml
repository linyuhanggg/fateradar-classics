- rule_id: XIEJIBIANFAN-003
  kind: doctrine
  statement: 每年依年支推年家神煞：太岁、岁破、大将军、博士、蚕室、太阴、白虎、豹尾、死符、劫煞、灾煞、岁煞、大煞、金神、破败五鬼、日游神等。岁德、岁德合、岁枝德为吉，余者多凶。
  anchor:
    file: sources/fulltext/selection/xieji-bianfang-shu/fulltext.md
    start_line: 2192
    end_line: 2192
  quote: 選擇宗鏡曰李淳風四利三元一太嵗二太陽三喪門四太隂五官符六死符七嵗破八龍德九白虎十福德十一弔客十二病符太陽太隂龍德福德為吉餘方皆凶
  applicable_to: []
