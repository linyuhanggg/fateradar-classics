    start_line: 1484
    end_line: 1484
  quote: 乾坤寳典曰天道者天之元陽順理之方也其地宜興舉衆務向之上吉○廣聖歴曰天道正月九月在南方二月在西南方三月七月在北方四月十二月在西方五月在西北方六月十月在東方八月在東北方十一月在東南方也○考原曰按天道者天徳所在之方也乾坤寳典曰天徳者天之福徳也所理之方
