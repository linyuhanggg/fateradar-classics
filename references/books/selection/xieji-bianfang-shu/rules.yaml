- rule_id: XIEJIBIANFAN-XR
  kind: doctrine
  statement: 二十四方位以八卦（壬子、癸丑、艮寅…）布全周天 360°；坐山方位避忌按"年月克山家"裁判；阳宅方位用八宅大小游年变卦。
  anchor:
    file: sources/fulltext/selection/xieji-bianfang-shu/fulltext.md
    start_line: 4350
    end_line: 4350
  quote: 各時刻於各節圏上作識之聯之必成曲線也最内一層為地平二十四方位以明此圖即晷表之理日在南則影在北日在東則影在西也夜無日影以晝例夜也今依其法推得京師各節氣昏旦更時刻中星著於篇星圖步天歌并附於後
  applicable_to: []
  caveats:
  - 方位避忌涉及年家三煞、大将军、太岁等，必须由 mingli-master.selection.v1 起盘
  - 文化参考，非事实判断
  school: null
