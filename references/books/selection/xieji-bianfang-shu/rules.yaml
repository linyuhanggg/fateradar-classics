- rule_id: XIEJIBIANFAN-017
  kind: doctrine
  statement: 本书"辨讹"卷订正《选择通书》及民间通书之讹，主要包括： - 罗天大进、走天罗地网、上吉七圣、太极贵人等"无据虚名"神煞应予废除。 - 起例口诀错谬（如某神煞起例算法错）应订正。 - "诸事不宜""百事大吉"等绝对化判语应回归"具体宜忌"。 - 所有择日不可"以吉避吉、以凶避凶"，应按事择日。
  anchor:
    file: sources/fulltext/selection/xieji-bianfang-shu/fulltext.md
    start_line: 3041
    end_line: 3041
  quote: 神併而仍諸事皆忌也隂陽交破陽破隂衝詳月厭條下舊本不忌嫁娶經絡而忌沐浴葢嫁娶舊止宜不將日又忌章光無翹伏斷歸忌紅沙若再忌月破等日恐致無日可用是不得已為權宜之術耳今按章光無翹等皆俗説拘於俗忌而不避大凶其所為權宜者殊為未當且按監本通書及各坊本皆云嫁
  applicable_to: []
  caveats:
  - 本规则为本书最大特色
  - 与民间通书（董公择日、玉匣记）冲突时以本书为权威裁判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: XIEJIBIANFAN-018
  kind: doctrine
  statement: 巡山羅㬋按年支配二十四山；原文明确“止忌立向，开山、修方不忌”，且一白到向为吉、吉星到山到向可择用，与太岁同宫则勿犯。当前事实层未计算同宫与制化，因此仅作方位信息，不作硬淘汰。
  anchor:
