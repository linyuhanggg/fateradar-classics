- rule_id: KR-05
  kind: doctrine
  statement: 五虎遁（年起月）：甲己起丙寅、乙庚起戊寅、丙辛起庚寅、丁壬起壬寅、戊癸起甲寅；五鼠遁（日起时）：甲己起甲子、乙庚起丙子、丙辛起戊子、丁壬起庚子、戊癸起壬子。
