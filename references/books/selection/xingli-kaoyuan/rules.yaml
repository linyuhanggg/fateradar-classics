- rule_id: KR-06
  kind: doctrine
  statement: 三合：申子辰水、亥卯未木、寅午戌火、巳酉丑金；五合（天干）：甲己土、乙庚金、丙辛水、丁壬木、戊癸火；六合（地支）：子丑、寅亥、卯戌、辰酉、巳申、午未。
  anchor: null
