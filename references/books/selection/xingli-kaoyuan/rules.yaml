- rule_id: KR-03
  kind: doctrine
  statement: 十二月配十二消息卦：复（子）、临（丑）、泰（寅）、大壮（卯）、夬（辰）、乾（巳）、姤（午）、遯（未）、否（申）、观（酉）、剥（戌）、坤（亥）。
