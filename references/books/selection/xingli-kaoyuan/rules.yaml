- rule_id: KR-08
  kind: doctrine
  statement: 太岁为年神之首，居当年地支位；年神有岁德合 / 岁枝德等吉神，与大将军 / 太阴 / 白虎 / 豹尾 / 金神七煞 / 力士等凶神。
