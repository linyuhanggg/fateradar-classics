- rule_id: DONGGONGZERI-010
  kind: doctrine
  statement: 原书大量使用“犯之主官司、损人口、重丧、大凶”等应验语。蒸馏为 skill 时必须改写为“原书以某日列为某类避忌”，禁止直接断言会发生灾祸。
  anchor: null
  quote: 建子日：火星甲子天赦日進財、惜被月建沖破用之主官司
  applicable_to: []
  caveats:
  - 必须附“文化参考，非事实判断”
