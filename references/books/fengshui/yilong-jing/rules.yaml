rules:
- rule_id: YILONGJING-R-01
  kind: doctrine
  statement: 干龙长远去无穷，行至中间阳气聚为真；枝龙身上半是虚花半是胎，结实者必有护送回顾。
  anchor: null
  quote: 干龙长远去无穷，行至中间阳气聚为真；枝龙身上半是虚花半是胎，结实者必有护送回顾。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  - '"虚花""结实"系古人形容词，非客观度量'
  - 不可据此作阴宅选址决策
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YILONGJING-R-02
  kind: doctrine
  statement: 枝龙护纒须观疊数，三重五重抱回来则可于枝龙腰上做穴；一疊回顾则只是护龙叶交互，非真穴。
  anchor: null
  quote: 枝龙护纒须观疊数，三重五重抱回来则可于枝龙腰上做穴；一疊回顾则只是护龙叶交互，非真穴。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  - 阴宅选址不应单凭古文判断
  school: null
