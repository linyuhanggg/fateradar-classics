- rule_id: YILONGJING-R-07
  kind: doctrine
  statement: 干龙行尽处必有外山隔水来顾为官山；若有逆转之鬼山拖脚后环则向前寬处安穴，"凡山大曲水大转，必有王侯居此间"。
