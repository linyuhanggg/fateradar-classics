- rule_id: YILONGJING-R-12
  kind: doctrine
  statement: 山川灵气降为神，神随主者家生人；只要祀事香火明，抱养子与僧道嗣续皆可承蔭，与亲生同气；古"招魂葬"汉家四百年旺为证。
  anchor: null
