    end_line: 31
  quote: 一、是書自宋迄今，巨族大家抄寫成帙，秘之已久。或前後失次，或散軼事不全，愚不揣固陋，留心匯正，歷數寒暑，方成全集。至間有欠雅馴處，字字坦然明白，故不敢妄為刪易。
