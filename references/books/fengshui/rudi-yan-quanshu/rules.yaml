- rule_id: RDY-R005
  kind: doctrine
  statement: 寻龙立穴水为先，但龙为根本水为用，二者不可偏废。
  anchor:
    file: sources/fulltext/fengshui/rudi-yan-quanshu/fulltext.md
    start_line: 213
    end_line: 219
  quote: 堪輿首重詳龍身，「詳」字妙。詳龍勢之強弱、偏正以及榮枯休旺等形。倚斜側出，不是龍矣。精峻岡巒秀氣凝。精峻自然秀，有凝自然發福。亦有平原結穴者，靜深蛾眉最親人。世俗紛紛滋論說，究來禍福總無憑。卻不知水秀砂明即是地，誰識得消砂納水法中尋。水秀者，或凝聚，或彎抱，或層層朝拜，並來大去小，來長去短，止見來不見去，更無駁雜是也。砂明者，峰頭開爽，情向親勢，低穴其頭俯臨，高穴其頭仰顧。穴砂差等，如賓主坐談，語笑殷勤是也。凡砂高穴，不過丈許，離穴不過兩尋。八尺曰尋，此言兩旁龍、虎是也。如砂腳端正，砂頭圓淨，砂身潤澤，饒有悃悃款款之形，不出半紀而發也。十二年為一紀。「凡砂」句四十二字，字字要訣。總之，人在穴中，砂之頭腳俱見者，其力最重。第一逆朝好，速發地多逆水。次之橫過水停蓄。橫過水停蓄，得砂關即發。人言大地多順局，初運貧寒怎麼救人。若得一案，緊緊橫開亦好。砂與水分先後，砂遲發，水速行。每見青龍砂甚好，右邊惡水長飄零。水先管事矣。朝主兩山本無砂妙處，二房似不利矣。二來繼大二乃興。長絕則二承矣。溪澗江湖固是水，田源塘沼亦同情。堂平而低砂即應，稍有曲折水先輪。龍為根本水為用，兩者由來無輕重。尋龍立穴水為先，詳將要法把君傳。
