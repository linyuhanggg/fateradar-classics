- rule_id: QINGNANGJING-R-08
  kind: doctrine
  statement: 外气行形而内气止生；气乘风则散、界水则止；故审气重乘界二字。
  anchor:
    file: sources/fulltext/fengshui/qingnang-jing/fulltext.md
    start_line: 32
    end_line: 32
  quote: 無極而太極也，理寓於氣，氣囿於形；日月星宿，剛氣上騰。山川草木，柔氣下凝。資陽以昌，用陰以成；陽德有象，陰德有位。地有四勢，氣從八方，外氣行形，內氣止生，乘風則散，界水則止。是故順五兆，用八卦，排六甲，布八門，推五運，定六氣，明地德，立人道，因變北，原終始，此之謂化成。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作传统选址美学参考
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGJING-R-09
  kind: doctrine
  statement: 顺五兆以审象、用八卦以审位、排六甲以审运、布八门以审气；地理矩矱尽于此。
  anchor: null
  quote: 以五星之正變審象也，
