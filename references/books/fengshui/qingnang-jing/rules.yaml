- rule_id: QINGNANGJING-R-02
  kind: doctrine
  statement: 先天卦以阴阳对待言（天地定位、山泽通气、雷风相薄、水火不相射）；后天卦以阴阳流行言（震巽离坤兑乾坎艮）；二者源出一时但用不同。
