- rule_id: QINGNANGJING-R-01
  kind: doctrine
  statement: 河图止有四象，每方二数析之成八；卦由四象生、爻由三交生；乾坤二卦为母六卦为子。
  anchor: null
  quote: 乾坤二卦為母，
