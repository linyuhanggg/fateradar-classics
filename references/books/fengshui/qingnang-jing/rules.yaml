- rule_id: QINGNANGJING-R-05
  kind: doctrine
  statement: 天分星宿地列山川，气行于地形丽于天；故应"因形察气"以立人纪。
  anchor:
    file: sources/fulltext/fengshui/qingnang-jing/fulltext.md
    start_line: 24
    end_line: 24
  quote: 天有五星，地有五行，天分星宿，地列山川，氣行於地，形麗於天，因形察氣，以立人紀。紫微天極，太乙之禦，君臨四正，南面而治，天市東宮，少微西掖，太微南垣，旁照四極。四七為經，五德為緯，運幹坤輿，垂光乾紀，七政樞機，流通終始。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  - 不构成天人感应的现代科学陈述
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGJING-R-06
  kind: doctrine
  statement: 山水朝应、阴阳相见，得冲和之正则福禄永贞；失冲和之正则相乘而禍咎踵门。
  anchor:
    file: sources/fulltext/fengshui/qingnang-jing/fulltext.md
    start_line: 26
    end_line: 26
  quote: 地德上載，天光下臨，陰用陽朝，陽用陰應，陰陽相見，福祿永貞，陰陽相乘，禍咎踵門。天之所臨，地之所感，形止氣蓄，萬物化生，氣感而應，鬼福及人。是故天有象，地有形，上下相須，而成一體。 此之謂化機。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究与古典美学参考
  - '"祸咎"等表述为古文措辞，不作现代决定论陈述'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGJING-R-07
  kind: doctrine
  statement: 天之所临、地之所感，形止气蓄而万物化生；气感而应、鬼福及人。
  anchor:
