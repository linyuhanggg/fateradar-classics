- rule_id: QINGNANGJING-R-04
  kind: doctrine
  statement: 阳之妙不在阳而在阴，陰中之陽乃真陽；故"陽以相陰，陰以含陽"；天地之道阳常本阴而阴常育阳。
  anchor: null
  quote: 而在於陰，
