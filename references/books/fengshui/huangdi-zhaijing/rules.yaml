- rule_id: HDZJ-R003
  kind: doctrine
  statement: 阴阳往来合天道；再三四度重入被书中视作无气、无魂、无魄。
  anchor:
    file: sources/fulltext/fengshui/huangdi-zhaijing/fulltext.md
