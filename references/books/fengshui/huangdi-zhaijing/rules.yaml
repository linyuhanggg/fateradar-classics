rules:
- rule_id: HDZJ-R001
  kind: doctrine
  statement: 凡居处皆可按宅法论，但须先判阴阳宅、移来方向与二十四路，不可只按街向或单一坐向。
  anchor:
    file: sources/fulltext/fengshui/huangdi-zhaijing/fulltext.md
    start_line: 18
    end_line: 19
  quote: 夫宅者乃是隂陽之樞紐人倫之軌模非夫博物明賢而能悟斯道也就此五種其最要者唯有宅法而真秘術凡人所居無不在宅雖只大小不等隂陽有殊縱然客居一室之中亦有善惡大者大説小者小論犯者有災鎮而禍止猶藥病之效也故宅者人之本人以宅為家居若安即家代昌吉若不安即門族衰微墳墓川岡並同兹説上之軍國次及州郡縣邑下之村坊署柵乃至山居但人所處皆其例焉目見耳聞古制非一
