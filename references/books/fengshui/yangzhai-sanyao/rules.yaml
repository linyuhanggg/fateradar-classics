- rule_id: YZS-R001
  kind: doctrine
  statement: 阳宅以门、主、灶为三要，先看大门，次看灶，再看主房。
  anchor:
    file: sources/fulltext/fengshui/yangzhai-sanyao/fulltext.md
    start_line: 15
    end_line: 15
  quote: 夫曰：三要者何，门、主、灶是也。门乃由之路，主乃居之所，灶乃食之方。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YZS-R002
  kind: doctrine
  statement: 门主相生以吉断，相克以凶断；灶须与门、主相生。
  anchor:
    file: sources/fulltext/fengshui/yangzhai-sanyao/fulltext.md
    start_line: 16
    end_line: 16
  quote: 阳宅先看大门，次看厨，有东四、西四之分，再者主房。而主房却无定位，高大者即是。
  applicable_to: []
  caveats: []
