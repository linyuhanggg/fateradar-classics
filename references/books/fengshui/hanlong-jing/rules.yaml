- rule_id: HANLONGJING-R-04
  kind: doctrine
  statement: 火星廉贞高顶生宝殿，分宗派祖；贪巨武曲皆从廉贞出。"贪狼若非廉作祖，为官也不到三公"。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 24
    end_line: 24
  quote: 火星要起廉貞位生出貪狼由此勢若見火星動熖時看他踪跡落何處此龍不是尋常貴生出貪狼向亦竒火星若起廉貞位落處須尋一百里中有貪狼小小峯有時回顧火星宫世人只道貪狼好不識廉貞是祖宗貪狼若非廉作祖為官也不到三公髙山頂上如平掌中分細脉如蛇様貴龍多是穿心出富
