- rule_id: R-13
  kind: doctrine
  statement: 古人尋龍尋頓伏，蓋緣頓伏生尖曲；曲转之余必生枝，枝上必为小关局。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 159
    end_line: 159
  quote: 尋頓伏葢縁頓伏生尖曲曲轉之餘必生枝枝上必為小關局譬如人行適千里豈無解鞍并頓宿頓宿之所雖未住亦有從行并部曲頓伏移換并退卸却看山靣何方下移換却須尋回山山回却有迎送還迎送相從識龍靣龍身背上是纒山纒山轉來龍抱體此中尋穴又何難古人建都與建邑先尋頓伏識
