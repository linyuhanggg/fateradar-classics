- rule_id: HANLONGJING-R-05
  kind: doctrine
  statement: 巨门行龙少鬼劫；两傍多罗列，水界分处夹龙行；其少关峡、护送无容左右离。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 35
    end_line: 35
  quote: 看䕶衛不曾停尊星自有尊星體方正為屏將相位巨門行龍少鬼刼葢緣两傍多羅列水界分處夾龍行不肯單行走空缺水界分及亂生枝枝葉雖多夾水隨䕶龍亦自有背靣背後如壁靣平夷平夷便是貼龍體龍過之時形怪異不起尖圓即馬旗攢劒繙龍歸此地䕶衛纒遶如打團重重包裹外山歸至令
