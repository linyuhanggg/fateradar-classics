- rule_id: HANLONGJING-R-03
  kind: doctrine
  statement: 贪狼正形五：尖（笋顶）、圆（四面同）、平（卧蚕高顶）、直（决脊引绳）、小（笔头插塔）；其余欹、斜、侧、巖、倒、破、空七者非正。
