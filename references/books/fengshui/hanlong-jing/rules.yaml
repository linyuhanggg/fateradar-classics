- rule_id: R-15
  kind: doctrine
  statement: 大关大锁龙千里、定有罗星横截气；罗星正形方匾尖圆为吉，破碎尖破最为害。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 95
    end_line: 95
  quote: 卧虎或作重重如瓠禹鑿龍門透大河便是當時關水處大行走出河中府河北河南關两所大河北來曲射東西山作水如眠龍馬耳山枕大江口絶無脚手為神妙壁山來截淮河更無一脚如横過海門二山鎻二浙兩山相合如環缺文廉生脚鎻緇流横在水中為两截大關大鎻龍千里定有羅星横截氣截
