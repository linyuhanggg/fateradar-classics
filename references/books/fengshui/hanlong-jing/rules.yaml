- rule_id: HANLONGJING-R-02
  kind: doctrine
  statement: 九星中贪狼、巨门、武曲为三吉，左辅右弼为辅佐；禄存、廉贞、破军、文曲多关煞或祖星，须与三吉合方为贵。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 6
    end_line: 6
  quote: 足盡信也然其書乃為世所盛傳撼龍經專言山壠落脈形勢分貪狼巨門禄存文曲㢘貞武曲破軍左輔右弼九星各為之説疑龍經上篇言幹中尋枝以關局水口為主中篇論尋龍到頭看面背朝迎之法下篇論結穴形勢附以疑龍十問以闡明其義法則專論穴有倚盖撞黏諸説倒杖分十二條即上説而
  applicable_to: []
  caveats:
