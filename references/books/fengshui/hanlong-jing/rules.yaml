- rule_id: HANLONGJING-R-03
  kind: doctrine
  statement: 贪狼正形五：尖（笋顶）、圆（四面同）、平（卧蚕高顶）、直（决脊引绳）、小（笔头插塔）；其余欹、斜、侧、巖、倒、破、空七者非正。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 22
    end_line: 22
  quote: 或為關峽似龍形正身潛在峽中行時師多向峽中覔不識真龍斷續情貪狼自有十二様尖圓平直小為上欹斜側巖倒破空祻福輕重自不同欹側似斜斜似側平似乗龍側似直貪狼似巨倒似空空似虚巖即似石問君來此如何觀我道貪狼非一般欹是崩崖破是折斜是邊有邊不同側是靣尖身直去空
  applicable_to: []
