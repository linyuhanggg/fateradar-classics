- rule_id: HANLONGJING-R-08
  kind: doctrine
  statement: 武曲覆钟、左辅覆釜；钟高釜矮，二者形似而辨。武曲端严富贵；辅弼随龙厚薄取。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 68
    end_line: 68
  quote: 武曲星峯覆鍾釜鍾釡之形有何故鍾髙釜矮事不同髙即為武矮為輔二者雖然皆吉星大小不容有差互武曲端嚴富貴牢輔弼隨龍厚薄取真龍若行五六程臨落之時剝輔星如梭如印如皎月三三两两牽聮行前關後峽相引從峽若多時龍猛勇博到輔星三四重仔細來此認龍踪貪巨若無輔弼落高
  applicable_to: []
