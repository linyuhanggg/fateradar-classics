- rule_id: R-10
  kind: doctrine
  statement: 左辅幞头形入垣最贵；东华西华水横之外四围列峰位，分左右兵卫。紫微、太微、天市三垣各有四门。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 99
    end_line: 99
  quote: 要知此星名侍衛入到垣中最為貴東華西華門水横水外四圍列峯位此是垣前執法星却分左右為兵衛方正之垣號太微垣有四門號天市紫㣲垣外前後門華蓋三台前後衛中有過水名御溝抱城屈曲中間流紫㣲垣内星辰足天市太微少全局朝迎未必皆真形朝海拱辰勢如簇千山萬水皆入朝入
  applicable_to: []
