- rule_id: HANLONGJING-R-09
  kind: doctrine
  statement: 破军星峰如走旗、前高卓尾后低；多为引龙兼作护，大龙虽要大破军，吉星之下无不吉、凶星之下凶所存。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 87
    end_line: 87
  quote: 少只為鐘鼓閣九星皆有破禄文三吉之形輔弼尊平行穿珠巨貪禄䦨掉尖拖是破軍吉星之下無不吉凶星之下凶所存况是凶龍不為穴只是閒行引過身縱然有穴必是假假穴如何保久存時師只來尋龍胍來此峽内空低蹲便指纒䕶為真氣或有逺秀出他村便説朝山朝水好下了凶事自入門只縁
