- rule_id: R-14
  kind: doctrine
  statement: 寻龙望气先寻脉，云雾多生是龙脊；春夏之交与二分，夜望云霓生处觅。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 92
    end_line: 92
  quote: 分星入桂連山行有斷脉不斷直至江隂大海邊海門旺氣連閩越南水两夾相交纒此是海門南脉絡貨財文武相交錯何處是貪何處文何處辨認武曲尊尋龍望氣先尋脉雲霧多生是龍脊春夏之交與二分夜望雲霓生處覔雲霓先生絶髙頂此是龍樓寶殿定大脊微微雲自生霧氣如嵐反難證生尋霧
