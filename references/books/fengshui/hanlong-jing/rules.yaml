- rule_id: HANLONGJING-R-06
  kind: doctrine
  statement: 禄存九形：顿鼓、覆釜、鹤爪、肋扇、悬鹑、平洋、长蛇、兠鍪、落花；各形主作不同（神坛、关锁、罗星等）。
