- rule_id: R-12
  kind: doctrine
  statement: 贪狼作穴是乳头、巨门作穴窝中求、武曲作穴釵钳觅、禄廉梳齿犁鐴头、文曲穴来坪里作（高处亦掌心落）、破军作穴似戈矛、辅星正穴燕巢仰。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 113
    end_line: 113
  quote: 貪狼作穴是乳頭巨門作穴窩中求武曲作穴釵鉗覔禄廉梳齒犁鐴頭文曲穴來坪裏作髙處亦是掌心落破軍作穴似戈矛两傍左右手皆收定有两山皆䕶衛不然一水過横流輔星正穴燕巢仰若在髙山掛燈様落在低平是雞巢縱有圓頭亦凹象此是博換尋星穴尋穴隨龍細辨别龍若真兮穴亦真龍
