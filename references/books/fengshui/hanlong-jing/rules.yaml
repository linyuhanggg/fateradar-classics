rules:
- rule_id: HANLONGJING-R-01
  kind: doctrine
  statement: 高山须认星峰起、平地龙行别有名；峰以星名取其类，星辰下照山成形。"高水一寸即是山、低水一寸即是平洋。"
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 15
    end_line: 15
  quote: 貴居其中大率龍行自有真星峯磊落是龍身髙山須認星峯起平地龍行别有名峯以星名取其類星辰下照山成形龍神二字尋山脉神是精神龍是質莫道髙山方有龍却來平地失真蹤平地龍從髙脈發髙起星峯低落穴高山既認星峯起平地兩傍尋水勢两水夾處是真龍枝葉周回中者是莫令山反
  applicable_to: []
