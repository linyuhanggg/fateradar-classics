- rule_id: HANLONGJING-R-04
  kind: doctrine
  statement: 火星廉贞高顶生宝殿，分宗派祖；贪巨武曲皆从廉贞出。"贪狼若非廉作祖，为官也不到三公"。
  anchor: null
