- rule_id: R-11
  kind: doctrine
  statement: 右弼随八曜高低生；隐藏无形、断脉断跡寻来无；多吉少傍凶，藏形多于平阳之地。
  anchor:
    file: sources/fulltext/fengshui/hanlong-jing/fulltext.md
    start_line: 109
    end_line: 109
  quote: 弼星本來無正形形隨八曜髙低生要識弼星正形處八星斷處隠藏行隠藏是形名隠曜此是弼星最要妙抛梭馬跡線如絲蜘蛛過水上灘魚驚蛇入草失行跡斷脉斷跡尋來無脉是尊名右弼星左右隨龍身上行行龍之時有輔弼變換隨龍看踪跡君如識得右弼星毎到垣中多失跡博龍失脉失跡時地
