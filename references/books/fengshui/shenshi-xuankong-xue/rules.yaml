- rule_id: XK
  kind: doctrine
  statement: 本 pack 是公开网页转写层，不是 1935 民国排印本逐页校本。
  anchor:
    file: sources/fulltext/fengshui/shenshi-xuankong-xue/fulltext.md
    start_line: 29
    end_line: 29
  quote: 余以葬事，涉猎地理诸书，觉其说庞杂，有歧之又歧之慨！及读《沈氏玄空学》，江迂生太史《序》曰：“峦头征实，古今无伪书；理气课虚，古今多伪诀。”信哉斯言！然后知余向之未始学，学自今始也。窥竹礽先生之学，窃以为先生当世衰学晦之际，得“天人合一”之旨，毅然有澄清天下之志，可谓观止矣！
  applicable_to: []
