- rule_id: SHENSHIXUANK-XK
  kind: doctrine
  statement: 沈氏玄空重九星、元运、山向、紫白、挨星等理气框架。
  anchor:
    file: sources/fulltext/fengshui/shenshi-xuankong-xue/fulltext.md
    start_line: 1189
    end_line: 1189
  quote: 祖绵谨案：仲山《阴宅秘断》第十六图“稽中堂祖墓”，子午兼壬丙，坐山挨星是八，乃山上飞星不用八，而用七入中，盖寻替当求同元，子午兼向天元龙也。八之天元为艮，“艮丙辛，位位是破军”，故以七入中。玄空重流行之气，艮属阳，故顺行耳。此以山用替也。
  applicable_to: []
  caveats:
  - 不能替代建筑安全、法律、工程和现实居住判断
