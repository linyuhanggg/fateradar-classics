- rule_id: ZFD-R004
  kind: doctrine
  statement: 本书按高山阳龙、高山阴龙、平地阳龙、平地阴龙四组，把脉/息/窟/突细分为盖、粘、倚、撞、斩、截、吊/坠、正、求、架、折、挨、并、斜、插等作法。
  anchor:
