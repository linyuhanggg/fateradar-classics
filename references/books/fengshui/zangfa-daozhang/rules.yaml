rules:
- rule_id: ZFD-R001
  kind: doctrine
  statement: 本书把穴场中隐微圆晕、金鱼水界与小明堂作为“真穴”先验标志。
  anchor:
    file: sources/fulltext/fengshui/zangfa-daozhang/fulltext.md
    start_line: 12
    end_line: 12
  quote: 穴場金魚水界。圓暈在隱微之間者，為太極。上是微茫水分，下是微茫水合。合處為小明堂，容人側臥，便是穴場。有此圓暈則生氣內聚，故為真穴，立標枕對於此而定。無此者，非也。若暈頂再見一二半暈如初三夜月樣者，名曰天輪，影有三輪者，大地也。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZFD-R002
  kind: doctrine
  statement: 晕间凹为阴穴，凸为阳穴；凹凸相兼时，重在取阴阳升降聚会处。
  anchor:
    file: sources/fulltext/fengshui/zangfa-daozhang/fulltext.md
    start_line: 19
    end_line: 19
  quote: 晕间凹陷者为阴穴，凸起者为阳穴，是谓两仪。就身作穴者为阴龙，宜阳穴；另起星峰作穴者为阳龙，宜阴穴，皆有饶减。或上截凸起，下截凹陷，或下截凸起，上截凹陷，或左右凹凸相兼者，为二气相感，则取阴阳交媾之中，升降聚会之所，不用饶减。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZFD-R003
  kind: doctrine
  statement: 脉、息、窟、突分别对应取中、剖开、培高、凿平四类定基倾向。
  anchor:
    file: sources/fulltext/fengshui/zangfa-daozhang/fulltext.md
    start_line: 26
    end_line: 26
  quote: 四象者，脈息窟突也。脈是暈間微有脊，乃少陰之象；息是暈間微有形，乃少陽之象；窟是暈間微有窩，乃太陰之象；突是暈間微有泡，乃太陽之象。四象作居，葬有四法：脈穴當取中定基，息穴當剖開定基，窟穴當培高定基，突穴當鑿平定基。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZFD-R004
  kind: doctrine
  statement: 本书按高山阳龙、高山阴龙、平地阳龙、平地阴龙四组，把脉/息/窟/突细分为盖、粘、倚、撞、斩、截、吊/坠、正、求、架、折、挨、并、斜、插等作法。
  anchor:
    file: sources/fulltext/fengshui/zangfa-daozhang/fulltext.md
    start_line: 33
    end_line: 33
  quote: 脈緩者，用蓋法：當揭高放棺，以蓋覆為義；脈急者，用粘法：當就低放棺，以粘綴為義；脈直者，用倚法：當挨偏放棺，以倚靠為義；脈不急不緩而橫者，用撞法：當取直放棺，以沖撞為義。已上四法，高山陽龍用之。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZFD-R005
  kind: doctrine
  statement: 文中多次强调上下左右、深浅高低、大小厚薄的差错会使取法失效。
  anchor: null
  quote: 理法少差，天淵懸隔
