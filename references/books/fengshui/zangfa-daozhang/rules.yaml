- rule_id: ZFD-R006
  kind: doctrine
  statement: 顺、逆、缩、离、没、穿、斗、截、对、缀、犯等法分别以脉缓、脉急、形俯、形仰、山体长横/长直、刚柔交接等条件触发。
  anchor:
    file: sources/fulltext/fengshui/zangfa-daozhang/fulltext.md
    start_line: 205
    end_line: 205
  quote: 脈急中沖用逆杖，以旁求龍之倚穴，如龍勢雄強，氣脈急硬，饒減轉跌。避煞葬吐，拂耳枕臂，挫急歸緩，斜倚直倚是也。要眾山拱固，眾水交結，明堂平正，四獸鹹備，作福甚速。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZFD-R007
  kind: doctrine
  statement: 二十四砂法开始先要求观察来龙起处与穴情止处，在“死处又寻生”的框架下分合、浅深、饶减。
  anchor:
    file: sources/fulltext/fengshui/zangfa-daozhang/fulltext.md
    start_line: 230
    end_line: 230
  quote: 夫觀龍觀其起，明穴明其止。起乃動而生，止乃靜而死，死處又尋生，是名曰生氣。故一察其微，乃盡其大旨。象其物而取其事，順其情而取其理，推分合以定淺深，明饒減以存克制。倚撞蓋粘，體勢情意，差之毫厘，謬以千里。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZFD-R008
  kind: doctrine
  statement: 担伞、正葬、打开、悬棺、马鬣封、回龙顾祖等都绑定特定来龙、穴势、砂水条件。
  anchor: null
  quote: 來龍急氣，脈直沖中，無乳氣穴粘右邊，側受倚其後，托左臂長而明堂寬展，如人之擔傘勢也。宜淺開金井，若太深必傷，宜培加客土，填實於塋，必主富貴綿遠。
  applicable_to: []
  caveats: []
