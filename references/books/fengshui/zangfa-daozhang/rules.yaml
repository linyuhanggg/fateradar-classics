- rule_id: ZFD-R010
  kind: doctrine
  statement: 底文存在缺字或异常字符时，只保留为校勘风险，不把模型猜补内容放入规则。
  anchor: null
  quote: 脈甚急就龍虛粘曰離，有如懸筆之垂珠滴者，謂之脫煞穴、拋穴、接穴、大陽影光穴，懸棺長鬣封是也。如龍雄勢猛，卸落平洋，結成盤珠，鋪氈展席，遙對來脈，壘土浮□，高大為墳，便知聚氣須用客土堆成，要有微窩靨或草蛇灰線者方結，否則旺氣未平，必主災禍。
