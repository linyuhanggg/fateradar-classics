- rule_id: ZANGSHU-R-05
  kind: doctrine
  statement: 童山（无草木生气绝）、断山（形断气不续）、石山（土行不通）、过山（龙气未止）、独山（无龙会）五者皆不可葬，强葬则消已福、生新凶。
  anchor: null
