- rule_id: ZANGSHU-R-07
  kind: doctrine
  statement: 龙势千尺顿息而外无聚护、内气散于地中者为不蓄之穴；强葬则成腐骨之藏。
  anchor: null
  quote: 龙势千尺顿息而外无聚护、内气散于地中者为不蓄之穴；强葬则成腐骨之藏。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  - '"腐骨""敗槨"为古代评价语，不作现代叙述'
  school: null
