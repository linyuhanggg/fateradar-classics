- rule_id: ZANGSHU-R-06
  kind: doctrine
  statement: 平地隐起之"支"葬于其顶（如首），高山起伏之"垄"葬于其足（如足）；支垄不辨则气脱如逐。
  anchor: null
  quote: 平地隐起之"支"葬于其顶（如首），高山起伏之"垄"葬于其足（如足）；支垄不辨则气脱如逐。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作古典葬法名词参考
  - 现代殡葬以法律法规与地形安全为准
  school: null
