- rule_id: ZANGSHU-R-10
  kind: doctrine
  statement: 玄武宜垂头、朱雀宜翔舞、青龙宜蜿蜒、白虎宜驯俯；反此则法当破死（虎蹲含尸、龙踞嫉主、玄武拒尸、朱雀腾去）。
  anchor: null
