- rule_id: ZANGSHU-R-14
  kind: doctrine
  statement: 穴有三吉（天光下临地德上载、阴阳冲和五土四备、目力工力趋全避缺）；葬有六凶（阴阳差错、岁时之乖、力小图大、凭福恃势、僭上逼下、变应怪见）。穴吉葬凶与弃尸同。
