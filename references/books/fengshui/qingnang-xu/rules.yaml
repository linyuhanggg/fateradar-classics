- rule_id: QINGNANGXU-R-03
  kind: doctrine
  statement: 先天罗经十二支、后天再用八干四维辅正位，共二十四山；二十四山分顺逆，共成四十八局；五行从此中分，祖宗从阴阳出。
  anchor: null
