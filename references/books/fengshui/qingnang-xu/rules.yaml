rules:
- rule_id: QINGNANGXU-R-01
  kind: doctrine
  statement: 杨公养老法以"看雌雄"为总；先看金龙动不动、次察血脉认来龙；龙分两片阴阳取，水对三叉细认宗。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 3
    end_line: 3
  quote: 楊公養老看雌雄，天下諸書對不同。先看金龍動不動，次察血脈認來龍。龍分兩片陰陽取，水對三叉細認宗。江南龍來江北望，江西龍去望江東。是以聖人卜河洛，湹澗二水交華嵩。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-02
  kind: doctrine
  statement: 山以山为对、水以水为对；山管山兮水管水，此是阴阳不待言；不可混淆。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 4
    end_line: 4
  quote: 相其陰陽流水位，卜年卜宅世都宮。晉世景純傳此術，演經立義出元空。朱雀發源生旺氣，一一講說開愚蒙。一生二兮二生三，三生萬物是元關。山管山兮水管水，此是陰陽不待言。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-03
  kind: doctrine
  statement: 先天罗经十二支、后天再用八干四维辅正位，共二十四山；二十四山分顺逆，共成四十八局；五行从此中分，祖宗从阴阳出。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 5
    end_line: 5
  quote: 識得陰陽元妙理，知其衰望生與死。不問坐山與來水，但逢死氣皆無取。先天羅經十二支，後天再用干與維。八干四維輔正位，子母公孫同此推。二十四山分順逆，共成四十有八局。
  applicable_to: []
  caveats:
  - 现代使用边界：具体局位推演必须使用 tool.fengshui.luopan，严禁手算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-04
  kind: doctrine
  statement: 用净阴净阳法时，前后八尺不宜杂；斜正受来阴阳取，气乘生旺方无煞。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 8
    end_line: 8
  quote: 用此量山與步水，百里江山一餉間。更有淨陰淨陽法，前後八尺不宜雜。斜正受來陰陽取，氣乘生旺方無煞。來處起頂須要知，三節四節不須拘。只要龍神得生旺，陰陽卻與穴中殊。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  - 具体精度由 tool.fengshui.luopan 判定，不可手算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-05
  kind: doctrine
  statement: 山上龙神不下水、水里龙神不上山；用此量山步水，百里江山一饷间。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 7
    end_line: 7
  quote: 若能勘破個中理，妙用本來向一體。陰陽相見兩爲難，一山一水何足言。二十四山雙雙起，少有時師通此義。五行分布二十四，時師此訣何曾記。山上龍神不下水，水裏龍神不上山。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-06
  kind: doctrine
  statement: 水交三八要相遇，水发城门须要会；明堂朝水须截定生旺，莫教直泻。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 9
    end_line: 9
  quote: 天上星辰似織羅，水交三八要相遇。水發城門須要會，卻如湖裏雁交鵝。穴上明堂并朝水，文庫大小俱得位。截定生旺莫教流，直射直流家業退。射破生方定少亡，沖破旺位財狼𤢎。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-07
  kind: doctrine
  statement: 截定生旺莫教流，直射直流家业退；射破生方定少亡，沖破旺位财狼藉。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 9
    end_line: 9
  quote: 天上星辰似織羅，水交三八要相遇。水發城門須要會，卻如湖裏雁交鵝。穴上明堂并朝水，文庫大小俱得位。截定生旺莫教流，直射直流家業退。射破生方定少亡，沖破旺位財狼𤢎。
