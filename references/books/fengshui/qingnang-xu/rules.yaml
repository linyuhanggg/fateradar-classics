- rule_id: QINGNANGXU-R-08
  kind: doctrine
  statement: 生出克出名为退、生入克入名为进；进神宜进则家资旺，进神若退则家不兴；退神宜退亦同旺，退神若进则主官刑。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 10
    end_line: 10
  quote: 文若來時男女亂，庫方來到定爲殃。生出剋出名爲退，生入剋入名爲進。退水宜流千百步，進水須教庭戶迎。進退得位出公卿，家資巨富旺人丁。旺方帶煞來不宜，庫中藏煞去亦非。
  applicable_to: []
  caveats:
