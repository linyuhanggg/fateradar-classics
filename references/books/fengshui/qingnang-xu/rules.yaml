  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-11
  kind: doctrine
  statement: 唐僧一行扰外国时颠倒五行，遂以讹传讹禍福错乱；用法须回归杨曾真传。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 17
    end_line: 17
  quote: 三才六建難爲妙，得三失五盡爲偏。蓋因一行擾外國，遂把五行顛倒編。以訛傳訛竟不明，所以禍福爲錯亂。
  applicable_to: []
  caveats:
  - 现代使用边界：典故性陈述，仅作源流参考
  - '"一行扰外国"为传说，史学待考'
  school: null
