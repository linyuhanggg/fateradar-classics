- rule_id: QINGNANGXU-R-09
  kind: doctrine
  statement: 乾坤艮巽长男兴、寅申巳亥长伶丁；甲庚丙壬中男发、子午卯酉中男杀；乙辛丁癸小男强、辰戌丑未小男殃。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 14
    end_line: 14
  quote: 凶神流短吉神長，富貴聲名滿天下。子午卯酉號衙廳，神壇寺觀亦能興。內有旗鎗紅門水，雷公館位使人驚。水神禍福原非細，更須一一查公位。乾坤艮巽長男興，寅申已亥長伶丁。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  - '"长男杀""小男殃"等表述为古文措辞，不作现代决定论陈述'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QINGNANGXU-R-10
  kind: doctrine
  statement: 山静水动昼夜定，水主财禄山主人丁；富贵贫贱在水神。
  anchor:
    file: sources/fulltext/fengshui/qingnang-xu/fulltext.md
    start_line: 15
    end_line: 15
  quote: 甲庚丙壬中男發，子午卯酉中男殺。乙辛丁癸小男強，辰戌丑未小男殃。富貴貧賤在水神，水是山家血脈精。山靜水動畫夜定，水主財祿山人丁。乾坤艮巽號御街，四大尊神在內排。
  applicable_to: []
  caveats:
  - 现代使用边界：仅作文化研究参考
  school: null
