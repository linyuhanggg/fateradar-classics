- rule_id: QM-P13
  kind: doctrine
  statement: 时干克日干乃五不遇而灾生
  anchor:
    file: sources/fulltext/san-shi/qimen-dunjia-tongzhi/fulltext.md
    start_line: 57
    end_line: 57
  quote: 甲加丙兮龙回首，丙加甲兮鸟跌穴。回首则悦怿易逐，跌穴则显灼易成。身残毁兮，乙遇辛而龙逃走；财虚耗兮，辛遇乙而虎猖狂。癸见丁，腾蛇妖矫；丁见癸，朱雀投江。生丙临戊天遁用兵，开乙临己地遁安坟，休丁遇太阴人遁安营。庚临日干伏干格，日干临庚飞干格。庚临值符伏宫格之名，值符临庚飞宫格之说。大格庚临六癸，刑格庚临六己。时干克日干乃五不遇而灾生，丙奇临时干名勃格而祸起。三奇得使众善皆臻，六仪击刑百凶俱集。太白加荧贼欲来，火入金乡贼将去。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
