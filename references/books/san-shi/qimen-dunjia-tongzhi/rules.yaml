- rule_id: QM-P10
  kind: doctrine
  statement: 生门六丙临六戊，此为天遁是分明
  anchor:
    file: sources/fulltext/san-shi/qimen-dunjia-tongzhi/fulltext.md
    start_line: 65
    end_line: 65
  quote: 生门六丙临六戊，此为天遁是分明。开门六乙临六己，地遁如斯而已矣。休门六丁合太阴，欲识人遁莫过此。要知三遁何所宜，形藏影隐斯为美。庚为太白丙荧惑，庚丙相加谁会得。六庚加丙白入荧，六丙加庚荧入白。白入荧兮贼即来，荧入白兮贼欲隔。丙为勃兮庚为格，格则不通勃乱逆。庚加六甲为伏干，甲加六庚飞干格。庚加值符天乙伏，值符加庚天乙飞。加一宫兮战在野，同一宫兮战国中。庚加癸兮为大格，加己为刑大不宜。加壬之时为小格，格嫌岁月日时移。更有一般时格者，六庚慎勿加三奇。此局若还行师去，匹马只轮无返期。六癸加丁腾蛇矫，六丁加癸雀入水。六辛加乙虎猖狂，六乙加辛龙逃走。诸君四是曰凶神，凡事遇之宜不平。丙加甲兮鸟跌穴，甲加丙兮龙回首。只此二者是吉神，为事加吉十八九。八门若遇休开生，诸事遇之总称情。伤宜捕猎终须获，杜好逃遮更隐形。景士投书与破阵，死唯游猎葬埋宜。试问惊门何所益，捕捉公庭较是非。蓬任冲辅禽阳星，英芮柱心阴宿益。辅禽心星为大吉，冲任小吉未全亨。大凶蓬芮不堪遇，小凶英柱在中宫。大凶无气交为小，小凶有气亦丁忧。吉宿更能逢旺相，万举万全功必成。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
