- rule_id: LIURENZHIYIN-011
  kind: doctrine
  statement: 取用和三传已定。
  anchor:
    file: sources/fulltext/san-shi/liuren-zhiyin/fulltext.md
    start_line: 1094
    end_line: 1103
  quote: 214. 既定課傳，次觀神將。貴人為百神之主，得位為福，失位為殃；螣蛇為卑賤之神，旺相怪異，休囚亦主憂驚。朱雀文書亦主刑戮奸讒口舌，白虎道路又為官災疾病死亡。勾陳主遲滯勾連之事，囚主訟而旺主生；玄武為盜賊虛耗之神，休失人而旺失物。六合為婚姻合和，婦女得之則為私門；太常主酒食衣裳，武職占之則為擢任。青龍所主財物，文官見之光為恩寵，天後雖為婦人，庶人得之亦主亨佳。天空奴婢妄誕，太陰暗昧不明。
  applicable_to: 
  - key: sanchuan
    value: 初传
  caveats:
  - 不得从单一白虎、玄武、贵人等名称直接生成现实断言
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: LIURENZHIYIN-012
  kind: doctrine
  statement: 用户问题已分类，且不是要求把文化文本当现实保证。
  anchor: null
  quote: 227. 占天看雲龍風虎，察水火升降以辨陰晴。占地看玉藻金英，視神將生克以知吉凶。占宅占人看日辰而次詳課義，占獄占病視勾虎而解救同論。捕亡三奸之下可得，鬼神煩神之位推詳。占婚姻視天後妻財與日辰比和。占胎孕夫妻年上方判陰陽。占謀望要成神合氣，占求財要看旺相龍常。占功名先看吉神吉將，占官職當明天吏天城。
  applicable_to: []
  caveats:
  - 现代增补课例不得冒充陈公献占验
  school: null
  verified: false
  verified_by: null
  verified_at: null
