- rule_id: LIURENZHIYIN-016
  kind: doctrine
  statement: 用户问收款、入账或求财，三传、六亲、旺衰、空墓与天将已由确定性事实层给出。
  anchor:
    file: sources/fulltext/san-shi/liuren-zhiyin/fulltext.md
    start_line: 943
    end_line: 949
  quote: 174. 三傳生日百事宜，日生三傳財源耗。日克三傳求財可羨，三傳克日眾鬼難堪。初傳克末事成空，末克初傳事可成。傳見妻財利益多，傳見父母饒生意，傳見兄弟口舌生，傳見子孫福祿滿，傳見官鬼有兩途，病訟畏兮官位顯。子傳父兮逆且疑，母傳子兮順且便。三傳凶謀事不成而終不喜，三傳吉兮干支凶，事吉而成無少憚。支若傳乾人求我，乾若傳支我求人。
  applicable_to: []
  caveats:
  - 青龙、玄武是后置限定
  - 不得覆盖课传、旺衰、空墓或问题类神
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: LIURENZHIYIN-017
  kind: doctrine
  statement: 本段以元首课主速、主喜，重审课主迟、主忧论应期与情势，同时提醒元首防乐极生悲、重审详自暗而明。
  anchor:
    file: sources/fulltext/san-shi/liuren-zhiyin/fulltext.md
    start_line: 141
    end_line: 141
  quote: 16. 克者動也，不克則不動。課中有幾克，即有幾事。又事之應期，亦在克中求，蓋克者，轉折也。元首主速，重審主遲；元首主喜，切防樂極生悲；重審主憂，亦詳自暗而明。
  applicable_to:
  - key: keti
    value: 元首课
  - key: keti
    value: 重审课
  caveats:
  - 当前全文含现代注解；此处依据《六壬指南注解》第16条，未作古本逐字归属认定。
  - 速迟与喜忧是传统取象，不能直接换算为保证发生或到账的日期；本段未讨论求财末传六合。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: LIURENZHIYIN-018
  kind: doctrine
  statement: 日干、日支及其五行均由同一确定性课盘给出；问题属于可判成否的具体事件。
  anchor: null
  quote: 508. 辰來克日諸事難成，日往克辰所謀皆遂。
  applicable_to: []
  caveats:
  - 不把“辰来克日”改读成任意一课上神克日
  - 本实现严格采用原注“支辰来克干 / 日干去克支辰”的日干日支口径
  school: null
  verified: false
  verified_by: null
  verified_at: null
