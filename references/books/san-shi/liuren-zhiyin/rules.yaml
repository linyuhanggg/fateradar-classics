- rule_id: LIURENZHIYIN-008
  kind: doctrine
  statement: adapter 标记十二神各临冲位，`is_fanyin=true`。
  anchor:
    file: sources/fulltext/san-shi/liuren-zhiyin/fulltext.md
    start_line: 187
    end_line: 200
  quote: 30. 若諸神歸於本位，如子加子、午加午之類，乃伏吟之象也。有克者取克，不過癸乙二干而已。無克者陽日自乾上發傳，陰日自辰上發傳，迤邐三刑而為三傳也。若初傳值自刑則中傳陽日用支、陰日用乾，仍取刑為末傳也。倘逢中傳自刑者，末傳以衝神為之矣。夫刑有三者：一字刑乃午刑午、辰刑辰、酉刑酉、亥刑亥，自刑也。二字刑乃卯刑子、子刑卯也。三字刑乃醜刑戌、戌刑未、未刑醜也；寅刑巳、巳刑申、申刑寅也。反吟乃子加午、卯加酉，十二神各臨衝射之位也。克之少者重審、元首取之，多則知一涉害取之。三傳初末相同而衝乎中傳。若夫丁未、己未、辛未、丁丑、己丑、辛丑六課無克，乃名無依，以支神之井欄衝射上所得之神以為初用，而日支所乘為中傳，日乾所乘為末傳。夫井欄者，醜衝未、巳衝亥也。
  applicable_to: []
  caveats:
  - 不得在无依分支中改套遥克、昴星或别责
  school: null
  verified: false
  verified_by: null
  verified_at: null
