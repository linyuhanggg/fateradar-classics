- rule_id: TR-04
  kind: doctrine
  statement: 每三年移一宫，按一、二、三、四、六、七、八、九顺行，不游中五
  anchor:
    file: sources/fulltext/san-shi/taiyi-shenshu/fulltext.md
    start_line: 94
    end_line: 94
  quote: 推上元積年以周紀法三百六十去之不盡以元法七十二去之又不盡以太乙小周法二十四除之又不盡以三約之為宫數不滿為入宫以來年數其宫數命起一宫順行八宫不遊中五筭外即得太乙所在及入宫以来年數也
  applicable_to: []
  caveats: []
  school: null
