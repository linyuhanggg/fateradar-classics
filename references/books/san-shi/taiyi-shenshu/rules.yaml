- rule_id: TR-03
  kind: doctrine
  statement: 360 年为六纪，每纪 60 年；另以连续五个 72 年段标记五子元（甲子、丙子、戊子、庚子、壬子），72 局内每三年依次理天、理地、理人
  anchor:
