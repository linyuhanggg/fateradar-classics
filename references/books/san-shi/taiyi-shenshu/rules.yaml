- rule_id: TR-01
  kind: doctrine
  statement: 采用卷一上元甲子年计；大唐甲子（724）为 1,937,281 算，一算起例，公元换算偏移为 1,936,557
  anchor:
    file: sources/fulltext/san-shi/taiyi-shenshu/fulltext.md
    start_line: 80
    end_line: 81
  quote: 自上元以来嵗代綿逺紀法差殊雖設繁詞備而靡用今從上元甲子到唐甲子嵗通前計四萬八百一筭臣按宋琨置元似童兒戯推求人紀之年下求不得日辰上求不得冬至自三百餘年學者何多逮於淳風但效尤而已臣今别修甲子元四分厯法與太乙同元舉而備用得上元甲子冬至引而下之齊距嵗計太乙行宫進不違於四分退不失於元紀自上元混沌甲子之嵗至今大唐甲子嵗積得一百九十三萬七千二百八十一筭
  applicable_to: []
  caveats:
  - 不与卷二周厉王近元、卷五上元甲寅或后世演纪积年混用
  school: null
  verified: false
  verified_by: null
  verified_at: null
