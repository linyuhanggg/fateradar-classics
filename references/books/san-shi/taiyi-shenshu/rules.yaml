- rule_id: TR-05
  kind: doctrine
  statement: 主客大将取算数个位；整十取十位；参将取大将乘三的十进制余数，余零留中五
  anchor:
    file: sources/fulltext/san-shi/taiyi-shenshu/fulltext.md
    start_line: 347
    end_line: 349
  quote: 五將者太乙監將幷上下二目主客大小將也監將者東方嵗星之精受木徳之正氣王在春三月 上目者南方熒惑之精受火徳之正氣在天為陽號始擊將屬客王在夏三月 下目者中宫鎮星之精受土徳之正氣在地為隂號文昌將屬主王在四季 客大將者北方辰星之精受水徳之正氣主兵革王在冬三月 主大將者西方太白之精受金徳之正氣主戰鬬王在秋三月又五將各應五方隨四時各有休王經云主客兩陣相當乘生氣者勝乘死氣者敗 假令八月攻東方以太蔟為始擊將乘生氣也大勝若髙叢為始擊將乘死氣也大負他倣此 嵗計者嵗星之使也謂計嵗月日時之事也 是故聖人則而象之創法而制局太乙為人君二目法輔相五將定主客八門分勝負運沉機扵罇爼之間突雄略扵幃幄之内盖王佐之要道也
  applicable_to: []
  caveats:
  - 只输出将位事实，不自动输出胜负
  school: null
  verified: false
  verified_by: null
  verified_at: null
