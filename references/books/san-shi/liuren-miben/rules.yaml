- rule_id: LIURENMIBEN-022
  kind: doctrine
  statement: 用户问应期，发用、天地盘和民用日期均已验证。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 3208
    end_line: 3208
  quote: 凡占事吉凶應期，以發用決之。太歲發用，應在一年；月建發用，應在一月；旬首發用，應在一旬；節氣發用，應在一氣；日乾發用，應在當日。其所應之事，以乘神決之。如勾用主田宅事。又乘貴人，主貴人扶助之例。
  applicable_to: []
  caveats:
  - 与其他候期法不一致时并列，不静默择一
  school: null
  verified: false
  verified_by: null
  verified_at: null
