- rule_id: LIURENMIBEN-017
  kind: doctrine
  statement: 用户明确采用卷十七三才应事，且 LM-R00 已通过。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 5600
    end_line: 5600
  quote: 天課占天人課人，地課卜宅地墳塋。罡天魁地人求貴，此訣教君最有靈。孟仲季中分順逆，地般落處見真情。仲於本位天盤取，孟季須知隔五尊。此是三才期應訣，鬼神無處可潛形。
  applicable_to: []
  caveats:
  - 这是一项卷十七专法，不覆盖常规四课三传解释
  school: null
