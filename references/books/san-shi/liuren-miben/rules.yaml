- rule_id: LIURENMIBEN-007
  kind: doctrine
  statement: 已按问题域确定类神，LM-R00 已通过。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 1474
    end_line: 1474
  quote: 類不逢空旺相乘，傳生支合事須成，見類日鬼空刑害，所乾不遂類中明。幹事，三傳上下相生，支神三六合乾合，所幹成。雖是見類，與今日為鬼，或刑害空亡，三傳見害，不成。傳中用事之人，須此原本作「比」字。言之。
  applicable_to: []
  caveats:
  - 不同卷可能为同一事项列不同类神，按问题细分并保留来源
  school: null
  verified: false
  verified_by: null
  verified_at: null
