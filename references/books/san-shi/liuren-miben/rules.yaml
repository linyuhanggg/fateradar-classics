- rule_id: LIURENMIBEN-010
  kind: doctrine
  statement: 需要用卷十四解释具体问题，LM-R00 已通过。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 3253
    end_line: 3253
  quote: 中式，理人事也。要分彼此、體用、內外、出入、主客、尊卑，明天時、地利、內外、喜忌、虛實、聚散，知進退、動靜、始終、遲速、存亡、勝負，識幽明、人物、器物、食物、情狀、男女、貴賤、親疏、老幼、新舊、多寡，定方向、遠近、前後、左右、高下，總三十類，而天地人三才之衢備矣。
  applicable_to: []
  caveats:
  - 同一干支角色会随“我去见人/人来见我”变化，不能复用静态映射
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: LIURENMIBEN-011
  kind: doctrine
  statement: adapter 已给旬空、落空/陷空和三传位置。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 3335
    end_line: 3335
  quote: 虛者，旬中空亡也。在天曰寡宿，在地曰孤辰，吉凶相反。克我、刑我、劫我、衝我，皆取空；生我、旺我、救我，不許空。天上神臨地下空，曰落空，曰陷空，即同空論。此天地妙理。課傳既定，首觀虛實，以分吉凶焉。實者，不空不陷，受生同類比和是也。
  applicable_to: []
  caveats:
  - 卷十三、十四、十五对空亡表述粒度不同，不能互相抹平
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: LIURENMIBEN-012
  kind: doctrine
  statement: 盘面事实完整，准备加入聚散、初建复建或奇格。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 3354
    end_line: 3365
  quote: 《中黃經》云：莫執東方木旺春，夏火秋金冬季水，專以初建複建，乾多者為聚，少者為散。初建者，日乾五子元遁之也。複建者，時幹五子元遁之也。且以建干多寡，逐情而變，不執本支五行也。如巳午本火，上下癸壬，或臨水鄉，便從水論之。如丁亥春夏從火，秋冬從水。若臨火鄉，便從火論。若臨水方，還從水論。以多為勝耳。此中黃變化之妙也。須看上下，分先後、聚散、主客。又分建破鬼救，試驗實妙，錄告來茲。
  applicable_to: []
  caveats:
  - 卷十四同收复杂变法与“求奇反不奇”的自我约束，应同时保留
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: LIURENMIBEN-013
  kind: doctrine
  statement: 已有日辰和三传，问题包含进退、过程或结果。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 3397
    end_line: 3397
  quote: 傳進為進，傳退為退。進空宜退，退空宜進，觀其傳，吉則進，凶則退。
  applicable_to: []
  caveats:
  - 特殊课体会改变过程感，但不取消三传事实
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: LIURENMIBEN-014
  kind: doctrine
  statement: 用户询问快慢或应期，LM-R00 已通过。
  anchor:
    file: sources/fulltext/san-shi/liuren-miben/fulltext.md
    start_line: 3441
    end_line: 3451
  quote: 柔日伏吟、涉害、天乙逆治、用在日辰之後，主事遲也。斬關、占時發用、天乙順治、用在日辰之前，主事速也。冬占申酉入傳，天罡在日辰後，是過去事。寅卯入傳，天罡在日辰前，是未來事。第三四課為用，向去事。用二八門，主事速。陰日伏吟、關格、斗罡加卯酉、傳歲月，久遠事。日上發用，應在旬內。辰上發用，應在一月。得歲不出歲，得月不出月。得日不出日，得時不出時，得候不出候。
  applicable_to: []
  caveats:
  - 卷十四和卷十七的时间口径用途不同，须标 source rule
  school: null
  verified: false
  verified_by: null
  verified_at: null
