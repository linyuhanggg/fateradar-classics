edition_statement: >-
  主检索文本为维基文库十二个子页合并并标准化的 13800 行电子文本。独立见证为
  Kanripo KR3g0031 的《文渊阁四库全书》十二卷转写，固定于仓库提交
  320cbc13a9048aa0f028d996ab32f8bf7b362ef7。馆藏影印锚点为《文渊阁四库全书》
  第 0808 册。电子主文本自称四库本，但其卷次安排与 Kanripo 文渊阁转写不一致，
  因此本包不得把 normalized 卷号直接称为文渊阁原卷号。

