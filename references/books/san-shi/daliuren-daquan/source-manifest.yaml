#     1 条 wikisource_raw.txt + 14 条 Kanripo（Readme.org 与 KR3g0031_000–012）。
#     → 因此本包声明的「独立见证」（Kanripo 文渊阁十二卷转写，固定于提交
#       320cbc13a9048aa0f028d996ab32f8bf7b362ef7）**在本地不可复现**，不能据此宣称已入库。
