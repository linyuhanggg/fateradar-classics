  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-018
  kind: doctrine
  statement: 三传及日干五行均由已验证事实层给出。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 11491
    end_line: 11499
  quote: 凡课用神生日，及三传递生日干，或干支俱互生旺，为亨通课。如丙申日三传申亥寅，初生中、中生末、末生日干也。癸丑日三传酉丑巳，末生中、中生初、初生日干也，为递生。主上人推荐，或官员请举，及文状事，始终成就。辛卯日干上亥，支上辰，为互生。丙寅干上寅生丙，支上亥生寅，为俱生，主彼此和顺，两相有益，遇生气两家合本求利。甲申日干上酉乃支之旺神，支上卯乃干之旺神，为互旺，主客两相投奔，互有兴旺。壬寅日干上子，支上卯为俱旺，自在坐用，谋为省力，或事己失欲复旧，或本职迁转极妙，或坐待通太，无心中得人照扶兴发。此三传递生日辰生旺，主人亨利，时运开通，故名亨通，统渐之体，乃福禄来临之课也。
  applicable_to: []
  caveats:
  - 任一传支、日干或关系字段缺失时停止本卡，不由语言模型补算
