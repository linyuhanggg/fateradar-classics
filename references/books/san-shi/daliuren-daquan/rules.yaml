- rule_id: DALIURENDAQU-DLR
  kind: doctrine
  statement: DLR-00 通过，adapter 已给日干和寄宫。
  anchor: null
  quote: 甲课寅兮乙课辰，丙戊课巳不须论。丁己课未庚申上，辛戌壬亥是其真。癸课原来丑宫坐，分明不用四正神。
  applicable_to: []
  caveats:
  - 出现不一致时停止四课解释，先回到 adapter 修正
  - 不得在下游补猜
