- rule_id: DALIURENDAQU-004
  kind: doctrine
  statement: DLR-02 留下两个或更多同方向直接克候选。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 70
    end_line: 70
  quote: 下贼或三二四侵，若逢上克亦同云。常将天日比神用，阳日用阳阴用阴。若或俱比俱不比，立法别有渉害陈。
  applicable_to: []
  caveats:
  - adapter 未输出候选阴阳、把支阴阳与天干阴阳混为一表时停止
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-005
  kind: doctrine
  statement: 多个同方向候选经比用后仍俱比或俱不比。
  anchor: null
  quote: 渉害行来本家止，路逢多克为用取。孟深仲浅季当休，复等柔辰刚日宜。
  applicable_to: []
  caveats:
  - 任何路径、土寄宫、孟仲季或先见顺序缺字段即返回 `unresolved_shehai`，禁止语言模型手数
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-006
  kind: doctrine
  statement: 四课上下无直接克；未进入伏吟、返吟、八专等专式无克分支。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 78
    end_line: 78
  quote: 神遥克日曰蒿矢，日遥克神曰弹射。四课无克号为遥，日与神兮逓互招。先取神遥克其日，如无方取日来遥。或有日克乎两神，复有两神来克日。择与日干比者用，阳日用阳阴用阴。
  applicable_to: []
  caveats:
  - 上下关系或第二至第四课候选范围不明确时停止
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-007
  kind: doctrine
  statement: 四课完整、无直接克、无遥克，且不属于伏吟、返吟、八专或三课别责。
  anchor: null
  quote: 无遥无克昴星穷，阳仰阴俯酉位中论初传也。刚日先辰而后日，柔日先日而后辰论中末也。
  applicable_to: []
  caveats:
  - adapter 只给“虎视”名称而不给酉上/酉下事实字段时停止
  - 三课、两课不得进入本卡
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-008
  kind: doctrine
  statement: 去重后恰为三课，且无直接克、无遥克。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 86
    end_line: 86
  quote: 四课不全三课备，无遥无克别责例。刚日干合上头神，柔日支前三合取。皆以天上作初传，阴阳中末干中寄。刚三柔六共九课，此课先贤俱隠秘。戊午戊辰与丙辰，干上皆午是为亲。辛丑辛未各二日，下上皆是丑未真。丁酉当为己丁是，辛酉原来是酉辛。
  applicable_to: []
  caveats:
  - 阴日未提供经过校定的 `biezhe_profile` 时返回 `unresolved_biezhe_yin`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-009
  kind: doctrine
  statement: 日柱属于癸丑、甲寅、丁未、己未、庚申，且干支同位形成两课结构。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 90
    end_line: 90
  quote: 两课无克号八专，阳日日阳顺行三连本位数。阴日辰阴逆三位，中末总向日上眠。
  applicable_to: []
  caveats:
  - 不在五日集合、课数不是两课或计数是否含本位不明时停止
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-010
  kind: doctrine
  statement: 月将支与占时支相同，十二神各居本宫，adapter 标记 `is_fuyin=true`。
  anchor: null
  quote: 伏吟有克还为用，无克刚干柔取辰。迤逦刑之作中末，从兹《玉厯》职其真。若也自刑为发用，次传颠倒日辰并。次传更复自刑者，冲取末传不论刑。
  applicable_to: []
  caveats:
  - 刑表、冲表或日干寄宫不统一时停止
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-011
  kind: doctrine
  statement: 十二神各居冲位，adapter 标记 `is_fanyin=true`。
  anchor: null
  quote: 返吟有克亦为用，无克别有井栏名。若知六日该无克，丑未同干丁己辛。丑日登明未太乙，辰中日末识原因阳日用辰，阴日用日，辰上作中，日上作末。
  applicable_to: []
  caveats:
  - adapter 没有 `well_rail_trace` 或 profile 未经过 golden tests 时返回 `unresolved_fanyin_well_rail`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DALIURENDAQU-012
  kind: doctrine
  statement: 要布十二天将或解释贵人顺逆。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 3
    end_line: 31
  quote: 臣等谨案：《六壬大全》十二巻，不着撰人名氏。巻首题“怀庆府推官郭载騋校”，盖明代所刋也。六壬与遁甲、太乙，世谓之“三式”，而六壬其传尤古，或谓出于黄帝元女，固属无稽，要其为术，固非后世方技家所能造。大抵数根于五行，而五行始于水，举阴以起阳，故称壬焉；举成以该生，故用六焉。其有天地盘与神将加临，虽渐近竒遁九宫之式，而由干支而有四课，则亦两仪、四象也；由发用而有三传，则亦一生二、二生三、三生万物也；以至六十四课，莫不原本羲爻，盖亦《易》象之支流，推而衍之者矣。考《国语》伶州鸠对七律，以所称“夷则”、“上宫”、“大吕”、“上宫”推之，皆有合于六壬之义。然占卜之属，特以五音、十二律定数，未可即指为六壬之源。《呉越春秋》载伍员及范蠡“鸡鸣”、“日出”、“日映”、“禺中”四术，则时将加乘，与龙、蛇、刑、徳之用，一如今世所传。而《越絶书》载公孙圣亦有“今日壬午时加南方”之语。其事虽不见经、传，似出依托，然赵煜、袁康皆后汉人，知其法着于汉代也。其书之见于史者，《隋志》二家，《唐志》六家，《宋志》三十家。而焦竑《经籍志》所列，多至八十三家，然多散佚不传；其存者，如徐道符《心镜》，蒋日新《开云观月歌》，凌福之《毕法赋》，及《五变中黄经》，术家奉为蓍蔡。而流传既久，其说多岐，或専论课体而失之拘，或専主类神而失之粗，或杂取神煞而失之支，又皆不可以为法。是书指《大全》，闲人按总集诸书遗文，首载《入手法》、《总钤》及贵神月将徳煞、加临喜忌，旁采唐以来诸论，若《括囊》、《云霄赋》、《课经》之类，而纬以《心镜》、《观月》诸篇，采撷颇为详备。案《明史艺文志》有袁祥《六壬大全》三十三巻，名目相同而巻帙不符，未必即祥所辑。要其博综简括，固六壬家之总汇也。惟是六壬所重，莫过于天乙贵神阴阳顺逆，为吉凶所自出，如匠者之凖绳矩矱。而先天之徳起于子，后天之德起于未，以五干徳合神取贵。承学之士多未究其源，我圣祖仁皇帝《御定星历考原》一书，贯串玑衡，权舆圭臬，以订曹震圭昼丑夜未之讹，实足立千古之标凖。我皇上御纂《协纪辨方书》，复申畅斯旨。谨按《呉越春秋》所载子胥之占，三月甲戌，时加鸡鸣，而以为青龙在酉，是甲日丑为阴贵也。范蠡石室之占，十二月戊寅，时加日出，而亦以为青龙临酉，功曹为螣蛇，是戊日丑为阳贵也。沿溯古义，皆与圣谟垂示先后同符，是书所取天乙尚沿俗例，巻中仅载先天贵人一图而不用，未免失之舛漏。又所载十二宫分野，亦多拘牵旧说，未能订正；今以原本所有，姑仍其旧録之，而附订其失如右。
  applicable_to: []
  caveats:
  - '`guiren_profile` 缺失、只给一个全局“昼某夜某”常量或来源表不可追踪时停止布将'
  school: null
  verified: false
  verified_by: null
  verified_at: null
