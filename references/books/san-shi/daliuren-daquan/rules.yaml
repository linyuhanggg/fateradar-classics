- rule_id: DALIURENDAQU-019
  kind: doctrine
  statement: 初传能唯一回指发用课，且上下神传统数值和运算可追踪。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 5069
    end_line: 5085
  quote: 伤破须观天上神，财入传来天将伤假令癸日巳午为财，入传或发用，上见水将克者，财破。如财遭天将破失，是伤也。官鬼下临财位上，阴私用事畏人彰假令己酉日申将巳时，卯是日鬼，下临子水乡是也。天盘日鬼加地盘日之财位，阴私用事，畏人知也。日往支辰亲识至，返遭刑克被凶侵日来支上两课者，主外人至，及进人口也。火主其明水主暗，失明只为火难任发用克日，蛇雀临巳午，主明信动。后玄临亥子，主暗信动。火属阳，水属阴，故火明水暗也。火临亥子，为失明，主虚忧、惊恐事。少多大小详衰旺，旺多衰少细推寻占物数多少大小者，皆以系神将旺相为多，休囚为少。月厌丁符与将空，伤干怪动好沉吟月厌，正月起戌逆行十二辰。丁者，六甲旬中之丁，及蛇亦是。符，直符也，甲日巳，乙日辰，丙日卯，丁日寅，戊日丑，己日午，庚日未，辛日申，壬日酉，癸日戌是也。将空者，天将不曽逰到之地，却于天上乗之。假令龙不到戌亥，却天上亥与戌为龙，乃是将空之地，余依此。又月厌、丁符、将空伤日辰，必主怪梦之事。取怪之状，以类神主之。
  applicable_to: []
  caveats:
  - 发用不能唯一回课或传统数值表缺失时返回 `number_family_unresolved`
  - 现实尺度缺失时返回 `currency_magnitude_unresolved`
