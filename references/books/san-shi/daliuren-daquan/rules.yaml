- rule_id: DALIURENDAQU-017
  kind: doctrine
  statement: 已确定发用、月令旺相休囚死口径；若判断多少，还必须先按问题确定类神或六亲。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 5027
    end_line: 5044
  quote: 贵临巳亥多反复，罡加癸水主蔵名贵人临地盘巳亥上，主事有反复之意。天罡鱼龙之物，下临癸水，主蔵避逃形，如得水蔵之象也。假令癸酉日寅时巳将，主蔵逃也。为辰加癸为用，余仿此。支干发用岁神临，所望逺大及朝廷必主逺大之望，非细微之事。縁太岁临干支为用，或岁君发用是也。占时发用当日言，太岁连传三二年占时发用，应在当日。太岁相传，却三二年事，必迟却三二年。支干入传为事连，岁建幷煞亦如然干支入传中者，占事主速。岁月建共入传，或杀刑重，亦主速也。旺相气发必欲速，休囚死气皆迟延春木旺、火相，四时各以类推。发用或传阳、传顺，事又速也。休囚死气为用，三传逆，又传入天乙后，主事迟，目下未成也。日阴辰阴用为合，更乗吉将待求成凡干三合在日阴发用，主外亲事。在辰阴发用，主内亲事。支三合亦然。日辰相?无凶将，亦主他来相合因日辰相并得吉将，主合事也。
  applicable_to: []
  caveats:
  - 类神缺失、月令季节表不明或没有具体问题对象时，数量层返回 `relative_quantity_unresolved`
  - 无应期锚点时具体日历窗口返回 `calendar_window_unresolved`
