  quote: 臣等谨案：《六壬大全》十二巻，不着撰人名氏。巻首题“怀庆府推官郭载騋校”，盖明代所刋也。六壬与遁甲、太乙，世谓之“三式”，而六壬其传尤古，或谓出于黄帝元女，固属无稽，要其为术，固非后世方技家所能造。大抵数根于五行，而五行始于水，举阴以起阳，故称壬焉；举成以该生，故用六焉。其有天地盘与神将加临，虽渐近竒遁九宫之式，而由干支而有四课，则亦两仪、四象也；由发用而有三传，则亦一生二、二生三、三生万物也；以至六十四课，莫不原本羲爻，盖亦《易》象之支流，推而衍之者矣。考《国语》伶州鸠对七律，以所称“夷则”、“上宫”、“大吕”、“上宫”推之，皆有合于六壬之义。然占卜之属，特以五音、十二律定数，未可即指为六壬之源。《呉越春秋》载伍员及范蠡“鸡鸣”、“日出”、“日映”、“禺中”四术，则时将加乘，与龙、蛇、刑、徳之用，一如今世所传。而《越絶书》载公孙圣亦有“今日壬午时加南方”之语。其事虽不见经、传，似出依托，然赵煜、袁康皆后汉人，知其法着于汉代也。其书之见于史者，《隋志》二家，《唐志》六家，《宋志》三十家。而焦竑《经籍志》所列，多至八十三家，然多散佚不传；其存者，如徐道符《心镜》，蒋日新《开云观月歌》，凌福之《毕法赋》，及《五变中黄经》，术家奉为蓍蔡。而流传既久，其说多岐，或専论课体而失之拘，或専主类神而失之粗，或杂取神煞而失之支，又皆不可以为法。是书指《大全》，闲人按总集诸书遗文，首载《入手法》、《总钤》及贵神月将徳煞、加临喜忌，旁采唐以来诸论，若《括囊》、《云霄赋》、《课经》之类，而纬以《心镜》、《观月》诸篇，采撷颇为详备。案《明史艺文志》有袁祥《六壬大全》三十三巻，名目相同而巻帙不符，未必即祥所辑。要其博综简括，固六壬家之总汇也。惟是六壬所重，莫过于天乙贵神阴阳顺逆，为吉凶所自出，如匠者之凖绳矩矱。而先天之徳起于子，后天之德起于未，以五干徳合神取贵。承学之士多未究其源，我圣祖仁皇帝《御定星历考原》一书，贯串玑衡，权舆圭臬，以订曹震圭昼丑夜未之讹，实足立千古之标凖。我皇上御纂《协纪辨方书》，复申畅斯旨。谨按《呉越春秋》所载子胥之占，三月甲戌，时加鸡鸣，而以为青龙在酉，是甲日丑为阴贵也。范蠡石室之占，十二月戊寅，时加日出，而亦以为青龙临酉，功曹为螣蛇，是戊日丑为阳贵也。沿溯古义，皆与圣谟垂示先后同符，是书所取天乙尚沿俗例，巻中仅载先天贵人一图而不用，未免失之舛漏。又所载十二宫分野，亦多拘牵旧说，未能订正；今以原本所有，姑仍其旧録之，而附订其失如右。
