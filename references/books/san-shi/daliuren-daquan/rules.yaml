- rule_id: DALIURENDAQU-014
  kind: doctrine
  statement: 用户或下游想标记官爵、游子、殃咎等课经复合课体。
  anchor:
    file: sources/fulltext/san-shi/daliuren-daquan/fulltext.md
    start_line: 11051
    end_line: 11051
  quote: 凡课得岁月年命驿马发用，又天魁太常入传，为官爵课。驿马者，三合头冲是也，为驿递之神，传命之使也。人命行年，太岁月建并用之马，华丽异常。又戌天魁为印绶，荣加官职爵禄，名曰官爵也。占事吉庆，仕宦升擢。统益之体，为鸿鹄冲霄之课也。
  applicable_to: []
  caveats:
  - 原文条件表尚未建立的课体不得从名称猜测，应回到卷段检索
  school: null
  verified: false
  verified_by: null
  verified_at: null
