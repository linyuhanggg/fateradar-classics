- rule_id: SANMINGTONGH-027
  kind: doctrine
  statement: 旬空由十干配十二支未到之位确定，如甲子旬戌亥；原文另分阴阳、前后与互换等法，空亡有用无用须看所空为福聚还是祸聚，不能逢空即凶、逢合即吉。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1636
    end_line: 1643
  quote: '空對實亡對有言神白經云空亡空亡幾多般十干不到作空看洞𤣥經云遁窮而亡生故以甲旬盡處曰空亡蓋有是位而無祿曰空有支而無干曰亡如甲子旬遁至酉而十干足所以無戌亥餘五干例見是為空亡然空而有實亡而有存所以未可便為㓙論珞琭子論空亡云五陽令用一陽五陰令用一陰假

    如甲子丙寅戊辰庚午壬申則用戌不用亥乙丑丁卯己巳辛未癸酉則用亥不用戌陽分陽年陰分陰年又說甲子至戊辰以戌為空亡己巳至癸酉以亥為空亡分上下五年中間又分甲子至戊辰見壬戌為重見戊戌之類為輕己巳至癸酉見癸亥為重見乙亥之類為輕如甲子生甲戌時此時上正見差輕

    如己巳生癸亥時亦時上内犯最重指迷賦云祿入空亡必分前後之辰所以表陰陽之分明輕重之等也八字金書云甲寅旬壬癸落空亡甲辰旬甲乙甲申旬丙丁甲戌旬庚辛以地支二位而論天干或謂十惡大敗犯此日生者主貧賤然人命見空亡而合格者多洞𤣥經云淵淨而倥侗無氣〔空亡多謂淵淨格

    〕圓機而自立一家〔祿馬貴官上見空亡為九流格〕辭有章而賁名〔學堂見空亡〕性無為而湛如〔自死自絶見空亡〕美質可愛〔貴人多見空亡則可愛〕功名可珍〔華蓋多見空亡則可珍〕優游恬淡無累雕鏤華藻有功〔休囚旺相有吉神而見空亡〕抱越人之才挾敢斷之果〔神煞暗指空亡雖超人無福〕詳此亦有吉處

    凡帶此煞生旺則氣度寛大動招虛名長大肥滿多意外無心之福死絶則一生成敗飄泊但在我有氣之地則不能為禍大忌支干與天中相合是謂小人得位則奸詐譎詭靡所不為若為我所尅是謂天中受殃反為特達之福〔如戊午火人見甲子金之類〕其神性無常與官符併則佞媚多文與刼煞併則狡勇

    與亡神併則飄蓬與大耗併顚倒鶻突與建祿併一生破散與咸池六害併多㐫暴卒惟夾貴華蓋三竒學堂併者大聰明脫俗之士夫空亡不言太歲見生日旬中空亡極若太歲與日互換空亡更不佳以實為空則實可映空以空為空無所映實故帶互換空亡者災深假令甲子年壬戌日甲子之正空亡在壬

    戌其壬戌乃甲寅旬甲寅旬中空復在子主一生財物耗散大破家宅餘倣此若日時互換時日慢若日犯而時却刑害衝破時犯而日却刑害衝破亦主有福未免坎坷又云天中一煞不可全以㓙言如柱有惡神惡煞禍聚之地全要空亡解之有空亡不宜見合合則不能空矣若祿馬財官福聚之氣全怕空亡

    散之有空亡却喜見合合則不能空矣若無衝無合無刑謂眞空亡四孟太毒只作小伎巧術人'
  applicable_to: []
  caveats:
  - 日旬查空是运行采用的口径，不代表本篇所有年日互换及阴阳分法。
  - 祸聚欲空而忌合，福聚怕空而喜合；冲刑与同类冲不动另有条件，不写成无条件解空。
  - 旬空、截路、四大空亡和五鬼等各有取法，不混用；主无依有变等泛化断语无对应本段依据。
