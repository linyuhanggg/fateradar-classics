  kind: doctrine
  statement: 辰戌丑未杂气取用须看所藏财官印、透干与节气深浅；原文喜适度冲刑，忌身弱或冲刑太过。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3326
    end_line: 3328
  quote: '雜氣者乃辰戌丑未辰中有乙戊癸為水土庫戌中有辛戊丁為火庫丑中有癸辛巳為金庫未中有丁巳乙為木庫各隨所藏之氣而言看我日干或為官或為財或為印官係福身之物財是養命之源印乃資身之本在人最為切要四庫各藏三件乃天地不正之氣故以雜言也經云財官印綬全備藏蓄於四

    季之中是也此格喜透露衝刑忌壓伏其餘喜忌消詳與前正氣財官印同假令六甲日生得丑月以丑中辛金為官巳土為財癸水為印看天干透出何字為福次分節氣淺深何物當令大槩透財者富透官者貴印綬享父祖見成之福受宣勅䕃庇之貴如無透出衝刑少許兼身旺為妙忌身弱衝刑太過則福

    聚之氣散矣如柱元有破害之物再不可遇此等運再行則為太過衝壊秀氣反不為吉元無破害喜衝刑運景鑑云雜氣財官身旺有衝而發若太過反受孤貧是也又云雜氣財官格要四柱財星多便為好命若四柱别入他格依他格斷又云雜氣財官有正官格偏官格正財格偏財格雜氣印綬有正印格偏'
  applicable_to:
