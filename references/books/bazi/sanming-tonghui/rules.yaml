- rule_id: SANMINGTONGH-047
  kind: doctrine
  statement: 正官诸子格：天福贵人（官星得福神护）、天元作禄（日坐禄，身强官得用）、岁德正官（年柱正官，祖上官贵）、时上正官（时柱正官，晚来得贵）。共性为官星在特定柱位得用，忌伤官克破。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 2970
    end_line: 2970
  quote: 謂官星坐處見禄如人有官得禄莫非天福甲生人以辛為官辛禄在酉是以甲人見酉乙人見申之例甲用辛官柱有辛酉更得福神助之生旺有氣為佳一名禄干福神遇者主科名巍峩官職尊崇多掌絲綸文翰之美
  applicable_to: []
