  quote: 獨步云棄命從財須要㑹財若逢根氣命損無猜假如丁生酉月柱多庚辛日干無氣只得棄命相從運入北方財官旺地乃為入格南行災古歌云曰干無氣滿盤財棄命相從是福胎運旺財官皆富貴如逢根助反為災
