- rule_id: SANMINGTONGH-028
  kind: doctrine
  statement: 神煞总论以生年纳音释身，须辨煞与本身的克临、生旺衰败及福神扶助；冲破合会可以转化福祸，吉凶神煞不可拘定。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1768
    end_line: 1770
  quote: '以上諸煞凡言尅身謂㓙煞下納音尅生年太歲納音臨身謂㓙煞帶太歲納音於本位也太歲納音為身若身被尅被臨於死敗絶位便遭不測之災若但在身有氣處被尅災重被臨則輕惟太歲納音尅煞則吉如人命已入貴格要處帶煞有福神助之則名為權柄無福神助之又煞氣乘旺遞互往還或刑尅

    本主下賤惡死又云一切福神所居之位則欲生旺生旺則榮貴一切煞神所居之位則欲死絶死絶則善終又云凡福神欲令得旺氣忌有敗之者凡㓙神欲令得衰氣忌有助之者又云相衝相破三合六合命中有之即求五行相得何如或禍中生福福中生禍如死絶復生空亡受破相尅相成則禍中生福反

    此則福中生禍命書云道途賤吏豈無驛馬攀鞍市井博徒亦有三奇夾貴子平云君子格中也犯七煞陽刃小人命内亦有正印官星由是觀之吉㓙神煞不可拘定輕重較量要在通變大抵㐫煞所居于神不宜帶真鬼尅傷本身雖見官星尚變為鬼况是真鬼其為災禍明矣'
  applicable_to: []
  caveats:
  - 克身是本段煞下纳音克生年纳音，不直接等同克日干。
  - 有官印或三奇禄马不保证贵，带七煞阳刃也不直接判贱；按原文条件分别记录。
  - 产品只记神煞落柱、不作主格主用为产品口径，不冒称本段逐字结论。
