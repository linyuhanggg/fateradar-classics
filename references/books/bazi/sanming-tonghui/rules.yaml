- rule_id: SANMINGTONGH-036
  kind: doctrine
  statement: 暗金的煞以四仲子午卯酉取巳、四孟寅申巳亥取酉、四季辰戌丑未取丑，分吟呻破碎白衣；旺相吉神救且入贵格原可无害。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1671
    end_line: 1676
  quote: '〔今選擇家以月取謂之紅煞日凡百皆㐫出行尤忌〕

    此三煞乃先天數之四衝也夫子午之數各九卯酉各六總為三十自子順行極三十而見已是為四仲之正煞寅申各七己亥各四總二十有二自子順行極二十二而見酉是為四孟之正煞辰戌各五丑未各八總二十有六自子順行極二十六數而見丑是為四季之正煞是起於數者然也凡神煞皆起於數

    與祿馬同類此一煞而有三名一曰吟呻二曰破碎三曰白衣子午卯酉在己寅申巳亥在酉辰戌丑未在丑巳者金生之地巳中臨官之火金氣臨尅主杖楚刑獄呻吟之災故曰吟呻酉者金旺之地煞物當時又有辛金相助萬物當之無不破碎主支離流血之災故曰破碎丑乃金之庫墓居四季而臨鬼門主

    妨害喪服哭泣之事故曰白衣五行中惟金能煞物故總名曰暗金的煞也其神生旺主人寛量大器決斷有為形容清峻若不夭喪刑傷須有癩病癱瘓死絶則慘害尅毒形容紅白巧言令色笑裏藏刀與官符併則横來官災與刼煞併則横來死喪與白虎羊刃併則流血傷殘與貴人建祿併則稍慢五行旺相

    吉神相救入貴格則無害入賤格再値一切㓙神則愈㓙又曰金生處主大風癱瘓之疾金旺處主水蠱毒藥之病金墓處主尅子惡死之憂若帶三刑徳貴主有高官持兵權大抵此煞不吉人命逢之固所不宜歲逢之亦主孝服哭聲盜賊侵擾口舌破耗小兒犯此湯火之厄不然身有痕疤破綻之象經云謬戾

    無過於刑害有時而吉乖違莫甚於衝破未必皆㓙此之謂也論災煞〔一名白虎煞余見申子辰全遇午方是白虎與災煞微不同〕'
  applicable_to: []
  caveats:
  - 旧摘要丑未取酉错误，应属四季取丑；本篇还区分择日以月取，不无据固定年日并查。
  - 原并神、旺衰及救应条件保留，没有必须刑冲引动才验的统一前提；不据标签断刑伤。
