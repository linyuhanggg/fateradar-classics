  kind: doctrine
  statement: 五行在十二时辰各有旺衰变化（如木旺于寅卯辰时、火旺于巳午未时等）；五行与地理方位（东南西北中）亦有分野吉凶。时辰定五行当前气数，地域分野作辅证。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4261
    end_line: 4261
  quote: 聖人得抱一之眞則無所不逹鬼神含得一之靈則變化無窮而隂陽之理精神之運歛散抑於一者所以為致一之命乃間世賢輔出羣大貴人也如年月日時胎五位納音四木一水四金一土之類一見於時或一金四水土一水四金土一見於年各有旺氣發越一路是也五位中年胎月俱丑而日上或時上
  applicable_to: []
