  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4582
    end_line: 4582
  quote: 夫招嫁不定者何也乃月令中有夫星透干與己相合己身從伏其夫星却無氣時引夫星或煞星却乘旺地來尅己身又從伏偏夫故謂之招嫁不定若夫星不旺或受尅制必嫁夫遲或嫁夫不明或夫不濟事或有外情如〔一命〕癸酉甲子己未乙亥己用甲為夫生於十一月失時不旺時逢亥字乃甲木長生是
