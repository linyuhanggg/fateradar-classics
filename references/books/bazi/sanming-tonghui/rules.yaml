    start_line: 3177
    end_line: 3177
  quote: 繼善篇又云財多身弱反為富屋貧人珞琭云大叚天元羸弱官吉不及以為榮縱鄧通鑄錢終身不富而餓死是也若月令得財局身衰逄印資助當作富論如先見印却怕見財獨步云先財後印反成其福先印後財反成其辱是也用財不宜明露柱見比刼則宜透出使人共見則不能奪賦云財宜藏藏則豐
