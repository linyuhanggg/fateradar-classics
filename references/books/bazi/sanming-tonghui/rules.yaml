  statement: 福德秀气格：合福德（天月德等）与秀气（学堂词馆等）为一体，主身份清贵；禄元互换格：年禄在日、日禄在年，互换为有情之象。
  anchor: null
  quote: 福德秀气格：合福德（天月德等）与秀气（学堂词馆等）为一体，主身份清贵；禄元互换格：年禄在日、日禄在年，互换为有情之象。
  applicable_to: []
  caveats:
  - 古法杂格，细则需对原文逐条核
  - 禄元互换尤需年日皆有禄位
