rules:
- rule_id: R-01
  kind: doctrine
  statement: 五行各有生数与成数（水一六、火二七、木三八、金四九、土五十）；命理依此分阴阳与配数。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1119
    end_line: 1119
  quote: 或問十干必隔六位一合何也余答曰天地之數各不過五上五位為生數下五位為成數生數與成數相遇然後合天一生壬地二生丁天三生甲地四生辛天五生戊地六成癸天七成丙地八成乙天九成庚地十成巳天一數見地二數然後合所以必隔六也易曰天數五地數五五位相得而各有合是也五
  applicable_to: []
  caveats:
  - 本规则属理论铺垫，不直接用于具体断命
  - 不可作为吉凶硬判依据
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-R-01
  kind: doctrine
  statement: 相生：木→火→土→金→水→木；相克：木克土、土克水、水克火、火克金、金克木。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4234
    end_line: 4234
  quote: 〔古歌曰〕生年遁數逄癸亥生月又遁見甲寅從日推之逄辛未此般格局有功名如陳右相癸已癸亥甲寅辛未為入格
  applicable_to: []
  caveats:
  - 单纯生克不等于吉凶
  - 需结合旺衰与喜忌
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-003
  kind: doctrine
  statement: 六十甲子各配纳音五行取象（海中金、炉中火、大林木、路旁土、剑锋金、山头火、涧下水、城头土、白腊金、杨柳木、泉中水、屋上土、霹雳火、松柏木、流下水、砂石金、山下火、平地木、壁上土、金箔金、灯头火、天河水、大驿土、钗钏金、桑柘木、柘榴木、大海水、石榴木、大海水），30组纳音以象喻命。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 175
    end_line: 175
  quote: 甲子金〔為寶物喜金木旺地進神喜福星平頭懸針破字〕
  applicable_to: []
  caveats:
  - 纳音在现代子平中已很少使用
  - 仅作古法源流参考，不参与格局判断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-004
  kind: doctrine
  statement: 六十甲子各有五行性质与吉凶倾向，如甲子乙丑海中金（藏而不露）、丙寅丁卯炉中火（炎上）等；可为年命/日柱论命提供甲子级判词。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 8189
    end_line: 8189
  quote: 〔交互有意如丙午見壬子各有所賴丙用癸官壬用丁財已官㸔餘神扶何者為急何者非急拱夾雖真如乙人遇癸未乙酉二位明見拱夾甲申之真官貴氣無疑或餘神埋藏火神倘遇嵗運見火見庚或見填實其位發禍何可勝言哉〕
  applicable_to: []
  caveats:
  - 六十甲子判词属古法年命体系
  - 现代子平以日干旺衰格局为主，甲子级判词仅作点缀
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: R-02
  kind: doctrine
  statement: 阳干顺行十二宫，阴干逆行十二宫；如甲长生在亥，乙长生在午（与寄生十二宫相配）。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1080
    end_line: 1080
  quote: 夫太嵗者乃一嵗之主宰諸神之領䄂其説有二如四柱中生年曰當生太嵗如逐年輪轉曰逰行大歳當生太嵗乃終身之主其理巳論於前其逐年太嵗逰行十二宫定一年之禍福為四時之吉凶經云太嵗乃衆煞之主入命未必為凶如逢戰闘之鄉必主刑於本命葢太嵗如君也大運如臣也如君臣和悦
  applicable_to: []
  caveats:
  - 阴干逆行说后世有争议
  - 与《滴天髓阐微》"阴阳同生同死"说冲突，需在 conflict-policy 中按问题类型选派
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-R-02
  kind: doctrine
  statement: 月令所藏天干分本气、中气、余气，按节气分日数分配司令；取格优先看本气透干，本气不透看中气、余气。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3218
    end_line: 3218
  quote: 財豐亦能旺官以財盛自生官運行旺相福禄俱臻一遇官鄉便可發福如柱中原帶官星便作好命看若兄弟輩出縱入官鄉發福必偏財月令所帶最重不宜柱中多逢年上偏財生旺月令柱中通氣主受伯叔祖考産䕃豐隆或外祖產業恩養大要日主興隆財星生旺運向財旺之鄉發福若見刑衝破害比
  applicable_to: []
  caveats:
  - 本气分配日数古今略有差异
  - 与《子平真诠》R2 互证，但日数细节以专精派 pack 为准
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-007
  kind: doctrine
  statement: 八字月柱以节气分界（立春、惊蛰…），不以朔望分界；节气前后须严格区分。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 908
    end_line: 908
  quote: 立節中氣其春秋有分而不言至夏冬有至而不言分及夫雨水驚蟄以降二十四氣分屬有名亦必有所以為名者何言乎四立者四時之節氣也丑之終寅之始則為節月之半則為中二分者隂陽相半之謂也二至者至有二義子至已為六陽午至亥為六隂至者介乎巳午亥子之間也冬至亥隂極故曰子
  applicable_to: []
  caveats:
  - 节气分界事实层
  - 必须由 `tool.bazi.paipan` 计算，不让 LLM 手算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-008
  kind: doctrine
  statement: 当令者旺、所生者相、生我者休、克我者囚、我克者死；命局以日干在月令的状态定基本旺衰。
  anchor: null
  quote: 当令者旺、所生者相、生我者休、克我者囚、我克者死；命局以日干在月令的状态定基本旺衰。
  applicable_to: []
  caveats:
  - 旺衰只是粗框架
  - 细致判断须追加 `bazi/ditiansui-chanwei`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-009
  kind: doctrine
  statement: 大运从月柱起；男阳女阴顺行，男阴女阳逆行；起运岁数按生时距前/后节气日数除三。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1012
    end_line: 1012
  quote: 傷本主無夀被形煞及生月日時者主損本氣破傷祖業六親冷淡蹇滯之命也月為運元行運從月建起若日時是本生年之福宜歸運元生旺處以扶助之故官印貴人禄馬財星宜在運元生旺處為佳若日時是本生年之禍宜歸運元剥尅處以潜濟之故土多窒塞宜歸運元疏通處水多泛濫宜歸運元歸
  applicable_to: []
  caveats:
  - 起运岁数为事实层
  - 必须由 `tool.bazi.paipan` 计算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-010
  kind: doctrine
  statement: 流年为太岁；命局与太岁冲、刑、合者皆有应；不限于值太岁、冲太岁。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1011
    end_line: 1011
  quote: 五十年若初限值禄馬貴神不犯空亡截路交退伏神便於初限進逹中限如初限便當中年成立末限如中限便當晚年享通是四柱中分三主三限可見當均重也又曰年為太嵗主人一生禍福如當生太嵗是金是木要日月時相生相應造化和順則根基牢固一生卓立成就若支干五行不順反尅衝破為
  applicable_to: []
  caveats:
  - 现代流派"犯太岁"包装多有夸大
  - 本书强调辨明冲、刑、合的具体类型，不一概而论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-011
  kind: doctrine
  statement: 大运与流年合参，看与命局喜忌的生克冲合；岁运并临往往应大事。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1091
    end_line: 1091
  quote: 夫太嵗者年中天子一嵗諸神煞之尊綂正方位廽送六氣遷運四時以成嵗功至尊無上若人遇尅衝壓伏皆為不祥之兆運者恊和二十四氣般運一生休咎扶持四柱輔弼三元運與流年二者相為表裏乃人命禍福死生所係嵗用天元運用地支凡行好運而日干傷流年天元為禍輕若行不好運及脱財
  applicable_to: []
  caveats:
  - 具体事件应期需配合神煞与十神
  - 具体事件层可叠加六爻 `divination/*`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-012
  kind: doctrine
  statement: 甲己合土、乙庚合金、丙辛合水、丁壬合木、戊癸合火。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 7884
    end_line: 7884
  quote: 凡命取五行真氣交互如辛亥金人得丁巳土有丁壬合真木往來有丙辛合真水往來丁巳土人得癸亥水有戊癸合真火往來有丁壬合真木往來如戊戌癸亥丁巳辛亥交互真氣全乃宰相命也戊午火得壬子木中有丁壬真木戊癸真火丙申火得乙酉水中有丙辛真水乙庚真金庚寅得己邜土中有甲
  applicable_to: []
  caveats:
  - 合不一定化
  - 化需化神当令且不被破
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-013
  kind: doctrine
  statement: 天干五合化气需化神当令、四柱有化神之根、不被冲克破合者方真化。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4111
    end_line: 4111
  quote: 謂年月日時胎再加年日禄馬或命宫合起十二支神更天干五位合全十干為貴如甲子丁卯戊寅辛酉戊午胎巳上安命之類余命壬午癸丑庚寅丙戌甲辰胎禄馬在申是也〔育吾自記〕
  applicable_to: []
  caveats:
  - 化气真伪是命理大变量
  - 不真化时仍按原五行论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-014
  kind: doctrine
  statement: 子丑合土、寅亥合木、卯戌合火、辰酉合金、巳申合水、午未合（土火）。
  anchor: null
  quote: 子丑合土、寅亥合木、卯戌合火、辰酉合金、巳申合水、午未合（土火）。
  applicable_to: []
  caveats:
  - 六合是否化亦受月令、四柱影响
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-015
  kind: doctrine
  statement: 申子辰合水局、亥卯未合木局、寅午戌合火局、巳酉丑合金局；三合局成时五行势力大增。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3552
    end_line: 3552
  quote: 如甲日生人柱無酉辛丑有卯多衝酉巳酉合丑為甲日正官喜壬癸生助忌酉辛塡實若止一卯字再有刑合起亦為好命乙日生人柱無申庚却有寅衝申子辰合拱或已刑出為乙正官喜壬癸生助忌申庚塡實戊日生人柱無卯乙却有酉衝卯亥未合卯戊得官星喜壬癸財丙丁印忌見卯乙巳日生人柱
  applicable_to: []
  caveats:
  - 三合需三支齐
  - 缺一为半合，效力打折
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-016
  kind: doctrine
  statement: 子未、丑午、寅巳、卯辰、申亥、酉戌相害；多主无情、不和。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 6569
    end_line: 6569
  quote: 己酉日甲戌時辰丑刑衝財源益進酉戌相害名利中平子月巳貴寅月官印行印運貴純乙酉年月頑暴〔一云〕孤獨離鄕
  applicable_to: []
  caveats:
  - 六害较冲、刑为轻
  - 不可独断凶
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-017
  kind: doctrine
  statement: 寅巳申无恩之刑、丑戌未持势之刑、子卯无礼之刑；辰午酉亥自刑。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1259
    end_line: 1259
  quote: 或曰三刑之法以數起之皇極中天十為煞數積數至十則畨空其數天道惡盈滿則覆故數自卯順至子子逆至卯極十數而為無禮之刑寅逆至巳巳逆至申極十數而為無恩之刑丑順至戍戍順至未極十數而為恃勢之刑七則衝十則刑六則合一理之自然也然寅巳申何以謂之無恩葢寅中有甲木刑
  applicable_to: []
  caveats:
  - 刑入命未必凶，需结合用神喜忌
  - 自刑较弱
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-018
  kind: doctrine
  statement: 子午、丑未、寅申、卯酉、辰戌、巳亥相冲；冲动、移动、变化之象。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1158
    end_line: 1158
  quote: 正月節   二月節   三月節
  applicable_to: []
  caveats:
  - 冲不一定凶
  - 冲喜用为凶，冲忌神为吉
  - 月柱冲影响最大
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-019
  kind: doctrine
  statement: 十干分配天文（甲雷、乙风、丙日、丁星、戊霞、己云、庚月、辛霜、壬雨、癸露）；十二支分配地理（子齐青州、丑吴越扬州等）。古法以天文地理取象配命。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 824
    end_line: 824
  quote: 子為墨池子在正北方屬水色象墨故有墨池之象凡命逢子年生者時喜見癸亥謂之水歸大海又謂之雙魚逰墨必為文章士矣
  applicable_to: []
  caveats:
  - 天文地理配干支属古法取象，现代仅作背景知识
  - 分野说已不符合当代地理区划
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-020
  kind: doctrine
  statement: 胎元取法：月干进一位、月支进三位（如甲子月→乙卯为胎元）；胎元代表先天根基，看命时可作辅助参考。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1023
    end_line: 1023
  quote: 夫胎者受形之始故易乾知太始以形言也月者成氣之時故傳曰積日為月以氣言也今談命或不以胎月為重殊不思胎月是四柱之根苗日時雖為若不犯破胎月或乘旺氣禄馬之處則為福尤多或日時之吉而為胎月所犯則吉亦歸無用是胎月最為樞要玉湖專論胎數良有以也今人多以法取胎元
  applicable_to: []
  caveats:
  - 现代八字排盘通常不排胎元柱
  - 胎元仅为古法辅助概念，不是必看项
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-021
  kind: doctrine
  statement: 坐命宫取法以月将加时辰推算得地支，再配天干；命宫辅助看命主根基与运势。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3666
    end_line: 3666
  quote: 〔珞琭子云〕將星扶德天乙加臨主本休囚行藏汨沒〔子平云〕月將德合逄日貴名登八座將星正月從亥上起運行十二月一月一宫湏照臺厯每月中氣後太陽過宫方為遇將六壬月將加時正此義也正月功曹二月大衝三月天罡四月太乙五月勝光六月小吉七月傳送八月從魁九月河魁十月登明十一
  applicable_to: []
  caveats:
  - 本书"坐命宫"与紫微斗数"命宫"取法不同，不可混用
  - 现代子平通常不排命宫
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-022
  kind: doctrine
  statement: 小运以时辰为起点，男阳女阴顺行、男阴女阳逆行，逐年推排；每一年一柱，用于辅助大运看年内细节。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4756
    end_line: 4756
  quote: 〔又曰〕小兒之命當論時辰為正先看關煞次看格局日主强財官旺有關無煞日主弱財官少常病易養日千弱財官多有煞有關難養夫關者何也即偏官為關偏財為煞專以日干為主取生成之數斷之關者譬如今之關隘乃險阻之地人至關非明文不敢私渡違者必致其禍小兒命犯此關則為不利柱中
