- rule_id: SANMINGTONGH-035
  kind: doctrine
  statement: 元辰冲前后法须分阳男阴女与阴男阳女，且有遇合反吉及子平原有七煞岁运复遇的另一解释，不能只用固定年支对照判损耗。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1662
    end_line: 1667
  quote: '〔屬毛頭星一名大耗〕

    元辰者别而不合之名陽前陰後則有所屈屈則於事無所伸陰前陽後則直而不遂於事暴而不治難與同事故謂之元辰是以陽男陰女在衝前一位支辰陰男陽女在衝後一位支辰假如甲子生男與甲午對衝即乙未為正乙丑生男與乙未對衝即甲午為正餘干午未半之所以為㐫者當氣衝之地左鼓

    則風煞在右右鼓則風煞在左故陰陽男女取衝前衝後不同若歲運臨之如物當風動摇顚倒不得寧息不有内疾必有外難雖富貴崇高勢位炎盛大運逢之十年可畏立朝定當竄逐居家必罹㓙咎縱有吉神扶持不免禍福倚伏尤忌先吉後㓙臨旺之後欲出未出之際㓙禍尤的生命逢之主形骸陋朴面

    有顴骨鼻低口大眼生威角腦凸臋高手脚強硬聲音沉濁生旺則落魄大度不别是非不分良善顚倒鶻突死絶則寒酸薄劣形貌猥下語言渾濁不識羞辱破敗坎坷貪飲好情甘習下流與官符併多招無辜之撓帶刼煞則不循細行動招危辱窮賤無耻婦人得之聲雄性濁奸滛私通奴賤鬼魅為憑不遵禮

    法一生多災雖生子抝而不孝常術鼠忌羊頭歌未分男女不足憑也珞琭子以宣父畏其元辰林開以元辰惡煞為災甚重有互換遇者尤為不吉忽然遇合又以吉論洞𤣥經云元辰遇合而大亨是也廣信集取巫伋參政己卯甲申己巳甲戌滕康樞密乙丑壬午乙丑壬午二命豈不犯元辰李吉甫曰大凡貴命

    須逢煞即得君王横升拔林開一偏之見也徐子平云元辰者命中元有所害之辰如甲見申庚乙見酉辛之類人生歲月日時原有七煞已為所害之辰歲運復遇謂之犯元辰為害尤重元無則輕然元辰一煞與亡刼羊刃空亡同類觀珞琭子消息賦自見雪心賦云元辰水去亦指神煞之名是古人之說是也'
  applicable_to: []
  caveats:
  - 阳男阴女冲前一位，阴男阳女冲后一位；原例甲子男乙未、乙丑男甲午。
  - 作者批评不分男女的旧歌，并举巫伋滕康反例；身体品行及灾病旧断不作现实事实。
