- rule_id: SANMINGTONGH-034
  kind: doctrine
  statement: 德秀按月支三合组分别取德干和秀干，须无破冲克压，并考察学堂财官扶助；不能据单一德秀标签判定容貌品性。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1512
    end_line: 1513
  quote: '夫徳者本月生旺之徳秀者合天地中和之氣五行變化而成者也又曰徳者陰陽解㐫之神秀者天地清秀之氣四時當旺之神故寅午戌月丙丁為徳戊癸為秀申子辰月壬癸戊己為徳丙辛甲己為秀己酉丑月庚辛為徳乙庚為秀亥卯未月甲乙為徳丁壬為秀凡人命中得此徳秀無破衝尅壓者賦性聰

    明溫厚和氣若遇學堂更帶財官主貴衝尅減力'
  applicable_to: []
  caveats:
  - 申子辰德含壬癸戊己、秀含丙辛甲己，不仅壬癸。
  - 冲克减力是原文明确限制，原己酉丑疑字保留。
