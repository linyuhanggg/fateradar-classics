  kind: doctrine
  statement: 时逢生印（时上印绶，晚年得印护身，需区分正印/偏印，偏印夺食为忌）；胞胎逢印绶（胎元得印，根基深厚，现代多用月柱替代胎元）。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3303
    end_line: 3303
  quote: 如甲日子時取子中癸水為印資助日主其人足智多謀安享食禄年月上要見辛官生印運行西北官印乃為貴命若柱逢戊巳土重更有午字衝破運厯東南官印衰絶百事無成公吏肆市人也
