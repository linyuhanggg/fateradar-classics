- rule_id: SANMINGTONGH-104
  kind: doctrine
  statement: 大运入墓为收藏、转变之期，非必凶；身强入墓伏藏（收敛），身弱入墓得藏（安稳）；墓运过后复出则有新局。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 8167
    end_line: 8167
  quote: 〔財官之氣均停有拱更加貴氣於上爲吉爲庫庫中雜氣有三件若當旺相為貴益我者妙若官化鬼入墓財神休囚入墓為凶則不為庫若吉神入庫仍帶休廢來刑且尅我者亦非庫〕
  applicable_to: 
