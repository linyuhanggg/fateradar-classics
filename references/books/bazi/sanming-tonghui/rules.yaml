- rule_id: SANMINGTONGH-027
  kind: doctrine
  statement: 以日柱所属旬定旬空（甲子旬空戌亥…）；空亡入命主无依、有变。
  anchor: null
  quote: 以日柱所属旬定旬空（甲子旬空戌亥…）；空亡入命主无依、有变。
