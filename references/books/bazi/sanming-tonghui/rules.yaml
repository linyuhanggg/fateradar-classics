  verified_at: null
- rule_id: SANMINGTONGH-032
  kind: doctrine
  statement: 学堂词馆篇并列纳音长生学堂、临官词馆及会禄会食等法，后引子平日干长生与四生支说；须分法考察得气、空亡、冲破及扶助。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1474
    end_line: 1492
  quote: '夫學堂者如人讀書之在學堂詞館者如今官翰林謂之詞館取其學業精專文章出類長生乃學堂之正位如金命見辛巳金長生在巳辛巳納音又屬金是也臨官乃詞館正位如金命見壬申金臨官在申壬申納音又屬金是也餘以類推壺中子云文星入命笑班馬之無才註云乙亥丁巳為文星是取木火

    長生臨官之義重木火者發焰紅綠文章之象也或以納音論火包而不包惟乙亥得之土包而不包惟丁巳得之恐未然閻東叟謂年月日時有甲乙丙丁分處四位相連不斷青赤為文章如甲寅乙亥丁酉丙申甲子丙寅甲寅丙寅之類主文彩異衆玉霄寶鑑則以木金火全赤白成章如丙寅見己亥辛巳取

    丙寅火己亥木辛巳金皆坐長生之地主詞翰秀頴又以申子辰全見丙如丙子人丙寅月丙辰日丙申時丙為眞水申子辰水之正位干支全見之有金則貴無金亦主學海波深鬼谷要訣又云戊己重重兩位帶旺兼元祿如戊子人見戊午戊戌己未己酉主文章燦爛

    諸家說有學堂會祿如金長生已臨官申甲乙人得之水土長生申臨官亥丙丁壬癸人得之木長生亥臨官寅戊己人得之火長生寅臨官己庚辛人得之又名官貴學堂以官貴長生之位為學堂官貴臨官之位為詞館也

    有學堂會食如甲食丙得丙寅乙食丁得丁巳丙食戊得戊申之類兼官印驛馬其福厚遇祿貴奇徳其氣清値刑尅衝破其氣濁清則科名巍峩厚則官尊榮顯濁則福祿微薄官職卑賤

    有生處見尅如甲乙人辛亥丁丙人壬寅戊己人甲申庚辛人丁巳謂之官星學堂主登科甲入侍從

    有納音見帝旺之位而逢天乙貴處其上如己酉人得丙子庚子日時壬午人得辛卯日時之類謂之學堂會貴主清貴

    凡學堂詞館切不要犯空亡及衝破支干納音不要見尅方為得用祝勝經云甲辰丙寅學堂不眞或止富蔭官職卑貧讀書修學空有虛名此言學堂怕落空也三車云學堂無氣惟利師儒此言學堂要乘旺也理愚歌云學堂如更朝驛馬位極勲高壓天下此言學堂要有馬也又云生來祿馬眞學堂若同詞館

    主文章遇中不遇人誰會不遇衝尅福祿昌又云文星聚處人中瑞聲華獨冠英雄輩降生不遇眞學堂才學豈能為拔萃此言學堂怕衝破受尅也况人命入格合造化又不在學堂詞館而得

    子平云學堂者天地陰陽清秀之氣五行長生之神乃甲見亥乙見午等例或月時一位見者即是不必兼全更帶天乙貴如丁日酉時或酉月之類讀書人遇之主聰明智巧高科文翰更引用得地無尅壓之神及逢徳秀冠世儒業與命中財帛印食相為表裏經云生氣學堂冠世文章富貴又云學堂不必專論

    官星文章不必專論印綬古人以長生學堂取生氣就學之義不必專論日干但柱中帶寅申己亥便為有學此四宮聚天地間至清之氣其中有四驛馬四刼煞皆是生發之意子午卯酉為四敗其氣濁辰戌丑未為四庫其氣雜且如月候到寅申巳亥便不寒不熱風氣自然清雅溫和凡占年月者最有力日干

    自得長生却不喜在月令如月令見之運順行便交沐浴如八字不帶學堂到五七歲却交日干長生運亦有文學雖非通儒却未至全不識字若八字不見最忌五七歲交敗死二運縱有嚴師也難訓化命帶二様學堂俱怕自刑尅壞但有刑衝破損讀書便不成重見雖不妨一衝終不純粹

    又曰人命不喜十分財盛財是厚濁之物一見便要貪好喪人心志柱中若先有官星以抑禀氣之偏亦性情執古不能通變若財盛而無官星便渾濁不清縱富貴亦愚古歌云五行生處為學堂陰陽順逆要推詳引旺有倚文學貴如逢尅壓不為良註云學堂上帶鬼為尅壓凡有科名命自是五行清粹學堂驛

    馬生旺於金水之上三奇華蓋類萃於日時之中或刑衝生旺水火相生福神聚時天元不戰皆主清譽巍科

    又曰甲辰一旬十二位謂之魁星一旬中又取出甲辰丁未庚戌癸丑四位以甲木旺於東方丁火旺於南方庚金旺於西方癸水旺於北方取逐方旺氣加於辰戌丑未之上以為眞魁星凡人命甲辰至癸丑一旬俱在日時上無不及第兩三位者必中前名又云丁亥辛卯庚戌為魁星日時遇者多占解省殿魁

    又四柱内兩見干合謂之歲首星子生人在子以命建之月謂之歲窠主詞學豐贍科名顯赫又寅申巳亥四位大愛本年遁起四位為魁星如癸巳人從寅上遁起甲寅丁巳庚申癸亥又如丁卯人從寅上遁起壬寅乙巳戊申辛亥是也餘准此例

    凡命金土乘秀氣金木乘秀氣火木乘秀氣水木乘秀氣皆主科名秀氣者月令中秀氣也大凡支干有氣乘月令秀氣皆主及第之命古歌曰日旺提綱火明木秀金白水清重叠土金既濟水火遞互丙丁根苗天乙相涵金水是也又木春生逢食傷財印兩輕官煞重煞重身輕逢印綬魁星官煞分明奇亦登科

    之命及第之年也壺中子云馬兼財合秦廷獻一鶚之書官共祿迎禹門透三級之浪註云行年驛馬與見生驛馬衝而不合又見天財文星之類其人必發合則必不發也遇官與祿則須成不遇官與祿止發而已又云凡舉人了當年大要太歲與月建相和作福其餘甲戊庚乙丙丁之類皆不定只以行年太歲

    與本生月建參而推之又云須是大運在官位又太歲帶正印或正天乙或本家祿是及第之年也'
  applicable_to:
  - key: shensha
    value: 学堂
  caveats:
  - 甲亥乙午是学堂长生例，不能用于统一定义词馆。
  - 首段纳音同类配柱与后文日干/四生取法不同，不能用单一查表替代整篇。
  - 科名不专凭学堂词馆；保留甲辰一旬十二位等疑文，不作学业预测。
