    start_line: 3217
    end_line: 3217
  quote: 何謂偏財乃甲見戊乙見巳之例非妻所帶乃衆人之財也切忌有姊妹兄弟分奪柱無官星禍患百出經曰偏財好出亦不懼藏唯怕分奪及落空亡有一於此官將不成財將不住如財弱必待厯旺鄉而榮財盛無往不利但恐身勢無力不能勝任偏財格主人慷慨不甚吝財與人有情而多詐若是得地不止
