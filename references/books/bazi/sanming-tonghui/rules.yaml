- rule_id: SANMINGTONGH-097
  kind: doctrine
  statement: 八专日（甲寅、乙卯、丁未、己未、庚申、辛酉、壬子、癸丑）日坐禄旺之地，身强为论；以月令它格为用。
  anchor: null
