  statement: 正官诸子格：天福贵人（官星得福神护）、天元作禄（日坐禄，身强官得用）、岁德正官（年柱正官，祖上官贵）、时上正官（时柱正官，晚来得贵）。共性为官星在特定柱位得用，忌伤官克破。
