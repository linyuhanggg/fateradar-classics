- rule_id: SANMINGTONGH-030
  kind: doctrine
  statement: 天上三奇甲戊庚、地下三奇乙丙丁、人中三奇壬癸辛；三奇入命需顺排不杂（天干连续）方为真，主特异才能。
  anchor: null
  quote: 天上三奇甲戊庚、地下三奇乙丙丁、人中三奇壬癸辛；三奇入命需顺排不杂（天干连续）方为真，主特异才能。
  applicable_to: []
  caveats:
  - 三奇贵人条件苛刻（需顺排+不杂+不逢冲破）
  - 八字三奇≠奇门三奇（乙丙丁）
  - 现代以格局为主，三奇为点缀
  school: null
  verified: false
  verified_by: null
  verified_at: null
