- rule_id: SANMINGTONGH-030
  kind: doctrine
  statement: 三奇篇并列乙丙丁、甲戊庚诸说，名称与顺逆取舍有分歧；须另论得体、得地、昼夜、贵神扶助及冲破，不能仅凭三干齐全定为有效贵格。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1432
    end_line: 1440
  quote: '珞琭子曰奇為貴也奇者異也謂物以貴為奇也乙丙丁出於貴人干徳配支之妙陽貴甲徳起子則乙徳在丑丙徳在寅丁徳在卯三干相連而無間陰貴甲徳起申乙在未丙在午丁在己三間相聯而無間以其隨貴人在天故曰天上三奇十干惟此為異餘則或間羅網或間天空或不重臨又不相聯不可以

    為奇玉霄寶鑑謂古人以正月為歲之始日出於乙故以乙為日奇老人星見為瑞見於丁位故以丁為星奇月照夜到丙位而天下明故以丙為月奇若甲戊庚亦以為天上三奇以甲戊庚俱臨丑未乃貴人家在斗牛之次出乎井鬼之舍先後天起貴而三干適臨之與别干不同其理亦通三車一覽以甲為陽

    木之魁戊為陽土之君庚為陽金之精地有此三物為奇謂之地三奇其說則鑿太乙經以辛壬癸為水奇謂之人間三奇其說無據但辛壬癸天干連珠謂之三台亦為難得紫虛局又有四奇之說夫奇奇數也四則偶矣謂之奇可乎三奇要順布不欲倒亂如乙丙丁甲戊庚天干年月日時順布為吉廣錄又以

    乙人丙月丁時是乙生丙丁秀氣下降主平常若乙時丙日丁年是秀氣上達反為貴似又不論順逆甲戊庚却以順者為貴逆者福慢亂者不壽氣清則貴氣濁則富經曰五行各有奇儀須分逆順若日月倒亂得順三奇亦不謂倒命有三奇要得體得地不欲失時如乙丙丁夜生甲戊庚晝生得體乙丙丁柱有

    亥則三光有所依附甲戊庚柱有申則三物有所憑藉或乙丙丁得丑寅卯未午巳甲戊庚得丑未全皆為得地三奇再遇三合如乙丙丁得金木局甲戊庚得水火局又遇六儀甲子旬戊甲戌旬己甲申旬庚甲午旬辛甲辰旬壬甲寅旬癸俱吉珞琭子云重犯奇儀蘊藉抱出羣之器遁甲曰順布三奇逆六儀如

    命出甲子甲申二旬而遇甲戊庚是重犯奇儀也

    凡命遇三奇主人精神異常襟懷卓越好奇尚大博學多能帶天乙貴者勲業超羣帶天月二徳者㓙災不犯帶六儀者才智出類帶三合入局者國家柱石帶官符刼煞者器識宏遠帶空亡生旺者脫塵離俗富貴不淫威武不屈値元辰咸池衝破天羅地網者為無用論三奇太歲不帶而月日時帶者孤獨詩曰

    順十干神乙丙丁神童及第播聲名日時祿馬公卿煞換武除文佐聖明又曰順十干神甲戊庚兼得長生兩府名若然無祿兼無馬只是財中蓄積人又曰三奇須是重逢貴方是榮華福壽人只有空奇無貴地貧窮下賤被欺陵又曰乙丙丁甲戊庚上局相生生復生不是蓬萊三島客也應金殿玉階行又曰欲

    識嵓廊官赫奕名仙多誕癸壬辛三奇玉籍傳消息輕薄時師莫與評 合諸詩觀三奇喜忌見矣'
  applicable_to: []
  caveats:
  - 正文以乙丙丁为天上三奇，亦认可甲戊庚天上说；批评甲戊庚地三奇及辛壬癸人间三奇说，不应写成统一天地人表。
  - 先主顺布，后引广录乙时丙日丁年反贵并指出似不论顺逆；末诗癸壬辛与前文辛壬癸及其评价分歧保留。
  - 乙丙丁夜生、甲戊庚昼生及得地、并贵、冲破等条件分别审视；才智贵贱为历史主张，未验证实际效果。
  - 本条为八字篇章的文献归纳，不直接改动奇门三奇运行规则。
