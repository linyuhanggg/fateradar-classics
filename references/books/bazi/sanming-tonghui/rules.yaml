    start_line: 3815
    end_line: 3815
  quote: 甲乙日生亥卯未月時逄寅卯丙丁日生寅午戌月時逄巳午戊巳日生巳午月時逄辰戌丑未庚辛日生已酉丑月時逄申酉壬癸日生申子辰月時逄亥子得此為主本得地歸方就局倚勢自强主人身健一生自要安居遠害退身避位名輕利薄去塵脱俗人也若甲乙人在寅卯丙丁人在巳午之類為五行
