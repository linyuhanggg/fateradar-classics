- rule_id: SANMINGTONGH-076
  kind: doctrine
  statement: 小儿/少年命局冲战过重、关煞重、五行偏枯至极，古法断为横夭。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4565
    end_line: 4565
  quote: 夫横夭少年者造化之窮絶格局之變異也有懸梁溺水血産少亡被人殺死若此者何乃身弱而遇煞重煞多尅身又帶刑衝破敗之類或命中元有官星受傷行運復遇官鄉或無官見傷運復臨官之類或帶刃無制運行合刃之地及亡神刼煞等類此皆横夭類也不獨女命有之男命亦同如〔一命〕丁夘癸丑
