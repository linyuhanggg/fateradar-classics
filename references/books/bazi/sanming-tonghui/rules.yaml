    start_line: 3311
    end_line: 3311
  quote: 經云棄印就財明偏正印綬忌財此理甚明正印居月令者决不可見財若居年時月令見財只用財格喜印生身敵財為福若偏印月令年時見財無妨為棄印就財捨輕用重如壬生申月丙生寅月坐長生之地年時得財即身旺喜見財地如此造化必主棄祖基而自創别業立身
  applicable_to: []
