  kind: doctrine
  statement: 遥合取贵类杂格（子遥巳禄、丑遥巳禄、冲合禄马、虎午奔巳、羊击猪蛇）的共同原则：日柱通过遥合、冲合等方式获取远在它支的禄（临官）或马（驿马）或财官；成立条件为遥合不破、禄马不被克冲。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3527
    end_line: 3527
  quote: 〔喜忌篇云〕甲子日再遇子時畏庚辛申酉丑午此格以甲子日甲子時甲以辛為官二子中癸水能遥合巳中戊土戊來合癸畏子上甲木尅制不敢來合戊與丙同居巳宫丙戊為父子戊動丙亦動丙却與酉中辛相合來尅甲木甲日得官星戊方得合癸是謂巳酉丑三合㑹起官星局年月大怕有午衝子丑絆
