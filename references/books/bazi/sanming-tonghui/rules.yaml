  verified_at: null
- rule_id: SANMINGTONGH-012
  kind: doctrine
  statement: 十干五合所配化气为甲己土、乙庚金、丙辛水、丁壬木、戊癸火；有组合不等于条件已经满足。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1130
    end_line: 1134
  quote: '東壬子 至丁巳六數 故丁與壬合 丁壬化木甲徳綂龍

    南戊子 至癸巳六數 故戊與癸合 戊癸化火丙徳綂龍

    西庚子 至乙巳六數 故乙與庚合 乙庚化金庚徳統龍

    中甲子 至己巳六數 故甲與巳合 甲己化土戊徳統龍

    北丙子 至辛巳六數 故丙與辛合 丙辛化水壬徳統龍'
