- rule_id: SANMINGTONGH-061
  kind: doctrine
  statement: 倒食即偏印；用食神时忌偏印克食。有制合时可不害食，柱中无食时只以偏印论。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3316
    end_line: 3318
  quote: '倒食即偏印之謂一名吞啖煞食神最忌見之如甲生丙火為食火能生土為甲之財財旺生金為甲之官食神生旺財官備矣今甲見壬為倒食者壬旺則尅了丙火丙被尅去不能生土甲無財矣壬合起丁傷甲之辛甲無官矣壬尅去丙庚煞得安來傷甲木甲生災矣所謂用食忌見者此也凡命帶倒食福薄

    夀夭若有制合如甲日見壬辰壬戌辰戌中有土制丁合乙日見癸未癸丑丑未中有巳制癸丙日見甲申丁日見乙巳乙酉戊日見丙子丙申丙辰己日見丁亥庚日見戊寅戊辰辛日見己卯己亥壬日見庚午庚戌癸日見辛巳辛未此等偏印不能為食害有尅制故也柱中身旺財官俱生可取為福助身陽日

    逢之能暗合傷官生財隂日逢之能暗合財星柱中無食只以偏印論又曰凡命有食遇梟猶尊長之制我不得自由作事進退悔懶有始無終財源屢成屢敗容貎欹斜身品小膽怯心虗凡事無成尅害六親㓜時尅母長大傷妻子賦云倒食者名為偏印號曰梟神值身旺而財豐福厚遇刑煞則夀夭身貧財星'
  applicable_to:
  - key: shishen
    value: 食神
  - key: shishen
    value: 偏印
  - key: geju
    value: 偏印格
  - key: rizhu_strength
    value: 中弱
  - key: rizhu_strength
    value: 偏弱
  - key: rizhu_strength
    value: 极弱
  caveats:
  - 不能仅凭偏印或食神单独出现即断倒食成立。
  - 需核对食神是否为用、偏印能否克食及制合条件。
  - 原文的寿夭与性情断语不作为现代健康、人格结论。
  school: null
  verified: false
  verified_by: null
  verified_at: null
