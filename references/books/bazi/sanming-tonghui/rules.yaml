- rule_id: SANMINGTONGH-094
  kind: doctrine
  statement: 子午双包格：命局子午对冲而各有包裹得宜（如子被丑合包裹、午被未合包裹）；冲中有合、动中有制则为贵。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 10102
    end_line: 10102
  quote: 者孤支干刑害者疾用神休囚者難求富貴秀氣淺薄者多是藝術刑尅互見身旺定作軍徒辰戌相加有損斷為獄吏金水閒慢落魄清貧之人驛馬衝擊馳驅紅塵之客魁罡重犯生於屠宰之家酉戌重逢身作奴僕之下柱中子午雙包尊居垣省命内干支一氣貴至王侯一片純陽獨尅命不死也傷滿盤印
  applicable_to: []
