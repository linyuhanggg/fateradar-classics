  statement: 拱禄拱贵格：两柱之间虚夹一位为禄（临官）或贵人（天乙贵人），虚而实应为贵；冲禄格：禄位被冲则动，动而有得（喜冲忌神得禄）。忌填实则拱破，忌冲喜用。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1393
    end_line: 1393
  quote: 天乙者乃天上之神在紫微垣閶闔門外與太乙並列事天皇大帝下遊三辰家在己丑斗牛之次出乎己未井鬼之舍執玉衡較量天人之事名曰天乙也其神最尊貴所至之處一切㓙煞隱然而避通𤣥經云先天坤在北方子位陽貴起先天之坤乃從子上起甲干甲徳在子甲與己合不取甲徳而取合氣故己
  applicable_to: 
