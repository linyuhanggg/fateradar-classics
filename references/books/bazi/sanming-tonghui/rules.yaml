  statement: 太极贵人取法以日干年干查地支（甲乙见子午、丙丁见卯酉等）；主智慧、玄学、学术天赋。
  anchor: null
  quote: 太极贵人取法以日干年干查地支（甲乙见子午、丙丁见卯酉等）；主智慧、玄学、学术天赋。
  applicable_to: []
  caveats:
