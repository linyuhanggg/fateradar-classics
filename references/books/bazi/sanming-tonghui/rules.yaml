- rule_id: SANMINGTONGH-103
  kind: doctrine
  statement: 时逢生印（时上印绶，晚年得印护身，需区分正印/偏印，偏印夺食为忌）；胞胎逢印绶（胎元得印，根基深厚，现代多用月柱替代胎元）。
  anchor: null
  quote: 时逢生印（时上印绶，晚年得印护身，需区分正印/偏印，偏印夺食为忌）；胞胎逢印绶（胎元得印，根基深厚，现代多用月柱替代胎元）。
  applicable_to: []
  caveats:
  - 胞胎（胎元）为古法概念，现代八字排盘通常不含胎元柱
  - 时印需看是否构成倒食（偏印夺食）
