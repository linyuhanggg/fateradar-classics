  quote: 主健財禄堪圖刼煞不宜行旺地食神最妙偏財鄉女命傷官歸禄得之極吉男造羊刃身弱遇之為竒金神建禄欄义女命逢之最忌羊刃傷官七煞男子遇之得權金神入火逢煞刃貴而無疑煞重有印逢食傷榮而有凖正官正印官居不顯羊刃七煞出仕馳名身旺無依僧道之軰桃花滚浪娼婢之流金弱
