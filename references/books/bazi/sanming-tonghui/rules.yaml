- rule_id: SANMINGTONGH-037
  kind: doctrine
  statement: 灾煞取三合局将星的对冲位：申子辰午、寅午戌子、巳酉丑卯、亥卯未酉；须分克身与官印生旺福神扶助，不能称三合沐浴位。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1676
    end_line: 1678
  quote: '無過於刑害有時而吉乖違莫甚於衝破未必皆㓙此之謂也論災煞〔一名白虎煞余見申子辰全遇午方是白虎與災煞微不同〕

    災煞者其性勇猛常居刼煞之前衝破將星謂之災煞如申子辰將星在子午却去衝子寅午戌在午子却去衝己酉丑在酉卯却去衝亥卯未在卯酉却去衝是災煞也神白經云類水逢星照虛空怕日煙庚辛夏蠋戰木不引雞眠四柱交加見福少禍連綿此煞主血光横死在水火防焚溺金木杖刃土墜落瘟

    疫尅身大㓙若有福神相助多是武權亦如刼煞之類要見官星印綬生旺處為佳神白經云災煞畏乎尅生處却為祥正謂此也'
  applicable_to:
  - key: shensha
    value: 灾煞
  caveats:
