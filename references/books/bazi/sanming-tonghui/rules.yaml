    start_line: 1068
    end_line: 1068
  quote: 丙丁巳午運名傷官運主尅子女訟事囚繫庚辛申酉運七煞官鄉主得名發越太過則災病惡疾壬癸亥子生氣印綬運主吉慶增産辰戍丑未戊巳財運主名利皆通此乃死發須隨格局喜忌推之干旺宜衰運正所謂干弱則求氣旺之藉有餘則欲不足之營須要通變更兼流年諸神煞推之其驗如神
