    start_line: 8793
    end_line: 8793
  quote: 〔崇者卑之反竒者耦之對物以積而高高之為崇在五行上生下是也物以無與耦之為竒在五行異而乃羣是也將星月将也德天月德也天乙貴神也生年為本生日為主休囚對生旺言人命年月日時四柱有五行上生下有三竒乙丙丁更帶將星德貴主本生旺得地所謂吉將交臨而福臻成慶此為至貴
  applicable_to: 
  - key: shensha
    value: 学堂
  caveats:
  - 古法杂格，细则需对原文逐条核
  - 禄元互换尤需年日皆有禄位
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-094
  kind: doctrine
  statement: 子午双包格：命局子午对冲而各有包裹得宜（如子被丑合包裹、午被未合包裹）；冲中有合、动中有制则为贵。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 10102
    end_line: 10102
  quote: 者孤支干刑害者疾用神休囚者難求富貴秀氣淺薄者多是藝術刑尅互見身旺定作軍徒辰戌相加有損斷為獄吏金水閒慢落魄清貧之人驛馬衝擊馳驅紅塵之客魁罡重犯生於屠宰之家酉戌重逢身作奴僕之下柱中子午雙包尊居垣省命内干支一氣貴至王侯一片純陽獨尅命不死也傷滿盤印
  applicable_to: []
  caveats:
  - 子午冲为最强之地支冲
  - 有制化方可取贵，冲而无制仍为凶
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-095
  kind: doctrine
  statement: 六神兽格（青龙=木、白虎=金、朱雀=火、玄武=水、勾陈=土）为五行配六神的取象法；各神兽对应五行须在命局成形（三合或方局）且格局清纯不破方为贵。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 670
    end_line: 670
  quote: 五行皆賴土也推其形色則水黑火赤木青金白土黃此正色也及其變易則不然常以生旺從正色〔當生旺則正氣全可見正色〕死絶從母色〔水者木之母死絶則黑木者火之母死絶則青火者土之母死絶則赤土者金之母死絕則黃夫五行死絕則氣歸根見母之色凡人遇苦楚而呻吟母者乃其義也〕成形
  applicable_to: []
  caveats:
  - 六神兽格属古法取象，不作现代八字主线结论
  - 本质上可归入五行专局格（曲直/从革/炎上/润下/稼穑）的变体
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-096
  kind: doctrine
  statement: 还魂借气格：命局借他柱之气为己用（如枯木逢水得生），日主衰弱而有情生扶者可借气还魂；借气来源须有情不破。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3789
    end_line: 3789
  quote: 五行自死絶而有救相還者如木絶在申而遇甲申金絶在寅而遇戊寅之類最吉有福神次之無則下
  applicable_to: []
  caveats:
  - 借气非原气，行运变则格局随之而变
  - 最忌借气来源被冲合
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-097
  kind: doctrine
  statement: 八专日（甲寅、乙卯、丁未、己未、庚申、辛酉、壬子、癸丑）日坐禄旺之地，身强为论；以月令它格为用。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 9713
    end_line: 9713
  quote: 〔支干同類如甲寅乙卯丙午丁未庚申辛酉壬子癸丑戊午己未戊戌己丑是也行運會煞必主不祿以其恃強與煞相争煞竟尅身故也〕
  applicable_to: []
  caveats:
  - 八专日身强需看是否过旺无制
  - 过旺需食伤、财、官为用
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-098
  kind: doctrine
  statement: 土局润下（土遇水局，克中有生）；金白水清（金水相生，主聪明）；木火交辉（木火通明，主文采）；火金铸印（火炼金成器，主权威）；火土夹杂（火土过燥需水润）。五者皆属两五行配合的特殊格局。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3843
    end_line: 3843
  quote: 〔賦云〕戊巳居於潤下萍梗他鄉此象乃戊申戊子戊辰三日生於申子辰壬癸水旺之鄉非特貧賤奔波合主四肢眼目疾或惡瘡膿血而死辰戌丑未運應其餘土虛逄水局皆漂流之命若目旺之土在水局富貴行火鄉發逹如戊辰甲子戊申乙卯是土虛逄潤下故主日疾為軍辛未庚子戊辰壬子土從衆水
  applicable_to: []
  caveats:
  - 此五格为五行搭配而成的特殊取象，不属标准八格
  - 金白水清、木火交辉在实务中可作搭配参考但不宜独断格局
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-099
  kind: doctrine
  statement: 辰戌丑未墓库遇七煞为墓煞；墓煞凶中藏变，有制化（食神制煞或印化煞）则可转凶为吉。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 8957
    end_line: 8957
  quote: 宅墓受煞落梁塵以呻吟喪弔臨人變宫商為薤露〔命前五辰為宅命後五辰為墓煞刼煞灾煞歲煞也命前二辰為喪門命後二辰為弔客人人元也古之善歌者有遶梁之聲善唱者合宫商之曲今易以呻吟愁嘆變為薤露挽歌則喪弔臨門宅墓受煞故也其或太歲凶煞臨併大小運限刑衝必致凶禍切宜
  applicable_to: 
  - key: shishen
    value: 食神
  caveats:
  - 墓煞非必凶
  - 墓库本身为收藏转化之地，与煞相遇只是凶象增重，制化得力则可解
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-100
  kind: doctrine
  statement: 四位纯全（四柱干支同气纯一）与一气生成（四柱地支顺连如寅卯辰巳）皆为专一格局；纯全太过则偏枯，一气顺连为美、逆乱则破。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3892
    end_line: 3892
  quote: 〔即四位純全如天干同類為天元一氣如支神一字為地物相同三格併論〕
  applicable_to: []
  caveats:
  - 纯全格在现代较少见
  - 一气生成顺连者更接近五行专局（如寅卯辰=曲直），可直接归入对应专局格
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-101
  kind: doctrine
  statement: 背禄逐马（禄被背不得、马被逐失势）为古法凶断；十干十二年生大贵人例为十干各年大贵人的枚举配合。
  anchor: null
  quote: 六甲年〔丁卯〕月〔乙未〕日〔戊寅〕時   六乙年〔己卯〕月〔甲戌〕日〔乙亥〕時六丙年〔庚寅〕月〔丁巳〕日〔丙午〕時   六丁年〔丙午〕月〔壬辰〕日〔丁未〕時六戊年〔壬戌〕月〔己丑〕日〔戊寅〕時   六巳年〔辛未〕月〔己未〕日〔丙寅〕時六庚年〔甲申〕月〔庚申〕日〔辛巳〕時   六辛年〔丙申〕月〔庚午〕日〔辛巳〕時六壬年〔辛亥〕月〔壬辰〕日〔丁未〕時   六癸年
  applicable_to: []
  caveats:
  - 背禄逐马为古法凶断，需结合整体格局复核不可独断
  - 大贵人例属枚举型古法，现代作趣味参考
  school: null
