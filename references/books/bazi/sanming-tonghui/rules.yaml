  statement: 六壬趋艮（壬日寅时）：壬水趋艮（寅属艮）得止为贵；六甲趋乾（甲日亥时）：甲木趋乾（亥属乾）得生为贵。忌冲：申冲寅破六壬趋艮，巳冲亥破六甲趋乾。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 5149
    end_line: 5149
  quote: 甲日乙亥時甲木亥上長生有旺乙為刃制尅學堂壬為倒食亥上建禄甲以金為官戊己為財辛金沐浴戊己衰絶不能作福生己酉丑月及見辛柱有戊字貴餘雖聰明功名不遂藝術人也
