- rule_id: SANMINGTONGH-050
  kind: doctrine
  statement: 偏官（七煞）诸子格：天元坐煞（日坐七煞需制化）、时上一位贵（时上一位七煞有制为权星）、年上七煞（年柱七煞需制化）。共性为七煞在特定柱位，制化得宜方吉。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3107
    end_line: 3107
  quote: 喜忌篇云若乃時逄七煞見之未必為㓙月制干強其煞反為權印經云時上偏官身要強陽刃衝刑煞敢當制多要行煞旺運煞多制少必為殃葢時上偏官要干上透出只一位為妙年月日重見反主辛苦勞碌若身旺煞制太過喜行煞旺運或三合煞運如無制伏要行制伏運方發但忌身弱縱得運扶持發
