    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 10312
    end_line: 10312
  quote: 絕官者無限貧窮身弱棄命要無根官居宰府干衰身化得其時位近天廷男命類屬從化照返鬼伏宜細詳之女命純和清貴濁濫娼淫當深究也
  applicable_to: 
