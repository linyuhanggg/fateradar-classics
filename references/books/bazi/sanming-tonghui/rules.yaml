  quote: 獨歩云棄命從煞須要㑹煞從財忌煞從煞喜財㑹逄根氣命損無猜葢言從煞格以煞神太重身無所歸不得已從之要行煞旺及財鄉四柱無一㸃比肩印綬方論如遇運扶身旺與煞為敵從煞不專故為禍患經云棄命從煞論剛柔言棄天干從地支隨五行性情隂干從地支煞純者多貴以隂柔能從物也
