- rule_id: SANMINGTONGH-033
  kind: doctrine
  statement: 神煞篇正印为纳音五行正库，金见乙丑、木癸未、火甲戌、水土壬辰丙辰；依旺气、贵格、救助及空破等分别论诸印成败。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1496
    end_line: 1508
  quote: '正印者乃五行之正庫金命見乙丑木癸未火甲戌水土壬辰丙辰是也言談云生逢正印必拜玉堂妙選云五行入垣官居五府可見得本家正印為貴本主同徳為上帝座為中胎月為下主人重厚魁梧功名昭著本家印又得貴格扶之更妙若木得水印火得木印多兼他權外財若身尅印或印尅身廢而復

    興若水人得火印火人帶水印次於本家印然須本主有旺氣方吉若尅破别無福救助或空亡只作清閒僧道無成舉人若五行有清氣則絶世高人有煞則貧賤

    有貴人夾印如丙丁火命以甲戌為正印却得酉亥夾之酉亥乃丙丁貴人壬癸水命以壬辰為正印却得卯巳夾之卯巳乃壬癸貴人

    有華蓋印如亥卯未得癸未之類

    有文章印如戊寅見癸未辛巳見甲戌庚申見乙丑癸亥見丙辰乙亥見壬辰乃納音尅身干神復制戊午得癸未庚子得乙丑丁酉得壬辰己卯得甲戌辛酉得丙辰干神制支神合之類

    諸印要逢庫墓若生旺扶助互換祿馬貴人併相合者至貴之命最忌刑衝破害三合六合上見鬼如甲戌日得癸酉時則減力水命人得本家印無益得木印損氣得土印支干有交涉者名官印無交涉者名鬼印有年時見印名鳯凰啣印如虞尚書癸未甲寅戊午丙辰是也

    又有福聚印如年月日時胎五位俱無氣衰敗得正印偏印俱在此印上或庫或旺雖有煞神至是受制此之謂福聚印

    有禍聚印如癸巳人帶壬辰印柱多逢水俱墓於辰則癸巳受煞以巳為命巳火遇多則本命病此之謂禍聚印

    有破福成禍印如水人得水印或月日時胎多帶土來本家印見鬼盛是謂破福成禍

    有帶煞印印中見貴煞如壬子見壬辰丙辰子至辰謂之華蓋壬人見辰為貴若印中反尅本命無福神往還名帶煞主㓙

    有臨空印乃印落空亡支無六合見官貴至賤而無成也

    有自刑印如庚戌人帶乙丑金人見金印固好丑戌相刑以金刑金此類不如無雖有少福亦終賤餘准此推

    凡論印更得眞五行與納音同氣尤妙但主少安逸不利六親難為子息'
  applicable_to: []
  caveats:
  - 不是日干查单支，也不是十神正印或天印贵。
  - 官印鬼印、福聚祸聚、自刑印均为篇内具体组合名称；不直接改动十神或地支刑算法。
  - 水命本家印无益与首段本家印贵等差异保留，贵贱六亲断语未经现实验证。
