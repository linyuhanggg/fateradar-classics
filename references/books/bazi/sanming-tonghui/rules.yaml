  quote: 重重又見財富貴饒金帛此之謂也或曰甲戊庚見刄逄衝發禍多騐壬丙逄刄見子午衝多無禍以丙見子壬見午俱為正官反作貴氣論也又曰甲以巳為妻財四柱却有卯乙巳土受傷不能扶甲故主剥喪妻子歲運復臨刼刃旺相誠所不免如别位逄庚辛酉申庚能邀乙為妻即成眷屬不為甲之七煞辛
