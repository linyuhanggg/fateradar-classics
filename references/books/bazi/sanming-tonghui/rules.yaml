- rule_id: SANMINGTONGH-098
  kind: doctrine
  statement: 土局润下（土遇水局，克中有生）；金白水清（金水相生，主聪明）；木火交辉（木火通明，主文采）；火金铸印（火炼金成器，主权威）；火土夹杂（火土过燥需水润）。五者皆属两五行配合的特殊格局。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3843
    end_line: 3843
  quote: 〔賦云〕戊巳居於潤下萍梗他鄉此象乃戊申戊子戊辰三日生於申子辰壬癸水旺之鄉非特貧賤奔波合主四肢眼目疾或惡瘡膿血而死辰戌丑未運應其餘土虛逄水局皆漂流之命若目旺之土在水局富貴行火鄉發逹如戊辰甲子戊申乙卯是土虛逄潤下故主日疾為軍辛未庚子戊辰壬子土從衆水
  applicable_to: []
  caveats:
