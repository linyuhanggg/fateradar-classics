- rule_id: SANMINGTONGH-039
  kind: doctrine
  statement: 勾绞以命前三辰与后三辰分取，并依阳男阴女、阴男阳女互换勾绞；须再看身煞生克、福救及两位是否俱全。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1686
    end_line: 1688
  quote: '〔一名爪牙煞〕

    勾者牽連之義絞者覊絆之名二煞嘗相對衝亦猶亡刼陽男陰女命前三辰為勾命後三辰為絞陰男陽女命前三辰為絞命後三辰為勾假令甲子陽命人卯為勾酉為絞乙丑陰命人辰為絞戌為勾之例古歌云爪牙煞去命三辰大忌金神羊刃臨夾煞尅身無福救必遭蛇虎傷其身此煞大忌金神白虎併

    則㓙牛馬犬畜等傷亦是不獨虎狼也不尅身與福同宫者不用大抵此煞凡命遇之身若尅煞多心路計巧主掌刑法之任或為將帥專行誅戮煞若尅身主非命而終小人逢之非横災禍行年至此亦主口舌刑獄等事又云値兩位全者災重一位者輕又云有鬼則災重無鬼則災輕'
  applicable_to: []
  caveats:
  - 阳男阴女前三勾后三绞，阴男阳女反之，不是统一年日支表。
  - 身克煞与煞克身方向不同，无克与福同宫另论，不据名称直接判口舌官非。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-040
  kind: doctrine
  statement: 十恶大败篇并列日禄入旬空、元白经特定年日冲、玄黄经年月日与旬等不同取法，原明有吉神贵气可吉，不是固定年查十日即断破败。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1712
    end_line: 1716
  quote: '十惡者譬律法中人犯十惡重罪在所不赦大敗者譬兵法中與敵交戰大敗無一生還喻極㐫也六甲旬中十個日値祿入空亡如甲辰乙巳甲以寅為祿乙以卯為祿甲辰旬以寅卯為空亡壬申者壬以亥為祿甲子旬以亥為空亡餘如丙申丁亥庚辰戊戌癸亥辛巳乙丑等日皆倣此命中犯者當以日上見

    之為是其餘不論况犯者未必皆㐫若内有吉神相扶貴氣相輔當為吉論

    元白經曰十惡都來十個辰逐年有煞用區分如庚戌年見甲辰日辛亥年見乙巳日壬寅年見丙申日癸巳年見丁亥日甲辰年見戊戌日乙未年見己丑日甲戌年見庚辰日乙亥年見辛巳日丙寅年見壬申日丁巳年見癸亥日蓋以年支干衝日支干無祿為忌餘悉無妨

    釋敎𤣥黄經又以甲己年戊辰月戊戌日壬申月癸亥日乙亥月丙申日丙子月丁亥日乙庚年辛巳月壬申日甲戌月乙巳日丙辛年壬辰月辛巳日戊戌月庚辰日己亥月甲辰日戊癸年己未月己丑日丁壬年無如人命甲己年三月七月十月十一月生恰遇此四日又分别甲子旬生恰遇壬申甲辰旬生恰遇

    乙巳在日上見方是其說尤的'
  applicable_to: []
  caveats:
  - 首日表乙丑与后两说己丑不一致，保留原字待校，不默改表。
  - 原以日上见为是，但后说另加年/月/旬条件，须分法；四废与天地转另论。
  school: null
  verified: false
  verified_by: null
  verified_at: null
