    start_line: 8676
    end_line: 8676
  quote: 〔此亦因比肩之謂也葢四柱多見比肩必然争祿争財且奪歲運之物為禍如年月透出一位七煞比肩知畏勢必歸之歲運一遇食神制煞則柱無主張之神使比肩復亂如初則散財破業横死於茍貪之下端有徵矣〕
