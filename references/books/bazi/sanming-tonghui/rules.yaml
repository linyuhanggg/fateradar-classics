    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4756
    end_line: 4756
  quote: 〔又曰〕小兒之命當論時辰為正先看關煞次看格局日主强財官旺有關無煞日主弱財官少常病易養日千弱財官多有煞有關難養夫關者何也即偏官為關偏財為煞專以日干為主取生成之數斷之關者譬如今之關隘乃險阻之地人至關非明文不敢私渡違者必致其禍小兒命犯此關則為不利柱中
  applicable_to: []
  caveats:
