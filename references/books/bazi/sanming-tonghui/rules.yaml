  quote: 假先下四十九數於筭盤乃加上其母受胎月數總得若干數若值正月胎是五十數其母三十一除去止餘一十九數九則為单单則男若单生女雙生男主夭折〔一云〕加除法以天一地二人三除之看剩數〔又云〕除一除二除三除盡看零數
