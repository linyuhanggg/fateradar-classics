    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3035
    end_line: 3035
  quote: 經云木若逄金間隔作兩府之官木無金終不成器如楊博尚書己巳庚午乙卯庚辰乙坐卯自旺生於午得兩庚間隔成器故貴極品又庚申戊子乙酉甲申乙為日主無氣取庚為官旺於酉乙庚化金妻從夫化成貴月令子癸為印申子合局生木運行東南身旺之地制煞之鄉故貴又云木官不重以木須要
