- rule_id: SANMINGTONGH-073
  kind: doctrine
  statement: 古文"浊滥娼淫"的命理成因：伤官过重无制、官煞混杂无去留、五行偏枯、桃花咸池泛滥。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 2037
    end_line: 2037
  quote: 之地若四柱庚辛俱見謂之官煞混雜無去留制伏反主貧賤如只有庚不見制伏當作鬼論分身鬼强弱定其吉㐫壽夭若制伏得中作偏官論太過反不為福更㸔日干於所生月内有力無力有助無助分節氣淺深輕重言之喜行身旺鬼衰運忌身衰鬼旺運
  applicable_to: 
