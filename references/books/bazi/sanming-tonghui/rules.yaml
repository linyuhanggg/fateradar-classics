- rule_id: SANMINGTONGH-038
  kind: doctrine
  statement: 六厄按三合局五行死位取申子辰卯、寅午戌酉、亥卯未午、巳酉丑子，有救护扶持、生旺贵气另论。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1682
    end_line: 1682
  quote: 厄者遭乎難者也常居馬前一辰刼後二辰死而不生謂之厄申子辰水局水死在卯寅午戌火局火死在酉亥卯未木局木死在午巳酉丑金局金死在子所以為厄若有救䕶有扶持逢生旺兼貴氣相助則吉究竟一生蹇滯壺中子云六厄為剝官之煞李廣不封侯是也
