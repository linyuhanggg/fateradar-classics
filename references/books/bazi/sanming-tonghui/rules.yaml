- rule_id: SANMINGTONGH-R-02
  kind: doctrine
  statement: 月令所藏天干分本气、中气、余气，按节气分日数分配司令；取格优先看本气透干，本气不透看中气、余气。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3218
    end_line: 3218
  quote: 財豐亦能旺官以財盛自生官運行旺相福禄俱臻一遇官鄉便可發福如柱中原帶官星便作好命看若兄弟輩出縱入官鄉發福必偏財月令所帶最重不宜柱中多逢年上偏財生旺月令柱中通氣主受伯叔祖考産䕃豐隆或外祖產業恩養大要日主興隆財星生旺運向財旺之鄉發福若見刑衝破害比
  applicable_to: []
