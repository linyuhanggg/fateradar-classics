- rule_id: SANMINGTONGH-029
  kind: doctrine
  statement: 金舆贵人取法以日干查地支（甲日见辰、乙日见巳等）；金舆主车驾出行之吉、迁动之利。
  anchor: null
  quote: 金舆贵人取法以日干查地支（甲日见辰、乙日见巳等）；金舆主车驾出行之吉、迁动之利。
