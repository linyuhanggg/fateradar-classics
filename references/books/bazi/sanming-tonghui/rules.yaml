- rule_id: R-01
  kind: doctrine
  statement: 五行以水一六、火二七、木三八、金四九、土五十配生数与成数。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1119
    end_line: 1121
  quote: '或問十干必隔六位一合何也余答曰天地之數各不過五上五位為生數下五位為成數生數與成數相遇然後合天一生壬地二生丁天三生甲地四生辛天五生戊地六成癸天七成丙地八成乙天九成庚地十成巳天一數見地二數然後合所以必隔六也易曰天數五地數五五位相得而各有合是也五

    行要論云天一生水其於物為精精者一之所生也地二生火其於物為神神者二之所生也天三生木其於物為魂魂從神者也地四生金其於物為魄魄從精者也天五生土其於物為體體者精神魂魄具而後有者也自天一至天五五行之生數自地六至地十五行之成數以竒生者成而偶以偶生者成而

    竒其成之者皆五五天數之中所以成於物也道立於一成於三變於五而天地之數具矣其十也偶之而已經云一六同宗二七同道三八為朋四九為友五十同途闔闢竒偶是也'
  applicable_to: []
  caveats:
  - 本规则属理论铺垫，不直接用于具体断命
  - 不可作为吉凶硬判依据
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-R-01
  kind: doctrine
  statement: 相生为水生木、木生火、火生土、土生金、金生水；相克为木克土、土克水、水克火、火克金、金克木。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 76
    end_line: 79
  quote: '五行相生相尅其理昭然十干十二支五運六氣歲月日時皆自此立更相為用在天則為氣寒暑燥濕風在地則成形金木水火土形氣相感而化生萬物此造化生成之大紀也原其玅用可謂無窮矣 木主於東應春木之為言觸也陽氣觸動冒地而生也水流趨東以生木也木上發而覆下乃自然之質也 火

    主於南應夏火之為言化也燬也陽在上陰在下燬然盛而變化萬物也鑽木取火木所生也然火無正體體本木焉出以應物盡而復入乃自然之氣也 金主於西應秋金之為言禁也陰氣始禁止萬物而收斂披沙揀金土所生也生於土而別於土乃自然之形也 水主於北應冬水之為言潤也陰氣濡潤任養

    萬物也水西而東金所生也水流曲折順下而達乃自然之性也 土主於中央兼位西南應於長夏土之為言吐也含吐萬物將生者出將死者歸為萬物家故長於夏末火所生也土或勝水水乃反土自然之義也五行相尅子皆能為母復讎也木尅土土之子金反尅木金尅木木之子火反尅金火尅金金之子

    水反尅火水尅火火之子土反尅水土尅水水之子木反尅土互能相生乃其始也互能相尅乃其終也皆出乎天之性也素問所謂水生木木復生火是木受竊氣故水怒而尅火即子逢竊氣母乃力爭與母被鬼傷子來力救其義一也强可攻弱土得木而達實可勝虛水得土而絶陰可消陽火得水而滅烈可'
  applicable_to: []
  caveats:
  - 单纯生克不等于吉凶
  - 需结合旺衰与喜忌
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-003
  kind: doctrine
  statement: 本篇以甲子乙丑海中金、壬申癸酉剑锋金、庚辰辛巳白蜡金为例，解释纳音如何用位置和生旺取物象。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 158
    end_line: 159
  quote: '主養育之權三才五行皆不可失處高下而得位居四季而有功金得之鋒鋭雄剛火得之光明照耀木得之英華越秀水得之濫波不泛土得之稼穡愈豐聚之不散必能為山山者高也散之不聚必能為地地者原也用之無窮生之罔極土之功用大矣哉又聞日家云甲子乙丑子屬水又為湖又為水旺之地

    兼金死於子墓於丑水旺而金死墓故曰海中金壬申癸酉申酉金之正位兼臨官申帝旺酉金旣生旺則誠剛矣剛則無踰於劒鋒故曰劒鋒金庚辰辛巳金養於辰生於巳形質初成未能堅利故曰白鑞金甲午乙未午為火旺之地火旺則金敗未為火衰之地火衰則金冠帶敗而方冠帶未能斫伐故曰沙中'
  applicable_to: []
  caveats:
  - 本条不是完整三十纳音表。
  - 取象不等于能由纳音推定人格和现实事件。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-004
  kind: doctrine
  statement: 论海中金须配合所见火、水、木、土等条件，作者亦对部分旧说提出异议，不是单见甲子乙丑便有统一吉凶判词。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 464
    end_line: 468
  quote: '海中金者寶藏龍宮珠孕蛟室出現雖假於空衝成器無藉乎火力故東方朔以蛤蚌名之良有理也妙選有珠藏淵海格以甲子見癸亥是不用火逢空有蚌珠照月格以甲子見己未是欲合化互貴蓋以海金無形非空衝則不能出現而乙丑金庫非旺火則不能陶鑄故也如甲子見戊寅庚午是土生金乙丑

    見丙寅丁卯是火制金又天干逢三奇此等格局無有不貴舊説甲子乙丑俱喜見爐中火丙寅旺火不喜木助丁卯敗火却宜木助覆燈山下山頭諸火性微不能煉金故宜木助天上火不能尅金須假凡火再得水濟無衝破為佳霹火就位相尅性主昏蒙運如再犯大凶見木則無造化以此金未能成器不能

    制物故也若月日有火而時遇木却以財論則吉井泉澗下大溪天河等水無火俱不宜見海水亦不宜然以妙選論之則為貴格據理甲子見癸亥逢生趨乾何不可之有路傍屋壁城頭大驛諸土在日時柱中天元支辰納音俱無火制主賤中年夭余見亦未然以庚午辛未戊寅巳卯二土造化有情故也如甲

    子見庚午坎離相濟見辛未官星帶貴乙丑見庚午官貴互換甲子見戊寅絶地逢生見己卯天干合化乙丑見戊寅亦絶地逢生見己卯則歸祿帶財餘土又當仍分年上祿馬貴人方准沙土埋金誠不宜見有火亦不吉柱中逢金砂鑞原未成器海中又未成器彼此無益故無火不宜劒釵已成器金相見有助

    玅選謂之脱體化神主貴泊金亦好如甲子見甲子乙丑見乙丑同類相資柱中喜見一寅見戊寅謂之崑山片玉如甲子見乙丑謂之干支連珠非得火煉不可即子平金神格之義也'
  applicable_to: []
  caveats:
  - 本段只讨论海中金，并非完整六十甲子性格表。
  - 古代纳音吉凶说法不直接转成现代健康、寿命或职业结论。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: R-02
  kind: doctrine
  statement: 十干之禄寄十二支，阳道顺行、阴道逆转，自长生起数至临官。
  anchor:
