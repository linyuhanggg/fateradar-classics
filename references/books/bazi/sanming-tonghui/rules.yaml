  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1463
    end_line: 1465
  quote: '〔一名科名星〕

    太極者太初也始也物造於初為太極成也収也物有所歸曰極造化始終相保乃曰太極貴也甲乙木先造乎子坎水助而生後終乎午離火焚而死丙丁火先喜出乎震卯也後喜藏乎兌酉也庚辛金得寅乃金生乎艮見亥乃金廟乎乾壬癸水先得申而生後得巳而納經曰地陷東南四瀆俱流巽位皆有始

    有終之意戊己土也喜生乎申得辰戌丑未為正庫理愚歌云四庫全時為至貴位班上列據權衡人命入格更有福氣貴神扶豈不為美'
  applicable_to:
  - key: shensha
    value: 太极贵人
  caveats:
  - 本段没有明确统一的年干日干并查指令，产品并查属于实现口径。
  - 戊己喜生申、四库及四库全的表述分别保留；不据星名推断智慧或玄学天赋。
