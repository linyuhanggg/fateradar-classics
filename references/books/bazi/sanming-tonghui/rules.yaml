- rule_id: SANMINGTONGH-096
  kind: doctrine
  statement: 还魂借气格：命局借他柱之气为己用（如枯木逢水得生），日主衰弱而有情生扶者可借气还魂；借气来源须有情不破。
  anchor: null
  quote: 还魂借气格：命局借他柱之气为己用（如枯木逢水得生），日主衰弱而有情生扶者可借气还魂；借气来源须有情不破。
  applicable_to: []
  caveats:
  - 借气非原气，行运变则格局随之而变
  - 最忌借气来源被冲合
  school: null
