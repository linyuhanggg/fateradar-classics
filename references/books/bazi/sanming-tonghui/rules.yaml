- rule_id: SANMINGTONGH-074
  kind: doctrine
  statement: 旺夫克子（夫星旺、子星弱→正官得用+食伤被制）；旺子伤夫（子星旺、夫星弱→食伤有力+正官被克）；伤夫克子（夫星子星皆损→官被伤、食被夺）。三者以十神生克为判断核心。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4550
    end_line: 4550
  quote: 有旺子傷夫者何此法專以月時推之謂尅我者為官為夫有氣得時則夫發福若支干失位不得月氣柱中又逢衝尅時上又無旺氣而已生之子引至時上逢長生臨官帝旺之地又無刑尅是旺子傷夫也如〔一命〕己夘甲戌乙夘戊寅乙用庚為夫九月庚金無氣乙用丙為子丙火長生於寅與戌㑹局皆屬火
  applicable_to: 
