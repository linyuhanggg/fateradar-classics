  quote: 十惡者譬律法中人犯十惡重罪在所不赦大敗者譬兵法中與敵交戰大敗無一生還喻極㐫也六甲旬中十個日値祿入空亡如甲辰乙巳甲以寅為祿乙以卯為祿甲辰旬以寅卯為空亡壬申者壬以亥為祿甲子旬以亥為空亡餘如丙申丁亥庚辰戊戌癸亥辛巳乙丑等日皆倣此命中犯者當以日上見
