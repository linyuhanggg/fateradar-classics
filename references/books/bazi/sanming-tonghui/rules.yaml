- rule_id: SANMINGTONGH-020
  kind: doctrine
  statement: 本篇讨论胎元并质疑通行简法，也指出固定以前三百日推受胎不能涵盖实际孕期差异。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1023
    end_line: 1028
  quote: '夫胎者受形之始故易乾知太始以形言也月者成氣之時故傳曰積日為月以氣言也今談命或不以胎月為重殊不思胎月是四柱之根苗日時雖為若不犯破胎月或乘旺氣禄馬之處則為福尤多或日時之吉而為胎月所犯則吉亦歸無用是胎月最為樞要玉湖專論胎數良有以也今人多以法取胎元

    未審精當且戊子生甲寅月往往便以一巳為胎葢言乙巳是生月前十日更不明其中有閏無閏或取日特以生日支干合者為受胎之時中有不值干支合全者亦取之無據惟有一法以當生前三百日為十月之氣乃是受胎之正譬甲子日生便以甲子為受胎之日葢五六計三百日看其生日在何月中有

    則閏在其中矣且如戊子生人甲寅月乙丑日湏於半月前十月或十一月内尋當生乙丑日乃是三百日之正胎經云胎生元命前人言如子生得子胎丑生得丑胎此説亦未善且如辛未生得壬辰月以癸未為胎辛未土受癸未木制為身鬼又何以謂之胎生元命五行相尅兼胎處六害之地縱使日時為福

    亦主獨强自立者歟蘭臺妙選有子歸母腹格謂金年受胎逢土年生者吉火年生者凶月日時相生則吉相尅則凶又曰凡人胎數長夀必長胎數短夀必短常以受胎隔零數為夀限遇徳却於零數增之遇煞於零數减之受胎不深者不能耐乆廢即易休更看納音何如若胎時支干納音相生不刑戰者主夀

    希尹曰胎月見貴必受福䕃刑衝破害决主艱辛鬼谷子曰胎中如有禄生在貴豪家或值空亡中貧窮起怨嗟古詩云時為末主胎為夀盡在末年五十後帝座朝胎生氣結看取夀年多老耄意葢謂此據胎分經人懐胎二百七十日而生醫家以十月産者計其血臟乾濕之一月也况人有多月生者少月生者

    以何為准多月生者不但古今可考就余所知者二三人俱是貧家少月生如杜拯都憲止七個月余與同僚親聞渠説又呉淵頴先生來宋文憲公濓俱姙七月而生然則貴人受胎定在三百日又豈可據乎'
  applicable_to:
  - key: yueling
    value: 子
  caveats:
  - 胎元存在不同取法；不得用排盘胎元推断真实受孕日期、孕期或寿命。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-021
  kind: doctrine
  statement: 本篇安命宫先从子宫起正月逆排生月，再将生时加于月宫顺排，逢卯定位；宫干按年干起月法配。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1032
    end_line: 1033
  quote: '神無廟無所歸人無室無所棲命無宫無所主故有命宫之説不然流年星辰為凶為吉以何憑據此法看是何月生人坐於何時然後方定命坐何宫先将所生之月從子上起正月亥上二月戌三酉四申五未六午七巳八辰九夘十寅十一丑十二逆行十二位次将所生之時加於所生之月順行十二位逢卯

    即安命宫經云天輪轉出地輪上卯上分明是命宫是也假令甲子年三月生人得戌時生却将正月加子二月在亥三月在戌為止又将戌時加在戌上亥上亥子上子丑上丑寅上寅卯上卯逄卯便是即命坐卯宫是也仍隨甲子年起亦如起月之法甲巳之年丙作首乃丁夘宫也次看三方并本命流干犯何'
  applicable_to: []
  caveats:
  - 此为该篇安命宫法，不能与其他命宫流派混为一法。
  school: null
  verified: false
  verified_by: null
  verified_at: null
