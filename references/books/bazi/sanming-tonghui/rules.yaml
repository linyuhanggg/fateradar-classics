  verified_at: null
- rule_id: SANMINGTONGH-103
  kind: doctrine
  statement: 时逢生印（时上印绶，晚年得印护身，需区分正印/偏印，偏印夺食为忌）；胞胎逢印绶（胎元得印，根基深厚，现代多用月柱替代胎元）。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3303
    end_line: 3303
  quote: 如甲日子時取子中癸水為印資助日主其人足智多謀安享食禄年月上要見辛官生印運行西北官印乃為貴命若柱逢戊巳土重更有午字衝破運厯東南官印衰絶百事無成公吏肆市人也
  applicable_to: 
  - key: shishen
    value: 偏印
  - key: shishen
    value: 正印
  - key: geju
    value: 偏印格
  caveats:
  - 胞胎（胎元）为古法概念，现代八字排盘通常不含胎元柱
  - 时印需看是否构成倒食（偏印夺食）
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-104
  kind: doctrine
  statement: 大运入墓为收藏、转变之期，非必凶；身强入墓伏藏（收敛），身弱入墓得藏（安稳）；墓运过后复出则有新局。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 8167
    end_line: 8167
  quote: 〔財官之氣均停有拱更加貴氣於上爲吉爲庫庫中雜氣有三件若當旺相為貴益我者妙若官化鬼入墓財神休囚入墓為凶則不為庫若吉神入庫仍帶休廢來刑且尅我者亦非庫〕
  applicable_to: 
  - key: rizhu_strength
    value: 中弱
  - key: rizhu_strength
    value: 偏弱
  - key: rizhu_strength
    value: 极弱
  caveats:
  - 墓运因人而异
  - 不可一遇墓运即断凶
  - 墓为土，土重者入墓尤需关注
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-105
  kind: doctrine
  statement: 倒冲禄（日时冲合求禄，与飞天禄马同理）；福星贵人（特定日柱带的福神，主福禄，神煞辅证）；食神同窠（食神与日干同柱，主子旺食丰，需不逢偏印夺食）；食神带合（食神被合则制煞不力或食力转变）；红鸾天印（红鸾桃花+天印，主婚喜或文印之喜，神煞辅证）；墨池涌泉（水局涌动文思如泉，主文贵）。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3709
    end_line: 3709
  quote: 神為印見己酉丑金局能生癸水喜秋冬亦不喜生四月以水絶於巳雖然金生在巳以金生水亦不能絶得官印運便能發福只嫌火財傷金〔或曰〕此三日與飛天禄馬同如生巳月名為月臨風是謂塡實貴位亦通辛巳辛酉辛丑三日柱全金局為妙若見午戌火旺有破反生災咎若通丙火旺為正氣官星或
  applicable_to: 
