- rule_id: SANMINGTONGH-015
  kind: doctrine
  statement: 申子辰、巳酉丑、寅午戌、亥卯未为三合组合；原文强调三字缺一不能直接按三合化局论。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1216
    end_line: 1218
  quote: '考厯家申子辰初之氣俱起於下漏一刻巳酉丑初之氣俱起於二十六刻寅午戊初之氣俱起於五十一刻亥卯未初之氣俱起於七十六刻氣皆起於同刻是天地自然之理也故謂之三合或以三合者如人一身之運用也精乃天之元氣乃神之本是以精為氣之母神為氣之子子母互相生精氣神全而不

    散之為合葢謂支屬人元故以此論之如申子辰申乃子之母辰乃子之子申乃水生子乃水旺辰乃水氣生即産旺即成庫即收有生有成有收萬物得始得終乃自然之理故申子申為水局若三字缺其一則化不成局不可以三合化局論葢天地間道理兩則化一隂一陽之謂也三則化三生萬物之謂也巳

    酉丑寅午戍亥卯未皆然五行不言土者四行皆頼土成局萬物皆歸藏於土故也若辰戌丑未全自作土局論凡命有合要得局為佳假令丙丁生人見亥卯未印巳酉丑財為得局見寅午戍火為本局申子辰水為官局辰戍丑未土為傷局又如丙人見巳酉丑丁人見寅午戍為三位禄格謂丙以巳為禄丁以'
  applicable_to: []
  caveats:
  - 半合与三合全局要区分；是否成势仍须结合命局。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-016
  kind: doctrine
  statement: 六害组合为子未、丑午、寅巳、卯辰、申亥、酉戌。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1244
    end_line: 1248
  quote: '因晝夜隂陽之氣感而六合因六合而生六害因六害而忌晝夜隂陽之氣六害者十二支凌戰之辰也子未相害者謂未旺土亥子旺水名勢家相害故子見未則為害

    丑午相害者謂午以旺火凌丑死金名官鬼相害故丑見午而午更帶丑干之真鬼則為害尢甚

    寅巳相害者謂各恃臨官擅能而進相害若干神往来有鬼者尢甚况刑在其中尢不可不加减災福言之卯辰相害者謂卯以旺木凌辰死土此以少淩長相害故辰見卯而卯更帶辰干真鬼則其害尢甚

    申亥相害者謂各恃臨官競嫉才能爭進相害故申見亥亥見申均為害更納音相尅者重

    酉戍相害者謂戍以死火害酉旺金此嫉妬相害故酉人見戍則㓙戍人見酉無災若乙酉人得戊戌乙為真金戊為真火為害尢甚'
  applicable_to: []
  caveats:
  - 本条记录传统组合，不单凭相害推断人品或现实事件。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-017
  kind: doctrine
  statement: 本段列寅巳申无恩之刑、丑戌未恃势之刑、子卯无礼之刑与辰午酉亥自刑；又并录《三车一览》将前两组名称互换的说法。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1259
    end_line: 1268
  quote: '或曰三刑之法以數起之皇極中天十為煞數積數至十則畨空其數天道惡盈滿則覆故數自卯順至子子逆至卯極十數而為無禮之刑寅逆至巳巳逆至申極十數而為無恩之刑丑順至戍戍順至未極十數而為恃勢之刑七則衝十則刑六則合一理之自然也然寅巳申何以謂之無恩葢寅中有甲木刑

    巳中戊土戊以癸水相合為妻則癸水者甲木之母也戊土既為癸水之夫乃甲之父也彼父而我刑之恩斯忘矣巳中之丙刑申中之庚申中之庚刑寅中之甲准此同義又云寅有生火刑巳上生金巳上寄生之土刑申上長生之水申中生水刑寅中生火不恤所生遥相尅制做曰無恩生旺主人持重少語寡

    慾無情多招失義忘恩之撓死絶則面譽背毁忘恩失義入貴格則虐好殺好立功業入賤格則言行乖越貪吝無厭婦人得之多産血損胎之災一生不利骨肉性頗亷正

    丑戌未何以謂之恃勢葢丑中有旺水丑乃水中之土戌中有墓火丑恃旺水刑戌中之墓火戌為六甲之尊未為六癸之卑戌恃六甲之尊刑未六癸之卑未有旺土復恃勢刑丑中之旺水又云未恃丁火之勢以刑丑中之金丑恃旺水之勢以刑戌中之火戌恃辛金之勢以刑未中之木故曰恃勢生旺主人精

    神意氣雄豪眉粗靣濶以直交人死絶刑露痩小精神乖佼是非賤佞樂禍幸災入貴格則公清平正人多畏懼入賤格則多犯刑書暗昧之災婦人得之妨害孤獨

    子卯何以謂之無禮子屬水卯屬木水能生木則子水為母卯木為子子毋自相刑又卯為日門子為陽之所生日出於卯子卯角立無欽卑之道不恤所以相生逓相刑害故曰無禮又云子中獨用癸水癸用戊土為夫星而敗於卯所以子刑卯卯中獨用乙木乙用庚金為夫星而死於子所以卯刑子此二家囚

    夫見刑女命見之尢為不良故曰無禮生旺主人威肅靣無和氣氣强性暴太察不容死絶則侮慢忽畧狹劣刻剥少孝弟害妻子呉越六親入貴格則多掌兵權不利近侍位居不乆入賤格則悖㓙暴多招刑祸

    辰午酉亥何以謂之自刑謂寅申巳亥有寅巳申互相刑内有亥無刑辰戌丑未有戌丑未互相刑内有辰無刑子午卯酉有子卯互相刑内有午酉無刑是以此四位謂之自刑葢無别物相加乃曰自也又云辰者水之墓滔則盈午者火之旺暴則焚酉者金之位剛則缺亥者水之生旺則朽各禀已盛太過之氣

    而自致禍故曰自刑生旺則沉靜内毒形容劣弱死絶則深毒輕忽察見淵漁多肢節手足之災入貴格則機變權謀入賤格則多憂頑愚不情自害帶諸凶煞非令終也婦人主淫蕩凶折之災

    此刑有四等名目而獨曰三刑者取四衝四極四庫各缺其一則欹而不正三者各自相推不齊用心故云三刑也三車一覧以寅巳申為恃勢以三宫中各有長生臨官之勢丑戌未為無恩以三位皆屬土比和為兄弟其説亦通'
  applicable_to: []
  caveats:
  - 此处记录传统刑的组合与名称分歧，不据此判人格或身体伤害。
  - 见组合仍须看具体位置、全局条件，不能单字出现即报自刑。
  school: null
  verified: false
  verified_by: null
  verified_at: null
