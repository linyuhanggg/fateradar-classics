    start_line: 2970
    end_line: 2970
  quote: 謂官星坐處見禄如人有官得禄莫非天福甲生人以辛為官辛禄在酉是以甲人見酉乙人見申之例甲用辛官柱有辛酉更得福神助之生旺有氣為佳一名禄干福神遇者主科名巍峩官職尊崇多掌絲綸文翰之美
