- rule_id: SANMINGTONGH-009
  kind: doctrine
  statement: 本篇以三日折一年推起运，阳男阴女向出生后的节顺数、阴男阳女向出生前的节逆数；须计节令与生时的分数，不宜粗取整日。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1039
    end_line: 1043
  quote: '者歟古人以大運則一辰十嵗折除以三日為年者何葢一月之終晦朔周而有三十日一日之終晝夜周而有十二時總十年之運氣凡三日有三十六時乃見三百六十日為一嵗之數在一月之中有三百六十時折除節氣算計三千六百日為一辰之十嵗也人生以百二十嵗為周天論折除之法必用生者

    日歴過日時數其節氣之數陽男隂女大運以生日後未來節氣日時為數順而行之隂男陽女大運以生日前過去節氣日時為數逆而行之假如甲子陽男十二月二十四日巳時生是月也二十九日申時立春陽男數以未來之日自二十四日巳時至二十五日巳時方是一日之實數至二十九申時正得五

    日三時之節氣實歴過六十三日折除過六十三時折除計六百三十日乃一嵗竒九月之大運起於丁丑必自十二月生日後實經厯過二十有一之日月運方移宫是越三嵗九月之内方是甲子十二月生行一嵗竒九月之大運也今人行運多用約法論以一嵗竒八月起運便以二嵗殊不明折除實厯之數

    也又曰大運者乃八字之表裏也取用當度其淺深成歳湏較夫多寡然三日而成一歳見有餘人謂之零見不足人謂之借但知其零借不知其所以零借假如陽命正月初一日丑時正一刻生至初四日丑時正一刻立春節乃作一嵗全若春在寅時則多一時乃零一旬若欠一時乃借一旬又以行運之法論

    之假如甲子年正月初一子時正一刻生行運至乙丑年正月初一日子時正一刻乃作一嵗内小六個月即進六日在初七日子時正一刻方作一嵗只要足十二個月却為本年有閏四月乃多一月矣當退還本年十二月初七日子時正一刻交運從此後十週年方換一運若學者不知其生刻獨知其生時即'
  applicable_to: []
  caveats:
  - 大运由月柱排，起运采用前后节而非任意中气。
  - 算法应保留交节时刻与生时精度；文本核对不等于真实人生验证。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-010
