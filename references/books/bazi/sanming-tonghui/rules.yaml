    start_line: 1011
    end_line: 1011
  quote: 五十年若初限值禄馬貴神不犯空亡截路交退伏神便於初限進逹中限如初限便當中年成立末限如中限便當晚年享通是四柱中分三主三限可見當均重也又曰年為太嵗主人一生禍福如當生太嵗是金是木要日月時相生相應造化和順則根基牢固一生卓立成就若支干五行不順反尅衝破為
  applicable_to: []
