- rule_id: SANMINGTONGH-071
  kind: doctrine
  statement: 本篇引《神白经》的一说为阳干伤官作父、正印作母，阴干正财作父、偏印作母；这是并录的六亲异说。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4797
    end_line: 4797
  quote: 惟辨隂陽陽男隂女理之大順也〔神白經云〕甲人丁為父壬為母乙人戊為父癸為母餘八干例見是不論陽男隂女只取隂生隂陽生陽生我者為母與母合干為父夫妻合而後生子陽干傷官為父正印為母隂干正財為父偏印為母見父則無父而發見母則無母而發尅年干不利父尅月干不利母干鬼不
  applicable_to:
