- rule_id: SANMINGTONGH-105
  kind: doctrine
  statement: 倒冲禄（日时冲合求禄，与飞天禄马同理）；福星贵人（特定日柱带的福神，主福禄，神煞辅证）；食神同窠（食神与日干同柱，主子旺食丰，需不逢偏印夺食）；食神带合（食神被合则制煞不力或食力转变）；红鸾天印（红鸾桃花+天印，主婚喜或文印之喜，神煞辅证）；墨池涌泉（水局涌动文思如泉，主文贵）。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3709
    end_line: 3709
  quote: 神為印見己酉丑金局能生癸水喜秋冬亦不喜生四月以水絶於巳雖然金生在巳以金生水亦不能絶得官印運便能發福只嫌火財傷金〔或曰〕此三日與飛天禄馬同如生巳月名為月臨風是謂塡實貴位亦通辛巳辛酉辛丑三日柱全金局為妙若見午戌火旺有破反生災咎若通丙火旺為正氣官星或
  applicable_to: 
  - key: shishen
    value: 食神
  - key: shishen
    value: 偏印
  - key: geju
    value: 偏印格
  caveats:
  - 全部属古法杂格或神煞辅证
  - 食神同窠/食神带合在实务中有参考价值（食神为子星、才华星），其余为古法或神煞参考
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-106
  kind: doctrine
  statement: 本书卷六所载杂格（壬骑龙背、遥合禄马、飞天禄马、六神兽格、趋乾趋艮等 30+ 项）多数属古法、唐宋朝禄命法或取象法，不属后世子平格局体系的主流结论；杂格可作趣味参考或历史源流追踪，但不得替代正格（八格+建禄阳刃+外格）的判断。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3517
    end_line: 3517
  quote: 〔喜忌篇云〕陽水叠逄辰位是壬騎龍背之鄉此格以壬日坐辰壬以丁為財巳為官壬用支辰暗衝戍中丁戊壬日得財官之貴柱中湏辰多方能衝起再得一寅字合住財官為妙不宜財官顯露喜行身旺及傷官食神運忌南方財官之地柱有丁巳午戌只作財官論若壬日坐寅柱中辰多亦取此格以壬食甲
  applicable_to: []
  caveats:
  - 主 skill 在遇到杂格相关提问时，默认先以正格（月令格局）为第一判断路径
  - 杂格仅作"可提及但非主线"信息
