- rule_id: SANMINGTONGH-094
  kind: doctrine
  statement: 子午双包格：命局子午对冲而各有包裹得宜（如子被丑合包裹、午被未合包裹）；冲中有合、动中有制则为贵。
  anchor: null
  quote: 子午双包格：命局子午对冲而各有包裹得宜（如子被丑合包裹、午被未合包裹）；冲中有合、动中有制则为贵。
  applicable_to: []
  caveats:
  - 子午冲为最强之地支冲
  - 有制化方可取贵，冲而无制仍为凶
