    start_line: 1930
    end_line: 1930
  quote: 辰戌丑未為四印戊己得之偏主信甲乙若逢鄙且貪丙丁或遇多貧病庚辛格號母生兒聚煞丑宫多短命〔戊己屬土遇四印為本宫主信甲乙逢之為財財已入庫主人貪鄙丙丁得之竊氣不貧則夭庚辛為子歸母腹或四位不全在死絶之地主人勾絞使術數或聚煞丑宫多夭折〕
