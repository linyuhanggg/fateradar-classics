    start_line: 3690
    end_line: 3690
  quote: 此格止有五日甲寅丙辰戊辰庚辰壬戌取甲丙戊庚壬五陽干甲坐寅得禄丙坐辰官庫庚坐辰財印兩全壬坐戌三竒俱備寅為三陽之首辰戍為魁罡之地干支異於别位故名日德也查吉神一百二十五位無日德或者别有取義余則未曉日德要多二三位併踏同者方用若只一位還以月令財官印食
