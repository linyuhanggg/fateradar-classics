  verified_at: null
- rule_id: SANMINGTONGH-007
  kind: doctrine
  statement: 节在一月的分界，中气在月之半；本篇以丑之终、寅之始解释立节。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 908
    end_line: 908
  quote: 立節中氣其春秋有分而不言至夏冬有至而不言分及夫雨水驚蟄以降二十四氣分屬有名亦必有所以為名者何言乎四立者四時之節氣也丑之終寅之始則為節月之半則為中二分者隂陽相半之謂也二至者至有二義子至已為六陽午至亥為六隂至者介乎巳午亥子之間也冬至亥隂極故曰子
  applicable_to: []
