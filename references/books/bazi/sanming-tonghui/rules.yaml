- rule_id: SANMINGTONGH-104
  kind: doctrine
  statement: 大运入墓为收藏、转变之期，非必凶；身强入墓伏藏（收敛），身弱入墓得藏（安稳）；墓运过后复出则有新局。
  anchor: null
