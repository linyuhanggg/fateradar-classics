  quote: 也不喜刑衝破害三㑹六合要有七煞相制再行官印鄉便為好命賦云日刄大忌衝合喜官煞相制合者㓙遇印者吉有煞無刃施為有勇無威有刄無煞作事濁而不顯無煞遇煞竊恐禍患相侵有刄遇刄須忌災危相犯刄生身死其年難作吉推財旺官傷此歲不作㓙㫁又曰戊午日歲月見火多則以印綬
