  quote: 嵗運併臨必死㑹諸凶神惡煞勾絞元辰亡神刼煞弔客墓病死宫諸煞九死一生財官太多身弱元犯七煞身輕如丙丁日干年月時庚辛加酉運或庚辛年必死甲乙日干庚辛月時夾雜年運見庚辛必死若有救則吉無救定凶五行神煞金多夭折水盛飄流木旺則夭土多痴呆火多愚頑太過不及作此論
