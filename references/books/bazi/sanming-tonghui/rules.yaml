    start_line: 1484
    end_line: 1484
  quote: 官星文章不必專論印綬古人以長生學堂取生氣就學之義不必專論日干但柱中帶寅申己亥便為有學此四宮聚天地間至清之氣其中有四驛馬四刼煞皆是生發之意子午卯酉為四敗其氣濁辰戌丑未為四庫其氣雜且如月候到寅申巳亥便不寒不熱風氣自然清雅溫和凡占年月者最有力日干
  applicable_to: []
