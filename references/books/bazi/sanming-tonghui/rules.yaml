- rule_id: SANMINGTONGH-009
  kind: doctrine
  statement: 本篇以三日折一年推起运，阳男阴女向出生后的节顺数、阴男阳女向出生前的节逆数；须计节令与生时的分数，不宜粗取整日。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1039
    end_line: 1043
  quote: '者歟古人以大運則一辰十嵗折除以三日為年者何葢一月之終晦朔周而有三十日一日之終晝夜周而有十二時總十年之運氣凡三日有三十六時乃見三百六十日為一嵗之數在一月之中有三百六十時折除節氣算計三千六百日為一辰之十嵗也人生以百二十嵗為周天論折除之法必用生者

    日歴過日時數其節氣之數陽男隂女大運以生日後未來節氣日時為數順而行之隂男陽女大運以生日前過去節氣日時為數逆而行之假如甲子陽男十二月二十四日巳時生是月也二十九日申時立春陽男數以未來之日自二十四日巳時至二十五日巳時方是一日之實數至二十九申時正得五

    日三時之節氣實歴過六十三日折除過六十三時折除計六百三十日乃一嵗竒九月之大運起於丁丑必自十二月生日後實經厯過二十有一之日月運方移宫是越三嵗九月之内方是甲子十二月生行一嵗竒九月之大運也今人行運多用約法論以一嵗竒八月起運便以二嵗殊不明折除實厯之數

    也又曰大運者乃八字之表裏也取用當度其淺深成歳湏較夫多寡然三日而成一歳見有餘人謂之零見不足人謂之借但知其零借不知其所以零借假如陽命正月初一日丑時正一刻生至初四日丑時正一刻立春節乃作一嵗全若春在寅時則多一時乃零一旬若欠一時乃借一旬又以行運之法論

    之假如甲子年正月初一子時正一刻生行運至乙丑年正月初一日子時正一刻乃作一嵗内小六個月即進六日在初七日子時正一刻方作一嵗只要足十二個月却為本年有閏四月乃多一月矣當退還本年十二月初七日子時正一刻交運從此後十週年方換一運若學者不知其生刻獨知其生時即'
  applicable_to: []
  caveats:
  - 大运由月柱排，起运采用前后节而非任意中气。
  - 算法应保留交节时刻与生时精度；文本核对不等于真实人生验证。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-010
  kind: doctrine
  statement: 太岁分生年当生太岁与逐年游行太岁；入命未必为凶。日犯岁君须结合原局或大运的制化救应、相合有情判断。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1080
    end_line: 1083
  quote: '夫太嵗者乃一嵗之主宰諸神之領䄂其説有二如四柱中生年曰當生太嵗如逐年輪轉曰逰行大歳當生太嵗乃終身之主其理巳論於前其逐年太嵗逰行十二宫定一年之禍福為四時之吉凶經云太嵗乃衆煞之主入命未必為凶如逢戰闘之鄉必主刑於本命葢太嵗如君也大運如臣也如君臣和悦

    其年則吉若值刑戰其年則凶經又云嵗傷日干有禍必輕日犯歳君災殃必重此又分言嵗君傷日者如庚年尅甲日為偏官譬君治臣父治子雖有災晦不為大害何則上治其下順也其情尚未盡絶日犯嵗君如甲日尅戊年為偏財譬臣弑其君子弑其父深為不利何則下凌其上逆也其凶决不能免若五

    行有救四柱有情如甲日尅戊年四柱元有庚申金或大運中亦有将甲木制伏純粹不能尅戊土為有救經云戊巳愁逢甲乙干頭湏要庚辛是也如大運并四柱中有一癸字與戊相合為有情經云壬以癸妹配戊凶為吉兆是也若二字俱全其年凶反為吉有一字者㐫半二字俱無㓙莫能觧經云五行有救

    其年反必為財四柱無情故論名為尅嵗是也又有真太嵗征太嵗之説經云生時相逢真太嵗假如甲子生人又見甲子年謂之真太嵗又名轉趾煞要大運日主與太嵗相和相順其年則吉若值刑衝破害與太嵗互相戰尅則凶如癸巳日逢丁亥流年日干支衝尅太嵗曰征運干支傷衝太嵗亦曰征太嵗干'
  applicable_to: []
  caveats:
  - 当生太岁与游行太岁不可混作同一输入。
  - 原文以庚辛制甲乙、癸合戊等说明救应，须核实际作用，不以符号出现视为已救。
  - 不据冲、刑、合或太岁名称直接保证现实事件发生。
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-011
  kind: doctrine
  statement: 原文以甲子流年又逢甲子大运为岁运并临；并临不一律为凶，须分羊刃七杀与财官印绶及命局喜忌。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 1084
    end_line: 1084
  quote: 支衝日干支亦曰征其年則凶災禍未免又如甲子流年又是甲子運謂之嵗運并臨獨羊刃七煞為凶財官印綬亦吉經云嵗運并臨災殃立至此指羊刃言也又如甲子日見甲子太嵗謂之日年相併如君子得之謂之君臣慶會其年利奏對有靣君之喜若當省士人得之有登薦仕進之象又要與嵗君帝座
  applicable_to: []
  caveats:
  - 同干支并临只确认组合形态，不直接判断必有大事或灾祸。
  - 原文的刃杀/财官印分类仍须取用、救应和实际作用条件，不能按十神名称简单计分。
  - 属于理论条目，未形成自动判断现实事件的执行规则。
  school: null
  verified: false
