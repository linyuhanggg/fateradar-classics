- rule_id: SANMINGTONGH-102
  kind: doctrine
  statement: 岁带正马（年柱正财，祖上有财，需身强能任）；时带正马（时柱正财，晚年财运，忌比劫夺）；天元坐财（日干自坐财，主自身得财，忌坐下被冲）；时上偏财（时上偏财一位为贵，忌劫财夺）；日坐天财（特定日柱坐财得贵）。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3230
    end_line: 3230
  quote: 為貴〔又〕時上偏財不用多支干須要用搜羅喜逢財旺兼身旺衝破傷官受折磨〔又〕時上偏財一位逢不遭衝破享榮豐比肩刼財還無遇富貴䨇全比石崇〔又〕時上偏財遇刼辰田園破盡苦還貧傷妻損妾多遭辱食不相資困在陳
  applicable_to: 
  - key: shishen
    value: 劫财
  - key: shishen
    value: 偏财
  - key: shishen
    value: 正财
  caveats:
  - 财在何柱何位只是参考信息
  - 最终财星成败需看全局扶抑与格局配合
  school: null
