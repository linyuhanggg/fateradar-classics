- rule_id: SANMINGTONGH-090
  kind: doctrine
  statement: 特定日柱自成贵格：财官双美（壬午、癸巳，日坐财官）；日贵（丁酉、丁亥、癸卯、癸巳，日带天乙贵人）；日德（甲寅、丙辰、戊辰、庚辰、壬戌，日坐德神）。共性为日柱本身带贵气，忌刑冲破害。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 3690
    end_line: 3690
  quote: 此格止有五日甲寅丙辰戊辰庚辰壬戌取甲丙戊庚壬五陽干甲坐寅得禄丙坐辰官庫庚坐辰財印兩全壬坐戌三竒俱備寅為三陽之首辰戍為魁罡之地干支異於别位故名日德也查吉神一百二十五位無日德或者别有取義余則未曉日德要多二三位併踏同者方用若只一位還以月令財官印食
  applicable_to: 
