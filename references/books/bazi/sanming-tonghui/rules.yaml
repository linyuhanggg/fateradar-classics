  quote: 吉釵釧成器相見亦宜若柱有未成之金無加於劒故最忌之見則性蒙猖狂戌則金混雜時中却宜火勝大抵劒鋒乃金之最利者只宜水潤不宜火刑如見寅巳三刑全者大凶
