  quote: 如甲日午年巳乙日巳年戊喜忌與月干正財同若嵗帶正馬生辰戊丑未月或夏令月申巳土旺相不犯刑衝分奪日干乗旺主受祖業豐厚若生寅卯月令柱中更帶比肩或遇運行傷刼之地必主貧困
