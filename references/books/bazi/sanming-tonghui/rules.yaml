    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 4560
    end_line: 4560
  quote: 安靜守分者乃夫星有氣日干自旺相停無尅不值刑衝財食得所者是也如〔一命〕癸巳庚申乙夘丁亥乙坐夘專禄自旺又得時支亥字合局是本身旺也以庚金為夫七月庚禄到申又得年支巳火為金長生之地是夫星旺也亥中壬水夫之食神天厨故主夫食天禄此乃自已夫星兩不相傷各乗旺氣無混
  applicable_to: []
