  quote: 經云官中見禄庫逄財金玉自天来如甲乙逄乙丑丙丁逄庚午戊己逄壬辰庚辛見乙未壬癸逄丙戌是也一命丁丑辛亥癸酉壬戌癸用丙為財戌為財庫用戊為官戌中戊土正旺財庫生助酉為癸印丑為印庫財官印俱逄庫旺無衝破為貴
