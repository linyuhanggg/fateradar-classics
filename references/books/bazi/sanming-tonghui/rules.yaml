    start_line: 9305
    end_line: 9305
  quote: 〔此亦同上文之義凡命最忌羊刄財格被破印格被奪官格衝怒只喜七煞制之陰刃力微無妨印見妻財是貪財壞印之説也歲運又見主破財傷妻或因妻致訟若原無財星或財星力㣲歲運見之稍輕惟官煞進生解勸反得舉薦成名〕
