  quote: 地支之用不比天干動静不同圓方逈異然五行所屬則一而所處之地不一且如在年則有在年之論在月則有在月之論在日時則有日時之論其隂陽輕重剛柔豈可泥於一體今當以月提為主所藏所用要見何神所耗所嫌要係何物凡四柱之神較量深淺而用子十二支之魁溪澗江洋之水乃戊土旺
