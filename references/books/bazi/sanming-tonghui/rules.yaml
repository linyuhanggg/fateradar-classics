  quote: 己絶忌癸有暗合遇卯死忌辛人遇午敗忌遇寅絶忌以上六貴神皆與忌神同位生月日時遇之可得二三分福力若與驛馬同位及帶正天乙本家祿正官正印干合有輔助者加倍據此分是貴人忌死絶而不思丙丁壬癸正以死絶為貴也
