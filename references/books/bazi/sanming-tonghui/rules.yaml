rules:
- rule_id: R-01
  kind: doctrine
  statement: 五行各有生数与成数（水一六、火二七、木三八、金四九、土五十）；命理依此分阴阳与配数。
  anchor: null
  quote: 五行各有生数与成数（水一六、火二七、木三八、金四九、土五十）；命理依此分阴阳与配数。
  applicable_to: []
  caveats:
  - 本规则属理论铺垫，不直接用于具体断命
  - 不可作为吉凶硬判依据
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-R-01
  kind: doctrine
  statement: 相生：木→火→土→金→水→木；相克：木克土、土克水、水克火、火克金、金克木。
  anchor: null
  quote: 相生：木→火→土→金→水→木；相克：木克土、土克水、水克火、火克金、金克木。
  applicable_to: []
  caveats:
  - 单纯生克不等于吉凶
  - 需结合旺衰与喜忌
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-003
  kind: doctrine
  statement: 六十甲子各配纳音五行取象（海中金、炉中火、大林木、路旁土、剑锋金、山头火、涧下水、城头土、白腊金、杨柳木、泉中水、屋上土、霹雳火、松柏木、流下水、砂石金、山下火、平地木、壁上土、金箔金、灯头火、天河水、大驿土、钗钏金、桑柘木、柘榴木、大海水、石榴木、大海水），30组纳音以象喻命。
  anchor: null
  quote: 六十甲子各配纳音五行取象（海中金、炉中火、大林木、路旁土、剑锋金、山头火、涧下水、城头土、白腊金、杨柳木、泉中水、屋上土、霹雳火、松柏木、流下水、砂石金、山下火、平地木、壁上土、金箔金、灯头火、天河水、大驿土、钗钏金、桑柘木、柘榴木、大海水、石榴木、大海水），30组纳音以象喻命。
  applicable_to: []
  caveats:
  - 纳音在现代子平中已很少使用
  - 仅作古法源流参考，不参与格局判断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-004
  kind: doctrine
  statement: 六十甲子各有五行性质与吉凶倾向，如甲子乙丑海中金（藏而不露）、丙寅丁卯炉中火（炎上）等；可为年命/日柱论命提供甲子级判词。
  anchor: null
  quote: 六十甲子各有五行性质与吉凶倾向，如甲子乙丑海中金（藏而不露）、丙寅丁卯炉中火（炎上）等；可为年命/日柱论命提供甲子级判词。
  applicable_to: []
  caveats:
  - 六十甲子判词属古法年命体系
  - 现代子平以日干旺衰格局为主，甲子级判词仅作点缀
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: R-02
  kind: doctrine
  statement: 阳干顺行十二宫，阴干逆行十二宫；如甲长生在亥，乙长生在午（与寄生十二宫相配）。
  anchor: null
  quote: 阳干顺行十二宫，阴干逆行十二宫；如甲长生在亥，乙长生在午（与寄生十二宫相配）。
  applicable_to: []
  caveats:
  - 阴干逆行说后世有争议
  - 与《滴天髓阐微》"阴阳同生同死"说冲突，需在 conflict-policy 中按问题类型选派
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-R-02
  kind: doctrine
  statement: 月令所藏天干分本气、中气、余气，按节气分日数分配司令；取格优先看本气透干，本气不透看中气、余气。
  anchor: null
  quote: 月令所藏天干分本气、中气、余气，按节气分日数分配司令；取格优先看本气透干，本气不透看中气、余气。
  applicable_to: []
  caveats:
  - 本气分配日数古今略有差异
  - 与《子平真诠》R2 互证，但日数细节以专精派 pack 为准
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-007
  kind: doctrine
  statement: 八字月柱以节气分界（立春、惊蛰…），不以朔望分界；节气前后须严格区分。
  anchor: null
  quote: 八字月柱以节气分界（立春、惊蛰…），不以朔望分界；节气前后须严格区分。
  applicable_to: []
  caveats:
  - 节气分界事实层
  - 必须由 `tool.bazi.paipan` 计算，不让 LLM 手算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-008
  kind: doctrine
  statement: 当令者旺、所生者相、生我者休、克我者囚、我克者死；命局以日干在月令的状态定基本旺衰。
  anchor: null
  quote: 当令者旺、所生者相、生我者休、克我者囚、我克者死；命局以日干在月令的状态定基本旺衰。
  applicable_to: []
  caveats:
  - 旺衰只是粗框架
  - 细致判断须追加 `bazi/ditiansui-chanwei`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-009
  kind: doctrine
  statement: 大运从月柱起；男阳女阴顺行，男阴女阳逆行；起运岁数按生时距前/后节气日数除三。
  anchor: null
  quote: 大运从月柱起；男阳女阴顺行，男阴女阳逆行；起运岁数按生时距前/后节气日数除三。
  applicable_to: []
  caveats:
  - 起运岁数为事实层
  - 必须由 `tool.bazi.paipan` 计算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-010
  kind: doctrine
  statement: 流年为太岁；命局与太岁冲、刑、合者皆有应；不限于值太岁、冲太岁。
  anchor: null
  quote: 流年为太岁；命局与太岁冲、刑、合者皆有应；不限于值太岁、冲太岁。
  applicable_to: []
  caveats:
  - 现代流派"犯太岁"包装多有夸大
  - 本书强调辨明冲、刑、合的具体类型，不一概而论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-011
  kind: doctrine
  statement: 大运与流年合参，看与命局喜忌的生克冲合；岁运并临往往应大事。
  anchor: null
  quote: 大运与流年合参，看与命局喜忌的生克冲合；岁运并临往往应大事。
  applicable_to: []
  caveats:
  - 具体事件应期需配合神煞与十神
  - 具体事件层可叠加六爻 `divination/*`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-012
  kind: doctrine
  statement: 甲己合土、乙庚合金、丙辛合水、丁壬合木、戊癸合火。
  anchor: null
  quote: 甲己合土、乙庚合金、丙辛合水、丁壬合木、戊癸合火。
  applicable_to: []
  caveats:
  - 合不一定化
  - 化需化神当令且不被破
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-013
  kind: doctrine
  statement: 天干五合化气需化神当令、四柱有化神之根、不被冲克破合者方真化。
  anchor: null
  quote: 天干五合化气需化神当令、四柱有化神之根、不被冲克破合者方真化。
  applicable_to: []
  caveats:
  - 化气真伪是命理大变量
  - 不真化时仍按原五行论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-014
  kind: doctrine
  statement: 子丑合土、寅亥合木、卯戌合火、辰酉合金、巳申合水、午未合（土火）。
  anchor: null
  quote: 子丑合土、寅亥合木、卯戌合火、辰酉合金、巳申合水、午未合（土火）。
  applicable_to: []
  caveats:
  - 六合是否化亦受月令、四柱影响
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-015
  kind: doctrine
  statement: 申子辰合水局、亥卯未合木局、寅午戌合火局、巳酉丑合金局；三合局成时五行势力大增。
  anchor: null
  quote: 申子辰合水局、亥卯未合木局、寅午戌合火局、巳酉丑合金局；三合局成时五行势力大增。
  applicable_to: []
  caveats:
  - 三合需三支齐
  - 缺一为半合，效力打折
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-016
  kind: doctrine
  statement: 子未、丑午、寅巳、卯辰、申亥、酉戌相害；多主无情、不和。
  anchor: null
  quote: 子未、丑午、寅巳、卯辰、申亥、酉戌相害；多主无情、不和。
  applicable_to: []
  caveats:
  - 六害较冲、刑为轻
  - 不可独断凶
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-017
  kind: doctrine
  statement: 寅巳申无恩之刑、丑戌未持势之刑、子卯无礼之刑；辰午酉亥自刑。
  anchor: null
  quote: 寅巳申无恩之刑、丑戌未持势之刑、子卯无礼之刑；辰午酉亥自刑。
  applicable_to: []
  caveats:
  - 刑入命未必凶，需结合用神喜忌
  - 自刑较弱
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-018
  kind: doctrine
  statement: 子午、丑未、寅申、卯酉、辰戌、巳亥相冲；冲动、移动、变化之象。
  anchor: null
  quote: 子午、丑未、寅申、卯酉、辰戌、巳亥相冲；冲动、移动、变化之象。
  applicable_to: []
  caveats:
  - 冲不一定凶
  - 冲喜用为凶，冲忌神为吉
  - 月柱冲影响最大
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-019
  kind: doctrine
  statement: 十干分配天文（甲雷、乙风、丙日、丁星、戊霞、己云、庚月、辛霜、壬雨、癸露）；十二支分配地理（子齐青州、丑吴越扬州等）。古法以天文地理取象配命。
  anchor: null
  quote: 十干分配天文（甲雷、乙风、丙日、丁星、戊霞、己云、庚月、辛霜、壬雨、癸露）；十二支分配地理（子齐青州、丑吴越扬州等）。古法以天文地理取象配命。
  applicable_to: []
  caveats:
  - 天文地理配干支属古法取象，现代仅作背景知识
  - 分野说已不符合当代地理区划
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-020
  kind: doctrine
  statement: 胎元取法：月干进一位、月支进三位（如甲子月→乙卯为胎元）；胎元代表先天根基，看命时可作辅助参考。
  anchor: null
  quote: 胎元取法：月干进一位、月支进三位（如甲子月→乙卯为胎元）；胎元代表先天根基，看命时可作辅助参考。
  applicable_to: []
  caveats:
  - 现代八字排盘通常不排胎元柱
  - 胎元仅为古法辅助概念，不是必看项
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-021
  kind: doctrine
  statement: 坐命宫取法以月将加时辰推算得地支，再配天干；命宫辅助看命主根基与运势。
  anchor: null
  quote: 坐命宫取法以月将加时辰推算得地支，再配天干；命宫辅助看命主根基与运势。
  applicable_to: []
  caveats:
  - 本书"坐命宫"与紫微斗数"命宫"取法不同，不可混用
  - 现代子平通常不排命宫
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-022
  kind: doctrine
  statement: 小运以时辰为起点，男阳女阴顺行、男阴女阳逆行，逐年推排；每一年一柱，用于辅助大运看年内细节。
  anchor: null
  quote: 小运以时辰为起点，男阳女阴顺行、男阴女阳逆行，逐年推排；每一年一柱，用于辅助大运看年内细节。
  applicable_to: []
  caveats:
  - 子平后世较少用小运，现代八字以大运+流年为标准配置
  - 小运仅在古法研究或特定流派中使用
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-023
  kind: doctrine
  statement: 五行在节气转换中有四阶段：进气（将旺未旺）、交气（正旺）、退气（旺极将衰）、伏气（衰极潜伏）。判断五行力量需考虑节气深浅。
  anchor: null
  quote: 五行在节气转换中有四阶段：进气（将旺未旺）、交气（正旺）、退气（旺极将衰）、伏气（衰极潜伏）。判断五行力量需考虑节气深浅。
  applicable_to: []
  caveats:
  - 现代多简化为旺衰二分
  - 进交退伏属精细古法概念，在实务中可作参考但不强制
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: R-03
  kind: doctrine
  statement: 日干之禄与驿马同支或邻支为禄马同乡；古以为吉象。
  anchor: null
  quote: 日干之禄与驿马同支或邻支为禄马同乡；古以为吉象。
  applicable_to: []
  caveats:
  - 神煞作辅
  - 不主主线
  - 与格局冲突时以格局为主
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-R-03
  kind: doctrine
  statement: 甲戊庚日见牛（丑）羊（未）；乙己日见鼠（子）猴（申）；丙丁日见猪（亥）鸡（酉）；壬癸日见兔（卯）蛇（巳）；辛日见马（午）虎（寅）。
  anchor: null
  quote: 甲戊庚日见牛（丑）羊（未）；乙己日见鼠（子）猴（申）；丙丁日见猪（亥）鸡（酉）；壬癸日见兔（卯）蛇（巳）；辛日见马（午）虎（寅）。
  applicable_to: []
  caveats:
  - 贵人入命主有解厄之力
  - 但不可单凭贵人作富贵硬断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: SANMINGTONGH-026
  kind: doctrine
  statement: 阳干见刃位（甲见卯、丙见午、戊见午、庚见酉、壬见子）为阳刃；阴干一般不取刃。
  anchor: null
  quote: 阳干见刃位（甲见卯、丙见午、戊见午、庚见酉、壬见子）为阳刃；阴干一般不取刃。
  applicable_to: []
  caveats:
