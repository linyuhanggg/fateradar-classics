    start_line: 8779
    end_line: 8779
  quote: 以干為祿向背定其貧富以支為命詳逆順以循環〔干猶木之幹支猶木之校綂言之干陽而支陰也分言之干支各有陰陽也十干之祿寄十二支中陽道順行陰道逆轉皆自長生而數遇本音臨官以寓焉此陽生陰死陰生陽死自然之理也○以干為祿而推之則有向背如甲祿在寅遇丑則謂之向見卯則謂
  applicable_to: []
