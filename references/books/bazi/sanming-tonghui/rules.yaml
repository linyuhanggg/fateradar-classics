  quote: 〔以上正衝倒衝遥合通融互文見義舉丙丁與巳忌填實也舉子忌刑衝也如丙子庚寅丙午癸巳○庚寅壬午丙午戊戌○二命喜寅午戌全如辛酉癸巳丁巳乙巳○癸卯丁巳丁巳乙巳○二命喜巳字多不論有合無合皆吉惟忌辰字絆住則不能衝却喜巳酉丑全是正衝格也喜忌篇云若逢傷官月建如凶處未必
