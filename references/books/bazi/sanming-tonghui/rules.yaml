- rule_id: R-04
  kind: doctrine
  statement: 日干得月令之气者为得时，得时支生扶者为得地；月时俱得则日主强旺；月时一得一失则中和；月时俱失则身弱。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 7944
    end_line: 7944
  quote: 基業立當代之功名不招䜛謗不致傷害保其終始是命運生旺體用俱得故也其一旦崛起忽然驟興繇柱中所用貴神悉皆得位乘旺又且合格奈日主無力不能勝任其福所以勞困偃蹇倐逢好運生扶日干得其强健元命用神方爲我用我因乘之虎嘯風生大發富貴是偏氣乘和衰以遇旺故迎吉而發
  applicable_to: 
