  quote: 〔日干庚辛地支巳酉丑或申酉戌全者乃從革之象庚日干頭再有甲戊辛日干頭再有壬癸其人死當廟食於百世矣何以言之夫金之為用也剛而其為質也固剛者義氣之發固者可久之道人之仗義者生為忠臣{{SKchar|2636}}必為明神矣此理可與達士論之〕
