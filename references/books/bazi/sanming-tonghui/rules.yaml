  statement: 日时禄贵类杂格（六阴朝阳=辛日子时、六乙鼠贵=乙日子时、日禄归时=时支为日干临官）的共同原则：时柱为归宿，时得禄贵则晚年有靠有贵；忌见官星或冲克破格。
  anchor:
    file: sources/fulltext/bazi/sanming-tonghui/fulltext.md
    start_line: 7551
    end_line: 7551
  quote: 癸日壬子時日祿歸時癸水子上建祿若年月干支無戊巳午未字刑衝破害三元有倚托通月氣者文章秀麗官職顯達若通木氣月亦貴如柱透己有甲合亦貴否則反覆
  applicable_to: 
