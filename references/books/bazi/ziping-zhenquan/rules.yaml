rules:
- rule_id: ZPR-01
  kind: doctrine
  statement: 八字用神专求月令，以日干配月令地支，按生克不同分财官印食、煞伤劫刃等格局。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 328
    end_line: 328
  quote: 八字用神，專求月令，以日干配月令地支，而生尅不同，格局分焉。財官印食，此用神之善而順用之者也；煞傷劫刃，此用神之不善而逆用之者也。當順而順，當逆而逆，配合得宜，皆爲貴格。
  applicable_to:
  - key: yueling
    value: "*"
  caveats:
  - 不向月令求用神而妄取用神，属执假失真
  - 但建禄月劫须另取财官煞食
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-02
  kind: doctrine
  statement: 财官印食为善而顺用；七煞、伤官、阳刃、月劫为不善而逆用。顺逆配合得宜皆可成贵格。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 328
    end_line: 328
  quote: 八字用神，專求月令，以日干配月令地支，而生尅不同，格局分焉。財官印食，此用神之善而順用之者也；煞傷劫刃，此用神之不善而逆用之者也。當順而順，當逆而逆，配合得宜，皆爲貴格。
  applicable_to:
