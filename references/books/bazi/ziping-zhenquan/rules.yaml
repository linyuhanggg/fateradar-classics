    value: 伤官
  - key: shishen
    value: 劫财
  caveats:
  - “善/不善”是格局术语，不是道德评价
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-03
  kind: doctrine
  statement: 格局不能只判成败，还要看败中是否有救、成中是否被破；救应能改变格局可用性。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 361
    end_line: 361
  quote: 用神專求月令，然以四柱配之，必有成敗。
  applicable_to:
  - key: yueling
    value: "*"
  caveats:
  - 救应判断依赖完整四柱透藏合冲，必须由结构化排盘工具供给
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-04
  kind: doctrine
  statement: 月令所藏多气，透干或会支可使财变官、官变印、煞化印等，用神随之变化。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 419
    end_line: 419
  quote: 用神既主月令矣，然月令所藏不一，而用神遂有變化。如十二支中，除子午卯酉外，餘皆有藏，不必四墓也。即以寅論，甲爲本主，如郡之有府；丙其長生，如郡之有同知；戊亦長生，如郡之有通判。假使寅月爲提
  applicable_to:
  - key: yueling
    value: "*"
  caveats:
  - 变化不是任意取用，仍须先以月令为主
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-05
  kind: doctrine
  statement: 用神之外，须看相神是否得力；相神能辅成用神或救护格局，是高低成败关键。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 522
    end_line: 522
  quote: 月令既得用神，則別位亦必有相，若君之有相，輔我用神者是也。如官逢財生，則官爲用，財爲相；財旺生官，則財爲用，官爲相；煞逢食制，則煞爲用，食爲相。然此乃一定之法，非通變之妙。要而言之，凡全局之格，賴此一字而成者，均謂之相也。
  applicable_to:
  - key: yueling
    value: "*"
  caveats:
  - 不可只看日主强弱而忽略相神位置
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-06
  kind: doctrine
  statement: 辰戌丑未为杂气，取用须看所藏何神透出、会合何局，不能只按单一藏干判断。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 542
    end_line: 542
  quote: 四墓者，沖氣也，何以謂之雜氣？以其所藏者多，用神不一，故謂之雜氣也。如辰本藏戊，而又爲水庫，爲乙餘氣
  applicable_to:
  - key: yueling
    value: 辰
  - key: yueling
    value: 戌
  - key: yueling
    value: 丑
  - key: yueling
    value: 未
  caveats:
  - 墓库开闭与刑冲必须结合全局
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-P1-01
  kind: doctrine
  statement: 甲日生辰月，辰中戊土透于本命年、月或时干时，偏财可列为月令杂气取用入口；这不等于偏财格已成或现实财运。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 542
    end_line: 548
  quote: 何謂透干？如甲生辰【校：「辰」原作「三」，據下文及中州本改】月，透戊則用偏財，透癸則用正印，透乙則用月劫是也。
  applicable_to:
    all_of:
    - key: rizhu
      value: 甲
      scope: {layer: 本命, pillar: day}
    - key: yueling
      value: 辰
      scope: {layer: 本命, pillar: month}
    - key: canggan
      value: 戊
      scope: {layer: 本命, pillar: month}
    - any_of:
      - key: gan
        value: 戊
        scope: {layer: 本命, pillar: year}
      - key: gan
        value: 戊
        scope: {layer: 本命, pillar: month}
      - key: gan
        value: 戊
        scope: {layer: 本命, pillar: time}
  caveats:
  - 只判“透戊形成偏财取用入口”，不判偏财为唯一用神、格局清浊成败或富贵。
  - 同透癸或乙须依原文“兼透则兼用”；申子辰会支须依“透而又会则并用”，不得覆盖其他入口。
  - 原文没有要求本条单独核司令深浅；若扩张为用神得力或财富结果，须另判司令、相神、救应与冲破。
  - 影印核对见 NLC416-11jh010455-35296.pdf 第41页（印本32页）；电子本“辰”有校记，影印本作“辰”。
  school: 子平真诠月令杂气取用
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-P1-02
  kind: doctrine
  statement: 甲日生辰月，本命另见申、子两支时，具备申子辰会支取水印的结构入口；须再核成局、冲破与并用，不直接判印格已成。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 542
    end_line: 548
  quote: 何謂會支？如甲生辰月，逢申與子會局，則用水印是也。
