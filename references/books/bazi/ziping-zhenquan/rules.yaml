- rule_id: ZPR-09
  kind: doctrine
  statement: 同一组十神因生克先后、位置远近、透藏关系不同，吉凶结论不同。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 637
    end_line: 637
  quote: 月令用神，配以四柱，固有每字之生尅以分吉凶。然有同此生尅，而先後之間，遂分吉凶者，尤談命之奧也。
  applicable_to:
  - key: yueling
    value: "*"
  caveats:
  - 需要工具输出四柱位置与干支关系
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-10
  kind: doctrine
  statement: 本书明确降级星辰神煞，格局判断以月令用神、相神、成败救应为主。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 663
    end_line: 668
  quote: 八字格局，專以月令配四柱，至於星辰好歹，既不能爲生尅之用，又何以操成敗之權？況於局有礙，即財官美物，尚不能濟，何論吉星？於格有用，即七煞傷官，皆爲美物，何謂凶辰乎？是以格局既成，即使滿盤孤辰入煞，何損其貴？格局既破，即使満盤天德貴人，何以爲功？今人不知輕重，見是吉星，遂至拋卻用神，不觀四柱，妄論貴賤，謬談禍福，甚可笑也。
  applicable_to:
  - key: shensha
    value: "*"
  caveats:
  - 神煞最多作旁证，不得覆盖格局层
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-11
  kind: doctrine
  statement: 外格是月令无用时的权取；若月令自有用神，不可别寻外格。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 697
    end_line: 697
  quote: 八字用神，既專主月令，何以而又有外格乎？外格者，蓋因月令無用，權而用之，故曰外格也。
  applicable_to:
  - key: yueling
    value: "*"
  caveats:
  - “提纲有用提纲重”，有官莫寻格局
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-12
  kind: doctrine
  statement: 行运不只是增减强弱，还会成格、变格、救格、破格。
  anchor: {file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md, start_line: 783, end_line: 783}
  quote: 論運與看命，無二法也。看命以四柱干支，配月令之喜忌。而取運則又以運之干支，配八字之喜忌。故運中每運行一字，即必以此一字，配命中八字而統觀之，爲喜爲忌，吉凶判然矣。
  applicable_to:
  - key: shishen
    value: "*"
    scope:
      layer: 大运
  caveats:
  - 大运干支必须由历法排盘工具计算
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-13
  kind: doctrine
  statement: 运中天干、地支作用不同，支中喜忌逢运透清又有特别规则。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 840
    end_line: 840
  quote: 命中喜忌，雖干支俱有，而干主天，動而有爲；支主地，靜以待用。且干主一而支藏多，爲福爲禍，安得不殊？
  applicable_to:
  - key: shishen
    value: "*"
    scope:
      layer: 大运
  caveats:
  - 不可把干运支运混为一谈
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-14
  kind: doctrine
  statement: 四吉神各有成格条件、破格条件和取运路径，不能用同一模板套判。
  anchor: {file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md, start_line: 927, end_line: 927}
  quote: 官以尅身，雖與【校：「與」原作「六」，據中州本改】七煞有別，終受彼制，何以切忌刑沖破害，尊之若是乎？豈知人生天地間【校：「間」字據中州本補】，必無矯焉自尊之理，雖貴極天子，亦有天祖臨之。正官者，分所當尊，如在國有君，在家有親，刑沖破害，以下犯上，烏乎可乎？
  applicable_to:
  - key: shishen
    value: 正官
  caveats:
  - 需结合具体章目读取，不做一刀切
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-15
  kind: doctrine
  statement: 四凶/特殊格须看制、化、合、配与取运，凶神得制化可成，失制化则败。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 1154
    end_line: 1154
  quote: 煞以攻身，似非美物，而大貴之格，多存七煞。蓋控制得宜，煞爲我用，如大英雄大豪傑，似難駕馭，而處之有方，則驚天動地之功，忽焉而就。此王侯將相所以多存七煞也。
  applicable_to:
  - key: shishen
    value: 七杀
  caveats:
  - 不可用现代强弱派直接覆盖沈氏格局法
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-16
  kind: doctrine
  statement: 杂格应在正格不足以取用时讨论，且须严格按原文条件，不可泛化为万能例外。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 1365
    end_line: 1365
  quote: 雜格者，月令無用，取外格而用之，其格甚多，故謂之雜。
  applicable_to: []
  caveats:
  - 与外格同属边界规则，优先级低于月令正用
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-P-01
  kind: procedure
  statement: 阳干顺行十二长生、阴干逆行。甲木长生在亥、死在午；乙木长生在午、死在亥。其余天干依阴阳互换。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 164
    end_line: 165
  quote: 即以甲乙論，甲爲木之陽，天之生氣流行萬木者，是故生於亥而死於午；乙爲木之陰，木之枝枝葉葉受天生氣者，是故生於午而死於亥。
  applicable_to: []
  caveats:
  - 起例只锁长生十二宫顺逆，不断旺衰吉凶
  - 阴长生力度沈氏另有「不甚有力」说，不在本条计算范围内
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: ZPR-P-02
  kind: procedure
  statement: 十干合化：甲己合化土、乙庚合化金、丙辛合化水、丁壬合化木、戊癸合化火。
  anchor:
    file: sources/fulltext/bazi/ziping-zhenquan/fulltext.md
    start_line: 205
    end_line: 209
  quote: 是以甲己相合之始，則化爲土；土則生金，故乙庚化金次之；金生水，故丙辛化水又次之；水生木，故丁壬化木又次之；木生火，故戊癸化火又次之，而五行遍焉。
  applicable_to: []
  caveats:
  - 合化是否成真须另看化神当令、有根、不被冲克，见合而不合章
  school: null
  verified: false
  verified_by: null
  verified_at: null
