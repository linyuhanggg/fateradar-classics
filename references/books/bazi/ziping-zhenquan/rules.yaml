  - 月令辰须在本命月支，申、子须在本命其他柱；不可借大运、流年、流月或流日凑局。
  - 依原文“一透则一用，兼透则兼用，透而又会则透与会并用”，本条不得排除同盘的戊、癸、乙透干入口。
  - 影印核对见 NLC416-11jh010455-35296.pdf 第41页（印本32页）；会支之后的有情无情与冲破条件未由本谓词判定。
