  kind: doctrine
  statement: 秋壬通源旺极，用戊土堤防、丁火财星为佐。戊丁两透者贵。
  anchor: null
  quote: 秋壬通源旺极，用戊土堤防、丁火财星为佐。戊丁两透者贵。
