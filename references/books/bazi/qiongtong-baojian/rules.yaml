- rule_id: QR-03-00
  kind: doctrine
  statement: 土主信、性重，散在四维，不立一方；春土气虚而薄，宜火生之；夏土性燥，宜水润之；秋土子旺母衰，宜火助之；冬土外寒内温，宜火暖之。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 11
    end_line: 11
  quote: 夫五行之性，各致其用。水者其性智，火者其性礼，木其性仁，金其性义，惟土主信，重宽厚博，无所不容：以之水，即水附之而行；以之木，则木托之而生；金不得土，则无自出；火不得土，则无自归。必损实以为通，致虚以为明，故五行皆赖土也。
  applicable_to:
  - key: rizhu
    value: 戊
  - key: rizhu
    value: 己
  caveats:
  - 仅总纲
  - 具体宜忌见 QR-03-01 ～ QR-03-08
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-01
  kind: doctrine
  statement: 正二月戊土先丙后甲、癸又次之；三月先甲后丙、癸又次之。春季共同涉及甲丙癸，但先后随月令改变。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 807
    end_line: 807
  quote: 三春戊土，无丙照暖，戊土不生，无甲疏噼，戊土不灵，无癸滋润，万物不长。正二月先丙后甲，癸又次之。三月先甲后丙，癸又次之，因戊土司权故也。有甲、丙、癸，三者齐透，必主一品当朝，或二透一藏，亦登金榜，二藏一透，也可异途。
  applicable_to:
  - key: rizhu
    value: 戊
  caveats:
  - 寅月忌甲多无丙
  - 正官格、七杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-02
  kind: doctrine
  statement: 夏戊燥裂，专用癸水润；丙火合癸化雨为辅。癸丙不悖（不直接相合即"既济"）者富贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 247
    end_line: 247
  quote: 四月乙木，自有丙火，耑取癸水为尊。四月乙木专用癸水，丙火酌用，虽以庚辛佐癸，须辛透为清。癸透、庚辛又透，科甲定然，独一点癸水、无金，是水无根，虽出天干，不过秀才小富，须要大运相扶。或土多困癸，贫贱之人。丙戊太多，支成火局，瞽目之流。
  applicable_to:
  - key: rizhu
    value: 戊
  caveats:
  - 午月忌火多焦土
  - 从强格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-03
  kind: doctrine
  statement: 秋戊金多泄气，用丙火助身、癸水润、甲木疏。丙癸甲三者俱备者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 901
    end_line: 901
  quote: 八月戊土，金洩身寒，赖丙照暖，喜水滋润，先丙后癸，不必木疏。丙癸两透，科甲中人。丙透癸藏，可许入泮。癸透丙藏，纳资得官。若丙藏又无癸，即多不透，此皆常人。丙癸全无，奔流之客。
  applicable_to:
  - key: rizhu
    value: 戊
  caveats:
  - 戌月燥金燥土须癸水透干
  - 伤官生财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-04
  kind: doctrine
  statement: 十月戊土先用甲木、次取丙火；十一、十二月严寒冰冻，丙火为专、甲木为佐。亥月与子丑月的先后次序不可混同。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 935
    end_line: 935
  quote: 十月戊土，时值小阳，阳气略出，先用甲木，次取丙火。非甲、土不灵。非丙、土不暖，安能生发万物。甲丙两出，富贵中人。或甲得长生，遇支藏得地之水，一丙高透，亦主身贵扬名。
  applicable_to:
  - key: rizhu
    value: 戊
  caveats:
  - 子月切忌癸水透干无丙
  - 从财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-05
  kind: doctrine
  statement: 春己阴湿，专用丙火暖、癸水润、甲木疏（合不化）。丙癸甲三者俱备者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1355
    end_line: 1355
  quote: 若壬水藏亥，戊不出干，亦主上达。有戊常人。有一甲透，衣禄可求。若有甲无壬癸者，富贵虚浮。所谓羊质虎皮是也。壬、癸、甲、三者全无，又不合格，斯为下品。
  applicable_to:
  - key: rizhu
    value: 己
  caveats:
  - 己甲合化土须时柱配合，详见 sanming-tonghui 五合化气
  - 正官格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-06
  kind: doctrine
  statement: 三夏己土取癸为要、次用丙火；原文以甘沛与太阳并论。此章不授权把辛金泄秀或癸辛两透写成三夏统一结论。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1019
    end_line: 1019
  quote: 三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火。夏无太阳，禾稼不长，故无癸曰旱田，无丙曰孤阴。
  applicable_to:
  - key: rizhu
    value: 己
  caveats:
  - 未月忌火多燥土
  - 伤官生财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-07
  kind: doctrine
  statement: 三秋己土以丙火温、癸水润，癸先丙后；九月土盛时另宜甲木疏之。不得据此虚构丙癸辛三透的统一规则。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1044
    end_line: 1044
  quote: 三秋己土，万物收藏之际，外虚内实，寒气渐升，须丙火温之，癸水润之，不特此也，且癸能洩金，丙能制金，补土精神，则秋生之物咸茂矣。癸先丙后。
  applicable_to:
  - key: rizhu
    value: 己
  caveats:
  - 戌月燥土须癸水透干
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-08
  kind: doctrine
  statement: 冬己寒湿，专用丙火暖、戊土帮身；不忌甲木合身（合而无化）。丙戊两透者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1071
    end_line: 1071
  quote: 三冬己土，溼泥寒冻，非丙暖不生，取丙为尊，甲木参酌。戊土癸水不用。惟初冬壬旺，取戊制之。余皆用丙丁，但丁不能解冻除寒，不能大济。
  applicable_to:
  - key: rizhu
    value: 己
  caveats:
  - 子月忌水多无丙
  - 从财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
