- rule_id: QR-05-08
  kind: doctrine
  statement: 十月癸水宜用庚辛；十一月专用丙火解冻并要辛金滋扶；十二月宜丙火解冻。亥子丑三月不得合并为统一丙辛规则。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1731
    end_line: 1764
  quote: 十月癸水，旺中有弱，何也？因亥摇木，洩散元神，宜用庚辛为妙。得庚辛两透，不见丁伤者，功名有准。
  applicable_to: []
