rules:
- rule_id: QTB
  kind: doctrine
  statement: 五行之土无固定一季之性，须结合四时所乘之气审视调济。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 777
    end_line: 777
  quote: 五行之土，散冠四维，故金木水火，依而成象，是四时皆有用有忌者。火、死酉也。水、旺子也。盖土赖火运，火死则土囚。土喜水才，水旺则土虚。土得金火，方成大器。土高无贵，空惹灰尘。土聚则滞，土散则轻。
  applicable_to: []
  caveats:
  - 仅说明四时方法，不据此自动判断旺衰吉凶
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR
  kind: doctrine
  statement: 00 五行总论
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 5
    end_line: 5
  quote: 五行者，本乎天地之间而不穷者也，故谓之行。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-00-01
  kind: doctrine
  statement: 木主仁、性直；火主礼、性急；土主信、性重；金主义、性刚；水主智、性聪。生克之理：木生火、火生土、土生金、金生水、水生木；木克土、土克水、水克火、火克金、金克木。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1315
    end_line: 1315
  quote: 二月辛金，阳和之际，壬水为尊，见戊己为病。得甲制伏，则辛金不致埋没，壬水不致混浊，合此者必身入玉堂。故二月辛金，有壬甲透者贵显。否则，乡绅。或壬坐亥支，不见土出，可能入芥，家亦小康。得申中之壬者，异途名望。无壬者常人。其生剋之理，与正月辛金皆同。
  applicable_to: []
  caveats:
  - 仅作日主性情参考
  - 不可用于断职业、伴侣等社会层面
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QIONGTONGBAO-QR
  kind: doctrine
  statement: 01 论木（行论 + 甲乙木 × 四季）
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 25
    end_line: 25
  quote: 木性腾上而无所止，气重则欲金任使，有金则有惟高惟敛之德。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-00
  kind: doctrine
  statement: 木性腾上而无所止；春木阳气方盛，宜火以宣其华；夏木根干叶燥，宜水以润之；秋木气衰枝叶凋零，宜金以斩削；冬木枝叶归根，宜火以暖之。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 25
    end_line: 25
  quote: 木性腾上而无所止，气重则欲金任使，有金则有惟高惟敛之德。
  applicable_to:
  - key: rizhu
    value: 甲
  - key: rizhu
    value: 乙
  caveats:
  - 仅是宜忌总纲，具体用神组合需查 QR-01-01 ～ QR-01-08
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-01
  kind: doctrine
  statement: 正月甲木余寒，原文取丙癸；二月以庚金得所为要；三月先取庚金、次用壬水。三个月令次序不同，不得合并成同一用神组合。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 57
    end_line: 63
  quote: 春月之木，渐有生长之象。初春犹有余寒，当以火温暖，则有舒畅之美，水多变剋，有损精神。重见生旺，必用庚金斲凿，可成楝梁。春末阳壮水渴，藉水资扶，则花繁叶茂。初春无火，增之以水，则阴浓气弱，根损枝枯，不能华秀。春末失水，增之以火，则阳气太盛，燥渴相加，枝枯叶干，亦不华秀。是以水火二物，要得时相济为美。
  applicable_to:
  - key: rizhu
    value: 甲
  caveats:
  - 寅月调候忌庚金过早伤甲
  - 具体宜忌取决于盘中庚丁透与不透
  - 调候必须与旺衰、格局合参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-02
  kind: doctrine
  statement: 四月甲木先癸后丁；五月先癸后丁，庚金次之；六月先丁后庚，原文并明言无癸亦可。三夏须按实际月支分别取用。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 105
    end_line: 105
  quote: 四月甲木退气，丙火司权，先癸后丁。
  applicable_to:
  - key: rizhu
    value: 甲
  caveats:
  - 巳月病火不可全废
  - 癸水必须有源（庚辛申子辰之类）
  - 炎上格、伤官生财格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-03
  kind: doctrine
  statement: 七月甲木以丁火为尊、庚金次之；八月先丁、次丙、再次庚；九月独爱丁火，并以壬癸滋扶。三秋各月不可互换次序。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 137
    end_line: 137
  quote: 三秋甲木，木性枯藁，金土乘旺，先丁后庚，丁庚两全，将甲造为画戟，七月甲堪为戟，非丁火不能造庚，非庚不能造甲，丁庚两透，科甲定然。庚禄居申，杀印相生，运行金水，身伴明君。或庚透无丁，一富而已，主为人操心太重，不能坐享。或丁透庚藏，亦主青衿小富。或庚多无丁，残疾之人若为僧道，灾厄可免。
  applicable_to:
  - key: rizhu
    value: 甲
  caveats:
  - 戌月燥土反需癸水润
  - 纯杀格、从杀格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-04
  kind: doctrine
  statement: 冬木寒凝，专用庚金为先（破癸去寒），丁火暖局，戊土堤水。庚丁戊三者俱透者大贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1511
    end_line: 1511
  quote: 凡壬日无比肩羊刃者，不必用戊，专用庚金，以丙为佐。
  applicable_to:
  - key: rizhu
    value: 甲
  caveats:
  - 子月切忌癸水透干无制
  - 冬甲见己土泥木为忌
  - 正官格遇冬子另判格局
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-05
  kind: doctrine
  statement: 正月乙木丙先癸次；二月以丙为君、癸为臣；三月转为先癸后丙。应用时必须保留寅卯辰的逐月差异。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 211
    end_line: 211
  quote: 三春乙木，为芝兰蒿草之物，丙癸不可离也，春乙见丙，卉木向阳，万象回春，须癸滋养根基。丙癸齐透天干，无化合制剋，自然登科及第，故书云：乙木根荄种得深，只须阳地不宜阴，漂浮只怕多逢水，剋制何须苦用金。
  applicable_to:
  - key: rizhu
    value: 乙
  caveats:
  - 辰月乙弱不可见戊厚埋根
  - 调候用神与旺衰用神冲突时按 §冲突优先级裁判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-06
  kind: doctrine
  statement: 夏乙焦枯，专用癸水润；丙火透出反喜，能催英华；忌干旱无水，亦忌庚金生水反复。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 247
    end_line: 247
  quote: 四月乙木，自有丙火，耑取癸水为尊。四月乙木专用癸水，丙火酌用，虽以庚辛佐癸，须辛透为清。癸透、庚辛又透，科甲定然，独一点癸水、无金，是水无根，虽出天干，不过秀才小富，须要大运相扶。或土多困癸，贫贱之人。丙戊太多，支成火局，瞽目之流。
  applicable_to:
  - key: rizhu
    value: 乙
  caveats:
  - 未月燥土须癸水透天
  - 夏乙见伤官生财格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-07
  kind: doctrine
  statement: 三秋乙木总纲先丙后癸，但九月专用癸水；七月、八月还须依各月段所列条件分别判断，不得把三秋写成统一组合。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 279
    end_line: 279
  quote: 三秋乙木，金神司令，先丙后癸，惟九月耑用癸水，恐丙暖戊土为病也。
  applicable_to:
  - key: rizhu
    value: 乙
  caveats:
  - 酉月切忌庚辛合乙乱命
  - 纯七杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-08
  kind: doctrine
  statement: 冬乙阴寒，专用丙火暖局；最忌癸水冻木；戊土制癸为佐。丙戊两透者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 840
    end_line: 840
  quote: 四月戊土，阳气发升，寒气内藏，外实内虚，不畏火炎，无阳气相催，万物不长，故先用甲疏噼，次取丙癸为佐。
  applicable_to:
  - key: rizhu
    value: 乙
  caveats:
  - 冬乙若日干弱极而四柱无丙，已成寒木无用之造，须警示判语
  - 从财、从杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QIONGTONGBAO-014
  kind: doctrine
  statement: 02 论火（行论 + 丙丁火 × 四季）
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 333
    end_line: 333
  quote: 炎炎真火，位镇南方，故火无不明之理，辉光不久。全要伏藏，故明无不灭之象。火以木为体。无木、则火不长焰。火以水为用，无水、则火太酷烈。故火多则不实，火烈则伤物。木能藏火，到寅卯方而生火，不利于西，遇申酉而必死。生居离位，木断有为，若居坎宫，谨畏守礼。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-00
  kind: doctrine
  statement: 火性炎上，宜其得地见水以济之；春火炎而未烈，秋火退气，冬火气衰，夏火炎烈。喜壬水克之、忌癸水熄之，丙喜见甲乙发其光。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 9
    end_line: 9
  quote: 火为太阳，性炎上。水为太阴，性润下。木为少阳，性腾上而无所止。金为少阴，性沉下而有所止。土无常性，视四时所乘，欲使相济得所，勿令太过弗及。
  applicable_to:
  - key: rizhu
    value: 丙
  - key: rizhu
    value: 丁
  caveats:
  - 仅总纲
  - 具体宜忌见 QR-02-01 ～ QR-02-08
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-01
  kind: doctrine
  statement: 正月丙火用壬、庚辛为助；二月专用壬水；三月仍用壬水，土重时取甲为辅。三春依据实际月支保留不同佐用。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 349
    end_line: 349
  quote: 三春丙火，秉象至威，阳回大地，侮雪欺霜，耑用壬水为扶阳，名曰天和地润，既济功成。
  applicable_to:
  - key: rizhu
    value: 丙
  caveats:
  - 寅月丙生时尚有余寒，忌见过早水多寒身
  - 正官格、印格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-02
  kind: doctrine
  statement: 四月丙火专用壬水、金为佐；五月亦专用壬水；六月用壬并借庚金为佐。此为三夏逐月原文次序，不外推固定吉凶。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 418
    end_line: 418
  quote: 三夏丙火，阳威性烈，专用壬水。若亥宫壬水无力，回剋洩气故也，仍用申宫长生之水，方云富贵。
  applicable_to:
  - key: rizhu
    value: 丙
  caveats:
  - 午月阳刃格须配七杀
  - 不可滥用壬水致水多反克身
  - 炎上格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-03
  kind: doctrine
  statement: 秋丙退气，专用甲木生身，壬水显威；甲壬两透者贵；忌癸水熄丙。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 658
    end_line: 658
  quote: 遇年透隔位之壬，不贪丁合者，忠而且厚。或支成火局，干见火出，得庚壬两透者，科甲定然。土透制壬，常人。即壬藏支中，亦非白丁，但要运行西北，方可发达。得一癸透，名独杀当权，出人头地。
  applicable_to:
  - key: rizhu
    value: 丙
  caveats:
  - 戌月燥土须配癸水反润
  - 财格、官杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-04
  kind: doctrine
  statement: 十月丙火按木旺、水旺、火旺分别酌用庚、戊、壬；十一月壬水为最、戊土佐之；十二月喜壬，土多时不可少甲。三冬不存在统一的壬甲戊三透规则。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 535
    end_line: 535
  quote: 十月丙火，太阳失令，得见甲戊庚出干，可云科甲，主为人性好清高，斯文领袖。如辛透见辰，名化合逢时，主大贵。
  applicable_to:
  - key: rizhu
    value: 丙
  caveats:
  - 冬丙忌壬水无制泛滥
  - 从杀格、化气格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-05
  kind: doctrine
  statement: 春丁柔弱，专用庚金劈甲、引甲生丁；甲庚不悖者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1511
    end_line: 1511
  quote: 凡壬日无比肩羊刃者，不必用戊，专用庚金，以丙为佐。
  applicable_to:
  - key: rizhu
    value: 丁
  caveats:
  - 庚金须有制（壬水或丁火本身），不可孤庚伤丁
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-06
  kind: doctrine
  statement: 夏丁炎旺，用庚金、壬水（"金白水清"），庚壬两透者贵；忌甲木助火、戊土晦光。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 21
    end_line: 21
  quote: 论木论火论土论金论水，甲木丙火戊土庚金壬水。
  applicable_to:
  - key: rizhu
    value: 丁
  caveats:
  - 未月燥土仍以壬水为先
  - 炎上格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-07
  kind: doctrine
  statement: 秋丁退气，专用甲木生身为主、庚金劈甲为辅；甲庚两透者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1688
    end_line: 1688
  quote: 正月癸水，辛金为主，庚金次之，丙亦不可少。若无庚辛，虽有丙火，无用之人。或火多土多，残疾不免。
  applicable_to:
  - key: rizhu
    value: 丁
  caveats:
  - 酉月忌庚旺无丁
  - 财格、杀格另议
  school: null
