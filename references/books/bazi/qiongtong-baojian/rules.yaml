- rule_id: QR-04-01
  kind: doctrine
  statement: 正月庚金以丙甲为上、丁火次之；二月专用丁火并借甲引丁、借庚劈甲；三月先甲后丁。三春须逐月读取。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1110
    end_line: 1110
  quote: 正月庚金，木旺之际，有土皆死，不能生金，且金之寒气未除，先用丙暖庚性，又虑土厚埋金，须甲疏洩。丙甲两透，科甲显荣。二者透一，亦有生监。丙藏甲透，异路功名。
  applicable_to:
  - key: rizhu
    value: 庚
  caveats:
  - 寅月仍寒，丁火不可无
  - 正财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-02
  kind: doctrine
  statement: 四月庚金参用壬丙戊；五月专用壬水、癸又次之；六月先用丁火、次取甲木。三夏没有统一的壬戊组合。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1175
    end_line: 1175
  quote: 四月庚金，长生于巳，巳内有戊。丙不镕金，故不畏火炎，丙亦可作用，但先壬水，方得中和，故曰群金生夏，喜用勾陈。次取戊土，丙火佐之。三者皆全，登科及第，即透一二，亦非白丁。
  applicable_to:
  - key: rizhu
    value: 庚
  caveats:
  - 午月忌丁多熔金
  - 从杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-03
  kind: doctrine
  statement: 秋庚得令，专用丁火炼成器、甲木引丁。丁甲两透不悖者大贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1158
    end_line: 1158
  quote: 得丁甲两透，不见比肩，科甲之命，但要好运相催。甲透丁藏，采芹拾芥。甲藏丁透，异路功名。丁甲俱藏，不受庚制，富中取贵，刀笔起家。有甲无丁，平常之辈。有丁无甲，迂儒腐儒。丁甲两无，下贱之流。
  applicable_to:
  - key: rizhu
    value: 庚
  caveats:
  - 戌月燥土反晦丁，须癸水或壬水调
  - 从革格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-04
  kind: doctrine
  statement: 冬庚寒，专用丁火炼、丙火暖、戊土制水。丁丙戊俱透者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1254
    end_line: 1254
  quote: 十月庚金，水冷性寒，非丁莫造，非丙不暖。丁甲两透，支无水局，一榜有之。支藏丙火，桃浪之仙。支见亥子，得己出制，亦有功名。
  applicable_to:
  - key: rizhu
    value: 庚
  caveats:
  - 子月忌伤官无制
  - 从儿格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-05
  kind: doctrine
  statement: 春辛弱嫩，专用己土生身、壬水洗辛。己壬两透者贵；忌丙火合辛化水误用。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1300
    end_line: 1300
  quote: 正月辛金，阳气舒而寒气未除，不知正月建寅，中有长生之丙，解去寒气，忌甲木司权，辛金失令，取己土为生身之本，欲得辛金发现，全赖壬水之功，己壬两透，支见庚制甲，科甲定然。或己土透干，支中有甲，异路恩荣。或己土不全，号曰君臣失势，富贵难全。或有丙火出干，亦主武学。或见壬、无己庚者，贫贱之徒。
  applicable_to:
  - key: rizhu
    value: 辛
  caveats:
  - 春辛见戊土反埋
  - 正官格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-06
  kind: doctrine
  statement: 夏辛被火炼，专用壬水洗辛、己土护身、癸水润。壬己癸三透者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1351
    end_line: 1351
  quote: 四月辛金，时逢首夏，忌丙火之燥烈，喜壬水之洗淘。支成金局，水透出干，有木制戊，名一清澈底，科甲功名。癸透壬藏，富真贵假。若壬癸皆藏，戊己亦藏，略富。若壬癸俱无，反见火出，必主鳏独。
  applicable_to:
  - key: rizhu
    value: 辛
  caveats:
  - 未月燥土须癸水透干
  - 从杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-07
  kind: doctrine
  statement: 七月辛金以壬水为尊、甲戊酌用；八月专用壬水，见戊己时才以甲制土；九月先壬后甲。不得把甲戊无条件并入所有秋月。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1399
    end_line: 1399
  quote: 七月辛金，值庚司令，不旺自旺，且壬水居申，四柱不见戊土，胎元戊藏申内，为壬堤岸，人命得此，为官清正，但不富耳。
  applicable_to:
  - key: rizhu
    value: 辛
  caveats:
  - 酉月忌伤官见官
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-08
  kind: doctrine
  statement: 冬辛寒甚，专用丙火暖（合而不化于本月），壬水洗辛（不寒）。丙壬两透清纯者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1474
    end_line: 1474
  quote: 十二月辛金，寒冻之极，先丙后壬，无丙不能解冻，无壬不能洗淘。丙壬两透，金马玉堂之客。壬丙俱藏，游庠食饩之人。有丙无壬富真贵假。有壬乏丙，贱而且贫。或丙多、无壬、有癸，市中贸易之流。
  applicable_to:
  - key: rizhu
    value: 辛
  caveats:
  - 子月忌癸水寒辛无丙
  - 化气格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QIONGTONGBAO-044
  kind: doctrine
  statement: 05 论水（行论 + 壬癸水 × 四季）
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1493
    end_line: 1493
  quote: 天倾西北，亥为出水之方，地陷东南，辰为纳水之库，逆流到申而作声，故水不西流。水性润下，顺则有容，顺行十二神，顺也，主有度量，有吉神扶助，乃贵格。逆则有声，逆行十二神，逆也。入格者，主清贵，有声誉。忌刑剋，则横流，爱自死自绝则吉。
  applicable_to: []
  caveats: []
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-05-00
  kind: doctrine
  statement: 水主智、性聪，至清而柔；春水泛滥，宜土堤之；夏水涸竭，宜金生之；秋水通源，喜水之归；冬水冻凝，喜火之暖。
  anchor: null
  quote: 水主智、性聪，至清而柔；春水泛滥，宜土堤之；夏水涸竭，宜金生之；秋水通源，喜水之归；冬水冻凝，喜火之暖。
  applicable_to:
  - key: rizhu
    value: 壬
  - key: rizhu
    value: 癸
  caveats:
  - 仅总纲
  - 具体宜忌见 QR-05-01 ～ QR-05-08
