- rule_id: QR-04-07
  kind: doctrine
  statement: 七月辛金以壬水为尊、甲戊酌用；八月专用壬水，见戊己时才以甲制土；九月先壬后甲。不得把甲戊无条件并入所有秋月。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1348
    end_line: 1405
  quote: 七月辛金，值庚司令，不旺自旺，且壬水居申，四柱不见戊土，胎元戊藏申内，为壬堤岸，人命得此，为官清正，但不富耳。
