- rule_id: QR-05-04
  kind: doctrine
  statement: 十月壬水专用戊丙、次取庚金；十一月先戊后丙；十二月专用丙火、甲木为佐。戊丙不是三冬不分月令的统一结论。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1587
    end_line: 1625
  quote: 十月壬水司权，至旺之极，取戊为用，若生辰日干，又见辰时，必须戊透，又须庚制甲，不伤戊土，戊庚两全，定主豋科乃第，位显权高。或甲出制戊，不见庚救者，断之贫穷。戊藏无制，可许生员。或戊庚两透无甲者，亦主荣显。
  applicable_to: []
  caveats:
  - 子月忌癸水透干争夫
  - 化气格另议
