- rule_id: QR-02-00
  kind: doctrine
  statement: 火性炎上，宜其得地见水以济之；春火炎而未烈，秋火退气，冬火气衰，夏火炎烈。喜壬水克之、忌癸水熄之，丙喜见甲乙发其光。
  anchor: null
  quote: 火性炎上，宜其得地见水以济之；春火炎而未烈，秋火退气，冬火气衰，夏火炎烈。喜壬水克之、忌癸水熄之，丙喜见甲乙发其光。
  applicable_to: []
  caveats:
