- rule_id: QR-03-01
  kind: doctrine
  statement: 正二月戊土先丙后甲、癸又次之；三月先甲后丙、癸又次之。春季共同涉及甲丙癸，但先后随月令改变。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 769
    end_line: 798
  quote: 三春戊土，无丙照暖，戊土不生，无甲疏噼，戊土不灵，无癸滋润，万物不长。正二月先丙后甲，癸又次之。三月先甲后丙，癸又次之，因戊土司权故也。有甲、丙、癸，三者齐透，必主一品当朝，或二透一藏，亦登金榜，二藏一透，也可异途。
  applicable_to: []
  caveats:
  - 寅月忌甲多无丙
  - 正官格、七杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
