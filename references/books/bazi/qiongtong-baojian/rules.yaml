- rule_id: QR-04-00
  kind: doctrine
  statement: 金性沉重、主义、性刚；春金犹寒，宜火气以舒之；夏金尤柔，宜土厚以扶之；秋金当权，喜火炼以成器；冬金寒甚，喜火暖以解冻。
  anchor: null
  quote: 金性沉重、主义、性刚；春金犹寒，宜火气以舒之；夏金尤柔，宜土厚以扶之；秋金当权，喜火炼以成器；冬金寒甚，喜火暖以解冻。
  applicable_to: []
  caveats:
