- rule_id: QR-04-01
  kind: doctrine
  statement: 正月庚金以丙甲为上、丁火次之；二月专用丁火并借甲引丁、借庚劈甲；三月先甲后丁。三春须逐月读取。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1072
    end_line: 1133
  quote: 正月庚金，木旺之际，有土皆死，不能生金，且金之寒气未除，先用丙暖庚性，又虑土厚埋金，须甲疏洩。丙甲两透，科甲显荣。二者透一，亦有生监。丙藏甲透，异路功名。
  applicable_to: []
  caveats:
  - 寅月仍寒，丁火不可无
  - 正财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-04-02
  kind: doctrine
  statement: 四月庚金参用壬丙戊；五月专用壬水、癸又次之；六月先用丁火、次取甲木。三夏没有统一的壬戊组合。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1137
    end_line: 1166
  quote: 四月庚金，长生于巳，巳内有戊。丙不镕金，故不畏火炎，丙亦可作用，但先壬水，方得中和，故曰群金生夏，喜用勾陈。次取戊土，丙火佐之。三者皆全，登科及第，即透一二，亦非白丁。
  applicable_to: []
  caveats:
  - 午月忌丁多熔金
  - 从杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
