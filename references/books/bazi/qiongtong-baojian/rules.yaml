  kind: doctrine
  statement: 冬丁寒弱，专用甲木生身、庚金劈甲、戊土制水；甲庚戊三透不悖者贵。
  anchor: null
  quote: 冬丁寒弱，专用甲木生身、庚金劈甲、戊土制水；甲庚戊三透不悖者贵。
