- rule_id: QR-01-00
  kind: doctrine
  statement: 木性腾上而无所止；春木阳气方盛，宜火以宣其华；夏木根干叶燥，宜水以润之；秋木气衰枝叶凋零，宜金以斩削；冬木枝叶归根，宜火以暖之。
  anchor: null
  quote: 木性腾上而无所止；春木阳气方盛，宜火以宣其华；夏木根干叶燥，宜水以润之；秋木气衰枝叶凋零，宜金以斩削；冬木枝叶归根，宜火以暖之。
  applicable_to: []
  caveats:
  - 仅是宜忌总纲，具体用神组合需查 QR-01-01 ～ QR-01-08
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-01
  kind: doctrine
  statement: 正月甲木余寒，原文取丙癸；二月以庚金得所为要；三月先取庚金、次用壬水。三个月令次序不同，不得合并成同一用神组合。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 41
    end_line: 69
  quote: 春月之木，渐有生长之象。初春犹有余寒，当以火温暖，则有舒畅之美，水多变剋，有损精神。重见生旺，必用庚金斲凿，可成楝梁。春末阳壮水渴，藉水资扶，则花繁叶茂。初春无火，增之以水，则阴浓气弱，根损枝枯，不能华秀。春末失水，增之以火，则阳气太盛，燥渴相加，枝枯叶干，亦不华秀。是以水火二物，要得时相济为美。
  applicable_to: []
  caveats:
  - 寅月调候忌庚金过早伤甲
  - 具体宜忌取决于盘中庚丁透与不透
  - 调候必须与旺衰、格局合参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-02
  kind: doctrine
  statement: 四月甲木先癸后丁；五月先癸后丁，庚金次之；六月先丁后庚，原文并明言无癸亦可。三夏须按实际月支分别取用。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 73
    end_line: 101
  quote: 四月甲木退气，丙火司权，先癸后丁。
  applicable_to: []
  caveats:
  - 巳月病火不可全废
  - 癸水必须有源（庚辛申子辰之类）
  - 炎上格、伤官生财格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-03
  kind: doctrine
  statement: 七月甲木以丁火为尊、庚金次之；八月先丁、次丙、再次庚；九月独爱丁火，并以壬癸滋扶。三秋各月不可互换次序。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 105
    end_line: 149
  quote: 三秋甲木，木性枯藁，金土乘旺，先丁后庚，丁庚两全，将甲造为画戟，七月甲堪为戟，非丁火不能造庚，非庚不能造甲，丁庚两透，科甲定然。庚禄居申，杀印相生，运行金水，身伴明君。或庚透无丁，一富而已，主为人操心太重，不能坐享。或丁透庚藏，亦主青衿小富。或庚多无丁，残疾之人若为僧道，灾厄可免。
  applicable_to: []
  caveats:
  - 戌月燥土反需癸水润
  - 纯杀格、从杀格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-04
  kind: doctrine
  statement: 冬木寒凝，专用庚金为先（破癸去寒），丁火暖局，戊土堤水。庚丁戊三者俱透者大贵。
  anchor: null
  quote: 冬木寒凝，专用庚金为先（破癸去寒），丁火暖局，戊土堤水。庚丁戊三者俱透者大贵。
  applicable_to: []
  caveats:
  - 子月切忌癸水透干无制
  - 冬甲见己土泥木为忌
  - 正官格遇冬子另判格局
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-05
  kind: doctrine
  statement: 正月乙木丙先癸次；二月以丙为君、癸为臣；三月转为先癸后丙。应用时必须保留寅卯辰的逐月差异。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 179
    end_line: 207
  quote: 三春乙木，为芝兰蒿草之物，丙癸不可离也，春乙见丙，卉木向阳，万象回春，须癸滋养根基。丙癸齐透天干，无化合制剋，自然登科及第，故书云：乙木根荄种得深，只须阳地不宜阴，漂浮只怕多逢水，剋制何须苦用金。
  applicable_to: []
  caveats:
  - 辰月乙弱不可见戊厚埋根
  - 调候用神与旺衰用神冲突时按 §冲突优先级裁判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-06
  kind: doctrine
  statement: 夏乙焦枯，专用癸水润；丙火透出反喜，能催英华；忌干旱无水，亦忌庚金生水反复。
  anchor: null
  quote: 夏乙焦枯，专用癸水润；丙火透出反喜，能催英华；忌干旱无水，亦忌庚金生水反复。
  applicable_to: []
  caveats:
  - 未月燥土须癸水透天
  - 夏乙见伤官生财格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-07
  kind: doctrine
  statement: 三秋乙木总纲先丙后癸，但九月专用癸水；七月、八月还须依各月段所列条件分别判断，不得把三秋写成统一组合。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 247
    end_line: 275
  quote: 三秋乙木，金神司令，先丙后癸，惟九月耑用癸水，恐丙暖戊土为病也。
  applicable_to: []
  caveats:
  - 酉月切忌庚辛合乙乱命
  - 纯七杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-01-08
  kind: doctrine
  statement: 冬乙阴寒，专用丙火暖局；最忌癸水冻木；戊土制癸为佐。丙戊两透者贵。
  anchor: null
  quote: 冬乙阴寒，专用丙火暖局；最忌癸水冻木；戊土制癸为佐。丙戊两透者贵。
  applicable_to: []
  caveats:
  - 冬乙若日干弱极而四柱无丙，已成寒木无用之造，须警示判语
  - 从财、从杀格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
