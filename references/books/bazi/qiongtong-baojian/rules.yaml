- rule_id: QR-05-02
  kind: doctrine
  statement: 四月壬水取壬比肩为助、辛金发源、庚金为佐；五月取癸为用、庚为佐；六月先辛后甲、次取癸水。三夏用法逐月不同。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1496
    end_line: 1530
  quote: 四月壬水，丙火司权，水弱极矣，专取壬水比肩为助，次取辛金发源，且暗合丙火，庚金为佐。壬辛两透，金榜有名，或癸辛两出，加以甲透，亦主异路之荣。无甲者、富贵门下之客。
  applicable_to: []
  caveats:
  - 午月忌火多无金
  - 从财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
