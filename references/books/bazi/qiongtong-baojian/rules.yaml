- rule_id: QR-05-05
  kind: doctrine
  statement: 春癸泄于木，用辛金生身、丙火配（不可同透相合）。辛丙间透者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1682
    end_line: 1682
  quote: 正月癸水，值三阳之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名阴阳和合，万物发生。辛丙两透，金榜有名。
  applicable_to:
