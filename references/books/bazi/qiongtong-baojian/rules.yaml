  kind: doctrine
  statement: 秋庚得令，专用丁火炼成器、甲木引丁。丁甲两透不悖者大贵。
  anchor: null
  quote: 秋庚得令，专用丁火炼成器、甲木引丁。丁甲两透不悖者大贵。
