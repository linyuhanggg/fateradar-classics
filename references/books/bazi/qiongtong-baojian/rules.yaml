  statement: 十月戊土先用甲木、次取丙火；十一、十二月严寒冰冻，丙火为专、甲木为佐。亥月与子丑月的先后次序不可混同。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 897
    end_line: 929
  quote: 十月戊土，时值小阳，阳气略出，先用甲木，次取丙火。非甲、土不灵。非丙、土不暖，安能生发万物。甲丙两出，富贵中人。或甲得长生，遇支藏得地之水，一丙高透，亦主身贵扬名。
  applicable_to: []
  caveats:
