- rule_id: QR-03-06
  kind: doctrine
  statement: 三夏己土取癸为要、次用丙火；原文以甘沛与太阳并论。此章不授权把辛金泄秀或癸辛两透写成三夏统一结论。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 981
    end_line: 1002
  quote: 三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火。夏无太阳，禾稼不长，故无癸曰旱田，无丙曰孤阴。
  applicable_to: []
  caveats:
  - 未月忌火多燥土
  - 伤官生财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-03-07
  kind: doctrine
  statement: 三秋己土以丙火温、癸水润，癸先丙后；九月土盛时另宜甲木疏之。不得据此虚构丙癸辛三透的统一规则。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1006
    end_line: 1029
  quote: 三秋己土，万物收藏之际，外虚内实，寒气渐升，须丙火温之，癸水润之，不特此也，且癸能洩金，丙能制金，补土精神，则秋生之物咸茂矣。癸先丙后。
  applicable_to: []
  caveats:
  - 戌月燥土须癸水透干
  school: null
  verified: false
  verified_by: null
  verified_at: null
