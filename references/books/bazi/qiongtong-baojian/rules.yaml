- rule_id: QR-05-01
  kind: doctrine
  statement: 春壬泄气于木，用辛金生身；如盘中水势已盛，配戊土堤防。辛戊适配者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1682
    end_line: 1682
  quote: 正月癸水，值三阳之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名阴阳和合，万物发生。辛丙两透，金榜有名。
  applicable_to:
  - key: rizhu
    value: 壬
  caveats:
  - 辰月水库须看戊土透不透
  - 伤官生财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-05-02
  kind: doctrine
  statement: 四月壬水取壬比肩为助、辛金发源、庚金为佐；五月取癸为用、庚为佐；六月先辛后甲、次取癸水。三夏用法逐月不同。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1547
    end_line: 1547
  quote: 四月壬水，丙火司权，水弱极矣，专取壬水比肩为助，次取辛金发源，且暗合丙火，庚金为佐。壬辛两透，金榜有名，或癸辛两出，加以甲透，亦主异路之荣。无甲者、富贵门下之客。
  applicable_to:
  - key: rizhu
    value: 壬
  caveats:
  - 午月忌火多无金
  - 从财格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-05-03
  kind: doctrine
  statement: 秋壬通源旺极，用戊土堤防、丁火财星为佐。戊丁两透者贵。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 1585
    end_line: 1585
  quote: 七月壬水，庚金司令，壬得申之长生，源流自远，转弱为强，专用戊土，次取丁火佐戊制庚。但用辰戌之戊，不用申中受病之戊。戊丁俱透，科甲生员。戊透天干，丁藏午戌，恩封可待，特忌戊癸化合。即支见寅戌，年出丁火，可许衣衿。或丁戊两藏，富中取贵。
  applicable_to:
  - key: rizhu
    value: 壬
  caveats:
  - 戌月燥土过重反塞水源
  - 从儿格另议
