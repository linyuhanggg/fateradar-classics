- rule_id: QR-02-01
  kind: doctrine
  statement: 正月丙火用壬、庚辛为助；二月专用壬水；三月仍用壬水，土重时取甲为辅。三春依据实际月支保留不同佐用。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 317
    end_line: 382
  quote: 三春丙火，秉象至威，阳回大地，侮雪欺霜，耑用壬水为扶阳，名曰天和地润，既济功成。
  applicable_to: []
  caveats:
  - 寅月丙生时尚有余寒，忌见过早水多寒身
  - 正官格、印格另议
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-02
  kind: doctrine
  statement: 四月丙火专用壬水、金为佐；五月亦专用壬水；六月用壬并借庚金为佐。此为三夏逐月原文次序，不外推固定吉凶。
  anchor:
    file: sources/fulltext/bazi/qiongtong-baojian/fulltext.md
    start_line: 386
    end_line: 448
  quote: 三夏丙火，阳威性烈，专用壬水。若亥宫壬水无力，回剋洩气故也，仍用申宫长生之水，方云富贵。
  applicable_to: []
  caveats:
  - 午月阳刃格须配七杀
  - 不可滥用壬水致水多反克身
  - 炎上格另判
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: QR-02-03
  kind: doctrine
  statement: 秋丙退气，专用甲木生身，壬水显威；甲壬两透者贵；忌癸水熄丙。
  anchor: null
  quote: 秋丙退气，专用甲木生身，壬水显威；甲壬两透者贵；忌癸水熄丙。
  applicable_to: []
