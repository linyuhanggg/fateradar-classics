- rule_id: DR-04
  kind: doctrine
  statement: 冬令日主不可无火（暖调）；夏令日主不可无水（寒调）；寒暖得宜者贵。
  anchor: null
  quote: 冬令日主不可无火（暖调）；夏令日主不可无水（寒调）；寒暖得宜者贵。
