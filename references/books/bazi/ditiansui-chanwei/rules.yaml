  verified_at: null
- rule_id: DITIANSUICHA-042
  kind: doctrine
  statement: 十神相生为恩、相克为怨；命局中恩怨配合决定际遇。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 2924
    end_line: 2924
  quote: 有以四柱为体，有以化神为体，四柱为用，化之真者，即以化神为体，以四柱中与化神相生相克者，取以为用。
  applicable_to: []
  caveats:
  - 抽象判语
  school: null
  verified: false
