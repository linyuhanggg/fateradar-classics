- rule_id: DITIANSUICHA-046
  kind: doctrine
  statement: 日主有微根而大势从之者为假从；化神不真但合而似化者为假化；假从假化者，运行从化之乡反吉、运逢扶身反凶。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 10532
    end_line: 10532
  quote: 冲得合而静这则易，合得冲而表明这则难，通行证喜神有能合而助之者为美，如良为喜神，得乙合而去之者是也。
  applicable_to: []
