  - 否则徒劳
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-021
  kind: doctrine
  statement: 官杀混杂者去留得宜（去官留杀、去杀留官）；官杀有制（食神制杀、伤官驾杀）者贵；官杀两清者吉；官杀无制者凶。
  anchor: null
  quote: 官杀混杂者去留得宜（去官留杀、去杀留官）；官杀有制（食神制杀、伤官驾杀）者贵；官杀两清者吉；官杀无制者凶。
  applicable_to: []
  caveats:
