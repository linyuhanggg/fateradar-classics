  statement: 当令而透干、得用之神为真神；不当令、被合冲制伏的为假神；真神得用为贵、假神乱真为凶。
  anchor: null
  quote: 当令而透干、得用之神为真神；不当令、被合冲制伏的为假神；真神得用为贵、假神乱真为凶。
