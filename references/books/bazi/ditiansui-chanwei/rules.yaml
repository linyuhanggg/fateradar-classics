schema_version: fateradar-rules-v2
book:
  slug: ditiansui-chanwei
  system: bazi
  title: 滴天髓阐微
  script: simplified
  fulltext: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
  fulltext_sha256: 2eca5a1a22582650f3ca64b6d33b3758bd0ba2a19f48393a1604947e0ee5cd65
rules:
- rule_id: DR-01
  kind: doctrine
  statement: 干为天元，支为地元，支中所藏为人元；论命三元一统，以日干为我，旁参支藏。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 11
    end_line: 11
  quote: 任氏曰：干为天元，支为地元，支中所藏为人元。人之禀命，万有不齐，总不越此三元之理，所谓万法宗也。阴阳本乎太极，是谓帝载，五行播于四时，是谓神功，乃三才之统系，万物之本原。《滴天髓》首明天道如此。
  applicable_to: []
  caveats:
  - 理论铺垫
  - 具体到取用必转入第十七章衰旺
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-DR-01
  kind: doctrine
  statement: 五气偏全决定命之吉凶；偏者凶、全者吉，此为根本判断框架。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 15
    end_line: 15
  quote: 坤元合德机缄通，五气偏全定吉凶。
  applicable_to: []
  caveats:
  - '"偏全"非简单的五行皆见，须看流通'
  - 与中和章互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-003
  kind: doctrine
  statement: 八字干支顺接相生（天干气弱地支生之、地支气衰天干辅之）为吉；反克为害则凶；命贵中和，偏枯终于有损。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 29
    end_line: 29
  quote: 如天干气弱，地支生之，地支神衰，天干辅之，皆为有情而顺则吉；
  applicable_to: []
  caveats:
  - 本派核心立场
  - '"奇异"（如四戊午、四癸亥）一律按偏枯论，不得作奇格高论'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-004
  kind: doctrine
  statement: 知命之人当平心定气，不取奇偏怪格；以中和为贵。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 3691
    end_line: 3691
  quote: 然总以中和为主，犹如人之无病，由四肢健量，营卫调和，行止自如，诸多安适：设使有病，则忧多乐少，举动艰难，如遇良药则可岂不为终身之患乎？
  applicable_to: []
  caveats:
  - 方法论层面
  - 任氏多次警告勿信"奇格"
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-005
  kind: doctrine
  statement: 理为体，气为用；理气不可偏废。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 248
    end_line: 248
  quote: 任氏曰：进退之机，不可不知也。
  applicable_to: []
  caveats:
  - 与第十三章体用互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-006
  kind: doctrine
  statement: 干支配合得宜（生克化制各得其用）为命之大纲。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 323
    end_line: 323
  quote: 配合干支仔细详，定人福祸与灾祥。
  applicable_to: []
  caveats:
  - '"配合得宜"为旺衰派的最高判语'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-007
  kind: doctrine
  statement: 十干各有性情：甲为参天之木、乙为花卉之木、丙为太阳之火、丁为灯烛之火、戊为城墙之土、己为田园之土、庚为顽铁之金、辛为珠玉之金、壬为江湖之水、癸为雨露之水；用法各异。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 3205
    end_line: 3205
  quote: 夫五行之气，流行于四时，虽日干各有专令，而其实专令之中，亦有并存者在，如春木司令，甲乙虽旺，而此时休囚之戊巳，亦未尝绝于天地也；
  applicable_to: []
  caveats:
  - 本书十干特性是后世旺衰派教学的根基
  - 切忌与《穷通宝鉴》调候视角混用
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-008
  kind: doctrine
  statement: 十二支各有所藏（本气/中气/余气）与季节属性；刑冲合害需结合所藏与位置精判。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 11
    end_line: 11
  quote: 任氏曰：干为天元，支为地元，支中所藏为人元。人之禀命，万有不齐，总不越此三元之理，所谓万法宗也。阴阳本乎太极，是谓帝载，五行播于四时，是谓神功，乃三才之统系，万物之本原。《滴天髓》首明天道如此。
  applicable_to: []
  caveats:
  - 藏干司令、深浅与位置（年/月/日/时）皆影响实际作用
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-009
  kind: doctrine
  statement: 天干为外、地支为内；天干之用须根于地支，地支之力须透于天干。
  anchor: null
  quote: 五阳皆阳丙为最，五阴皆阴癸为至。
  applicable_to: []
  caveats:
  - 与配合章互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DR-02
  kind: doctrine
  statement: 两气合而成象（如水木相涵），五气聚而成形（金木水火土齐备）；形象成则气势顺，宜顺其势；形象破则需通关或制伏。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 1852
    end_line: 1852
  quote: 两气合而成象，象不可破也。
  applicable_to: []
  caveats:
  - 形象为高阶视角
  - 与从象、化象互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-DR-02
  kind: doctrine
  statement: 三合局（亥卯未木局等）成局者气势全；方局（寅卯辰东方等）齐全者气势纯；局成宜顺、局破宜疏。
  anchor: null
  quote: 合有宜不宜，合多不为奇。
  applicable_to: []
  caveats:
  - 方与局不混
  - 方为同方位三支齐、局为三合三支齐
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-012
  kind: doctrine
  statement: 八格（正官/七杀/正印/偏印/正财/偏财/食神/伤官）的取用以"扶抑"为主线，不同于格局派以"成败救应"为主线。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 2658
    end_line: 2658
  quote: 财官印绶发偏正，兼论食伤八格定。
  applicable_to: []
  caveats:
  - 与《子平真诠》视角不同
  - 遇到月令格局精修需求时转 `bazi/ziping-zhenquan`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-013
  kind: doctrine
  statement: 以日主为体，以用神为用；体强者用宜泄、体弱者用宜扶。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 2918
    end_line: 2918
  quote: 原注：有以日主为体，提纲为用。
  applicable_to: []
  caveats:
  - 本派"用神"为旺衰扶抑视角
  - 与格局派的"相神"不同
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-014
  kind: doctrine
  statement: 命局之精（资源充足）、气（流通无阻）、神（光彩外显）三者饱满者为贵。
  anchor: null
  quote: 命局之精（资源充足）、气（流通无阻）、神（光彩外显）三者饱满者为贵。
  applicable_to: []
  caveats:
  - 抽象判语
  - 不能单独成断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-015
  kind: doctrine
  statement: 月令为提纲，决定旺衰、决定喜忌；用神取法以月令为最重要参考。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 5541
    end_line: 5541
  quote: 寅月生人，不透木火，而透金为用神，是为提纲不照也；
  applicable_to: []
  caveats:
  - 与《子平真诠》"月令本气透干取格"不同：本书月令为旺衰之主，格局派月令为格局之主
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-016
  kind: doctrine
  statement: 生时为命之归宿；时干时支与日主的关系决定晚年归宿。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 570
    end_line: 570
  quote: 癸水即壬水之归宿，扶桑之水也。
  applicable_to: []
  caveats:
  - 抽象判语
  - 具体到事件需结合大运
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DR-03
  kind: doctrine
  statement: 日主衰旺判断需综合月令得令失令、四柱根气、十干性情、合冲解化；强中有弱、弱中有强；不可以"得令"或"失令"一项独断。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 934
    end_line: 934
  quote: 得令者冲衰则拔，失时者冲旺无伤。
  applicable_to: []
  caveats:
  - 本派核心规则
  - 任氏多次强调"得令未必旺、失令未必衰"
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-DR-03
  kind: doctrine
  statement: 命贵中和；五行流通、刚柔得宜者富贵；偏枯至极者贫贱。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 48
    end_line: 48
  quote: 由此观之，命贵中和，偏枯终于有损；
  applicable_to: []
  caveats:
  - '"中和"不是五行皆有'
  - 是五行配合得宜、流通无阻
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-019
  kind: doctrine
  statement: 五行有源（生发之神）有流（归宿之神）；流通无阻为贵，停滞为滞，反克为凶。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 5762
    end_line: 5762
  quote: 其气自当有辨，五行有颠倒，作用各自有法，是故气有乘本势而不顾他杂者，气有借他神而可以成局者，无有从旺神而不可克制者，无有依弱资扶者，所以制杀莫如乘旺，化杀正以扶身，从杀乃依权势，留杀正尔迎官。
  applicable_to: []
  caveats:
  - 与中和章互参
  - 流通为本派的主线判语之一
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-020
  kind: doctrine
  statement: 当二五行相战（如金木相战）时，介入第三方（如水）使战局化为生生（金生水、水生木）即为通关；通关之神得令为吉。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 1824
    end_line: 1824
  quote: 此造土生金，金生水，水生木，干支同流，但有相生之谊，而无争妒之风、戊戌中财星归库，官司清印正分明，食神吐秀逢生。乡榜出身，仕至黄堂，一妻二妾，子有十三，科第连绵，富有百万，寿过九旬。
  applicable_to: []
  caveats:
  - 通关之神必须得令或有根
  - 否则徒劳
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-021
  kind: doctrine
  statement: 官杀混杂者去留得宜（去官留杀、去杀留官）；官杀有制（食神制杀、伤官驾杀）者贵；官杀两清者吉；官杀无制者凶。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 4555
    end_line: 4555
  quote: 任氏曰：官杀混杂者，富贵甚多。总之杀官当令者，必要坐下印绶，则其杀官之气流通，生化有情：或气贯生时，亦足以扶身敌杀。若不气贯生时，又不坐下印绶，不贫亦贱。如杀官不当令者，不作此论也。
  applicable_to: []
  caveats:
  - 本书官杀视角与格局派略有不同：本派以"制化平衡"为主，格局派以"成败救应"为主
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-022
  kind: doctrine
  statement: 伤官真者（当令而透）泄秀为贵；伤官假者（不当令）反主刑伤；伤官见官，需结合身强身弱、合冲化解综合判断，非铁定为祸。
  anchor: null
  quote: 伤官见官果难辨，可见不可见。
  applicable_to: []
  caveats:
  - 本书纠正《渊海子平》"伤官见官为祸百端"的简化说，强调"伤官见官，要看格局"
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-023
  kind: doctrine
  statement: 命局清者（十神不杂、生克得宜）为贵；浊者（十神混杂、生克失宜）为贱；清中有浊、浊中有清者另议。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 5281
    end_line: 5281
  quote: 任氏曰：命之最难辨者，清浊两字也。
  applicable_to: []
  caveats:
  - '"清浊"不能简单看十神种类多寡，要看是否各得其位'
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-024
  kind: doctrine
  statement: 当令而透干、得用之神为真神；不当令、被合冲制伏的为假神；真神得用为贵、假神乱真为凶。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 5454
    end_line: 5454
  quote: 令上寻其聚得真，假神休要乱真神，真神得用生平贵，用若无为碌碌人。
  applicable_to: []
  caveats:
  - 真假之辨须结合月令与透干位置
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-025
  kind: doctrine
  statement: 干性刚（甲丙戊庚壬）柔（乙丁己辛癸）须相济；过刚则折、过柔则靡。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 399
    end_line: 399
  quote: 原注：甲、丙、戊、庚、壬为阳，独丙火秉阳之精，而为阳中之阳；乙、丁、己、辛、癸为阴，独癸水秉阴之精，而为阴中之阴。
  applicable_to: []
  caveats:
  - 与配合章互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-026
  kind: doctrine
  statement: 顺者吉、逆者凶为大纲；但顺逆需结合气势：从势顺生为顺、反克成势为反，皆可为格。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 5756
    end_line: 5756
  quote: 顺逆不齐也，不可逆者，其气势而已矣。
  applicable_to: []
  caveats:
  - 与第十六/十七章顺局/反局互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DR-04
  kind: doctrine
  statement: 冬令日主不可无火（暖调）；夏令日主不可无水（寒调）；寒暖得宜者贵。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 9532
    end_line: 9532
  quote: 四柱财官得时当令，日主虚弱无气，虽有比劫印绶生扶，而柱中食神生财，财仍破印；
  applicable_to: []
  caveats:
  - 本章为旺衰派对调候的旁证视角
  - 调候十干配合精修需转 `bazi/qiongtong-baojian`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-DR-04
  kind: doctrine
  statement: 火土过盛则燥（不长万物）；水土过盛则湿（成淤泥）；燥湿调节为贵。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 9413
    end_line: 9413
  quote: 火土过燥，要带水之金运以润之。
  applicable_to: []
  caveats:
  - 与寒暖章互参
  - 调候精修转 `bazi/qiongtong-baojian`
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-029
  kind: doctrine
  statement: 吉神宜隐藏蓄势（不被冲克）、凶神宜显露受制；隐者贵显、显者贵隐。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 6031
    end_line: 6031
  quote: 如无丙丁之官，或得壬癸之食伤合化亦可，故吉神宜深藏地支者吉，凶物深藏，成养虎之患者，地支气杂，难于制化故也。
  applicable_to: []
  caveats:
  - 经验判语
  - 具体看位置与合冲
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-030
  kind: doctrine
  statement: 五行众者（如比劫遍野）宜散（食伤泄）、寡者（如孤立一根）宜聚（印星生）。
  anchor: null
  quote: 任氏曰：众寡之说，强弱之意也，须分日主四柱两端而论也。
  applicable_to: []
  caveats:
  - 与中和章互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-031
  kind: doctrine
  statement: 震（卯）兑（酉）相对；卯酉冲为震兑战；处理须看月令支援。
  anchor:
