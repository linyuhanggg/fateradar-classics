- rule_id: DITIANSUICHA-020
  kind: doctrine
  statement: 当二五行相战（如金木相战）时，介入第三方（如水）使战局化为生生（金生水、水生木）即为通关；通关之神得令为吉。
  anchor: null
  quote: 当二五行相战（如金木相战）时，介入第三方（如水）使战局化为生生（金生水、水生木）即为通关；通关之神得令为吉。
  applicable_to: []
  caveats:
