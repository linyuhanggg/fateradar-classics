- rule_id: DITIANSUICHA-037
  kind: doctrine
  statement: 何知其人富——财气通门户；何知其人贵——官星有理会；何知其人贫——财神反不真；何知其人贱——官星还不见；何知其人吉——喜神为辅弼；何知其人凶——忌神得权位；何知其人寿——五行流通；何知其人夭——五行偏枯至极。
  anchor: null
