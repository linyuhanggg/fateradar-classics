  - 是五行配合得宜、流通无阻
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-019
  kind: doctrine
  statement: 五行有源（生发之神）有流（归宿之神）；流通无阻为贵，停滞为滞，反克为凶。
  anchor: null
  quote: 五行有源（生发之神）有流（归宿之神）；流通无阻为贵，停滞为滞，反克为凶。
