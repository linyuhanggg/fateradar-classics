- rule_id: DR-02
  kind: doctrine
  statement: 两气合而成象（如水木相涵），五气聚而成形（金木水火土齐备）；形象成则气势顺，宜顺其势；形象破则需通关或制伏。
  anchor: null
  quote: 两气合而成象（如水木相涵），五气聚而成形（金木水火土齐备）；形象成则气势顺，宜顺其势；形象破则需通关或制伏。
  applicable_to: []
  caveats:
  - 形象为高阶视角
  - 与从象、化象互参
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-DR-02
  kind: doctrine
  statement: 三合局（亥卯未木局等）成局者气势全；方局（寅卯辰东方等）齐全者气势纯；局成宜顺、局破宜疏。
  anchor: null
  quote: 三合局（亥卯未木局等）成局者气势全；方局（寅卯辰东方等）齐全者气势纯；局成宜顺、局破宜疏。
  applicable_to: []
  caveats:
  - 方与局不混
  - 方为同方位三支齐、局为三合三支齐
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-012
  kind: doctrine
  statement: 八格（正官/七杀/正印/偏印/正财/偏财/食神/伤官）的取用以"扶抑"为主线，不同于格局派以"成败救应"为主线。
  anchor: null
  quote: 八格（正官/七杀/正印/偏印/正财/偏财/食神/伤官）的取用以"扶抑"为主线，不同于格局派以"成败救应"为主线。
