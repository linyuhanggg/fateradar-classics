- rule_id: DR-05
  kind: doctrine
  statement: 男以正财（偏财）为妻、日支为妻宫；妻星与妻宫俱旺者得贤妻；妻星弱、妻宫被冲克者婚不利。
  anchor: null
  quote: 夫妻因缘宿世来，喜神有意傍天财。
  applicable_to: []
  caveats:
  - 经验判语
  - 现代不作婚姻铁口断
  school: null
  verified: false
