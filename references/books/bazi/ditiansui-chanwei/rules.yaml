- rule_id: DITIANSUICHA-DR-06
  kind: doctrine
  statement: 日主无根极弱时，从最旺之神：从财、从煞、从儿（食伤）、从势（多势并旺）；运忌扶身。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 2665
    end_line: 2665
  quote: 变者，必从五行之气势也，曰从财，曰从官杀，曰从食伤，曰从强，曰从弱，曰从势，曰一行得气，曰两气成形。
  applicable_to: []
  caveats:
  - 从格判定严格，必须无根
  - 运逢扶身则破
