- rule_id: DITIANSUICHA-032
  kind: doctrine
  statement: 坎（子）离（午）相对；子午冲为坎离战；处理须看月令支援与寒暖。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 102
    end_line: 102
  quote: 子午为坎离，宰天地之中气。
