- rule_id: DITIANSUICHA-023
  kind: doctrine
  statement: 命局清者（十神不杂、生克得宜）为贵；浊者（十神混杂、生克失宜）为贱；清中有浊、浊中有清者另议。
  anchor: null
  quote: 命局清者（十神不杂、生克得宜）为贵；浊者（十神混杂、生克失宜）为贱；清中有浊、浊中有清者另议。
