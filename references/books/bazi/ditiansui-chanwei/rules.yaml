- rule_id: DITIANSUICHA-007
  kind: doctrine
  statement: 十干各有性情：甲为参天之木、乙为花卉之木、丙为太阳之火、丁为灯烛之火、戊为城墙之土、己为田园之土、庚为顽铁之金、辛为珠玉之金、壬为江湖之水、癸为雨露之水；用法各异。
  anchor: null
  quote: 十干各有性情：甲为参天之木、乙为花卉之木、丙为太阳之火、丁为灯烛之火、戊为城墙之土、己为田园之土、庚为顽铁之金、辛为珠玉之金、壬为江湖之水、癸为雨露之水；用法各异。
  applicable_to: []
  caveats:
  - 本书十干特性是后世旺衰派教学的根基
  - 切忌与《穷通宝鉴》调候视角混用
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-008
  kind: doctrine
  statement: 十二支各有所藏（本气/中气/余气）与季节属性；刑冲合害需结合所藏与位置精判。
  anchor: null
  quote: 十二支各有所藏（本气/中气/余气）与季节属性；刑冲合害需结合所藏与位置精判。
  applicable_to: []
  caveats:
  - 藏干司令、深浅与位置（年/月/日/时）皆影响实际作用
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-009
  kind: doctrine
  statement: 天干为外、地支为内；天干之用须根于地支，地支之力须透于天干。
  anchor: null
