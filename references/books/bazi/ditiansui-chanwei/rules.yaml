- rule_id: DITIANSUICHA-045
  kind: doctrine
  statement: 天干五合化气为真化的条件：化神当令、有根、不被冲克。
  anchor: null
  quote: 五阳皆阳丙为最，五阴皆阴癸为至。
  applicable_to: []
  caveats:
