- rule_id: DITIANSUICHA-DR-03
  kind: doctrine
  statement: 命贵中和；五行流通、刚柔得宜者富贵；偏枯至极者贫贱。
  anchor: null
  quote: 命贵中和；五行流通、刚柔得宜者富贵；偏枯至极者贫贱。
