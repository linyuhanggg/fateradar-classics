- rule_id: DITIANSUICHA-022
  kind: doctrine
  statement: 伤官真者（当令而透）泄秀为贵；伤官假者（不当令）反主刑伤；伤官见官，需结合身强身弱、合冲化解综合判断，非铁定为祸。
  anchor: null
  quote: 伤官真者（当令而透）泄秀为贵；伤官假者（不当令）反主刑伤；伤官见官，需结合身强身弱、合冲化解综合判断，非铁定为祸。
