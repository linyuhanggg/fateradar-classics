  verified_at: null
- rule_id: DITIANSUICHA-048
  kind: doctrine
  statement: 君象（日主为主、众星拱卫）、臣象（日主为臣、君星显达）、母象（印星养身）、子象（食伤泄秀）；皆为气势比拟。
  anchor: null
  quote: 君不可抗也。贵乎损上以益下。
  applicable_to: []
  caveats:
