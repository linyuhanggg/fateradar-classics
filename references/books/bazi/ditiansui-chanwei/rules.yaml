- rule_id: DITIANSUICHA-DR-05
  kind: doctrine
  statement: 男以官杀为子、女以食伤为子；时柱为子宫；子星生旺、子宫稳定者子嗣顺利。
  anchor: null
  quote: 官杀混杂来问我，有可有不可。
  applicable_to: []
  caveats:
  - 现代不作生育铁口断
  - 遇咨询建议医学优先
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-035
  kind: doctrine
  statement: 偏财为父、正印为母；父星母星得地者父母康健；被冲克者主父母不利。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 6721
    end_line: 6721
  quote: 原注：子平之法，以财为父，以印为母，以断其吉凶，十有九验，然看岁月为紧。
  applicable_to: []
  caveats:
  - 现代有"父正财母偏印"之异说
  - 不能铁口断
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-036
  kind: doctrine
  statement: 比劫为兄弟；身弱用比劫者得兄弟之助；身强忌比劫者主兄弟分夺。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 6452
    end_line: 6452
  quote: 同我者为兄弟，比肩劫财是也。
  applicable_to: []
  caveats:
  - 经验判语
  - 需结合喜忌
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-037
  kind: doctrine
  statement: 何知其人富——财气通门户；何知其人贵——官星有理会；何知其人贫——财神反不真；何知其人贱——官星还不见；何知其人吉——喜神为辅弼；何知其人凶——忌神得权位；何知其人寿——五行流通；何知其人夭——五行偏枯至极。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 6891
    end_line: 6891
  quote: 何知其人富？财气通门户。
  applicable_to: []
  caveats:
  - ⚠️ 经验断语，不可铁口
  - 尤其"夭"不得作寿命铁断
  - 现代结合医学事实
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-038
  kind: doctrine
  statement: 女命以夫星（正官）、子星（食伤）为重；夫星纯正、子星生旺者吉；古文有"贞淫"等贬义判语，现代不沿用。
  anchor: null
  quote: 论夫论子要安样，气静平和妇道章，三奇二德虚好语，咸池驿马半推详。
  applicable_to: []
  caveats:
  - ⚠️ 古文价值观需 reframe
  - 不照搬贞淫等贬义判语
  - 女命与男命使用同一旺衰框架，仅夫子星位置不同
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-039
  kind: doctrine
  statement: 小儿命主要看关煞、五行偏枯、冲战过重；任氏多次强调"小儿命断夭折须极审慎"。
  anchor: null
  quote: 论财论杀论精神，四柱和平易养成，气势攸长无削丧，杀关虽有不伤身。
  applicable_to: []
  caveats:
  - ⚠️ 绝对禁止铁口断小儿夭折
  - 现代医学事实优先
  - 只分析五行倾向，不作寿夭结论
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-040
  kind: doctrine
  statement: 才（用神得用）与德（喜神有情）的命局表征；才德兼备者贵。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 8683
    end_line: 8683
  quote: 原注：清和平顺，主辅得宜，所合者皆正神，所用者皆正气，不必节外生枝，不必弄假成真，财官喜神，皆是以了其生平；
  applicable_to: []
  caveats:
  - 抽象判语
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: DITIANSUICHA-041
  kind: doctrine
  statement: 命局气势顺而清者主奋发；气势逆而浊者主抑郁。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 436
    end_line: 436
  quote: 要在气势顺正，四柱五行停匀，庶不偏倚，自无损人利己之心。
  applicable_to: []
  caveats:
  - 性情倾向，非心理诊断
