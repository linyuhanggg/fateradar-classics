- rule_id: DR-03
  kind: doctrine
  statement: 日主衰旺判断需综合月令得令失令、四柱根气、十干性情、合冲解化；强中有弱、弱中有强；不可以"得令"或"失令"一项独断。
  anchor: null
  quote: 日主衰旺判断需综合月令得令失令、四柱根气、十干性情、合冲解化；强中有弱、弱中有强；不可以"得令"或"失令"一项独断。
