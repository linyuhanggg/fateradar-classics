- rule_id: DITIANSUICHA-047
  kind: doctrine
  statement: 顺局（从势顺生）、反局（反克成势）、战局（五行相战需通关）、合局（合化成势）；皆为气势格局。
  anchor: null
  quote: 一出门来只见儿，吾儿成气构门闾：从儿不管身强弱，只要吾儿又得儿。
  applicable_to: []
  caveats:
