- rule_id: DR-06
  kind: doctrine
  statement: 闲神（不为用、不为忌）虽不主吉凶，但能起转化作用；闲神被合化为忌神时为凶变。
  anchor:
    file: sources/fulltext/bazi/ditiansui-chanwei/fulltext.md
    start_line: 8977
    end_line: 8977
  quote: 一二闲神用去么，不用何妨莫动它；半局闲神任闲着，要紧之场作自豪。
  applicable_to: []
  caveats:
  - 闲神判断为本派精修概念
