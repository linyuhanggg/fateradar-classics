- rule_id: YUANHAIZIPIN-YR-02
  kind: doctrine
  statement: 十神喜忌总纲赋文；正官喜印护忌伤冲、七煞喜食制忌无制等。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 270
    end_line: 270
  quote: 《未》未月阴深火渐衰，藏官藏印不藏财；近无亥卯形难变，远带刑冲库亦开。无火怕行金水去，多寒偏爱丙丁来；用神喜忌当分晓，莫把圭璋作石猜。
  applicable_to: []
  caveats:
  - 赋文体裁，经验性描述
  - 精细喜忌以后世《子平真诠》为准
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YUANHAIZIPIN-012
  kind: doctrine
  statement: 看命次序的经验口诀汇总（先看月令、再看十神、再看合冲等）。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 4420
    end_line: 4420
  quote: 年根為本，月令為中。日生百刻，時旺時空。日主要強，月提得令。用物為財，表實為正。
  applicable_to: []
  caveats:
  - 口诀为经验汇总，非绝对规则
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YUANHAIZIPIN-013
  kind: doctrine
  statement: 正官一位清纯为佳（忌伤冲多见）；七煞需制化（食制/印化/合留）；正财身财两停为佳；偏财多情慷慨忌劫夺；印绶生身护身；偏印夺食为忌；食神制煞生财；伤官见官为祸；比肩劫财分夺。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 2202
    end_line: 2202
  quote: 凡识生财伤官有三：伤之不尽，多出吏道；元有物气，伤官运及印綬，岁复见官星者，多凶化气，怕逢返本；不化有变局，如化不成者，可只用本日干断。
  applicable_to:
  - key: shishen
    value: "*"
  caveats:
  - 本书十神描述为"经验断语"级别，未严格区分顺逆用
  - 精修以《子平真诠》为准
  school: null
  verified: false
  verified_by: null
  verified_at: null
