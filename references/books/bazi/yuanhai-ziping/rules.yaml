rules:
- rule_id: YR-01
  kind: doctrine
  statement: 阴阳五行为造化之源；命理以五行生克为底层规则。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 4740
    end_line: 4740
  quote: 大哉干支，生物之始，本乎天地，万象宗焉。有阴阳变化之机，时候浅深之用；故，金木水火土无正形，生剋制化理取不一。
  applicable_to: []
  caveats:
  - 理论铺垫，不直接用于断命
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YUANHAIZIPIN-YR-01
  kind: doctrine
  statement: 阳干顺行十二宫（长生→帝旺→墓绝），阴干逆行；判断日干在地支的旺衰状态。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 4111
    end_line: 4111
  quote: 欲识五行生死诀，容易岂与凡人说，星中但以限为凭，子平但以运为诀；运行先布十二宫，看来何格堕时节，财官印綬与食神，当知轻重审分明。
  applicable_to: []
  caveats:
  - 阴干逆行说后世有争议
  - 与《滴天髓阐微》"阴阳同死同生"说冲突
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YUANHAIZIPIN-003
  kind: doctrine
  statement: 以日干为"我"，其余干支相对于日干的十神关系为论命主线。区别于早期禄命"以年为主"。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 105
    end_line: 105
  quote: 予尝观唐书所载，有李虚中者，取人所生年月日时干支生剋，论命之贵贱寿夭之说，已详之矣！至于宋时，方有子平之说；取日干为主，以年为根，以月为苗，以日为花，以时为果；以生旺死绝休囚制化，决人生休咎。其理必然矣，复有何疑哉！
  applicable_to: []
  caveats:
  - 这是子平法与禄命法的根本分界
  - 本书确立此原则但细节尚不如后世严格
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YUANHAIZIPIN-004
  kind: doctrine
  statement: 月支为提纲；得令者旺、失令者衰；月令决定命局基本强弱。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 126
    end_line: 126
  quote: 月为提纲，带官星印綬，则慷慨聪明、见识高人。
  applicable_to:
  - key: yueling
    value: "*"
  caveats:
  - 本书强调月令重要性但尚未形成后世《子平真诠》的严格"月令本气透干取格"规则
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: YR
  kind: doctrine
  statement: 以日为主，年为本，月为提纲，时为辅佐。
