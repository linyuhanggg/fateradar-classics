- rule_id: YUANHAIZIPIN-023
  kind: doctrine
  statement: 父偏印、母正印、兄弟比劫、妻正财、子食伤（男）、夫正官（女）。
  anchor:
    file: sources/fulltext/bazi/yuanhai-ziping/fulltext.md
    start_line: 438
    end_line: 438
  quote: 何谓之正财？犹如正官之意；是阴见阳财，阳见阴财。大抵正财，吾妻之财也。人之女貲财以事我，必精神康强，然后可以享用之；如吾身方且自萎懦而不振，虽妻财丰厚，但能目视，终不可一毫受用。
  applicable_to: []
  caveats:
