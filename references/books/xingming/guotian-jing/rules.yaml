- rule_id: GR-05
  kind: doctrine
  statement: 观星二十四秘法之看三主：身主 / 宫主 / 度主皆要得局，不泄气，不迟留伏逆于恶地，喜朝元升殿垣局。
  anchor: null
  quote: 张果星宗八即宫主、度主、身主是也。身主不傍鬼，不冥晦宫度，三主要得局，不泄气，不迟留伏逆于恶地，极喜朝元升殿垣局，生我之度也，所以不怕，三方忌星刑照，正是他来刑我，我居庙旺以何妨，不必论恩援二星于失次，亦富贵论之。宫身度主喜朝阳，三主高强福寿昌，恩援不须来辅助也，应富贵始终良。主犹人身，禀气强壮且居廊庙之上，不受克制，近于天庭终为贵也。
  applicable_to: []
  caveats:
  - 通用 1
  school: null
  verified: false
  verified_by: null
  verified_at: null
- rule_id: GUOTIANJING-GR-05
  kind: doctrine
  statement: 宫强而度弱者不美，度高而宫衰者不善，必须宫度二主皆强为尽美；身主尤为切要。
  anchor: null
  quote: 张果星宗十宫之所属是宫主也，宿之所属即度主，也凡安命处有命宫之主，有命度之主，名虽有二其论则一。如宫强而度弱者不美，或度高而宫衰者不善，必须要宫度二主皆强，斯为尽美而尽善矣。且如子宫坐命躔虚日度土为宫主，起在四土升殿或居子丑，本垣日为度主，起居四日升殿或在午，宫本位又生于昼，此所谓宫度皆强也。倘土星起寅亥，二宫或次四木度下又逢木，气照克兼太阳西沉失明或昼逢木气所蔽又带刃，劫廉雄等煞，此所谓宫度皆弱也。如宫度皆强者不贵即富，或宫度皆弱者非夭即贫，倘宫主度主一强一弱，则知得失于其中矣。此论虽然如是更看太阴身星为重，盖月者一日行十三度关系，祸福最紧。故云：要知荣枯惟看月，经云宫身度主喜。朝阳三主高强福寿昌恩援，不须来辅助也。应富贵始终良，然此三主者第一重身主，第二重度主，第三看宫主。又云：昼生看命度，主夜生看身度，主斯论亦当宫者十二宫也。度者二十八宿也，此举一宫一度者言之，余皆可以例推廉谓飞廉雄谓天雄也。身主尤为切要宫身度，名曰三主兼身度，主又有四主。之论学者详之。
  applicable_to: []
  caveats:
  - 通用 1+4
  school: null
  verified: false
  verified_by: null
  verified_at: null
