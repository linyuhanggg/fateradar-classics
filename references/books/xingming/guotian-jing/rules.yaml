  statement: 太阴乃水之精，人之身也；昼生看命度主，夜生看身度主；月入财官夫子各宫各有断语；女命尤重身主太阴。
  anchor: null
  quote: 张果星宗十一太阴乃水之精也，人之身也。一日行十三度为准，人生以十二时所属，何度盈亏。明晦即管人之祸福，今术者多不识晨昏度，只论琴堂虚实以故不精不验。朔后为昏度，望后为晨度。太阳元火之气为诸曜之主，不变不化月与金木水火土，气孛罗计皆变化不常，故日为君月为臣五行为人民。月借日之光，五行借月之光，所以用月美者富贵多，凡四余作权柄又为干戈与七政，共格为文武同行必镇守边疆之命。性理云月本黑色如漆，盘则受日之光先儒之理明矣。一未为太阴宫何也。盖午后阴生为水之精而亥卯。未合木局惟未宫井，度最长所赖水垣得子母相顾以成太阴之象，土不能伤月故也。午为太阳午与未合，臣借君光月借日光故耳。一太阴在天有三府奎壁斗也，最是文明之宫。凡月在斗生于有光之际就斗牛泊命行氐，土度中进士状元，若晦冥之际亦斗泊命只得妻财子力，行氐角限发财福而已。一月居斗而命安奎乃月明，官禄行丑限为御史，若角住命月在斗为富格也。一月在井诸星不杂又安命于鬼，井卯地有星拱起乃是天官，大夫毕度高中。一月在奎宿为太阴，朝天酉宫安命行限见月中，举壁水度中进士。一月在壁者以毕月安，命生光辉之际，行奎壁度联科作布政官，若生上下弦之际只纳粟奏名。一月在奎气星同行酉宫，立命生于亥子时乃祥云捧月之象，限见月即高科子限为太守，行斗度死于路。一月最不宜坐箕参尾女，四度反复成败之人。一月躔心者金星相伴，巳宫立命行未限发科或木星伴必雕巧妆花之人，月在毕命在午官为御史。一月挂柳梢五度之外不取，又未宫安命毕度中魁有火，在四土度行胃土度即死，四土度无火行娄奎度作翰林官。柳度在未乃月之本宫，至柳四柳五过午宫，故不取。一月喜漏罗计之外以月为身，命官福田财方为得体，若月为迁移八煞闲极奴仆相貌之主纵有光，亦弄巧成拙，先荣后辱或流落江湖者多。一月居闲极止有三所，命在酉月在未，命在丑月在亥，命在巳月在卯，虽得格无大贵。若以他宫为闲极论乃僧道贫薄之命，经云月居闲极反为祥更喜临于华盖。月乃身主居兄弟之宫，主清闲富贵。一太阴最宜临财帛加财星高起，必享千锺之禄，若月被蚀掩因祖财成败。一月与妻星同宫，因妻致富或因亲致亲，若财星原陷必自成自立致富，又怕白虎飞廉的煞大小耗？之财，虽发未免先成后败。一日月同入财宫必招横财，昼生以财求名夜，生先贫后富加罗计发骤。一月孛同入则宫，若财宫属金必因酒色坏财，或因酒色丧身。孛乃月之余好酒好色，若同财会金必主是事。一月同金入财宫必得母财发达，惟在寅宫谓金骑人马必败母之财，废母之业。一月在星以午为财帛者，复带金刃必盗，父之财兼本身庶出，以月为身在午不光故也。一兄弟属土属木带杀克太阴于财，宫必主兄弟争夺不和。一申宫安命太阴在未及酉宫，毕月度立命太阴不离于申宫之毕，皆是做官方面致富钱粮之官。一太阴喜居官禄务要有光为贵格，若在辰戌丑未宫只为纳粟奏名之士。一月在寅亥宫为官禄者最怕落木，寒蟾必是寒儒。一月在子午卯酉为官禄者酉宫，主风宪余三宫皆杂流及五六品之阶。酉宫乃月之所出之宫。一月掌财星入官禄以财夺名，亦纳粟之官。一月兼奴入官宫乃吏员之命。一月喜孤居，官禄则清有星混之，则浊或生上弦纵昼月亦清生，下弦昼生乃秀而不实，又看官禄主如何。一假如日在申月在寅命在亥，合大富贵子亦秀气合格也。一如月在寅以寅为官，宫金同行必谪降仕路加飞廉天雄必犯御刑。一月生残晦之际带迁移，主入官宫又带刃雄等，煞必因名得罪徒流千里，及与为官人争告。一月带八煞入官禄金木为飞，廉白虎剑锋侵战行，此限加四余流来，必死乱兵之下。月乃母后之象，性本善慈，人依之为母。何况遇此凶煞则杀身而殒命者岂能免乎。一火助月于官禄主权贵，一扫千兵之命，惟月带刃不喜近于火罗。一月入官禄而贫盖因寒孛拱之，及金水严凝侵之而宫空亡耗难？之，及月躔初末度并受制之度故也。一有望月居官禄而不显者，盖夜生论身度为要看本度所属何星，若是月三方掩映争光罗计亲之为武臣，惟秋夜望月主秀气。一春月居官见金水者，王府训导之命也。月与金水皆聚阴之象，柔弱之身当任此职。一人月坐箕风生于望，夜因木在箕而生风，纵光明为狂妄之士也。一人月生望夜坐翼已为奇妙，然居巳为阳极阴不可居而月化禄金掌八煞，复居难地少年高科行官，宫为哺艮革前程。一有申宫坐命月在亥，生于望夜前以财入官禄，主享祖财纳粟。因月带刃行于室火，火罗三方迫之，又木在巳生风之地而限又弱行，此限失火官司刑克巳属巽卦象取巽为风。一有翼火住命月生望，夜在参水猿，又谓福居禄位乃一清寒之人何也。盖水为的劫廉雄水月为鬼克，故不能发也。一有六月十二日月亦在房命在虚为教读之人，养子为盗无结果何也。盖因盛夏之际以阳气胜阴，复在火宫太阳傍照月带煞，复有劫刃两傍得文昌在焉，颇知文墨其实火日盛，窃亥木之财而贫也。一人心月住命月坐星，生于望夜木同行于张为道官何也。盖阴占极阳之地主出祖，过房木气掌孤劫，所以为斯文道官。一月在戌奎生在望，夜以未垣安命六己生人何以至贫而孤戊寅生人何以至富而贵。郑先生云：己人带刃，所以贫孤。戊人带贵，所以富贵。未垣安命己生人刃在未戊，生人贵人在未，所以有贵贱之分，宜细推之可见。一月居奴仆而庶生者贵，盖月为母为庶今月起。奴宫高照三方与财帛官禄有情，所以富贵设，若月居奴仆带煞无光而奴元复起高照，即皂隶之徒月坐。奴遇贵人为刀笔之吏，次则书手成家。一身主入八煞务要入天门，方合贵格煞主背太阴为贱格。一月望入迁移反富贵何也。曰：看三方局主何如殊不知斯命在卯月，为身在未孛在亥天关也。又玉兔腾空之象，所以为富贵也。孛在十二宫皆裸形至于亥乃天门也，必着朱衣而过之，所以不为祸而为福。一孟子命在亥月在卯孛在未，纵漏关格所以三迁之教大抵月在迁移者多，因事业反复处见成就。一有未望之月在张而命在辰，岂非禄居福位多主大贵见月即当中。所以身入福亦是碧玉大格。一如用太阴者不拘所在何宫随日变化之忌，喜怒之曜相参无有不准。一刘国师命坐亥月占斗柄而诸星灿灿，拱南木又躔毕，所以为君师。经云：月为人之母即有生化之气，故为用神切也。一太阴最嫌斗煞或土去计来或火去，罗来其水孛木气皆顺行，不妨怕斗斗者死，顺者灾若月被斗在难地则乱兵而亡。若斗在生地因祸中得福，又如四月度犯斗亦不好。太阴本沉静之星喜居阴宫，宜逢吉宿及同宵之辰，所以为福。况逢战斗之煞安有不为祸乎。天星有如此况人民乎。一宁王命万水朝宗格木月夹命于亥地，因土计罗刃于卯死后凶危。一如小儿命看太阴三日宫所躔何如。又太阴一时过一度交接，初刻末刻仔细消详上四刻下四刻，验之所属方知奥妙。一月居火地最怕水孛迫之，必溺水误医之厄。一木近月为煞者，必脾胃疟疾。一金近月于木度必喘嗽及克妻。一罗近月于四金者必有足目之疾，一孛月向坐四金者主酒色病祸。一水月同坐四木度，主行医九流之人。一气月同坐四木度，主僧道之人。一金月同坐心月狐，主巧艺之匠。一论太阴何以为福。早为福迟即看度深度浅是也。凡太阴有贵格者有太乙抱蟾身居闲，极日月守照一星伴月，火月同宵，日月趋朝，金助月华，母依日月祥云捧月，日月同宫日月互垣，火金逢月木月清贵之类皆作贵命而推之也。一月在限即论月在四正三方，亦论月不见月方看他星。一晚年行月星其限不好，即不善终见月好即能享福。一月喜居太阳之前，不喜太阳之后，名曰背君。一论官品高低须看官星所泊之度，及格局并用神在何处，若是官星度困则看用神之度何如，但格局用神兼得所者京堂命也。一用神格局俱好只有财星混于官恩，星远乎驾方面之官。一格局高内有所破，此外任四五品之官。一文魁星高太阴作科道等官。一余气用神健必掌兵。一罗为官魁或向驾，亦在京得宠。一用外盘格局及七政混杂乃杂流之职，财禄交驰财马互换，及禄到财宫乃纳粟监生命也。一有不入泮门而白衣做官者此可论斗标卦气禄马，元天经地纬唐符国印贵人三元为要。次看内盘恩星提携必身主微宫，主度主弱只是限好，因聪明文笔得京官，若身度健太阳高强有夹拱，此得父荫原格无破亦渐升，至京堂原有破只升外任。斗杓卦气天经地纬唐符国印诸吉星皆详起，例此张果通元之秘星。一论王侯驸伯命盖侯伯要禄马，逢空休囚爵恩星到早而诸星皆会高强。用神亦在驾前只论身星，财帛为要身星好有才志，财星好享厚福，身星晦财星疲无才能而且穷也。一指挥千百户命与杂流同论亦宜官恩好行，限好方许高升与前侯伯命兼看为是。一总兵参将与都堂命同只是武官文星欠，高身星欠清终不能近君也。当以权印刃劫等煞同论方有助威权之用也。一太监命与僧道同只是身福田，财星好享福有权柄也。一有极贵而无子者盖未垣安命以火为子为官火，至西而发，故得极贵而无子，若丑安命以金为子为官。金至西而囚，故得子而不发贵，看本星所泊何处高照何方。若有福星弱官星高得贵而不得子官，星高福星健主福与子俱好。经云：福德男女同一局也，若男女主好福德弱，虽有子不得尽终。一有僧道尼姑后还俗，生子者皆因原恩福官，度休囚煞神孤寡切照，后限遇夫妻星动驿马桃花星照，孤寡皆去故生子也。
