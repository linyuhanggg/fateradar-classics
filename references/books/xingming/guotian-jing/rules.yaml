- rule_id: GUOTIANJING-032
  kind: doctrine
  statement: 限主第一急；禄星可贵；诸曜顺行可发；庙宫为发，忌星可畏；本宫见星灾福十分，对照七分，三合四分。
  anchor: null
  quote: 张果星宗十七大凡洞微所急者限主星也，所贵者禄星也，所重者诸曜顺行也，所发者庙宫也，所畏者忌星也，所好者吉神也，所辅者行年也，所助者三方也，所恶者气孛罗计也，如善星陷逆则福慢，顺行则福紧。凶星陷逆则灾紧，顺行则灾慢。如遇吉星顺行即得本宫加数，若遇恶星他宫则其数减半。大凡吉星居七强为福紧，临五弱为福慢，灾星在强宫为灾慢，五弱为灾紧。凡限本宫见星灾福应十分，对照七分、三合四分，凡限星在终末之度，即灾福之力则微，而不可以定数言也。凡忌星在好乐宫入限，三年内为福。三年后反为灾，大凡限逢忌星不死亦灾，若火在阴宫、土在阳宫、或为三方主虽有厄而不亡。故曰：夜忌土星，昼忌火。三方不是死无疑，此星若是三方主虽有灾侵命不。离火阴土阳宫尤妙，好乐位中别有奇正此谓也。凡灾忌星生时在伏段限内。灾祸只有三四分力，福星生时在伏段亦只有三四分力，盖被太阳所伏光芒不见，有如臣居君侧包藏光美之象。凡一限中见吉凶星同聚，即以入宫先后及逆顺而断吉凶，故先入宫深者先见，后入宫浅者后逢也。凡遇本限及对照三合并不见一星，名曰空限，主多灾凶、图事不成，若得限主当生有力之位，则反为吉，惟有官禄宫上逢空限最凶，必于四十六七岁死矣。凡当生吉星照身命者，主中年富贵，纵逢灾限不妨。若当生凶星照身命者，中年虽逢福限四旬之后，亦主迍滞，大都吉凶之应全藉限基当生有禄则吉，限上无禄则难发，是犹无根之木，虽逢春终不葩花而成实也。故经云：若无一曜临身命，自是贤愚别有因。
