- rule_id: GUOTIANJING-031
  kind: doctrine
  statement: 百六限依命、相貌、福德、官禄、迁移、疾厄、妻妾、奴仆、男女、田宅、兄弟、财帛次序，年数分别为 15、10、11、15、8、7、11、4.5、4.5、4.5、5、5，合计 100 年 6 个月；“百六”不得误写为 106 年。
  anchor: null
  quote: 张果星宗十六天地万物莫逃乎数，二气运行三辰流转，至于人物之休咎，莫不有不期然而然者，非人力所可为也。河图之数四十有五，洛书之数五十有五，古者圣人测其数以示将来。后世学者循其常而昧其本，大道日讹诡论蜂起，盖红紫得以乱朱原。夫洞微限数一百六布于周天十二宫内。然阔狭不等同异，互陈命与禄数十有五福，与妻十有一，田宅子孙各四年半、而奴仆随之，财帛兄弟各五而相貌独管十年，疾厄迁移退以七八，其所以若此者实不外乎河洛之定数也。子午卯酉居阴阳之中位，命禄妻田称为四强，管年四十有五而赢半，岁计日一百八十分而四强各得四十五日，乃函洛书四十有五之妙也。寅申巳亥、辰戌丑未八宫当阴阳终始之地，管年五十有五而无奇，乃具河图五十有五之妙也。总十二宫计数百六自然周流无秋毫差错，二五之运既不能离河洛之妙，则人禀二五之气以生，又安能舍百六之会哉。古今圣贤推阳九百之变，昭布经史岂虚语耶。每于今之谈论天文者，推以洞微深会，辄臆度而不经或结舌而莫究，若欲验其祸福亦难矣。仆因桑榆余暇以异人所授列为图说，将与同契者居易于定数，怡神于妙理，匪敢立异以沽名也。览者无哂焉，金赘野人元机子蔡绍申书。
