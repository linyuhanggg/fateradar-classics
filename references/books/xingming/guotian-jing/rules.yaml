- rule_id: GUOTIANJING-030
  kind: doctrine
  statement: 金星守命夜生吉，木星照命有多般，水星在命合入庙，火星入命不堪详，土星入命主顽钝；夜生 / 昼生差异极大。
  anchor: null
  quote: 张果星宗十三金星守命夜生吉，白日生人减半力。木星照命有多般，白日逢之必作官。夜生若有暗曜杂，反为凶祸主忧煎，水星在命合入庙，夜里生人太阴照，或居双女与阴阳，决定少年居显要，火星入命不堪详。白日生人主祸殃，更被孛罗三合照，定知哑吃与人伤，患劳枉死人孤寡，夜生又宜却无妨，土星入命主顽钝，夜里生人不可论，水命定知须哑吃，黄肿气疾命难存。太阳坐命如逢木，罗气同宫须食禄。火星不照定封侯，月孛临之患心腹。太阴在命生逢夜，水宿同宫为仆体。土星入命孛星来，有禄定知非久谢，紫气印星号天乙，凡在命宫皆有益。生时不被恶星临，善宿合兮多子息。木月见气入夜宫，夜里生人为辅弼，若是土星三合照，虽则高强终是疾。罗?入命许谋多，木气同宫主豪富，金木太阳三合照，此人慷慨更英豪，女命夜生罗照着，自缢劳刑贫又薄。气火水计入命时，此人定作般般恶，计都入命忧火命，此则十杀恶无定，贵人遇者以无权，白日生人宜修进，木星紫气如临照。主命居强为福庆，孛星入命人廉洁。目快心清为性别，气木日金若合时，所作高强皆有节，日生火孛主星微，决定刑伤蛇虎食。掩口不开气冲人，直得为官须歇灭。金属阴故喜夜生，木属阳故喜昼生，双女巳宫阴阳申，宫土喜昼生。夜生人不吉，天乙为紫气主吉，土为瘟星故主人多疾。
