    start_line: 35
    end_line: 35
  quote: 人以財福為重官星可作天元只宜坐貴不宜衝惟忌見滛又見合桃花金水坐子夘是無禮之人金孛咸池騎四馬為勞瘵之鬼縱有朱唇粉黛難免送舊迎新須是雪月風花不無飄蓬落魄此則舉其綱領更探而索微要知造化𤣥機細騐天時得失天元玉册歴象無差細辨盈虚貴賤定矣
