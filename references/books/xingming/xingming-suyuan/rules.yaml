  quote: 又問隂注陽受身命值之則可化㓙為吉更兼吉星乃是利名之人也有庚辰生人四月夘時酉土坐命坐注受之地犯刑而死者何也荅曰此金為羊刃之煞又值咸池居于命宫甲戌旬中無申酉將何為美豈不為酒色而害己亡身也
