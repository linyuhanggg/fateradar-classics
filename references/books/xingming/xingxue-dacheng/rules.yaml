  quote: 育吾子方裒集刪定諸家星命之說以廣厥傳忽有客坐而問曰五星麗於天者也凡民麗於地者也天地邈不相及胡術家者流以五星而推人祿命其說亦有理與余應之曰天地不外隂陽隂陽不外五行人不能外五行以生五星乃五行之精凝結成象天垂以示人者也人之生也禀天地之精英萃隂陽之造化天星運於上而適恊厥期人命鍾於下而感與天通是故長庚入夣而太白生歲德下臨而曼倩降郎官應宿庶民惟星以五星而推人禄命其理至著其道至微但術者未盡知耳客曰星命之說固云有理然所以推星與命者則吾未之喻也敢問何以先排十二宫一命宫二財帛三兄弟四田宅五男女六奴僕七妻妾八疾厄九遷移十官禄十一福德十二相貌其立名次序無乃牽强也與答曰人之生也以身命為主故命宫為第一財為養命之源故次二分我之財者獨兄弟故次三田宅所以安命藏財而居兄弟故次四既有財帛兄弟田宅而男女所以承田與財者也故次五奴僕所以輔男女故次六妻妾敵體與命宫對衝故次七夫自命宫而至妻宫其敘自不可亂疾厄人命之所不能無者故次八遷移人之所不能免者故次九官禄天之所予係於命而最要故次十福德人之所享係於天而難得故次十一相貌所以成身故次十二自疾厄而至相貌其敘却乃倒言何也十二宫之中命與妻相對相貌福德官禄出天上故列在身前財帛兄弟田宅隱地下故敘在身後遷移疾厄妻妾限數最皆太陽過午而行促有相貌而後見福德有福德而後居官禄有官禄而後厯遷移有遷移而後見疾厄自相貌而至於疾厄皆日月之喜升而惡沉有財帛而後見兄弟有兄弟而後分田宅有田宅而後歸男女有男女而後居奴僕自財帛而至奴僕皆日月之右轉而分布人之所以為人不過如此故十二宫之名足以盡人之一生也男女身命所生遷移父子所專兄弟和樂妻奴雍睦人之福德此二者最難財與官禄相連奴僕所以服官而營財也貌為疾厄所苦田宅所以安身而養疾也故皆三合此十二宫流行之敘對代之體錯綜之用有如此子殆未之思乎客曰星盤十二宫既聞命矣然何以午未屬天子丑屬地亥寅屬木卯戌屬火辰酉屬金巳申屬水與五行地支十二之理不同又何說與余曰五行以寅卯為木巳午為火申酉為金亥子為水辰戌丑未為土乃地支十二維也午與未合居於上而屬乾故以為天子與丑合居於下而屬坤故以為地上天下地一定之體也亥與寅合屬春故以為木卯與戌合屬夏故以為火辰與酉合屬秋故以為金巳與申合屬冬故以為水春夏秋冬四時之序也日月麗天水金輔之故喜金水土石麗地木火生之故喜木火此雖與地支十二維分布不同而其道理則相貫也客又曰人一日之生不啻億萬何以從太陽為命太隂為身遂據此斷吉凶禍福僕未深信敢問其故何也余曰善哉問我明告子天形如卵而左旋日月代明而右轉天體日週東方常抽惟其東抽是以西沉一沉一抽無停留也太陽之升出在東方太隂之没入在西鄊一升一没無差忒也人之出乎胎中即天轉乎地上若是卯時而尘天日俱出東廂惟卯時以後天體無形以日為準故因日而數至卯即卯地而出蒼穹太隂日之配身之所自出也故以太陽立命太隂安身身命人之所最重者故先求此二宫天體度數各有對度是以日月同其好惡身命同其禍福東出父命西没孃身東出太陽西没太隂東出亢金西没婁金東出井木西没斗木故琴堂有身命一般般之說葢為此也客又問曰人之身命同乎天地得夫子之教已喻其理但加關之說樓上架樓而禍福却以為準又何理與願盡洩天機以教僕請授業於門焉余曰前言巳盡子猶未深悟乎夫天開於子地闢於丑人生寅出卯千竅萬妙不出一卯天盤之加順天左旋十二宫地盤之關因日右轉十二宫洞微飛數遍周天皆左旋陽九小限逐日月皆右轉曰加曰關惟卯互換地盤卯酉定地不易天盤卯酉房昴是的前言人之生也因天體之出卯也天運不息不能昴卯故隨所生而值所宿皆謂之卯酉也吾人之卯酉以天日之卯酉為準故以卯加命宫此之謂三才合一道理故吉凶禍福可得而判也星之源流吾已畧註望斗三盤之法詳著卷首子取而觀之予何言哉客又曰星家源流其理既同然何以有準於古而差於今驗於今而謬於古其故又何僕也惑敢問余曰此天道自然之運也天之運也積氣日月五星積氣之光曜者也其循行次舍七十年而差一度天道且然而况於人乎世有升降國有隆汚皆囿於天道自然之運人乃積氣中之動物身之用舍道之行藏又囿於國家一時之運此古今人命之所以不同而星家準與不準之辯咸在此矣客恍然而悟醒然而得再拜而退閱數日請見作而言曰今夫天日陽精忌火月隂精忌土五行獨以火土為惡為日月所畏以金水木為善為日月所喜今夫人凡水凡木凡金凡火凡土為命主皆日為身主皆月忌有五行之不齊皆火土喜有五行之不一皆金水木此亦是否乎余黙然不答客退不敢復言或又有問曰諸星家俱以太隂為身琴堂雖有身命一般般之說乃是命宫所喜身亦喜之如命度屬金喜土太隂傍土亦不為忌謂之安身傍母今夫子答客乃不以太隂為身而以身為太隂所自出不知指何者為身也答曰命者父之所鍾身者母之所生星家既以太陽數至卯為命獨不以太隂數至酉為身葢未悟耳夫十二宫命宫與妻宫正對合為夫婦有夫婦然後人生焉是身命乃夫婦所出觀立命則立身可知矣東升是命西没是身可見當以命對宫之度為身不可直指太隂為身此身命所以為一般般而好惡禍福同也此余獨得之妙因子問而盡發之
