    end_line: 135
  quote: 此星喜居田宅宫及七強入廟生旺之地主多業產如留逆無氣更在閒極陷地俱不得祖業主多破敗田宅宫别有吉星臨照亦自能成立如田宅地更是忌星相犯加以命弱失陷一生並無田宅
