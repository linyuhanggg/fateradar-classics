- rule_id: XXDC-M01
  kind: doctrine
  statement: 以宫分依次列命、财帛、兄弟、田宅、男女、奴仆、妻妾、疾厄、迁移、官禄、福德、相貌十二宫；仅用于核对宫位事实。
  anchor:
