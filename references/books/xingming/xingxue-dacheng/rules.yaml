- rule_id: XXDC-R007
  kind: doctrine
  statement: 吉星坐实、三方左右夹拱有力为贵；煞星的刃夹拱为祸，空实冲合要分吉凶星。
  anchor:
    file: sources/fulltext/xingming/xingxue-dacheng/fulltext.md
    start_line: 1042
    end_line: 1207
  quote: 士君子凡欲看命先看身命二主落在何宫専以空實强弱夾拱衝驀八字定其人品出處高下次以福禄恩官田財六主定其貧富貴賤真假輕重然後次以金木水火土炁羅計孛日月十一曜天德月德并的刃刼煞三煞白虎華葢六害等守命安身以分其為君子小人奸直麄細之性行却以大小二限太歲流旬直難填實逢空有無貼襯之類以斷其發達衰遲好惡生死大要十二宫所主切處吉星坐實勝居强位凶星落空勝居弱宫明實不如暗實原空不若流空有實不如有夾有夾不如有拱空其位莫若空其星實其主莫若空其煞貴人禄馬殿駕此五者明浄純粹喜天恩拱福不喜拱煞黨惡日月官福田財此六者喜互換飛出坐實不喜雜煞散漫無情用星不可被傷身星不宜落䧟天煞地煞切忌拱福拱官駕前駕後尤怕逢刃逢的身命逢官無實拱祿秩難高福官坐實值身空發施不出身官值好既能貴而臨事俱能福恩兩高縱遇險而依還不險如身命二主并限主值流旬一齊空却須看限宫拱夾之有無直難天地二煞夾身者有空亡限行其上亦防凶死但遲一歩爾大抵恩能取信恩一䧟而信令不行福能保官福一空而官居不久福嫌身弱田忌財空身弱福强似病人而挑重擔田高財䧟如浪子而逞風流忽然福忽然灾多是殺恩守命暫時貧暫時富定縁直難傷財論尅父母在古說則無此理而今以生害之理推之如計犯月夜生人必先尅父羅犯日晝生人必先尅母此乃隂陽相峙子午流注之理或是日月同宫謂之日月合朔日生人必先尅母夜生人必先尅父或日月衝照謂之日月對望日生尅母夜生尅父葢取其有光無光之義也日生人太陽落隂宫則父先亡夜生人太隂落陽宫則母多先死隂陽反背之義也至於夫妻男女俱有成法兹不復論但琴堂星法其𤣥妙只在空實二字其禍福只在夾拱二字貴賤真假須看四柱上四箇實字俱有吉曜得用之星守之三方左右夾拱有力福星恩官田財各得其實當決定作真富貴命斷之或四柱上實地只有二處守吉星則看其所守者是何宫主如是田財之主則其人可富或身星限星强則此命必是自家成立發達或日月田財命主都守實則斷其人必多祖業承䕃有餘生平不受勞碌如命主守官禄或坐天月二德貴人禄馬有實字拱夾者則知其為文獻衣冠故家之裔有德守成之士也或身命同文魁星坐文昌長生實地者須分晝夜日月司天之法看之則知其人有學有識極聰明多才多藝之士也或身命守的刃刼煞白虎六害之宫或的刃六害咸池之類夾之則知其人為奸麄小人市井尋常之徒也或天月二德貴人禄馬雜的刃刼煞白虎六害之類守夾身命二主者則知其人界乎君子小人之間也或天馬守實地馬逢空身命二主與之同宫者則知其人乃幫閑隨時附勢之徒也或身命與金炁孛同守天空或入兄弟宫者則多浮蕩江湖醫卜賣活之軰無疑或身命主坐奴僕貴人禄馬衝夾此則多在公府皁之類其他可依此例活法斷之不可具述也如病人欲問其目下生死或凡人行限問其壽夭應在何年月日者其要只把各年太歲逐宫輪轉看其宫分原有何吉凶星守之或太歲帶的刃禄馬貴人之類值年填之以分其灾福如太歲帶刃填起煞星衝我命宫并大小二限者斷其人是何年月日灾病破財或是官禄主星在限上被其當頭衝填其煞入官禄之宫又有直難的刃重見被太歲填實則知其人此年必因官事囚禁破耗勞苦大不稱心有官則剥官停俸次年有恩星填實救之則可解脫或太歲填煞入福德財帛田宅者則止破財營運不能有利門户疊見繁擾却無他重災其餘妻子奴僕之宫並依此例推之如身命二主逢空大限主星又落空亡後限主星又不如先者流年太歲一連趕起的刃三箇地煞到命到限其年小限主星又作煞論者并其月令透出黨三煞又有直難坐實則善病而亡若太嵗一般趕煞到身亦未即死大凡欲逐流年看星必須以流年太嵗論之葢太嵗能吊起三方之星如大嵗在申則能吊起子辰二宫其三宫所得力之星一時皆動是名吊起之法其太嵗所守之位有星並皆填起其吉凶動靜皆由此而應如士大夫功名之人問動靜則以催官天禄天馬之類太嵗吊起之法依正經所載一一斷之萬不失一大槩煞星乃小人之象偏喜合不喜衝故太嵗三合吊之有吉則能成吉衝宫之衝有凶則能成凶所謂小人女子合則喜衝則怒也天理人事一而二二而一也其實皆可以理推其𤣥微以形像求其彷彿夫吉凶消長得失存亡之道固不可以預知然果能依此求之雖不中不遠矣然易有言曰君子修之吉小人悖之凶則天理本具於人心修身之道或可消非於無妄迎福禄於大有者必灼然矣
