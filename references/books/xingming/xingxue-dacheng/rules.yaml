    start_line: 921
    end_line: 921
  quote: 從命宫起逆轉如亥生人立命在丑就丑上數亥子年在子丑年在亥寅年在戌夘年在酉辰年在申巳年在未午年在午未年在巳申年在辰酉年在卯戌年在寅之例以宫分言則一命宫二財帛三兄弟四田宅五男女六奴僕七妻妾八疾厄九遷移十官禄十一福徳十二相貌逆數右轉以限度言則一命宫二相貌三福徳四官禄五遷移六疾厄七妻妾八奴僕九男女十田宅十一兄弟十二財帛順數左旋宫分次第不可亂也
