  quote: 右周天都計三百六十五度二十分五十秒分布十二宫惟子午兩宫每宫計三十度四十三分八十秒其餘十宫每宫計三十度四十三分七十九秒歲必三百六十五日零三時而交春是合周天之度月必三十日零五時二刻而交節是合一宫之度
