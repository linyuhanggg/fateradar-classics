    end_line: 120
  quote: 凡祿主星一宜在七強宫二喜照命三要順行四要廟旺五要在當生年納音長生臨官帝旺宫以上並得用主大富貴如在五弱宫或入四煞位更行留逆故為福不純主人淹滯雖不在五弱臨在七強亦初中年不得發福矣
